<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>先生ページ</title>

<style>

body{
font-family:sans-serif;
background:#fff8e7;
padding:20px;
}

h1{
text-align:center;
}

.card{
background:white;
padding:20px;
margin:15px auto;
border-radius:20px;
max-width:700px;
box-shadow:0 3px 8px #ccc;
}

button{
padding:12px 25px;
border:none;
border-radius:20px;
background:#2b7a78;
color:white;
font-size:16px;
margin:5px;
}

.subject{
color:#2b7a78;
font-weight:bold;
font-size:20px;
}

.study-box{
background:#f5f5f5;
padding:15px;
border-radius:15px;
}

.level-box{
background:#eaf6ff;
padding:10px;
border-radius:15px;
margin:10px 0;
}

.comment-box{
background:#fff4d6;
padding:10px;
border-radius:15px;
}

textarea{
width:90%;
height:60px;
}

</style>

</head>


<body>


<h1>👩‍🏫 先生ページ</h1>


<div id="list">
読み込み中...
</div>



<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,
collection,
onSnapshot,
doc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain: "manabi-album-v2.firebaseapp.com",

projectId: "manabi-album-v2",

storageBucket: "manabi-album-v2.firebasestorage.app",

messagingSenderId: "226258471812",

appId: "1:226258471812:web:15230ba15e7e0bd7d86bd1"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



let allData={};


onSnapshot(collection(db,"manabi"),(snapshot)=>{


allData={};


snapshot.forEach((doc)=>{


const data=doc.data();

data.id=doc.id;


if(!allData[data.name]){

allData[data.name]=[];

}


allData[data.name].push(data);


});


showStudents();


});
window.showStudents=function(){

let html="";

html += `
<h2>📁 児童一覧</h2>
`;


Object.keys(allData).forEach(name=>{


html += `

<div class="card">

<h2>
📁 ${name} さん
</h2>

<p>
${allData[name].length}件の学び
</p>


<button onclick="openStudent('${name}')">
開く
</button>


</div>

`;

});


document.getElementById("list").innerHTML=html;

}


// 児童を開く

window.openStudent=function(name){


let html=`


<button onclick="window.showStudents()">
← 児童一覧へ
</button>


<h2>
👤 ${name} さん
</h2>


<h3>📂 教科を選んでください</h3>

`;



let subjects=[];


allData[name].forEach(data=>{


if(!subjects.includes(data.subject)){

subjects.push(data.subject);

}


});



subjects.forEach(subject=>{


html += `

<div class="card">

<h2>
📚 ${subject}
</h2>


<button onclick="openSubject('${name}','${subject}')">
見る
</button>


</div>

`;

});


document.getElementById("list").innerHTML=html;


};



// 教科を開く

window.openSubject=function(name,subject){


let html=`


<button onclick="openStudent('${name}')">
← 教科一覧へ
</button>


<h2>
📚 ${name} さん　${subject}
</h2>


<h3>📖 単元を選んでください</h3>

`;



let units=[];



allData[name].forEach(data=>{


if(data.subject===subject && data.unit){


if(!units.includes(data.unit)){

units.push(data.unit);

}


}


});


// 単元フォルダ表示

units.forEach(unit=>{


html += `

<div class="card">

<h2>
📖 ${unit}
</h2>


<button onclick="openUnit('${name}','${subject}',\`${unit}\`)">
見る
</button>


</div>

`;

});



// 単元なし表示

let noUnit = allData[name].filter(data=>

data.subject===subject && !data.unit

);



if(noUnit.length>0){


html += `

<div class="card">

<h2>
📝 単元未入力の振り返り
</h2>


<button onclick="openNoUnit('${name}','${subject}')">
見る
</button>


</div>

`;

}


document.getElementById("list").innerHTML=html;


};
// 単元を開く

window.openUnit=function(name,subject,unit){


let html=`


<button onclick="openSubject('${name}','${subject}')">
← 単元一覧へ
</button>


<h2>
📖 ${unit}
</h2>

`;



allData[name].forEach(data=>{


if(
data.subject===subject &&
data.unit===unit
){


html += `

<div class="card">


<p><b>📝 今日の学び</b></p>


<div class="study-box">

${data.study}

</div>
<div class="comment-box">

<h3>✨ AI所見作成</h3>


<button onclick="makeComment('${data.id}')">

AI所見を作成

</button>
<button onclick="saveAIComment('${data.id}')">

💾 先生コメントに保存

</button>

<textarea id="aiComment-${data.id}" rows="5">

まだ作成されていません

</textarea>


</div>
<div class="level-box">

🤖 AIからの問い

<br>

${data.aiQuestion || "まだありません"}

</div>


<div class="study-box">

✏️ 深めた考え

<br>

${data.deepReflection || "まだ入力されていません"}

</div>


<div class="level-box">

🌱 ${data.level || "判定なし"}

</div>



<p>
<b>次にやりたいこと</b>
</p>

<p>
${data.next || ""}
</p>



<div class="comment-box">

<p><b>💬 先生コメント</b></p>


<textarea id="comment-${data.id}">
${data.comment || ""}
</textarea>


<br>


<button onclick="saveComment('${data.id}')">
コメント保存
</button>


</div>


</div>

`;

}


});


document.getElementById("list").innerHTML=html;


};




// 単元未入力を見る

window.openNoUnit=function(name,subject){


let html=`


<button onclick="openSubject('${name}','${subject}')">
← 教科一覧へ
</button>


<h2>
📝 ${name}さん　単元未入力の振り返り
</h2>


`;



allData[name].forEach(data=>{


if(
data.subject===subject &&
!data.unit
){


html += `

<div class="card">


<p><b>📝 今日の学び</b></p>


<div class="study-box">

${data.study}

</div>



<div class="level-box">

🌱 ${data.level || "判定なし"}

</div>



<p>
💬 ${data.comment || "コメントなし"}
</p>


</div>

`;

}


});


document.getElementById("list").innerHTML=html;


};




// コメント保存

window.saveComment = async function(id){


const text =

document.getElementById("comment-"+id).value;



await updateDoc(

doc(db,"manabi",id),

{

comment:text

}

);


alert("コメントを保存しました😊");


};
window.saveAIComment = async function(id){

const text =
document.getElementById("aiComment-"+id).value;


await updateDoc(
doc(db,"manabi",id),
{
comment:text
}
);


alert("AI所見を先生コメントに保存しました😊");

};

console.log("先生ページ完成版 読み込み完了");

window.makeComment=function(id){


let data=null;


// データを探す

Object.values(allData).forEach(list=>{

list.forEach(item=>{

if(item.id===id){

data=item;

}

});

});



if(!data){

alert("データが見つかりません");

return;

}



let comment="";


// 国語
if(data.subject==="国語"){

comment =
`${data.unit || "国語"}の学習では、文章の内容や登場人物の気持ちについて考え、友達との交流を通して自分の考えを深めることができました。${data.deepReflection || ""}`;

}


// 算数
else if(data.subject==="算数"){

comment =
`${data.unit || "算数"}の学習では、問題解決に向けて様々な考え方を試し、根拠をもって説明する力を伸ばすことができました。${data.deepReflection || ""}`;

}


// 理科
else if(data.subject==="理科"){

comment =
`${data.unit || "理科"}の学習では、予想と結果を比べながら考察し、自然の事象について進んで調べることができました。${data.deepReflection || ""}`;

}


// 社会
else if(data.subject==="社会"){

comment =
`${data.unit || "社会"}の学習では、資料や調べたことをもとに考え、社会の仕組みや人々の工夫について理解を深めることができました。${data.deepReflection || ""}`;

}


// 総合
else if(data.subject==="総合"){

comment =
`${data.unit || "総合"}の学習では、課題を見つけて調べたり、友達と考えを交流したりしながら、地域や未来について考えを深めることができました。${data.deepReflection || ""}`;

}


// 道徳
else if(data.subject==="道徳"){

comment =
`${data.unit || "道徳"}の学習では、登場人物の気持ちや行動について考え、自分の生活を振り返りながらよりよい生き方について考えることができました。${data.deepReflection || ""}`;

}


// 体育・生活など
else{

comment =
`${data.unit || data.subject}の学習では、意欲的に活動に取り組み、工夫したことや友達との関わりを通して学びを深めることができました。${data.deepReflection || ""}`;

}
document.getElementById(
"aiComment-"+id
).value = comment;

};
</script>


</body>

</html>
