<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2 先生ページ</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Noto Sans JP", sans-serif;
  background: #f4f6f8;
  color: #333;
}

header {
  background: #3d7cc9;
  color: white;
  padding: 18px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
  color: #2e69a5;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  margin: 5px;
  font-size: 16px;
  cursor: pointer;
  background: #3d7cc9;
  color: white;
}

button:hover {
  opacity: 0.9;
}

.back {
  background: #777;
}

.student-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.student-card {
  background: #eef6ff;
  border: 2px solid #c8e0f7;
  border-radius: 14px;
  padding: 18px;
  cursor: pointer;
}

.student-card:hover {
  background: #e0f0ff;
}

.subject-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.subject-card {
  background: #f3f8ff;
  border: 2px solid #d4e5f5;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
}

.subject-card:hover {
  background: #e3f0fc;
}

.unit-card {
  background: #fafafa;
  border-left: 5px solid #3d7cc9;
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
}

.reflection-card {
  background: #f8fbfd;
  border-radius: 10px;
  padding: 15px;
  margin: 12px 0;
  border-left: 5px solid #55a96d;
}

.date {
  font-size: 14px;
  color: #777;
}

.level {
  background: #eef8ee;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
}

.loading {
  padding: 20px;
  text-align: center;
}

.cache-info {
  font-size: 13px;
  color: #777;
  background: #f5f5f5;
  padding: 8px;
  border-radius: 8px;
}

.hidden {
  display: none;
}

@media (max-width: 800px) {

  .student-grid,
  .subject-grid {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 500px) {

  .student-grid,
  .subject-grid {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<header>
👩‍🏫 学びアルバム Ver.2　先生ページ
</header>

<div class="container">


<!-- =====================================================
     メイン
===================================================== -->

<div id="teacherHome" class="card">

<h2>📚 先生メニュー</h2>

<p>
<strong>2026年度</strong>
</p>

<button onclick="loadStudents()">
👧 児童一覧
</button>

<button onclick="clearAllCache()">
🔄 キャッシュを更新
</button>

<div id="homeMessage"></div>

</div>


<!-- =====================================================
     児童一覧
===================================================== -->

<div id="studentPage" class="card hidden">

<h2>👧 児童一覧</h2>

<div class="cache-info">
💡 一度取得したデータはブラウザに一時保存し、
同じ情報を何度もFirebaseから読み込まない仕組みです。
</div>

<div
  id="studentList"
  class="student-grid"
>
</div>

<button
  class="back"
  onclick="goHome()"
>
戻る
</button>

</div>


<!-- =====================================================
     教科一覧
===================================================== -->

<div id="subjectPage" class="card hidden">

<h2 id="studentTitle">
📚 教科を選んでください
</h2>

<div
  id="subjectList"
  class="subject-grid"
>
</div>

<button
  class="back"
  onclick="backToStudents()"
>
児童一覧へ
</button>

</div>


<!-- =====================================================
     振り返り一覧
===================================================== -->

<div id="reflectionPage" class="card hidden">

<h2 id="reflectionTitle">
📝 振り返り
</h2>

<div
  id="reflectionList"
>
</div>

<button
  class="back"
  onclick="backToSubjects()"
>
教科一覧へ
</button>

</div>


</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ======================================================
// Firebase設定
// ↓↓↓ 自分のFirebase設定に置き換えてください ↓↓↓
// ======================================================

const firebaseConfig = {

  apiKey: "ここにAPIキー",

  authDomain: "ここにauthDomain",

  projectId: "ここにprojectId",

  storageBucket: "ここにstorageBucket",

  messagingSenderId: "ここにmessagingSenderId",

  appId: "ここにappId"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


// ======================================================
// 年度
// ======================================================

const SCHOOL_YEAR = 2026;


// ======================================================
// キャッシュ
// ======================================================

const CACHE_PREFIX =
  "teacherManabiCache_";


// ======================================================
// 現在選択中
// ======================================================

let currentStudentNumber = null;

let currentSubject = null;

let currentStudentData = [];


// ======================================================
// 画面切り替え
// ======================================================

function showOnly(id) {

  const pages = [
    "teacherHome",
    "studentPage",
    "subjectPage",
    "reflectionPage"
  ];


  pages.forEach(page => {

    document
      .getElementById(page)
      .classList.add("hidden");

  });


  document
    .getElementById(id)
    .classList.remove("hidden");

}


// ======================================================
// ホーム
// ======================================================

window.goHome = function() {

  showOnly("teacherHome");

};


// ======================================================
// 児童一覧
// ======================================================

window.loadStudents = async function() {

  showOnly("studentPage");


  const list =
    document.getElementById(
      "studentList"
    );


  list.innerHTML =
    `<div class="loading">
      📡 児童一覧を確認しています...
    </div>`;


  const cacheKey =
    CACHE_PREFIX +
    SCHOOL_YEAR +
    "_ALL";


  try {

    const cached =
      localStorage.getItem(
        cacheKey
      );


    let data;


    // --------------------------------------------------
    // キャッシュがある場合
    // --------------------------------------------------

    if (cached) {

      console.log(
        "📦 児童一覧：キャッシュ"
      );


      data =
        JSON.parse(cached).data;


    } else {

      // ------------------------------------------------
      // キャッシュがない場合だけFirebase
      // ------------------------------------------------

      console.log(
        "🔥 児童一覧：Firebase"
      );


      const q =
        query(
          collection(db, "manabi"),

          where(
            "schoolYear",
            "==",
            SCHOOL_YEAR
          )
        );


      const snapshot =
        await getDocs(q);


      data =
        snapshot.docs.map(
          d => ({
            id: d.id,
            ...d.data()
          })
        );


      localStorage.setItem(
        cacheKey,
        JSON.stringify({

          savedAt:
            Date.now(),

          data:
            data

        })
      );

    }


    currentStudentData =
      data;


    // ==================================================
    // 児童ごとの集計
    // ==================================================

    const students = {};


    data.forEach(item => {

      const number =
        String(
          item.studentNumber
        );


      if (!students[number]) {

        students[number] = {

          studentNumber:
            number,

          count: 0

        };

      }


      students[number].count++;

    });


    const numbers =
      Object.keys(students)
        .sort(
          (a,b) =>
            Number(a) -
            Number(b)
        );


    if (!numbers.length) {

      list.innerHTML =
        "<p>まだ振り返りがありません。</p>";

      return;

    }


    list.innerHTML = "";


    numbers.forEach(number => {

      const student =
        students[number];


      const card =
        document.createElement("div");


      card.className =
        "student-card";


      card.innerHTML = `

        <h3>
          ${escapeHtml(number)}番
        </h3>

        <p>
          振り返り
          <strong>
            ${student.count}
          </strong>
          件
        </p>

      `;


      card.onclick =
        () =>
          openStudent(
            number
          );


      list.appendChild(card);

    });


  } catch (error) {

    console.error(error);

    list.innerHTML =
      `<p>
        児童一覧を読み込めませんでした。
      </p>`;

  }

};


// ======================================================
// 児童を開く
// ======================================================

window.openStudent = function(
  studentNumber
) {

  currentStudentNumber =
    String(studentNumber);


  document.getElementById(
    "studentTitle"
  ).textContent =
    `👤 ${currentStudentNumber}番の教科`;


  showOnly("subjectPage");


  showSubjects();

};


// ======================================================
// 教科一覧
// ======================================================

function showSubjects() {

  const subjects = [

    "国語",
    "算数",
    "生活",
    "理科",
    "社会",
    "総合",
    "道徳",
    "体育"

  ];


  const list =
    document.getElementById(
      "subjectList"
    );


  list.innerHTML = "";


  subjects.forEach(subject => {

    const count =
      currentStudentData.filter(
        item =>
          String(
            item.studentNumber
          ) ===
          String(
            currentStudentNumber
          ) &&
          item.subject ===
          subject
      ).length;


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "subject-card";


    card.innerHTML = `

      <div style="font-size:30px;">
        📖
      </div>

      <div>
        ${subject}
      </div>

      <div style="font-size:13px;color:#777;">
        ${count}件
      </div>

    `;


    card.onclick =
      () =>
        openSubject(
          currentStudentNumber,
          subject
        );


    list.appendChild(card);

  });

}


// ======================================================
// 教科を開く
// ======================================================

window.openSubject = async function(
  studentNumber,
  subject
) {

  currentStudentNumber =
    String(studentNumber);

  currentSubject =
    subject;


  document.getElementById(
    "reflectionTitle"
  ).textContent =
    `📝 ${currentStudentNumber}番　${subject}`;


  showOnly("reflectionPage");


  const list =
    document.getElementById(
      "reflectionList"
    );


  list.innerHTML =
    `<div class="loading">
      📡 振り返りを確認しています...
    </div>`;


  try {

    // ==================================================
    // 重要
    //
    // 教科ごとのキャッシュを使用
    // ==================================================

    const cacheKey =
      CACHE_PREFIX +
      SCHOOL_YEAR +
      "_" +
      currentStudentNumber +
      "_" +
      subject;


    const cached =
      localStorage.getItem(
        cacheKey
      );


    let data;


    if (cached) {

      console.log(
        "📦 教科データ：キャッシュ"
      );


      data =
        JSON.parse(cached).data;


    } else {

      console.log(
        "🔥 教科データ：Firebase"
      );


      const q =
        query(

          collection(
            db,
            "manabi"
          ),

          where(
            "schoolYear",
            "==",
            SCHOOL_YEAR
          ),

          where(
            "studentNumber",
            "==",
            String(
              currentStudentNumber
            )
          ),

          where(
            "subject",
            "==",
            subject
          )

        );


      const snapshot =
        await getDocs(q);


      data =
        snapshot.docs.map(
          d => ({
            id: d.id,
            ...d.data()
          })
        );


      localStorage.setItem(
        cacheKey,
        JSON.stringify({

          savedAt:
            Date.now(),

          data:
            data

        })
      );

    }


    data.sort(
      (a,b) =>
        new Date(b.date) -
        new Date(a.date)
    );


    if (!data.length) {

      list.innerHTML =
        "<p>この教科の振り返りはまだありません。</p>";

      return;

    }


    // ==================================================
    // 単元ごとに整理
    // ==================================================

    const units = {};


    data.forEach(item => {

      const unit =
        item.unit ||
        "単元名なし";


      if (!units[unit]) {

        units[unit] = [];

      }


      units[unit].push(item);

    });


    let html = "";


    Object.keys(units).forEach(unit => {

      html += `

        <div class="unit-card">

          <h3>
            📚 ${escapeHtml(unit)}
          </h3>

      `;


      units[unit].forEach(item => {

        html += `

          <div class="reflection-card">

            <div class="date">
              ${formatDate(item.date)}
            </div>

            <p>
              ${escapeHtml(item.study)}
            </p>

            ${
              item.aiQuestion
              ?
              `
              <div>
                🤖
                ${escapeHtml(
                  item.aiQuestion
                )}
              </div>
              `
              :
              ""
            }


            ${
              item.deepReflection
              ?
              `
              <div class="level">

                🌱
                深まりレベル：
                ${escapeHtml(
                  item.deepLevel ||
                  ""
                )}

                <p>
                  ${escapeHtml(
                    item.deepReflection
                  )}
                </p>

              </div>
              `
              :
              ""
            }

          </div>

        `;

      });


      html += `</div>`;

    });


    list.innerHTML =
      html;


  } catch (error) {

    console.error(error);

    list.innerHTML =
      `<p>
        振り返りを読み込めませんでした。
      </p>`;

  }

};


// ======================================================
// 児童一覧へ
// ======================================================

window.backToStudents =
  function() {

    loadStudents();

  };


// ======================================================
// 教科一覧へ
// ======================================================

window.backToSubjects =
  function() {

    openStudent(
      currentStudentNumber
    );

  };


// ======================================================
// キャッシュ全削除
// ======================================================

window.clearAllCache =
  function() {

    const keys = [];


    for (
      let i = 0;
      i < localStorage.length;
      i++
    ) {

      const key =
        localStorage.key(i);


      if (
        key &&
        key.startsWith(
          CACHE_PREFIX
        )
      ) {

        keys.push(key);

      }

    }


    keys.forEach(
      key =>
        localStorage.removeItem(key)
    );


    document.getElementById(
      "homeMessage"
    ).innerHTML =
      `<div style="
        margin-top:10px;
        padding:10px;
        background:#e8f8ec;
        border-radius:8px;
      ">
        🔄 キャッシュを更新しました。
        次回はFirebaseから最新データを取得します。
      </div>`;

  };


// ======================================================
// 日付
// ======================================================

function formatDate(dateString) {

  if (!dateString) {
    return "";
  }


  const d =
    new Date(dateString);


  return (
    d.getFullYear() +
    "年" +
    (d.getMonth() + 1) +
    "月" +
    d.getDate() +
    "日"
  );

}


// ======================================================
// HTML安全化
// ======================================================

function escapeHtml(value) {

  if (
    value === undefined ||
    value === null
  ) {

    return "";

  }


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>

</body>
</html>
