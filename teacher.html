<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2 先生ページ</title>


<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;

  background:#f4f7fb;

  color:#333;

}

header{

  background:
    linear-gradient(
      135deg,
      #4f8cff,
      #6c63ff
    );

  color:white;

  text-align:center;

  padding:22px;

}

header h1{

  margin:0;

  font-size:28px;

}

.container{

  max-width:1100px;

  margin:auto;

  padding:20px;

}

.page{

  display:none;

}

.page.active{

  display:block;

}

.box{

  background:white;

  border-radius:18px;

  padding:24px;

  margin-bottom:20px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.08);

}

input,
select,
textarea{

  width:100%;

  padding:13px;

  margin-top:8px;

  border:
    1px solid #ddd;

  border-radius:11px;

  font-size:16px;

}

label{

  display:block;

  margin-top:16px;

  font-weight:bold;

}

textarea{

  min-height:130px;

}

button{

  border:none;

  border-radius:11px;

  padding:13px 20px;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

}

.primary{

  background:#4f8cff;

  color:white;

}

.green{

  background:#43b883;

  color:white;

}

.red{

  background:#e85b5b;

  color:white;

}

.gray{

  background:#e9eef8;

  color:#333;

}

.button-row{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-top:18px;

}

.lesson-status{

  padding:18px;

  border-radius:14px;

  background:#eef4ff;

  margin-top:18px;

}

.lesson-active{

  border-left:
    7px solid #43b883;

}

.lesson-ended{

  border-left:
    7px solid #aaa;

}

.big-subject{

  font-size:28px;

  font-weight:bold;

  margin:8px 0;

}

.unit{

  font-size:19px;

}

.student-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:15px;

}

.student-card{

  background:white;

  border-radius:16px;

  padding:20px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.07);

  cursor:pointer;

}

.student-name{

  font-size:20px;

  font-weight:bold;

}

.count{

  color:#777;

  margin-top:7px;

}

.reflection-card{

  background:white;

  border-radius:16px;

  padding:20px;

  margin:15px 0;

  box-shadow:
    0 3px 12px rgba(0,0,0,.07);

}

.card-header{

  display:flex;

  justify-content:space-between;

  flex-wrap:wrap;

  gap:10px;

}

.subject-tag{

  display:inline-block;

  background:#eaf1ff;

  color:#3769c8;

  padding:5px 10px;

  border-radius:20px;

  font-size:13px;

}

.study{

  white-space:pre-wrap;

  line-height:1.8;

  margin-top:15px;

}

.deep{

  background:#f7f7f7;

  padding:15px;

  border-radius:10px;

  margin-top:15px;

  white-space:pre-wrap;

  line-height:1.7;

}

.ai{

  background:#f0f7ff;

  border-left:
    5px solid #4f8cff;

  padding:15px;

  border-radius:10px;

  margin-top:15px;

}

.level{

  display:inline-block;

  background:#fff0c7;

  padding:6px 12px;

  border-radius:20px;

  margin-top:10px;

  font-weight:bold;

}

.empty{

  text-align:center;

  padding:35px;

  color:#777;

}

.search-box{

  margin-bottom:20px;

}

.stat-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:15px;

}

.stat{

  background:#f7f9fc;

  padding:20px;

  border-radius:14px;

  text-align:center;

}

.stat-number{

  font-size:30px;

  font-weight:bold;

}

@media(max-width:700px){

  .student-grid{

    grid-template-columns:
      repeat(2,1fr);

  }

  .stat-grid{

    grid-template-columns:1fr;

  }

}

</style>

</head>


<body>


<header>

  <h1>👩‍🏫 学びアルバム Ver.2</h1>

  <div>
    先生ページ
  </div>

</header>


<div class="container">


<!-- =================================================
     授業管理
================================================= -->

<section
  id="lessonPage"
  class="page active">


  <div class="box">

    <h2>📚 授業を開始する</h2>

    <p>
      ここで教科と単元を設定すると、
      児童側に自動表示されます。
    </p>


    <label>

      教科

      <select id="subject">

        <option value="">選択してください</option>

        <option>国語</option>

        <option>算数</option>

        <option>生活</option>

        <option>理科</option>

        <option>社会</option>

        <option>総合</option>

        <option>道徳</option>

        <option>体育</option>

      </select>

    </label>


    <label>

      単元名

      <input
        id="unit"
        type="text"
        placeholder="例：わり算の考え方">

    </label>


    <div class="button-row">

      <button
        class="primary"
        onclick="startLesson()">

        ▶️ 授業開始

      </button>

      <button
        class="red"
        onclick="endLesson()">

        ⏹️ 授業終了

      </button>

    </div>


    <div id="lessonStatus"></div>

  </div>


  <div class="box">

    <h2>📊 現在の状況</h2>

    <div
      id="stats"
      class="stat-grid">

    </div>

  </div>


  <div class="button-row">

    <button
      class="primary"
      onclick="openStudents()">

      👦👧 児童の振り返りを見る

    </button>

  </div>


</section>


<!-- =================================================
     児童一覧
================================================= -->

<section
  id="studentsPage"
  class="page">


  <button
    class="gray"
    onclick="showPage('lessonPage')">

    ← 授業管理へ戻る

  </button>


  <div class="box">

    <h2>👦👧 児童一覧</h2>

    <input
      id="studentSearch"
      class="search-box"
      placeholder="児童名で検索"
      oninput="displayStudents()">

    <div
      id="studentGrid"
      class="student-grid">

    </div>

  </div>


</section>


<!-- =================================================
     児童詳細
================================================= -->

<section
  id="studentDetailPage"
  class="page">


  <button
    class="gray"
    onclick="openStudents()">

    ← 児童一覧へ戻る

  </button>


  <div class="box">

    <h2 id="studentDetailTitle">
      児童の振り返り
    </h2>

    <div
      id="studentSubjects"
      class="button-row">

    </div>

  </div>


  <div id="studentDetailList"></div>


</section>


</div>


<script type="module">


import {

  initializeApp

} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

  getFirestore,

  collection,

  getDocs,

  query,

  where,

  doc,

  setDoc,

  updateDoc,

  onSnapshot,

  serverTimestamp

} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   Firebase設定
================================================== */

const firebaseConfig = {

  apiKey: "ここにAPI_KEY",

  authDomain: "ここにAUTH_DOMAIN",

  projectId: "ここにPROJECT_ID",

  storageBucket: "ここにSTORAGE_BUCKET",

  messagingSenderId:
    "ここにMESSAGING_SENDER_ID",

  appId: "ここにAPP_ID"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* ==================================================
   データ
================================================== */

let currentLesson = null;

let allReflections = [];

let selectedStudent = "";

let selectedSubject = "";


/* ==================================================
   ページ切り替え
================================================== */

window.showPage =
function(pageId){

  document
    .querySelectorAll(".page")
    .forEach(page=>{

      page.classList.remove("active");

    });


  document
    .getElementById(pageId)
    .classList.add("active");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* ==================================================
   現在の授業を監視
================================================== */

const lessonRef =
  doc(
    db,
    "currentLesson",
    "today"
  );


onSnapshot(
  lessonRef,
  snapshot=>{

    if(!snapshot.exists()){

      currentLesson = null;

      showLessonStatus();

      return;

    }


    currentLesson =
      snapshot.data();


    showLessonStatus();

    loadReflections();

  },
  error=>{

    console.error(error);

    document.getElementById(
      "lessonStatus"
    ).innerHTML =
      `<div class="lesson-status lesson-ended">
        Firebaseとの接続を確認してください。
      </div>`;

  }
);


/* ==================================================
   授業表示
================================================== */

function showLessonStatus(){

  const area =
    document.getElementById(
      "lessonStatus"
    );


  if(!currentLesson){

    area.innerHTML =
      `<div class="lesson-status lesson-ended">
        ⏸️ 現在、授業は設定されていません。
      </div>`;

    return;

  }


  if(currentLesson.active !== true){

    area.innerHTML = `

      <div class="lesson-status lesson-ended">

        ⏸️ 授業終了

        <div class="big-subject">
          ${escapeHtml(currentLesson.subject || "")}
        </div>

        <div class="unit">
          ${escapeHtml(currentLesson.unit || "")}
        </div>

      </div>

    `;

    return;

  }


  area.innerHTML = `

    <div class="lesson-status lesson-active">

      🟢 授業中

      <div class="big-subject">
        ${escapeHtml(currentLesson.subject || "")}
      </div>

      <div class="unit">
        📘 ${escapeHtml(currentLesson.unit || "")}
      </div>

      <p>
        授業ID：
        ${escapeHtml(currentLesson.lessonId || "")}
      </p>

    </div>

  `;

}


/* ==================================================
   授業ID自動作成
================================================== */

function createLessonId(){

  const now =
    new Date();


  const datePart =
    now.getFullYear() +

    String(
      now.getMonth()+1
    ).padStart(2,"0") +

    String(
      now.getDate()
    ).padStart(2,"0") +

    "-" +

    String(
      now.getHours()
    ).padStart(2,"0") +

    String(
      now.getMinutes()
    ).padStart(2,"0") +

    String(
      now.getSeconds()
    ).padStart(2,"0");


  const randomPart =
    Math.random()
      .toString(36)
      .substring(2,7)
      .toUpperCase();


  return `${datePart}-${randomPart}`;

}


/* ==================================================
   授業開始
================================================== */

window.startLesson =
async function(){

  const subject =
    document
      .getElementById("subject")
      .value;


  const unit =
    document
      .getElementById("unit")
      .value.trim();


  if(!subject){

    alert("教科を選択してください。");
    return;

  }


  if(!unit){

    alert("単元名を入力してください。");
    return;

  }


  const lessonId =
    createLessonId();


  try{

    await setDoc(

      doc(
        db,
        "currentLesson",
        "today"
      ),

      {

        lessonId:lessonId,

        subject:subject,

        unit:unit,

        active:true,

        startedAt:
          serverTimestamp(),

        createdAt:
          new Date().toLocaleString(
            "ja-JP"
          )

      }

    );


    alert(
      "授業を開始しました！\n\n" +
      "児童側には教科・単元が自動表示されます。"
    );


  }catch(error){

    console.error(error);

    alert(
      "授業を開始できませんでした。"
    );

  }

};


/* ==================================================
   授業終了
================================================== */

window.endLesson =
async function(){

  if(!currentLesson){

    alert("現在の授業がありません。");
    return;

  }


  if(!confirm(
    "現在の授業を終了しますか？"
  )){

    return;

  }


  try{

    await updateDoc(

      doc(
        db,
        "currentLesson",
        "today"
      ),

      {

        active:false,

        endedAt:
          serverTimestamp()

      }

    );


    alert("授業を終了しました。");


  }catch(error){

    console.error(error);

    alert(
      "授業を終了できませんでした。"
    );

  }

};


/* ==================================================
   振り返り読み込み
================================================== */

async function loadReflections(){

  try{

    const snapshot =
      await getDocs(
        collection(db,"manabi")
      );


    allReflections = [];


    snapshot.forEach(
      docSnap=>{

        allReflections.push({

          id:docSnap.id,

          ...docSnap.data()

        });

      }
    );


    updateStats();

    displayStudents();

  }catch(error){

    console.error(error);

  }

}


/* ==================================================
   統計
================================================== */

function updateStats(){

  const stats =
    document.getElementById(
      "stats"
    );


  const current =
    currentLesson
      ? allReflections.filter(
          item =>
            item.lessonId ===
            currentLesson.lessonId
        )
      : [];


  const students =
    new Set(
      current
        .map(item=>item.name)
        .filter(Boolean)
    );


  const deep =
    current.filter(
      item =>
        Number(item.deepLevel || 0)
        >= 3
    );


  stats.innerHTML = `

    <div class="stat">

      <div>
        👦👧 児童数
      </div>

      <div class="stat-number">
        ${students.size}
      </div>

    </div>


    <div class="stat">

      <div>
        📝 振り返り
      </div>

      <div class="stat-number">
        ${current.length}
      </div>

    </div>


    <div class="stat">

      <div>
        🌟 レベル3
      </div>

      <div class="stat-number">
        ${deep.length}
      </div>

    </div>

  `;

}


/* ==================================================
   児童一覧
================================================== */

window.openStudents =
function(){

  showPage("studentsPage");

  displayStudents();

};


window.displayStudents =
function(){

  const grid =
    document.getElementById(
      "studentGrid"
    );


  const keyword =
    document
      .getElementById("studentSearch")
      .value
      .trim();


  let data =
    currentLesson

      ? allReflections.filter(
          item =>
            item.lessonId ===
            currentLesson.lessonId
        )

      : [];


  const studentMap = {};


  data.forEach(item=>{

    const name =
      item.name || "名前なし";


    if(!studentMap[name]){

      studentMap[name] = 0;

    }


    studentMap[name]++;

  });


  let names =
    Object.keys(studentMap)
      .sort(
        (a,b)=>
          a.localeCompare(
            b,
            "ja"
          )
      );


  if(keyword){

    names =
      names.filter(
        name =>
          name.includes(keyword)
      );

  }


  if(names.length === 0){

    grid.innerHTML =
      `<div class="empty">
        まだ振り返りはありません。
      </div>`;

    return;

  }


  grid.innerHTML =
    names
      .map(
        name=>`

          <div
            class="student-card"
            onclick="openStudent('${escapeJs(name)}')">

            <div class="student-name">
              👤 ${escapeHtml(name)}
            </div>

            <div class="count">
              振り返り ${studentMap[name]}件
            </div>

          </div>

        `
      )
      .join("");

};


/* ==================================================
   児童詳細
================================================== */

window.openStudent =
function(name){

  selectedStudent =
    name;


  showPage(
    "studentDetailPage"
  );


  document.getElementById(
    "studentDetailTitle"
  ).innerHTML =
    `👤 ${escapeHtml(name)} の振り返り`;


  const data =
    allReflections.filter(
      item =>

        item.lessonId ===
        (currentLesson
          ? currentLesson.lessonId
          : "") &&

        item.name === name
    );


  const subjects = [
    ...new Set(
      data.map(
        item=>item.subject
      )
    )
  ];


  const subjectArea =
    document.getElementById(
      "studentSubjects"
    );


  if(subjects.length === 0){

    subjectArea.innerHTML =
      "振り返りはありません。";

    return;

  }


  subjectArea.innerHTML =
    subjects
      .map(
        subject=>`

          <button
            class="primary"
            onclick="openSubject('${escapeJs(subject)}')">

            ${escapeHtml(subject)}

          </button>

        `
      )
      .join("");


  if(subjects.length > 0){

    openSubject(subjects[0]);

  }

};


/* ==================================================
   教科表示
================================================== */

window.openSubject =
function(subject){

  selectedSubject =
    subject;


  const area =
    document.getElementById(
      "studentDetailList"
    );


  const data =
    allReflections.filter(
      item =>

        item.lessonId ===
        (currentLesson
          ? currentLesson.lessonId
          : "") &&

        item.name ===
        selectedStudent &&

        item.subject ===
        subject
    );


  data.sort(
    (a,b)=>
      String(b.date || "")
        .localeCompare(
          String(a.date || "")
        )
  );


  if(data.length === 0){

    area.innerHTML =
      `<div class="empty">
        ${escapeHtml(subject)}
        の振り返りはありません。
      </div>`;

    return;

  }


  area.innerHTML = `

    <div class="box">

      <h2>
        📚 ${escapeHtml(subject)}
      </h2>

      ${data
        .map(item=>
          teacherReflectionCard(item)
        )
        .join("")}

    </div>

  `;

};


/* ==================================================
   先生用カード
================================================== */

function teacherReflectionCard(item){

  const level =
    Number(
      item.deepLevel || 1
    );


  return `

    <div class="reflection-card">

      <div class="card-header">

        <div>

          <span class="subject-tag">
            ${escapeHtml(item.subject || "")}
          </span>

          <strong>
            ${escapeHtml(item.unit || "")}
          </strong>

        </div>

        <div>
          ${escapeHtml(item.date || "")}
        </div>

      </div>


      <div class="study">

        <strong>
          ✏️ 今日の学び
        </strong>

        <br><br>

        ${escapeHtml(item.study || "")}

      </div>


      ${
        item.aiQuestion
          ? `

            <div class="ai">

              <strong>
                🤖 AIからの問い
              </strong>

              <br><br>

              ${escapeHtml(
                item.aiQuestion
              )}

            </div>

          `
          : ""
      }


      <div class="level">

        🌱 振り返りレベル
        ${level}

      </div>


      ${
        item.deepReflection
          ? `

            <div class="deep">

              <strong>
                🌱 深まり振り返り
              </strong>

              <br><br>

              ${escapeHtml(
                item.deepReflection
              )}

            </div>

          `
          : `

            <div class="deep">

              まだ深まり振り返りは
              入力されていません。

            </div>

          `
      }

    </div>

  `;

}


/* ==================================================
   HTML安全化
================================================== */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJs(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


/* ==================================================
   最初のデータ読み込み
================================================== */

loadReflections();

</script>

</body>

</html>
