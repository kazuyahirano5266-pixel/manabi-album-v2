<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>学びアルバム｜先生ページ</title>

<style>

*{
box-sizing:border-box;
}

body{

font-family:sans-serif;

background:#f0f8ff;

margin:0;

padding:20px;

color:#333;

}

.box{

background:white;

padding:25px;

border-radius:25px;

max-width:1200px;

margin:0 auto 20px;

}

h1{

text-align:center;

}

button{

padding:12px 22px;

border:none;

border-radius:20px;

background:#2b7a78;

color:white;

font-size:16px;

margin:6px;

cursor:pointer;

}

button:hover{

opacity:.85;

}

.back-button{

background:#777;

}

.refresh-button{

background:#4c8bf5;

}

.card{

background:white;

padding:18px;

border-radius:20px;

box-shadow:0 3px 8px #ccc;

}

.grid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:20px;

margin-top:20px;

}

.student-grid{

display:grid;

grid-template-columns:
repeat(5,1fr);

gap:12px;

margin-top:20px;

}

.student-card{

background:#f8fbff;

padding:15px;

border-radius:18px;

border:2px solid #d9edf7;

text-align:center;

}

.submitted{

background:#eaffea;

border-color:#8ed18e;

}

.not-submitted{

background:#f5f5f5;

border-color:#ddd;

}

.status{

font-size:28px;

}

.progress-box{

background:#eaf6ff;

padding:25px;

border-radius:20px;

margin-top:20px;

text-align:center;

}

.progress-number{

font-size:42px;

font-weight:bold;

margin:10px;

color:#2b7a78;

}

.progress-bar{

width:100%;

height:30px;

background:#ddd;

border-radius:20px;

overflow:hidden;

margin:15px 0;

}

.progress-fill{

height:100%;

background:#2b7a78;

width:0%;

transition:.5s;

}

.info-box{

background:#f8fbff;

border:2px solid #d9edf7;

padding:18px;

border-radius:20px;

margin:20px 0;

}

.lesson-title{

background:#e8f7e8;

padding:18px;

border-radius:20px;

margin-top:20px;

}

.section-title{

background:#eaf6ff;

padding:15px;

border-radius:15px;

margin-top:20px;

}

.study-box{

background:#f5f5f5;

padding:15px;

border-radius:15px;

margin:10px 0;

line-height:1.8;

white-space:pre-wrap;

word-break:break-word;

}

.deep-box{

background:#f0fff0;

padding:15px;

border-radius:15px;

margin:10px 0;

line-height:1.8;

white-space:pre-wrap;

word-break:break-word;

}

.advice-box{

background:#eaf6ff;

padding:18px;

border-radius:20px;

margin:15px 0;

line-height:1.8;

}

.praise-box{

background:#fff4b8;

padding:18px;

border-radius:20px;

margin:15px 0;

line-height:1.8;

border:2px solid #f0d76a;

}

.comment-box{

background:#fff4d6;

padding:18px;

border-radius:20px;

margin:15px 0;

line-height:1.8;

}

.level-box{

padding:14px;

border-radius:15px;

margin:10px 0;

line-height:1.8;

background:#eaf6ff;

}

.level1{

background:#f5f5f5;

}

.level2{

background:#eaffea;

}

.level3{

background:#fff4b8;

}

.date{

font-size:14px;

color:#777;

}

.empty{

padding:30px;

background:#f8f8f8;

border-radius:20px;

margin-top:20px;

text-align:center;

}

.loading{

padding:30px;

text-align:center;

font-size:20px;

}

.teacher-login{

max-width:500px;

margin:60px auto;

text-align:center;

}

input,
textarea,
select{

width:90%;

padding:12px;

font-size:17px;

margin:8px;

border:1px solid #ccc;

border-radius:10px;

}

textarea{

min-height:120px;

line-height:1.7;

}

.hidden{

display:none;

}

.logout{

background:#555;

}

.ai-button{

background:#7b4ab8;

}

.count-small{

font-size:15px;

color:#666;

}

@media(max-width:900px){

.grid{

grid-template-columns:
repeat(2,1fr);

}

.student-grid{

grid-template-columns:
repeat(4,1fr);

}

}

@media(max-width:650px){

body{

padding:10px;

}

.box{

padding:15px;

}

.grid{

grid-template-columns:1fr;

}

.student-grid{

grid-template-columns:
repeat(3,1fr);

}

}

</style>

</head>


<body>


<!-- ==================================================
先生ログイン
================================================== -->

<div
class="box teacher-login"
id="teacherLogin">

<h1>👩‍🏫 学びアルバム</h1>

<h2>先生ページ</h2>

<p>先生用パスワードを入力してください。</p>

<input
type="password"
id="teacherPassword"
placeholder="パスワード">

<p
id="loginMessage"
style="color:#d33;font-weight:bold;">
</p>

<button onclick="teacherLogin()">

ログイン

</button>

</div>


<!-- ==================================================
先生ホーム
================================================== -->

<div
class="box hidden"
id="teacherHome">

<h1>
👩‍🏫 先生ページ
</h1>


<!-- 今日の授業 -->

<div
class="lesson-title">

<h2>
📚 今日の授業
</h2>

<p>

今日提出された振り返りから
授業を自動判定します。

</p>

</div>


<div
id="todayLessons">

<div class="loading">

📚 今日の授業を読み込んでいます...

</div>

</div>


<button
class="refresh-button"
onclick="loadTodayLessons()">

🔄 最新の提出状況に更新

</button>


<button
class="logout"
onclick="teacherLogout()">

🚪 ログアウト

</button>

</div>


<!-- ==================================================
授業詳細
================================================== -->

<div
class="box hidden"
id="lessonPage">

<div id="lessonDetail"></div>

<br>

<button
class="back-button"
onclick="showTeacherHome()">

← 授業一覧へ

</button>

</div>


<!-- ==================================================
児童の振り返り
================================================== -->

<div
class="box hidden"
id="studentReflectionPage">

<div id="studentReflectionDetail"></div>

<br>

<button
class="back-button"
onclick="backToLesson()">

← 提出状況へ戻る

</button>

</div>


<script type="module">


/* ==================================================
Firebase
================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,
collection,
query,
where,
getDocs,
updateDoc,
doc

}

from

"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain:
"manabi-album-v2.firebaseapp.com",

projectId:
"manabi-album-v2",

storageBucket:
"manabi-album-v2.firebasestorage.app",

messagingSenderId:
"226258471812",

appId:
"1:226258471812:web:15230ba15e7e0bd7d86bd1"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ==================================================
設定
================================================== */

const TEACHER_PASSWORD="1111";

const TOTAL_STUDENTS=30;

let todayData=[];

let currentLessonId="";

let currentSubject="";

let currentUnit="";


/* ==================================================
安全表示
================================================== */

function escapeHTML(value){

if(
value===undefined ||
value===null
){

return "";

}

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* ==================================================
日付
================================================== */

function getTodayStart(){

const now=
new Date();

now.setHours(
0,0,0,0
);

return now;

}


function getTodayString(){

const now=
new Date();

const year=
now.getFullYear();

const month=
String(
now.getMonth()+1
).padStart(2,"0");

const day=
String(
now.getDate()
).padStart(2,"0");

return `${year}-${month}-${day}`;

}


/* ==================================================
🆔 授業ID自動作成
================================================== */

function createLessonId(
subject,
unit
){

return `${getTodayString()}_${subject}_${unit}`;

}


/* ==================================================
日付表示
================================================== */

function formatDate(value){

if(!value){

return "日付なし";

}

try{

if(
value.toDate
){

return value
.toDate()
.toLocaleString(
"ja-JP"
);

}

return new Date(value)
.toLocaleString(
"ja-JP"
);

}catch{

return "日付なし";

}

}


/* ==================================================
レベル判定
================================================== */

function judgeReflectionLevel(
text
){

const study=
(text || "").trim();

if(!study){

return 1;

}

const length=
study.length;


const level3Words=[

"友達",
"友だち",
"友達の考え",
"友だちの考え",
"教科書",
"資料",
"本文",
"話し合い",
"発表",
"意見",
"考えを聞いて",
"比べ",
"くらべ",
"違い",
"ちがい",
"実験結果",
"結果から",
"理由",
"なぜ",
"どうして",
"根拠",
"もとに",
"参考に"

];


let count3=0;

level3Words.forEach(
word=>{

if(
study.includes(word)
){

count3++;

}

});


if(
length>=35 &&
count3>=1
){

return 3;

}


const level2Words=[

"分かった",
"わかった",
"できた",
"理解",
"気付",
"気づ",
"理由",
"方法",
"やり方",
"考え方",
"工夫",
"大切"

];


let count2=0;

level2Words.forEach(
word=>{

if(
study.includes(word)
){

count2++;

}

});


if(
length>=25 ||
count2>=1
){

return 2;

}


return 1;

}


/* ==================================================
レベル表示
================================================== */

function getLevelHTML(
level
){

if(
level===3
){

return `

<div class="level-box level3">

🌳 <strong>レベル3</strong>

<br><br>

いろいろな考えや資料などをもとに、
自分の学びを深く考えています。

</div>

`;

}


if(
level===2
){

return `

<div class="level-box level2">

🌿 <strong>レベル2</strong>

<br><br>

分かったことや気付いたことを、
具体的に書けています。

</div>

`;

}


return `

<div class="level-box level1">

🌱 <strong>レベル1</strong>

<br><br>

自分の気持ちや感じたことを
書けています。

</div>

`;

}


/* ==================================================
ログイン
================================================== */

window.teacherLogin=function(){

const password=
document.getElementById(
"teacherPassword"
).value.trim();


if(
password!==TEACHER_PASSWORD
){

document.getElementById(
"loginMessage"
).innerText=
"🔑 パスワードが違います。";

return;

}


localStorage.setItem(
"manabiTeacherLogin",
"true"
);


showTeacherHome();

};


/* ==================================================
先生ログアウト
================================================== */

window.teacherLogout=function(){

localStorage.removeItem(
"manabiTeacherLogin"
);

document.getElementById(
"teacherHome"
).style.display="none";

document.getElementById(
"lessonPage"
).style.display="none";

document.getElementById(
"studentReflectionPage"
).style.display="none";

document.getElementById(
"teacherLogin"
).style.display="block";

};


/* ==================================================
画面切替
================================================== */

function hideAll(){

[
"teacherLogin",
"teacherHome",
"lessonPage",
"studentReflectionPage"

].forEach(
id=>{

document.getElementById(
id
).style.display="none";

});

}


/* ==================================================
先生ホーム
================================================== */

window.showTeacherHome=function(){

hideAll();

document.getElementById(
"teacherHome"
).style.display="block";

loadTodayLessons();

};


/* ==================================================
📚 今日の授業を取得
================================================== */

window.loadTodayLessons=
async function(){

document.getElementById(
"todayLessons"
).innerHTML=

`
<div class="loading">

📚 今日の授業を読み込んでいます...

</div>
`;


try{


const snapshot=
await getDocs(
collection(db,"manabi")
);


todayData=[];


const today=
getTodayStart();


snapshot.forEach(
d=>{

const data=
d.data();


let date=null;


if(
data.date &&
data.date.toDate
){

date=
data.date.toDate();

}else if(
data.date
){

date=
new Date(
data.date
);

}


if(
date &&
date>=today
){

todayData.push({

id:d.id,

studentNumber:
Number(
data.studentNumber || 0
),

lessonId:
data.lessonId || "",

subject:
data.subject || "",

unit:
data.unit || "",

study:
data.study || "",

aiQuestion:
data.aiQuestion || "",

deepReflection:
data.deepReflection || "",

likes:
Number(
data.likes || 0
),

reflectionLevel:
Number(
data.reflectionLevel ||
judgeReflectionLevel(
data.study
)
),

date:
data.date

});

}

});


showTodayLessons();


}catch(error){

console.error(error);


document.getElementById(
"todayLessons"
).innerHTML=

`
<div class="empty">

😢 読み込みに失敗しました。

<br><br>

${escapeHTML(
error.message
)}

</div>
`;

}

};


/* ==================================================
今日の授業一覧
================================================== */

function showTodayLessons(){

if(
todayData.length===0
){

document.getElementById(
"todayLessons"
).innerHTML=

`
<div class="empty">

📭 今日はまだ提出がありません。

</div>
`;

return;

}


const lessons=[];


todayData.forEach(
data=>{

let lessonId=
data.lessonId;


/*
旧データなどでlessonIdがない場合
教科＋単元から補完
*/

if(
!lessonId
){

lessonId=
createLessonId(
data.subject,
data.unit
);

}


if(
!lessons.find(
x=>x.lessonId===lessonId
)
){

lessons.push({

lessonId:

lessonId,

subject:
data.subject,

unit:
data.unit

});

}

});


let html="";


lessons.forEach(
lesson=>{

const count=
todayData.filter(
data=>
(
data.lessonId ||
createLessonId(
data.subject,
data.unit
)
)===
lesson.lessonId
).length;


const percent=
Math.round(
count /
TOTAL_STUDENTS *
100
);


html+=`

<div class="card"
style="margin-top:20px;">

<div class="lesson-title">

<h2>
📚 ${escapeHTML(
lesson.subject
)}
</h2>

<h3>
📖 ${escapeHTML(
lesson.unit
)}
</h3>

<p>

🆔 授業ID：
<strong>
${escapeHTML(
lesson.lessonId
)}
</strong>

</p>

</div>


<div class="progress-box">

<div>
今日の提出状況
</div>

<div class="progress-number">

${count} / ${TOTAL_STUDENTS}人

</div>

<div class="progress-bar">

<div
class="progress-fill"
style="width:${percent}%">

</div>

</div>

<p>

🟢 提出済み　
<strong>${count}人</strong>

　

⚪ 未提出　
<strong>${TOTAL_STUDENTS-count}人</strong>

</p>

<button
onclick="openLesson(
${JSON.stringify(
lesson.lessonId
)}
)">

📊 提出状況を見る

</button>

</div>

</div>

`;

});


document.getElementById(
"todayLessons"
).innerHTML=html;

}


/* ==================================================
📊 授業詳細
================================================== */

window.openLesson=function(
lessonId
){

currentLessonId=
lessonId;


const target=
todayData.find(
data=>
(
data.lessonId ||
createLessonId(
data.subject,
data.unit
)
)===
lessonId
);


if(
!target
){

return;

}


currentSubject=
target.subject;

currentUnit=
target.unit;


hideAll();


document.getElementById(
"lessonPage"
).style.display="block";


showLessonDetail();

};


/* ==================================================
提出状況詳細
================================================== */

function showLessonDetail(){

const lessonData=
todayData.filter(
data=>
(
data.lessonId ||
createLessonId(
data.subject,
data.unit
)
)===
currentLessonId
);


const submittedNumbers=
lessonData.map(
data=>
Number(
data.studentNumber
)
);


const submittedCount=
new Set(
submittedNumbers
).size;


const notSubmitted=[];


for(
let i=1;
i<=TOTAL_STUDENTS;
i++
){

if(
!submittedNumbers.includes(i)
){

notSubmitted.push(i);

}

}


const percent=
Math.round(
submittedCount /
TOTAL_STUDENTS *
100
);


let html=

`
<h1>
📊 今日の提出状況
</h1>


<div class="lesson-title">

<h2>
📚 ${escapeHTML(
currentSubject
)}
</h2>

<h3>
📖 ${escapeHTML(
currentUnit
)}
</h3>

<p>
🆔 授業ID：
<strong>
${escapeHTML(
currentLessonId
)}
</strong>
</p>

</div>


<div class="progress-box">

<h2>
提出状況
</h2>

<div class="progress-number">

${submittedCount} / ${TOTAL_STUDENTS}人

</div>

<div class="progress-bar">

<div
class="progress-fill"
style="width:${percent}%">

</div>

</div>

<p>

🟢 提出済み
<strong>${submittedCount}人</strong>

　

⚪ 未提出
<strong>${notSubmitted.length}人</strong>

</p>

</div>


<h2 class="section-title">

👦 30人の提出状況

</h2>


<div class="student-grid">

`;


for(
let i=1;
i<=TOTAL_STUDENTS;
i++
){

const data=
lessonData.find(
item=>
Number(
item.studentNumber
)===i
);


if(data){

html+=`

<div
class="student-card submitted">

<div class="status">
🟢
</div>

<h3>
${i}番
</h3>

<p>
提出済み
</p>

<button
onclick="openStudentReflection(
${JSON.stringify(
data.id
)}
)">

振り返りを見る

</button>

</div>

`;

}else{

html+=`

<div
class="student-card not-submitted">

<div class="status">
⚪
</div>

<h3>
${i}番
</h3>

<p>
未提出
</p>

</div>

`;

}

}


html+=`

</div>


<h2 class="section-title">

📝 提出した児童

</h2>


<div class="grid">

`;


lessonData
.sort(
(a,b)=>
a.studentNumber-
b.studentNumber
)
.forEach(
data=>{

html+=`

<div class="card">

<h2>
👤 ${data.studentNumber}番
</h2>

<p class="date">

📅 ${formatDate(
data.date
)}

</p>

${getLevelHTML(
data.reflectionLevel
)}

<div class="study-box">

<b>
📝 最初の振り返り
</b>

<br><br>

${escapeHTML(
data.study
)}

</div>

<div class="deep-box">

<b>
✏️ 最終的な振り返り
</b>

<br><br>

${escapeHTML(
data.deepReflection ||
"まだ入力されていません"
)}

</div>

<button
onclick="openStudentReflection(
${JSON.stringify(
data.id
)}
)">

詳しく見る

</button>

</div>

`;

});


html+=`

</div>

`;


if(
notSubmitted.length>0
){

html+=`

<div class="info-box">

<h2>
⚪ 未提出の児童
</h2>

<p>

${notSubmitted
.map(
number=>
number+"番"
)
.join("　")}

</p>

</div>

`;

}


document.getElementById(
"lessonDetail"
).innerHTML=html;

}


/* ==================================================
児童の振り返り詳細
================================================== */

window.openStudentReflection=
function(id){

const data=
todayData.find(
item=>item.id===id
);


if(!data){

return;

}


hideAll();


document.getElementById(
"studentReflectionPage"
).style.display="block";


const level=
Number(
data.reflectionLevel
) ||
judgeReflectionLevel(
data.study
);


document.getElementById(
"studentReflectionDetail"
).innerHTML=

`

<h1>
👤 ${data.studentNumber}番の振り返り
</h1>


<div class="lesson-title">

<h2>
📚 ${escapeHTML(
data.subject
)}
</h2>

<p>
📖 ${escapeHTML(
data.unit
)}
</p>

<p>
🆔 ${escapeHTML(
data.lessonId
)}
</p>

</div>


${getLevelHTML(level)}


<div class="study-box">

<h2>
📝 最初の振り返り
</h2>

${escapeHTML(
data.study
)}

</div>


<div class="advice-box">

<h2>
🤖 AIからの問い
</h2>

<p>

${escapeHTML(
data.aiQuestion ||
"まだありません"
)}

</p>

</div>


<div class="deep-box">

<h2>
✏️ 最終的な振り返り
</h2>

<p>

${escapeHTML(
data.deepReflection ||
"まだ入力されていません"
)}

</p>

</div>


<div class="level-box">

⭐ 参考になった人数：

<strong>

/* ==================================================
先生コメント保存
================================================== */

window.saveTeacherComment=
async function(id){

const textarea=
document.getElementById(
"teacherComment"
);

const comment=
textarea.value.trim();


if(!comment){

alert(
"先生からのコメントを書いてください。"
);

return;

}


try{

await updateDoc(
doc(
db,
"manabi",
id
),
{

teacherComment:
comment

}
);


document.getElementById(
"commentMessage"
).innerHTML=

`

<div class="praise-box">

🌟 先生からのコメントを
保存しました！

</div>

`;

}catch(error){

console.error(error);

alert(
"保存できませんでした。"
);

}

};

window.backToLesson=
function(){

hideAll();

document.getElementById(
"lessonPage"
).style.display="block";

showLessonDetail();

};


/* ==================================================
授業一覧へ
================================================== */

window.showTeacherHome=
function(){

hideAll();

document.getElementById(
"teacherHome"
).style.display="block";

loadTodayLessons();

};


/* ==================================================
起動
================================================== */

const savedLogin=
localStorage.getItem(
"manabiTeacherLogin"
);


if(
savedLogin==="true"
){

showTeacherHome();

}else{

document.getElementById(
"teacherLogin"
).style.display="block";

}


console.log(
"👩‍🏫 学びアルバム 先生ページ 起動"
);

</script>
