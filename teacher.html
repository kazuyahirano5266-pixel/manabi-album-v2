<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>先生ページ</title>

<style>

body{
font-family:sans-serif;
background:#fff8e7;
padding:20px;
}

h1{
text-align:center;
}

.card{
background:white;
padding:20px;
margin:15px auto;
border-radius:20px;
max-width:700px;
box-shadow:0 3px 8px #ccc;
}

button{
padding:12px 25px;
border:none;
border-radius:20px;
background:#2b7a78;
color:white;
font-size:16px;
margin:5px;
}

.subject{
color:#2b7a78;
font-weight:bold;
font-size:20px;
}

.study-box{

background:#f5f5f5;
padding:15px;
border-radius:15px;

}

.level-box{

background:#eaf6ff;
padding:10px;
border-radius:15px;
margin:10px 0;

}

.comment-box{

background:#fff4d6;
padding:10px;
border-radius:15px;

}

textarea{

width:90%;
height:60px;

}

</style>

</head>


<body>


<h1>👩‍🏫 先生ページ</h1>


<div id="list">

読み込み中...

</div>



<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import { 

getFirestore,
collection,
onSnapshot,
doc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain: "manabi-album-v2.firebaseapp.com",

projectId: "manabi-album-v2",

storageBucket: "manabi-album-v2.firebasestorage.app",

messagingSenderId: "226258471812",

appId: "1:226258471812:web:15230ba15e7e0bd7d86bd1"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



let allData={};



onSnapshot(collection(db,"manabi"),(snapshot)=>{


allData={};


snapshot.forEach((doc)=>{


const data=doc.data();
alert(JSON.stringify(data));
data.id=doc.id;


if(!allData[data.name]){

allData[data.name]=[];

}


allData[data.name].push(data);


});


showStudents();


});



function showStudents(){


let html="";


html += `
<h2>📁 児童一覧</h2>
`;


Object.keys(allData).forEach(name=>{


html += `

<div class="card">


<h2>
📁 ${name} さん
</h2>


<p>
${allData[name].length}件の学び
</p>


<button onclick="openStudent('${name}')">

開く

</button>


</div>

`;

});


document.getElementById("list").innerHTML=html;


}


window.openStudent=function(name){


let html=`


<button onclick="showStudents()">

←児童一覧

</button>


<h2>
👤 ${name} さん
</h2>


<h3>📂 教科を選んでください</h3>


`;


let subjects=[];


allData[name].forEach(data=>{


if(!subjects.includes(data.subject)){

subjects.push(data.subject);

}


});


subjects.forEach(subject=>{


html += `


<div class="card">


<h2>
📚 ${subject}
</h2>


<button onclick="openSubject('${name}','${subject}')">

見る

</button>


</div>


`;


});


document.getElementById("list").innerHTML=html;


}
window.openSubject=function(name,subject){


let html="";


html += `

<button onclick="openStudent('${name}')">

← 教科一覧へ

</button>


<h2>
📚 ${name} さん　${subject}
</h2>

`;



allData[name].forEach(data=>{


if(data.subject===subject){


html += `

<div class="card">


<p>
📅 ${data.date ? 
new Date(data.date.seconds*1000).toLocaleDateString()
:
""}
</p>


<p><b>今日の学び</b></p>

<div class="study-box">

${data.study}

</div>


<div class="level-box">

🌱 ${data.level || "判定なし"}

</div>



<p><b>次にやりたいこと</b></p>

<p>

${data.next || ""}

</p>



<div class="comment-box">

<p><b>💬 先生コメント</b></p>


<textarea id="comment-${data.id}">
${data.comment || ""}

</textarea>


<br>


<button onclick="saveComment('${data.id}')">

コメント保存

</button>


</div>


</div>


`;

}


});


document.getElementById("list").innerHTML=html;


}



window.saveComment = async function(id){


const text =

document.getElementById("comment-"+id).value;



await updateDoc(

doc(db,"manabi",id),

{

comment:text

}

);


alert("コメントを保存しました😊");


}
</script>


</body>

</html>
