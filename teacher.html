<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2 先生ページ</title>

<style>

/* =========================
基本
========================= */

*{
box-sizing:border-box;
}

body{
font-family:sans-serif;
background:#eef7ff;
margin:0;
padding:15px;
color:#333;
}

.box{
background:white;
max-width:1400px;
margin:0 auto;
padding:20px;
border-radius:25px;
}

h1{
text-align:center;
margin-top:5px;
}

h2{
margin-bottom:10px;
}

button{
border:none;
border-radius:16px;
padding:12px 20px;
font-size:16px;
cursor:pointer;
margin:5px;
background:#2b7a78;
color:white;
}

button:hover{
opacity:0.85;
}

.back-button{
background:#777;
}

.setting-button{
background:#555;
}

.copy-button{
background:#1976d2;
}

.comment-button{
background:#8e44ad;
}

.close-button{
background:#777;
}

.number-button{
background:white;
color:#333;
border:2px solid #2b7a78;
font-size:17px;
min-height:60px;
}

.number-button.selected{
background:#2b7a78;
color:white;
}

.number-button.has-data{
border-color:#f0a500;
}

input,
textarea,
select{
width:100%;
padding:12px;
font-size:17px;
border:1px solid #ccc;
border-radius:12px;
margin:5px 0 12px;

textarea{
min-height:140px;
line-height:1.6;

/* =========================
ヘッダー

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.header-title{
flex:1;
}


/* =========================
出席番号
========================= */

.number-grid{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:8px;
margin-top:15px;
}

.number-area{
background:#f5fbff;
padding:15px;
border-radius:20px;
}


/* =========================
カード
========================= */

.card{
background:white;
border-radius:20px;
padding:18px;
box-shadow:0 3px 10px #ccc;
}

.card-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
margin-top:20px;
}

.reflection-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-top:20px;
}


/* =========================
児童カード
========================= */

.student-card{
background:#f8fcff;
border:2px solid #d9edf7;
border-radius:20px;
padding:18px;
}

.student-number{

font-weight:bold;
}

.student-name{
font-size:18px;
color:#555;
margin:8px 0;
}

.count-badge{

background:#eaf6ff;
padding:6px 12px;
border-radius:15px;
font-size:14px;
}


/* =========================
振り返り
========================= */

.study-box{
background:#f5f5f5;
padding:15px;
border-radius:15px;
margin:12px 0;
line-height:1.8;
white-space:pre-wrap;
word-break:break-word;
}

.advice-box{
background:#eaf6ff;
padding:15px;
border-radius:15px;
margin:12px 0;
line-height:1.8;
}

.deep-box{
background:#f0fff0;
padding:15px;
border-radius:15px;
margin:12px 0;
line-height:1.8;
white-space:pre-wrap;
word-break:break-word;
}

.level-box{
background:#fff7df;
padding:12px;
border-radius:15px;
margin:12px 0;
}

.date{
font-size:14px;
color:#777;
}


/* =========================
所見
========================= */

.comment-area{
background:#faf5ff;
border:2px solid #ead9f5;
padding:18px;
border-radius:20px;
margin-top:18px;
}

.copilot-box{
background:#f4f4f4;
border-radius:15px;
padding:15px;
margin-top:15px;
white-space:pre-wrap;
word-break:break-word;
font-size:15px;
line-height:1.7;
}


/* =========================
設定
========================= */

.setting-panel{
background:#f7f7f7;
padding:20px;
border-radius:20px;
margin-top:20px;
}

.name-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.name-row{
display:grid;
grid-template-columns:80px 1fr;
align-items:center;
gap:8px;
background:white;
padding:8px;
border-radius:12px;
}

.name-row input{
margin:0;
}


/* =========================
その他
========================= */

.section-title{
background:#eaf6ff;
padding:14px;
border-radius:15px;
margin-top:20px;
}

.empty{
padding:30px;
text-align:center;
background:#f8f8f8;
border-radius:20px;
margin-top:20px;
}

.loading{
padding:35px;
text-align:center;
font-size:20px;
}

.message{
padding:15px;
background:#eaffea;
border-radius:15px;
margin:15px 0;
}

.hidden{
display:none;
}


/* =========================
レスポンシブ
========================= */

@media(max-width:1100px){

.number-grid{
grid-template-columns:repeat(8,1fr);
}

.card-grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:800px){

.number-grid{
grid-template-columns:repeat(5,1fr);
}

.reflection-grid{
grid-template-columns:1fr;
}

.name-grid{
grid-template-columns:1fr;
}

}

@media(max-width:600px){

body{
padding:8px;
}

.box{
padding:12px;
}

.number-grid{

gap:5px;
}

.number-button{
padding:9px 3px;
font-size:15px;
min-height:50px;
}

.card-grid{
grid-template-columns:1fr;
}

}

</style>

</head>


<body>


<!-- ==================================================
メイン
================================================== -->

<div class="box" id="mainPage">

<div class="header">

<div class="header-title">

<h1>
👩‍🏫 学びアルバム Ver.2
</h1>

<p>
先生ページ
</p>

</div>

<div>

<button
class="setting-button"
onclick="openSettings()">

⚙️ 名前設定

</button>

</div>

</div>


<!-- =========================
出席番号
========================= -->

<div class="number-area">

<h2>
🔢 児童を選んでください
</h2>

<p>
出席番号を選択すると、その児童の振り返りを表示します。
</p>

<div
class="number-grid"
id="numberGrid">
</div>

</div>


<!-- =========================
児童一覧
========================= -->

<div
id="studentArea">

<div class="empty">

👆 出席番号を選択してください。

</div>

</div>

</div>


<!-- ==================================================
設定ページ
================================================== -->

<div
class="box hidden"
id="settingsPage">

<h1>
⚙️ 児童名設定
</h1>

<p>
出席番号と表示名を設定できます。
</p>

<p>
<strong>
※ここで設定した名前はFirestoreには保存されません。
</strong>
</p>

<p>
この端末のブラウザにだけ保存されます。
</p>


<div
class="name-grid"
id="nameGrid">
</div>


<div style="margin-top:20px;">

<button
onclick="saveNames()">

💾 名前を保存する

</button>

<button
class="back-button"
onclick="closeSettings()">

← 先生ページへ

</button>

</div>


<p id="settingMessage"></p>

</div>



<script type="module">


/* ==================================================
Firebase
================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,
collection,
query,
where,
getDocs,
updateDoc,
doc

}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain:
"manabi-album-v2.firebaseapp.com",

projectId:
"manabi-album-v2",

storageBucket:
"manabi-album-v2.firebasestorage.app",

messagingSenderId:
"226258471812",

appId:
"1:226258471812:web:15230ba15e7e0bd7d86bd1"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ==================================================
変数
================================================== */

let allData=[];

let selectedNumber="";


/* ==================================================
名前設定
Firestoreには保存しない
================================================== */

let studentNames=
JSON.parse(
localStorage.getItem(
"manabiStudentNames"
) || "{}"
);


/* ==================================================
HTML安全処理
================================================== */

function escapeHTML(value){

if(
value===undefined ||
value===null
){

return "";

}

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* ==================================================
日付
================================================== */

function formatDate(value){

if(!value){

return "日付なし";

}

try{

if(value.toDate){

return value.toDate()
.toLocaleString("ja-JP");

}

return new Date(value)
.toLocaleString("ja-JP");

}catch(error){

return "日付なし";

}

}


/* ==================================================
出席番号の正規化
================================================== */

function getNumber(data){

/*
現在の児童ページで
保存しているフィールド名に対応。

将来的に studentNumber に変更しても
対応できるようにしている。
*/

return String(

data.studentNumber ??
data.number ??
data.attendanceNumber ??
data.name ??
""

).trim();

}


/* ==================================================
名前表示
================================================== */

function getDisplayName(number){

return studentNames[number]
? studentNames[number]
: "名前未設定";

}


/* ==================================================
出席番号ボタン作成
================================================== */

function createNumberButtons(){

let html="";

for(let i=1;i<=40;i++){

const number=String(i);

const count=
allData.filter(
data=>getNumber(data)===number
).length;

html+=`

<button
class="number-button ${count>0 ? "has-data":""}"
onclick="selectStudent('${number}')">

${i}番

${count>0
? `<br><small>📚 ${count}件</small>`
: ""
}

</button>

`;

}

document.getElementById(
"numberGrid"
).innerHTML=html;

}


/* ==================================================
最初の読み込み
================================================== */

async function loadAllData(){

document.getElementById(
"studentArea"
).innerHTML=

'<div class="loading">📚 振り返りを読み込んでいます...</div>';

try{

/*
先生ページを開いたときに
Firestoreを1回だけ読み込む。

その後の画面移動では
再読み込みしない。
*/

const snapshot=
await getDocs(
collection(db,"manabi")
);

allData=[];

snapshot.forEach(
docSnap=>{

const data=
docSnap.data();

allData.push({

...data,

id:docSnap.id

});

});


console.log(
"先生ページ読み込み：",
allData.length,
"件"
);


createNumberButtons();


document.getElementById(
"studentArea"
).innerHTML=

`

<div class="empty">

👆 出席番号を選択してください。

</div>

`;

}catch(error){

console.error(error);

document.getElementById(
"studentArea"
).innerHTML=

`

<div class="empty">

😢 振り返りを読み込めませんでした。

<br><br>

<button onclick="loadAllData()">

🔄 もう一度読み込む

</button>

</div>

`;

}

}


/* ==================================================
児童選択
================================================== */

window.selectStudent=
function(number){

selectedNumber=number;


/*
ボタンの選択状態
*/

document
.querySelectorAll(".number-button")
.forEach(button=>{

button.classList.remove(
"selected"
);

});


const buttons=
document
.querySelectorAll(".number-button");

if(buttons[number-1]){

buttons[number-1]
.classList.add("selected");

}


showStudentSubjects();

};


/* ==================================================
児童の教科一覧
================================================== */

function showStudentSubjects(){

const data=
allData.filter(
item=>
getNumber(item)===selectedNumber
);


let html=`

<div class="section-title">

<h2>
👤 ${selectedNumber}番
</h2>

<p class="student-name">

${escapeHTML(
getDisplayName(selectedNumber)
)}

</p>

</div>

`;


if(data.length===0){

html+=`

<div class="empty">

📭 この児童にはまだ振り返りがありません。

</div>

`;

document.getElementById(
"studentArea"
).innerHTML=html;

return;

}


const subjects=[];


data.forEach(item=>{

if(
item.subject &&
!subjects.includes(item.subject)
){

subjects.push(item.subject);

}

});


html+=`

<h2>
📚 教科を選んでください
</h2>

<div class="card-grid">

`;


subjects.forEach(subject=>{

const count=
data.filter(
item=>item.subject===subject
).length;

html+=`

<div class="student-card">

<h2>
📚 ${escapeHTML(subject)}
</h2>

<span class="count-badge">
${count}件の振り返り
</span>

<br>

<button
onclick="openTeacherSubject(${JSON.stringify(subject)})">

見る

</button>

</div>

`;

});


html+=`

</div>

`;

document.getElementById(
"studentArea"
).innerHTML=html;

}


/* ==================================================
教科
================================================== */

window.openTeacherSubject=
function(subject){

const data=
allData.filter(
item=>
getNumber(item)===selectedNumber &&
item.subject===subject
);


let html=`

<button
class="back-button"
onclick="showStudentSubjects()">

← 教科一覧へ

</button>

<div class="section-title">

<h2>
👤 ${selectedNumber}番
</h2>

<h2>
📚 ${escapeHTML(subject)}
</h2>

</div>

<h3>
📖 単元を選んでください
</h3>

<div class="card-grid">

`;


const units=[];


data.forEach(item=>{

const unit=
item.unit || "";

if(!units.includes(unit)){

units.push(unit);

}

});


units.forEach(unit=>{

const count=
data.filter(
item=>
(item.unit||"")===unit
).length;

html+=`

<div class="student-card">

<h2>
📖 ${escapeHTML(
unit || "単元名なし"
)}
</h2>

<span class="count-badge">

${count}件

</span>

<br>

<button
onclick="openTeacherUnit(
${JSON.stringify(subject)},
${JSON.stringify(unit)}
)">

見る

</button>

</div>

`;

});


html+=`

</div>
`;

document.getElementById(
"studentArea"
).innerHTML=html;

};


/* ==================================================
単元
================================================== */

window.openTeacherUnit=
function(subject,unit){

const data=
allData.filter(
item=>
getNumber(item)===selectedNumber &&
item.subject===subject &&
(item.unit||"")===unit
);


let html=`

<button
class="back-button"
onclick="openTeacherSubject(
${JSON.stringify(subject)}
)">

← 単元一覧へ

</button>

<div class="section-title">

<h2>
👤 ${selectedNumber}番
</h2>

<h2>
📚 ${escapeHTML(subject)}
</h2>

<h2>
📖 ${escapeHTML(
unit || "単元名なし"
)}
</h2>

</div>

<div class="reflection-grid">

`;


data.forEach(item=>{

html+=createReflectionCard(
item
);

});


html+=`

</div>
`;


document.getElementById(
"studentArea"
).innerHTML=html;

};


/* ==================================================
振り返りカード
================================================== */

function createReflectionCard(data){

const safeId=
String(data.id)
.replace(/'/g,"");


return `

<div class="card">

<p class="date">

📅 ${formatDate(data.date)}

</p>


<div class="study-box">

<b>
📝 今日の学び
</b>

<br><br>

${escapeHTML(data.study)}

</div>


<div class="advice-box">

<b>
🤖 AIからの問い
</b>

<br><br>

${escapeHTML(
data.aiQuestion ||
"ありません"
)}

</div>


<div class="deep-box">

<b>
✏️ 深めた考え
</b>

<br><br>

${escapeHTML(
data.deepReflection ||
"まだ入力されていません"
)}

</div>


<div class="level-box">

⭐ 参考にした人数：

<b>
${Number(data.likes || 0)}
</b>

人

</div>


<div class="comment-area">

<h3>
📝 この振り返りから所見を作成
</h3>

<p>

このボタンを押すと、
この児童の振り返りをもとに
Copilotへ貼り付ける文章を作成します。

</p>


<button
class="comment-button"
onclick="showCommentPrompt('${safeId}')">

📝 所見作成

</button>


<div
id="comment-${safeId}"
class="hidden">

<div
class="copilot-box"
id="prompt-${safeId}">
</div>


<button
class="copy-button"
onclick="copyCopilotPrompt('${safeId}')">

📋 Copilotにコピー

</button>


</div>

</div>

</div>

`;

}


/* ==================================================
教科別の所見条件
================================================== */

function getSubjectInstruction(subject){

const instructions={

"国語":`

国語の学習内容を踏まえ、
文章を読んで考えたこと、
自分の考えを表現したこと、
友達との交流による考えの深まりなどを
具体的に捉えて所見にしてください。
`,

"算数":`

算数の学習内容を踏まえ、
問題解決の過程、
考え方や計算の工夫、
図・式・言葉による説明などを
具体的に捉えて所見にしてください。
`,

"生活":`

生活科の学習内容を踏まえ、
身近なものや人への気付き、
体験を通して得た発見、
自分から関わろうとした姿などを
具体的に捉えて所見にしてください。
`,

"理科":`

理科の学習内容を踏まえ、
予想、実験・観察、結果、
そこから考えたことなど、
科学的に考える姿を具体的に捉えてください。
`,

"社会":`

社会科の学習内容を踏まえ、
資料を調べたこと、
社会の仕組みについて考えたこと、
生活とのつながりに気付いたことなどを
具体的に捉えてください。
`,

"総合":`

総合的な学習の時間の学習内容を踏まえ、
課題を見付けたこと、
調べたり考えたりしたこと、
友達との対話や協働、
地域との関わりなどを具体的に捉えてください。
`,

"道徳":`

道徳の学習内容を踏まえ、
教材や友達の考えを通して
自分自身について考えたこと、
価値について考えを深めたことなどを
具体的に捉えてください。
`,

"体育":`

体育の学習内容を踏まえ、
技能の向上、
運動の工夫、
友達との関わり、
粘り強く取り組んだ姿などを
具体的に捉えてください。
`

};

return instructions[subject] ||
`
教科の学習内容を踏まえ、
児童の具体的な学びや考えの深まりが
伝わる所見にしてください。
`;

}


/* ==================================================
Copilot用文章作成
================================================== */

function createCopilotPrompt(data){

const subject=
data.subject || "";

const unit=
data.unit || "";

const study=
data.study || "";

const deep=
data.deepReflection || "";

const instruction=
getSubjectInstruction(subject);


return `

あなたは小学校教師の所見作成を支援するAIです。

以下の児童の振り返りをもとに、
通知表等に使用できる自然で具体的な所見を
作成してください。

【教科】
${subject}

【単元】
${unit || "単元名なし"}

【児童の今日の学び】
${study || "記入なし"}

【児童が学びを深めて考えたこと】
${deep || "記入なし"}


【教科に応じた作成方針】
${instruction}


【共通の作成条件】

・児童の実際の振り返りを根拠にする
・振り返りに書かれていない事実を勝手に追加しない
・児童が何を学んだのかを具体的に表す
・考えの変化や深まりがあれば取り入れる
・教師から見た児童の学びとして自然な文章にする
・前向きな表現にする
・「～しました」の繰り返しを避ける
・児童の名前は入れない
・出席番号も入れない
・100～120字程度を目安にする
・小学校の通知表に適した丁寧な文体にする
・児童の振り返りを単に言い換えるだけではなく、
  学びの価値が伝わる文章にする

【出力】

所見本文だけを出力してください。
説明や前置きは不要です。
`;

}


/* ==================================================
所見作成ボタン
================================================== */

window.showCommentPrompt=
function(id){

const data=
allData.find(
item=>item.id===id
);


if(!data){

alert(
"振り返りが見つかりません。"
);

return;

}


const area=
document.getElementById(
"comment-"+id
);

const prompt=
document.getElementById(
"prompt-"+id
);


if(!area || !prompt){

return;

}


prompt.textContent=
createCopilotPrompt(data);


area.classList.remove(
"hidden"
);

};


/* ==================================================
Copilotにコピー
================================================== */

window.copyCopilotPrompt=
async function(id){

const data=
allData.find(
item=>item.id===id
);


if(!data){

alert(
"振り返りが見つかりません。"
);

return;

}


const text=
createCopilotPrompt(data);


try{

await navigator.clipboard.writeText(
text
);

alert(
"📋 Copilot用の文章をコピーしました！\n\nCopilotを開いて貼り付けてください。"
);

}catch(error){

console.error(error);


/*
クリップボードが使えない場合
*/

const textarea=
document.createElement("textarea");

textarea.value=text;

document.body.appendChild(
textarea
);

textarea.select();

try{

document.execCommand("copy");

alert(
"📋 Copilot用の文章をコピーしました！"
);

}catch(copyError){

alert(
"コピーできませんでした。\n表示された文章を長押ししてコピーしてください。"
);

}

document.body.removeChild(
textarea
);

}

};


/* ==================================================
名前設定ページ
================================================== */

window.openSettings=
function(){

document.getElementById(
"mainPage"
).classList.add("hidden");

document.getElementById(
"settingsPage"
).classList.remove("hidden");


createNameInputs();

};


function createNameInputs(){

let html="";


for(let i=1;i<=40;i++){

const number=
String(i);

const current=
studentNames[number] || "";


html+=`

<div class="name-row">

<strong>
${i}番
</strong>

<input
id="name-${i}"
value="${escapeHTML(current)}"
placeholder="名前を設定">

</div>

`;

}


document.getElementById(
"nameGrid"
).innerHTML=html;

}


/* ==================================================
名前保存
================================================== */

window.saveNames=
function(){

const newNames={};


for(let i=1;i<=40;i++){

const value=
document.getElementById(
"name-"+i
).value.trim();


if(value){

newNames[String(i)]=value;

}

}


studentNames=
newNames;


localStorage.setItem(
"manabiStudentNames",
JSON.stringify(studentNames)
);


document.getElementById(
"settingMessage"
).innerHTML=

`

<div class="message">

✅ 名前設定を保存しました。

<br>

※名前はFirestoreには保存されていません。

</div>

`;


createNumberButtons();

};

window.closeSettings=
function(){

document.getElementById(
"settingsPage"
).classList.add("hidden");

"mainPage"
).classList.remove("hidden");


if(selectedNumber){

showStudentSubjects();

}

};
