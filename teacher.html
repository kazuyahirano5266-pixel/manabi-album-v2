<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>学びアルバム｜先生ページ</title>

<style>

/* =========================================
基本
========================================= */

*{
box-sizing:border-box;
}

body{

font-family:
sans-serif;

background:#f0f8ff;

margin:0;

padding:20px;

color:#333;

}

.box{

background:white;

padding:25px;

border-radius:25px;

max-width:1200px;

margin:0 auto 20px;

}

h1{
text-align:center;
}

h2{
margin-top:10px;
}

button{

padding:12px 22px;

border:none;

border-radius:20px;

background:#2b7a78;

color:white;

font-size:16px;

margin:6px;

cursor:pointer;

}

button:hover{
opacity:.85;
}

.back-button{
background:#777;
}

.logout-button{
background:#555;
}

.small-button{

font-size:14px;

padding:9px 16px;

}

.hidden{
display:none;
}


/* =========================================
ログイン
========================================= */

.login-box{

max-width:500px;

margin:60px auto;

text-align:center;

}

.login-box input{

width:90%;

padding:14px;

font-size:18px;

border:1px solid #ccc;

border-radius:10px;

margin:10px;

}


/* =========================================
カード
========================================= */

.grid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:20px;

margin-top:20px;

}

.card{

background:white;

padding:20px;

border-radius:20px;

box-shadow:
0 3px 8px #ccc;

}


/* =========================================
見出し
========================================= */

.section-title{

background:#eaf6ff;

padding:15px;

border-radius:15px;

margin-top:20px;

}

.lesson-title{

background:#e8f7e8;

padding:18px;

border-radius:20px;

margin-top:20px;

}


/* =========================================
📊 提出状況
========================================= */

.submission-box{

background:#fff9e6;

border:2px solid #f1d98b;

padding:20px;

border-radius:20px;

margin-top:20px;

}

.submission-number{

text-align:center;

font-size:46px;

font-weight:bold;

color:#2b7a78;

margin:10px 0;

}

.submission-bar{

width:90%;

height:28px;

background:#eeeeee;

border-radius:20px;

margin:15px auto;

overflow:hidden;

}

.submission-bar-inner{

height:100%;

width:0%;

background:#2b7a78;

border-radius:20px;

transition:width .5s;

}

.submission-info{

display:flex;

justify-content:center;

gap:40px;

font-size:18px;

margin-top:15px;

text-align:center;

}

.submitted{

color:#16833b;

font-weight:bold;

}

.not-submitted{

color:#777;

font-weight:bold;

}


/* =========================================
未提出番号
========================================= */

.not-submitted-list{

background:#f5f5f5;

padding:15px;

border-radius:15px;

margin-top:15px;

line-height:2;

}


/* =========================================
振り返り
========================================= */

.reflection-grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:20px;

margin-top:20px;

}

.study-box{

background:#f5f5f5;

padding:15px;

border-radius:15px;

line-height:1.8;

white-space:pre-wrap;

word-break:break-word;

}

.deep-box{

background:#f0fff0;

padding:15px;

border-radius:15px;

line-height:1.8;

white-space:pre-wrap;

word-break:break-word;

}

.advice-box{

background:#eaf6ff;

padding:15px;

border-radius:15px;

line-height:1.8;

}

.level-box{

padding:14px;

border-radius:15px;

margin:10px 0;

line-height:1.8;

}

.level1{

background:#f5f5f5;

}

.level2{

background:#eaffea;

}

.level3{

background:#fff4b8;

}

.date{

font-size:14px;

color:#777;

}


/* =========================================
その他
========================================= */

.empty{

padding:30px;

background:#f8f8f8;

border-radius:20px;

margin-top:20px;

text-align:center;

}

.loading{

padding:30px;

text-align:center;

font-size:20px;

}

.teacher-info{

text-align:center;

background:#eaf6ff;

padding:12px;

border-radius:15px;

margin-bottom:20px;

font-size:18px;

}


/* =========================================
レスポンシブ
========================================= */

@media(max-width:900px){

.grid{

grid-template-columns:
repeat(2,1fr);

}

}

@media(max-width:650px){

body{

padding:10px;

}

.box{

padding:15px;

}

.grid,
.reflection-grid{

grid-template-columns:1fr;

}

.submission-info{

flex-direction:column;

gap:10px;

}

.submission-number{

font-size:38px;

}

}

</style>

</head>


<body>


<!-- ==================================================
先生ログイン
================================================== -->

<div
class="box login-box"
id="teacherLoginPage">

<h1>👩‍🏫 学びアルバム</h1>

<h2>先生ページ</h2>

<p>
先生用パスワードを入力してください。
</p>

<input
type="password"
id="teacherPassword"
placeholder="パスワード">

<p
id="teacherLoginMessage"
style="color:#d33;font-weight:bold;">
</p>

<button onclick="teacherLogin()">

先生ページへ

</button>

</div>


<!-- ==================================================
先生ホーム
================================================== -->

<div
class="box hidden"
id="teacherPage">

<h1>👩‍🏫 先生ページ</h1>

<div class="teacher-info">

📚 学びアルバム Ver.2

</div>


<!-- ==================================================
今日の授業
================================================== -->

<div
class="section-title">

<h2>
📚 今日の授業
</h2>

<p>
今日、児童が提出した授業を
自動的に判別しています。
</p>

</div>


<div id="todayLessons">

<div class="loading">

📚 今日の授業を読み込んでいます...

</div>

</div>


<!-- ==================================================
児童一覧
================================================== -->

<div
class="section-title">

<h2>
👦 児童一覧
</h2>

</div>


<div id="studentList">

<div class="loading">

👦 児童一覧を読み込んでいます...

</div>

</div>


<button
class="logout-button"
onclick="teacherLogout()">

🚪 ログアウト

</button>

</div>


<!-- ==================================================
児童詳細
================================================== -->

<div
class="box hidden"
id="studentPage">

<h1>👦 児童の学び</h1>

<div id="studentDetail"></div>

<br>

<button
class="back-button"
onclick="backTeacherPage()">

← 先生ページへ戻る

</button>

</div>


<!-- ==================================================
授業詳細
================================================== -->

<div
class="box hidden"
id="lessonPage">

<div id="lessonDetail"></div>

<br>

<button
class="back-button"
onclick="backTeacherPage()">

← 先生ページへ戻る

</button>

</div>


<script type="module">


/* ==================================================
Firebase
================================================== */

import {

initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,
collection,
onSnapshot,
query,
where,
getDocs

}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain:
"manabi-album-v2.firebaseapp.com",

projectId:
"manabi-album-v2",

storageBucket:
"manabi-album-v2.firebasestorage.app",

messagingSenderId:
"226258471812",

appId:
"1:226258471812:web:15230ba15e7e0bd7d86bd1"

};


const app=
initializeApp(firebaseConfig);


const db=
getFirestore(app);


/* ==================================================
設定
================================================== */

const TEACHER_PASSWORD="1111";

const TOTAL_STUDENTS=30;

let allData=[];

let todayData=[];


/* ==================================================
安全表示
================================================== */

function escapeHTML(value){

if(
value===undefined ||
value===null
){

return "";

}

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* ==================================================
日付
================================================== */

function getDateObject(value){

if(!value){

return null;

}

try{

if(value.toDate){

return value.toDate();

}

return new Date(value);

}catch{

return null;

}

}


/* ==================================================
今日かどうか
================================================== */

function isToday(value){

const date=
getDateObject(value);

if(!date){

return false;

}

const now=
new Date();

return(

date.getFullYear()
===
now.getFullYear()

&&

date.getMonth()
===
now.getMonth()

&&

date.getDate()
===
now.getDate()

);

}


/* ==================================================
自動授業ID
================================================== */

function createLessonId(subject,unit){

const now=
new Date();

const year=
now.getFullYear();

const month=
String(
now.getMonth()+1
).padStart(2,"0");

const day=
String(
now.getDate()
).padStart(2,"0");


const cleanUnit=
String(unit||"")
.trim()
.replace(/\s+/g,"_")
.replace(
/[\/\\#?%*:|"<>]/g,
""
);


return `${year}${month}${day}_${subject}_${cleanUnit}`;

}


/* ==================================================
授業IDをデータから取得
================================================== */

function getLessonId(data){

/*
新しいデータ
*/

if(data.lessonId){

return data.lessonId;

}


/*
古いデータにも対応

lessonIdがまだない場合、
教科＋単元から自動生成
*/

if(
data.subject &&
data.unit
){

return createLessonId(
data.subject,
data.unit
);

}


return "";

}


/* ==================================================
先生ログイン
================================================== */

window.teacherLogin=function(){

const password=
document
.getElementById("teacherPassword")
.value
.trim();


if(
password!==TEACHER_PASSWORD
){

document
.getElementById(
"teacherLoginMessage"
)
.innerText=
"🔑 パスワードが違います。";

return;

}


localStorage.setItem(
"manabiTeacherLogin",
"true"
);


showTeacherPage();

};


/* ==================================================
自動ログイン
================================================== */

function checkTeacherLogin(){

if(
localStorage.getItem(
"manabiTeacherLogin"
)==="true"
){

showTeacherPage();

}

}


/* ==================================================
先生ページ表示
================================================== */

function showTeacherPage(){

document
.getElementById(
"teacherLoginPage"
)
.style.display="none";


document
.getElementById(
"teacherPage"
)
.style.display="block";


document
.getElementById(
"studentPage"
)
.style.display="none";


document
.getElementById(
"lessonPage"
)
.style.display="none";

}


/* ==================================================
ログアウト
================================================== */

window.teacherLogout=function(){

localStorage.removeItem(
"manabiTeacherLogin"
);

location.reload();

};


/* ==================================================
Firebase監視
================================================== */

function startRealtimeListener(){

onSnapshot(

collection(db,"manabi"),

(snapshot)=>{

allData=[];


snapshot.forEach(
docSnapshot=>{

allData.push({

id:
docSnapshot.id,

...docSnapshot.data()

});

});


/*
今日のデータだけ
*/

todayData=
allData.filter(
data=>isToday(data.date)
);


/*
今日の授業
*/

showTodayLessons();


/*
児童一覧
*/

showStudentList();


},

(error)=>{

console.error(
"Firebase読み込みエラー",
error
);

}

);

}


/* ==================================================
今日の授業一覧
================================================== */

function showTodayLessons(){

const area=
document.getElementById(
"todayLessons"
);


/*
授業を自動的にまとめる
*/

const lessonMap={};


todayData.forEach(data=>{

const lessonId=
getLessonId(data);


if(!lessonId){

return;

}


if(!lessonMap[lessonId]){

lessonMap[lessonId]={

lessonId:
lessonId,

subject:
data.subject || "",

unit:
data.unit || "",

students:new Set()

};

}


const number=
Number(data.studentNumber);


if(
number>=1 &&
number<=TOTAL_STUDENTS
){

lessonMap[
lessonId
]
.students.add(number);

}

});


const lessons=
Object.values(lessonMap);


if(lessons.length===0){

area.innerHTML=

`
<div class="empty">

📭 今日の提出はまだありません。

</div>
`;

return;

}


let html="";


lessons.forEach(
lesson=>{

const submitted=
lesson.students.size;


const notSubmitted=
TOTAL_STUDENTS-
submitted;


const rate=
Math.round(
submitted/
TOTAL_STUDENTS*
1000
)/10;


const notSubmittedNumbers=[];


for(
let i=1;
i<=TOTAL_STUDENTS;
i++
){

if(
!lesson.students.has(i)
){

notSubmittedNumbers.push(i);

}

}


html+=`

<div class="submission-box">

<h2>
📚 ${escapeHTML(
lesson.subject
)}
</h2>

<h3>
📖 ${escapeHTML(
lesson.unit
)}
</h3>


<div class="submission-number">

${submitted} / ${TOTAL_STUDENTS}人

</div>


<div class="submission-bar">

<div
class="submission-bar-inner"
style="width:${rate}%">

</div>

</div>


<div class="submission-info">

<div class="submitted">

🟢 提出済み：
${submitted}人

</div>


<div class="not-submitted">

⚪ 未提出：
${notSubmitted}人

</div>

</div>


<p style="text-align:center;font-size:18px;">

提出率：
<strong>
${rate}%
</strong>

</p>


<div class="not-submitted-list">

<strong>
⚪ まだ提出していない出席番号
</strong>

<br><br>

${
notSubmittedNumbers.length>0

?

notSubmittedNumbers
.map(
n=>`${n}番`
)
.join("　")

:

"🎉 全員提出しました！"
}

</div>


<button
onclick="openLesson(
${JSON.stringify(
lesson.lessonId
)}
)">

📖 この授業の振り返りを見る

</button>


</div>

`;

});


area.innerHTML=html;

}


/* ==================================================
授業詳細
================================================== */

window.openLesson=function(
lessonId
){

const lessonData=
todayData.filter(
data=>
getLessonId(data)
===
lessonId
);


if(
lessonData.length===0
){

return;

}


document
.getElementById(
"teacherPage"
)
.style.display="none";


document
.getElementById(
"studentPage"
)
.style.display="none";


document
.getElementById(
"lessonPage"
)
.style.display="block";


const subject=
lessonData[0].subject || "";


const unit=
lessonData[0].unit || "";


let html=

`
<h1>
📚 ${escapeHTML(subject)}
</h1>

<h2
class="lesson-title">

📖 ${escapeHTML(unit)}

</h2>
`;


const submittedNumbers=
new Set();


lessonData.forEach(data=>{

const number=
Number(data.studentNumber);


if(
number>=1 &&
number<=TOTAL_STUDENTS
){

submittedNumbers.add(number);

}

});


html+=`

<div class="submission-box">

<div class="submission-number">

${submittedNumbers.size}
/
${TOTAL_STUDENTS}人

</div>

<p style="text-align:center">

提出状況

</p>

</div>


<h2 class="section-title">

📝 児童の振り返り

</h2>

<div class="reflection-grid">

`;


lessonData
.sort(
(a,b)=>
Number(a.studentNumber)
-
Number(b.studentNumber)
)
.forEach(data=>{

const level=
Number(
data.reflectionLevel
||1
);


html+=`

<div class="card">

<h2>

👦 ${Number(
data.studentNumber
)}番

</h2>

<p class="date">

📅 ${escapeHTML(
formatDate(data.date)
)}

</p>


${getLevelHTML(level)}


<div class="study-box">

<strong>
📝 最初の振り返り
</strong>

<br><br>

${escapeHTML(
data.study
)}

</div>


<div class="advice-box">

<strong>
🤖 AIからの問い
</strong>

<br><br>

${escapeHTML(
data.aiQuestion ||
"まだありません"
)}

</div>


<div class="deep-box">

<strong>
✏️ 最終的な振り返り
</strong>

<br><br>

${escapeHTML(
data.deepReflection ||
"まだ入力されていません"
)}

</div>


<div class="level-box">

⭐ 参考になった人数：
<strong>
${Number(data.likes||0)}
</strong>人

</div>

</div>

`;

});


html+=`

</div>

`;


document
.getElementById(
"lessonDetail"
)
.innerHTML=html;

};


/* ==================================================
レベル表示
================================================== */

function getLevelHTML(level){

if(level===3){

return `

<div class="level-box level3">

🌳 <strong>レベル3</strong>

<br><br>

いろいろな考えや資料などをもとに、
自分の学びを具体的に書けています！

</div>

`;

}


if(level===2){

return `

<div class="level-box level2">

🌿 <strong>レベル2</strong>

<br><br>

今日分かったことや気付いたことを、
具体的に書けています！

</div>

`;

}


return `

<div class="level-box level1">

🌱 <strong>レベル1</strong>

<br><br>

自分の気持ちや感じたことを
しっかり書けています！

</div>

`;

}


/* ==================================================
日付表示
================================================== */

function formatDate(value){

const date=
getDateObject(value);


if(!date){

return "日付なし";

}


return date.toLocaleString(
"ja-JP"
);

}


/* ==================================================
児童一覧
================================================== */

function showStudentList(){

const area=
document.getElementById(
"studentList"
);


const students=[];


allData.forEach(data=>{

const number=
Number(data.studentNumber);


if(
number>=1 &&
number<=TOTAL_STUDENTS &&
!students.includes(number)
){

students.push(number);

}

});


students.sort(
(a,b)=>a-b
);


if(
students.length===0
){

area.innerHTML=

`
<div class="empty">

まだ児童の振り返りはありません。

</div>
`;

return;

}


let html=

`
<div class="grid">
`;


for(
let number=1;
number<=TOTAL_STUDENTS;
number++
){

const count=
allData.filter(
data=>
Number(
data.studentNumber
)===number
).length;


html+=`

<div class="card">

<h2>
👦 ${number}番
</h2>

<p>

📚 振り返り：
<strong>
${count}件
</strong>

</p>


<button
onclick="openStudent(
${number}
)">

📖 学びを見る

</button>

</div>

`;

}


html+=`

</div>

`;


area.innerHTML=html;

}


/* ==================================================
児童詳細
================================================== */

window.openStudent=function(
number
){

const studentData=
allData.filter(
data=>
Number(
data.studentNumber
)===number
);


document
.getElementById(
"teacherPage"
)
.style.display="none";


document
.getElementById(
"studentPage"
)
.style.display="block";


let html=

`
<h1>
👦 ${number}番の学び
</h1>

<h2 class="section-title">

📚 教科を選んでください

</h2>

<div class="grid">
`;


const subjects=[];


studentData.forEach(data=>{

if(
data.subject &&
!subjects.includes(
data.subject
)
){

subjects.push(
data.subject
);

}

});


subjects.forEach(subject=>{

const count=
studentData.filter(
data=>
data.subject===subject
).length;


html+=`

<div class="card">

<h2>
📚 ${escapeHTML(subject)}
</h2>

<p>
${count}件の振り返り
</p>

<button
onclick="openStudentSubject(
${number},
${JSON.stringify(subject)}
)">

見る

</button>

</div>

`;

});


html+=`

</div>

`;


if(
subjects.length===0
){

html+=`

<div class="empty">

まだ振り返りはありません。

</div>

`;

}


document
.getElementById(
"studentDetail"
)
.innerHTML=html;

};


/* ==================================================
児童：教科
================================================== */

window.openStudentSubject=function(
number,
subject
){

const studentData=
allData.filter(
data=>
Number(
data.studentNumber
)===number &&
data.subject===subject
);


let html=

`
<button
class="back-button small-button"
onclick="openStudent(${number})">

← 教科一覧へ

</button>


<h1>
👦 ${number}番
</h1>


<h2 class="section-title">

📚 ${escapeHTML(subject)}

</h2>


<h3>
📖 単元を選んでください
</h3>


<div class="grid">
`;


const units=[];


studentData.forEach(data=>{

const unit=
data.unit || "";


if(
!units.includes(unit)
){

units.push(unit);

}

});


units.forEach(unit=>{

const count=
studentData.filter(
data=>
(data.unit||"")===unit
).length;


html+=`

<div class="card">

<h2>

📖 ${escapeHTML(
unit || "単元名なし"
)}

</h2>

<p>
${count}件
</p>


<button
onclick="openStudentUnit(
${number},
${JSON.stringify(subject)},
${JSON.stringify(unit)}
)">

見る

</button>

</div>

`;

});


html+=`

</div>

`;


document
.getElementById(
"studentDetail"
)
.innerHTML=html;

};


/* ==================================================
児童：単元
================================================== */

window.openStudentUnit=function(
number,
subject,
unit
){

const studentData=
allData.filter(
data=>
Number(
data.studentNumber
)===number &&
data.subject===subject &&
(data.unit||"")===unit
);


let html=

`
<button
class="back-button small-button"
onclick="openStudentSubject(
${number},
${JSON.stringify(subject)}
)">

← 単元一覧へ

</button>


<h1>
👦 ${number}番
</h1>


<h2 class="section-title">

📖 ${escapeHTML(
unit || "単元名なし"
)}

</h2>


<div class="reflection-grid">

`;


studentData.forEach(data=>{

const level=
Number(
data.reflectionLevel
||1
);


html+=`

<div class="card">

<p class="date">

📅 ${escapeHTML(
formatDate(data.date)
)}

</p>


${getLevelHTML(level)}


<div class="study-box">

<strong>
📝 最初の振り返り
</strong>

<br><br>

${escapeHTML(
data.study
)}

</div>


<div class="advice-box">

<strong>
🤖 AIからの問い
</strong>

<br><br>

${escapeHTML(
data.aiQuestion ||
"まだありません"
)}

</div>


<div class="deep-box">

<strong>
✏️ 最終的な振り返り
</strong>

<br><br>

${escapeHTML(
data.deepReflection ||
"まだ入力されていません"
)}

</div>

</div>

`;

});


html+=`

</div>

`;


document
.getElementById(
"studentDetail"
)
.innerHTML=html;

};


/* ==================================================
戻る
================================================== */

window.backTeacherPage=function(){

document
.getElementById(
"studentPage"
)
.style.display="none";


document
.getElementById(
"lessonPage"
)
.style.display="none";


document
.getElementById(
"teacherPage"
)
.style.display="block";

};


/* ==================================================
起動
================================================== */

checkTeacherLogin();

startRealtimeListener();


console.log(
"👩‍🏫 学びアルバム Ver.2 先生ページ 起動"
);

</script>

</body>

</html>
