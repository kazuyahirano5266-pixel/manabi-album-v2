<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>先生ページ</title>

<style>

body{
font-family:sans-serif;
background:#fff8e7;
padding:20px;
}

h1{
text-align:center;
}

.card{
background:white;
padding:20px;
margin:15px auto;
border-radius:20px;
max-width:700px;
box-shadow:0 3px 8px #ccc;
min-height:300px;
}

.subject{
color:#2b7a78;
font-weight:bold;
}
.study-text{
background:#f7f7f7;
padding:10px;
border-radius:10px;
max-height:80px;
overflow:auto;
}

.level-box{
background:#eaf6ff;
padding:10px;
border-radius:10px;
margin:10px 0;
}
.comment-area{
height:60px;
resize:none;
}
textarea{
width:90%;
max-height:80px;
}

</style>

</head>


<body>


<h1>👩‍🏫 先生ページ</h1>

<div id="list">
読み込み中...
</div>



<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import { getFirestore, collection, onSnapshot, doc, updateDoc }

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain: "manabi-album-v2.firebaseapp.com",

projectId: "manabi-album-v2",

storageBucket: "manabi-album-v2.firebasestorage.app",

messagingSenderId: "226258471812",

appId: "1:226258471812:web:15230ba15e7e0bd7d86bd1"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



onSnapshot(collection(db,"manabi"),(snapshot)=>{


let html="";


snapshot.forEach((doc)=>{


const data=doc.data();


html += `

<div class="card">

<div class="subject">
📚 ${data.subject}
</div>


<h3>👤 ${data.name}</h3>


<p><b>今日の学び</b></p>

<div class="study-text">
${data.study}
</div>

<div class="level-box">
${data.level || "まだ判定なし"}
</div>

<p><b>次にやりたいこと</b></p>

<p><b>💬 先生コメント</b></p>

<textarea class="comment-area" id="comment-${doc.id}">
${data.comment || ""}
</textarea>

<button onclick="saveComment('${doc.id}')">
保存
</button>

`;

});


document.getElementById("list").innerHTML=html;


});

window.saveComment = async function(id){

const text =
document.getElementById("comment-"+id).value;


await updateDoc(doc(db,"manabi",id),{

comment:text

});


alert("コメントを保存しました");

}
</script>


</body>

</html>
