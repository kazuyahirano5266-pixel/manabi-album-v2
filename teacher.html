<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2 先生ページ</title>

<style>

/* =========================
基本
========================= */

*{
box-sizing:border-box;
}

body{
font-family:sans-serif;
background:#eef7ff;
margin:0;
padding:15px;
color:#333;
}

.box{
background:white;
max-width:1400px;
margin:0 auto;
padding:20px;
border-radius:25px;
}

h1{
text-align:center;
margin-top:5px;
}

h2{
margin-bottom:10px;
}

button{
border:none;
border-radius:16px;
padding:12px 20px;
font-size:16px;
cursor:pointer;
margin:5px;
background:#2b7a78;
color:white;
}

button:hover{
opacity:0.85;
}

.back-button{
background:#777;
}

.setting-button{
background:#555;
}

.copy-button{
background:#1976d2;
}

.comment-button{
background:#8e44ad;
}

.new-lesson-button{
background:#e67e22;
font-size:18px;

}

.number-button{
background:white;
color:#333;
border:2px solid #2b7a78;

}

background:#2b7a78;
color:white;
}

.number-button.has-data{

/* =========================
入力
========================= */

input,
textarea,
select{
width:100%;
padding:12px;
font-size:17px;
border:1px solid #ccc;
border-radius:12px;
margin:5px 0 12px;
}

textarea{
min-height:140px;
line-height:1.6;

/* =========================
ヘッダー
========================= */

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.header-title{
flex:1;
}


/* =========================
授業情報
========================= */

.lesson-area{
background:#fff7df;
padding:20px;
border-radius:22px;
margin-bottom:20px;
text-align:center;
border:2px solid #f0d98c;
}

.lesson-status{
font-size:15px;
color:#666;
margin-bottom:5px;
}

.lesson-title{
font-size:25px;
font-weight:bold;
margin:5px 0;
}

.lesson-id{
font-size:18px;
color:#777;
margin-top:8px;
}

.current-badge{
display:inline-block;
background:#2b7a78;
color:white;
padding:7px 16px;
border-radius:20px;
font-weight:bold;
margin-bottom:10px;
}


/* =========================
出席番号
========================= */

.number-area{
background:#f5fbff;
padding:15px;
border-radius:20px;
}

.number-grid{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:8px;
margin-top:15px;
}


/* =========================
カード
========================= */

.card{
background:white;
border-radius:20px;
padding:18px;
box-shadow:0 3px 10px #ccc;
}

.card-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
margin-top:20px;
}

.reflection-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-top:20px;
}


/* =========================
児童カード
========================= */

.student-card{
background:#f8fcff;
border:2px solid #d9edf7;
border-radius:20px;
padding:18px;
}

.student-number{
font-size:22px;
font-weight:bold;
}

.student-name{
font-size:18px;
color:#555;
margin:8px 0;
}

.count-badge{
display:inline-block;
background:#eaf6ff;
padding:6px 12px;
border-radius:15px;
font-size:14px;
}


/* =========================
振り返り
========================= */

.study-box{
background:#f5f5f5;
padding:15px;
border-radius:15px;
margin:12px 0;
line-height:1.8;
white-space:pre-wrap;
word-break:break-word;
}

.advice-box{
background:#eaf6ff;
padding:15px;
border-radius:15px;
margin:12px 0;
line-height:1.8;
}

.deep-box{
background:#f0fff0;
padding:15px;
border-radius:15px;
margin:12px 0;
line-height:1.8;
white-space:pre-wrap;
word-break:break-word;
}

.level-box{
background:#fff7df;
padding:12px;
border-radius:15px;
margin:12px 0;
}

.date{
font-size:14px;
color:#777;
}


/* =========================
所見
========================= */

.comment-area{
background:#faf5ff;
border:2px solid #ead9f5;
padding:18px;
border-radius:20px;
margin-top:18px;
}

.copilot-box{
background:#f4f4f4;
border-radius:15px;
padding:15px;
margin-top:15px;
white-space:pre-wrap;
word-break:break-word;
font-size:15px;
line-height:1.7;
}


/* =========================
設定
========================= */

.setting-panel{
background:#f7f7f7;
padding:20px;
border-radius:20px;
margin-top:20px;
}

.name-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.name-row{
display:grid;
grid-template-columns:80px 1fr;
align-items:center;
gap:8px;
background:white;
padding:8px;
border-radius:12px;
}

.name-row input{
margin:0;
}


/* =========================
その他
========================= */

.section-title{
background:#eaf6ff;
padding:14px;
border-radius:15px;
margin-top:20px;
}

.empty{
padding:30px;
text-align:center;
background:#f8f8f8;
border-radius:20px;
margin-top:20px;
}

.loading{
padding:35px;
text-align:center;
font-size:20px;
}

.message{
padding:15px;
background:#eaffea;
border-radius:15px;
margin:15px 0;
}

.error-box{
padding:20px;
background:#fff0f0;
border:2px solid #ffcccc;
border-radius:20px;
margin-top:20px;
}

.hidden{
display:none;
}


/* =========================
レスポンシブ
========================= */

@media(max-width:1100px){

.number-grid{
grid-template-columns:repeat(8,1fr);
}

.card-grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:800px){

.number-grid{
grid-template-columns:repeat(5,1fr);
}

.reflection-grid{
grid-template-columns:1fr;
}

.name-grid{
grid-template-columns:1fr;
}

}

@media(max-width:600px){

body{
padding:8px;
}

.box{
padding:12px;
}

.number-grid{
grid-template-columns:repeat(5,1fr);
gap:5px;
}

.number-button{
padding:9px 3px;
font-size:15px;
min-height:50px;
}

.card-grid{
grid-template-columns:1fr;
}

.lesson-title{
font-size:21px;
}

}

</style>

</head>


<body>


<!-- ==================================================
メインページ
================================================== -->

<div class="box" id="mainPage">


<div class="header">

<div class="header-title">

<h1>
👩‍🏫 学びアルバム Ver.2
</h1>

<p>
先生ページ
</p>

</div>


<button
class="setting-button"
onclick="openSettings()">

⚙️ 名前設定

</button>

</div>


<!-- ==================================================
現在の授業
================================================== -->

<div class="lesson-area">

<div class="current-badge">
🟢 現在の授業
</div>

<div class="lesson-status">
今、児童が保存する振り返りはこの授業に入ります。
</div>

<div
id="lessonTitleDisplay"
class="lesson-title">

授業を準備しています…

</div>

<div
id="lessonIdDisplay"
class="lesson-id">

授業ID：----

</div>


<button
type="button"
class="new-lesson-button"
onclick="createNewLesson()">

🔄 新しい授業を開始

</button>


<p style="font-size:14px;color:#777;">

※児童は授業IDを入力する必要はありません。

</p>

</div>


<!-- =========================
出席番号
========================= -->

<div class="number-area">

<h2>
🔢 児童を選んでください
</h2>

<p>
出席番号を選択すると、<strong>今の授業</strong>の振り返りを表示します。
</p>

<div
id="numberGrid"
class="number-grid">

</div>

</div>


<!-- =========================
児童表示
========================= -->

<div id="studentArea">

<div class="empty">

📚 現在の授業を読み込んでいます。

</div>

</div>


</div>



<!-- ==================================================
設定ページ
================================================== -->

<div
class="box hidden"
id="settingsPage">

<h1>
⚙️ 児童名設定
</h1>

<p>
出席番号と表示名を設定できます。
</p>

<p>
<strong>
※ここで設定した名前はFirestoreには保存されません。
</strong>
</p>

<p>
この先生ページを開いている端末のブラウザにだけ保存されます。
</p>


<div
id="nameGrid"
class="name-grid">

</div>


<div style="margin-top:20px;">

<button
onclick="saveNames()">

💾 名前を保存する

</button>


<button
class="back-button"
onclick="closeSettings()">

← 先生ページへ

</button>

</div>


<div id="settingMessage"></div>

</div>



<script type="module">


/* ==================================================
Firebase
================================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {
getFirestore,
collection,
getDocs,
query,
where,
doc,
getDoc,
setDoc
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain:
"manabi-album-v2.firebaseapp.com",

projectId:
"manabi-album-v2",

storageBucket:
"manabi-album-v2.firebasestorage.app",

messagingSenderId:
"226258471812",

appId:
"1:226258471812:web:15230ba15e7e0bd7d86bd1"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ==================================================
変数
================================================== */

let allData=[];

let selectedNumber="";

let currentLessonId="";

let currentLessonCreatedAt="";


/* ==================================================
名前設定
================================================== */

let studentNames={};

try{

studentNames=
JSON.parse(
localStorage.getItem(
"manabiStudentNames"
) || "{}"
);

}catch(error){

studentNames={};

}


/* ==================================================
HTML安全処理
================================================== */

function escapeHTML(value){

if(
value===undefined ||
value===null
){

return "";

}

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==================================================
日付
================================================== */

function formatDate(value){

if(!value){

return "日付なし";

}

try{

if(
value &&
typeof value.toDate==="function"
){

return value
.toDate()
.toLocaleString("ja-JP");

}

const date=
new Date(value);

if(
isNaN(date.getTime())
){

return "日付なし";

}

return date.toLocaleString("ja-JP");

}catch(error){

return "日付なし";

}

}


/* ==================================================
出席番号取得
================================================== */

function getNumber(data){

const possibleValues=[

data.studentNumber,
data.attendanceNumber,
data.attendanceCode,
data.number,
data.studentNo

];


for(
const value of possibleValues
){

if(
value!==undefined &&
value!==null &&
String(value).trim()!==""
){

const text=
String(value).trim();

if(
Number(text)>=1 &&
Number(text)<=40
){

return String(
Number(text)
);

}

}

}


if(data.name){

const oldName=
String(data.name).trim();

if(
Number(oldName)>=1 &&
Number(oldName)<=40
){

return String(
Number(oldName)
);

}

}


return "";

}


/* ==================================================
表示名
================================================== */

function getDisplayName(number){

if(
studentNames &&
studentNames[number]
){

return studentNames[number];

}

return "名前未設定";

}


/* ==================================================
授業ID作成
================================================== */

function generateLessonId(){

const now=
new Date();


const date=
String(
now.getFullYear()
).slice(-2)
+
String(
now.getMonth()+1
).padStart(2,"0")
+
String(
now.getDate()
).padStart(2,"0");


const time=
String(
now.getHours()
).padStart(2,"0")
+
String(
now.getMinutes()
).padStart(2,"0");


const random=
Math.random()
.toString(36)
.substring(2,6)
.toUpperCase();


return date+"-"+time+"-"+random;

}


/* ==================================================
現在の授業をFirebaseから取得
================================================== */

async function loadCurrentLesson(){

try{

const lessonRef=
doc(
db,
"settings",
"currentLesson"
);


const lessonSnap=
await getDoc(
lessonRef
);


if(
lessonSnap.exists()
){

const data=
lessonSnap.data();


currentLessonId=
data.lessonId || "";


currentLessonCreatedAt=
data.createdAt || "";

}


if(
!currentLessonId
){

await createNewLesson(false);

}else{

showCurrentLesson();

await loadAllData();

}


}catch(error){

console.error(
"現在の授業取得エラー:",
error
);


document.getElementById(
"studentArea"
).innerHTML=

`

<div class="error-box">

<h2>
😢 現在の授業を取得できませんでした
</h2>

<p>
Firebaseとの通信を確認してください。
</p>

<button
type="button"
onclick="location.reload()">

🔄 ページを再読み込み

</button>

</div>

`;

}

}


/* ==================================================
新しい授業を開始
================================================== */

async function createNewLesson(ask=true){

if(ask){

const answer=
confirm(
"新しい授業を開始します。\n\n現在の授業とは別の授業になります。\n\nよろしいですか？"
);

if(!answer){

return;

}

}


try{

const newLessonId=
generateLessonId();


currentLessonId=
newLessonId;


currentLessonCreatedAt=
new Date();


/*
Firebaseの
「現在の授業」を更新
*/

await setDoc(

doc(
db,
"settings",
"currentLesson"
),

{

lessonId:
currentLessonId,

createdAt:
currentLessonCreatedAt

}

);


showCurrentLesson();


/*
今まで表示していたデータをクリア
*/

allData=[];

selectedNumber="";


createNumberButtons();


document.getElementById(
"studentArea"
).innerHTML=

`

<div class="message">

✅ 新しい授業を開始しました。

<br><br>

この授業から児童が保存する振り返りは、
自動的にこの授業に入ります。

</div>

<div class="empty">

👆 出席番号を選択してください。

</div>

`;

}catch(error){

console.error(
"新しい授業作成エラー:",
error
);


alert(
"新しい授業を開始できませんでした。"
);

}

}


/* ==================================================
現在の授業表示
================================================== */

function showCurrentLesson(){

const idElement=
document.getElementById(
"lessonIdDisplay"
);


const titleElement=
document.getElementById(
"lessonTitleDisplay"
);


if(idElement){

idElement.textContent=
"授業ID："+(
currentLessonId || "----"
);

}


if(titleElement){

titleElement.textContent=
"この授業が現在の授業です";

}

}


/* ==================================================
出席番号ボタン
================================================== */

function createNumberButtons(){

let html="";


for(
let i=1;
i<=40;
i++
){

const number=
String(i);


const count=
allData.filter(
data=>
getNumber(data)===number
).length;


html+=`

<button
type="button"
class="number-button ${
count>0 ? "has-data" : ""
}"
data-number="${number}">

${i}番

${
count>0
?
`<br><small>📚 ${count}件</small>`
:
""
}

</button>

`;

}


document.getElementById(
"numberGrid"
).innerHTML=html;


document
.querySelectorAll(
".number-button"
)
.forEach(button=>{

button.addEventListener(
"click",
function(){

const number=
this.dataset.number;

selectStudent(number);

}
);

});

}


/* ==================================================
Firestore読み込み
現在の授業だけ
================================================== */

async function loadAllData(){

if(!currentLessonId){

return;

}


document.getElementById(
"studentArea"
).innerHTML=

`

<div class="loading">

📚 今の授業の振り返りを読み込んでいます...

</div>

`;


try{

/*
lessonIdが現在の授業と一致するものだけ取得
*/

const q=
query(

collection(
db,
"manabi"
),

where(
"lessonId",
"==",
currentLessonId
)

);


const snapshot=
await getDocs(q);


allData=[];


snapshot.forEach(
docSnap=>{

const data=
docSnap.data();


allData.push({

id:docSnap.id,

...data

});

});


console.log(
"現在の授業ID:",
currentLessonId
);

console.log(
"今回の読み込み件数:",
allData.length
);


createNumberButtons();


document.getElementById(
"studentArea"
).innerHTML=

`

<div class="message">

📚 現在の授業：

<strong>
${escapeHTML(currentLessonId)}
</strong>

<br>

現在 ${allData.length} 件の振り返り

</div>


<div class="empty">

👆 出席番号を選択してください。

</div>

`;


}catch(error){

console.error(
"Firestore読み込みエラー:",
error
);


document.getElementById(
"studentArea"
).innerHTML=

`

<div class="error-box">

<h2>
😢 読み込めませんでした
</h2>

<p>
現在の授業の振り返りを読み込めませんでした。
</p>

<button
type="button"
id="reloadButton">

🔄 もう一度読み込む

</button>

</div>

`;


document.getElementById(
"reloadButton"
).addEventListener(
"click",
loadAllData
);

}

}


/* ==================================================
児童選択
================================================== */

function selectStudent(number){

selectedNumber=
String(number);


document
.querySelectorAll(
".number-button"
)
.forEach(
button=>{

button.classList.remove(
"selected"
);

}
);


const selectedButton=
document.querySelector(
`.number-button[data-number="${CSS.escape(selectedNumber)}"]`
);


if(selectedButton){

selectedButton.classList.add(
"selected"
);

}


showStudentSubjects();

}


/* ==================================================
児童の教科一覧
================================================== */

function showStudentSubjects(){

const data=
allData.filter(
item=>
getNumber(item)===selectedNumber
);


let html=`


<button
type="button"
class="back-button"
id="backToNumbers">

← 児童一覧へ

</button>


<div class="section-title">

<h2>
👤 ${escapeHTML(selectedNumber)}番
</h2>

<p class="student-name">

${escapeHTML(
getDisplayName(selectedNumber)
)}

</p>

</div>

`;


if(
data.length===0
){

html+=`

<div class="empty">

📭 この授業ではまだ振り返りがありません。

</div>

`;


document.getElementById(
"studentArea"
).innerHTML=html;


document.getElementById(
"backToNumbers"
).addEventListener(
"click",
showNumberArea
);

return;

}


const subjects=[];


data.forEach(
item=>{

const subject=
String(
item.subject || ""
).trim();


if(
subject &&
!subjects.includes(subject)
){

subjects.push(subject);

}

});


subjects.sort();


html+=`

<h2>
📚 教科を選んでください
</h2>

<div class="card-grid">

`;


subjects.forEach(
subject=>{

const count=
data.filter(
item=>
String(item.subject || "").trim()
===subject
).length;


html+=`

<div class="student-card">

<h2>
📚 ${escapeHTML(subject)}
</h2>

<span class="count-badge">

${count}件の振り返り

</span>

<br>


<button
type="button"
class="subject-button"
data-subject="${escapeHTML(subject)}">

見る

</button>

</div>

`;

});


html+=`

</div>

`;


document.getElementById(
"studentArea"
).innerHTML=html;


document.getElementById(
"backToNumbers"
).addEventListener(
"click",
showNumberArea
);


document
.querySelectorAll(
".subject-button"
)
.forEach(
button=>{

button.addEventListener(
"click",
function(){

openTeacherSubject(
this.dataset.subject
);

}
);

});

}


/* ==================================================
出席番号一覧へ
================================================== */

function showNumberArea(){

selectedNumber="";


document.getElementById(
"studentArea"
).innerHTML=

`

<div class="message">

📚 現在の授業：

<strong>
${escapeHTML(currentLessonId)}
</strong>

</div>


<div class="empty">

👆 出席番号を選択してください。

</div>

`;


document
.querySelectorAll(
".number-button"
)
.forEach(
button=>{

button.classList.remove(
"selected"
);

});

}


/* ==================================================
教科
================================================== */

function openTeacherSubject(subject){

subject=
String(subject || "");


const data=
allData.filter(
item=>

getNumber(item)===selectedNumber &&

String(
item.subject || ""
).trim()===subject

);


let html=`


<button
type="button"
class="back-button"
id="backToSubjects">

← 教科一覧へ

</button>


<div class="section-title">

<h2>
👤 ${escapeHTML(selectedNumber)}番
</h2>

<h2>
📚 ${escapeHTML(subject)}
</h2>

</div>


<h3>

/* ==================================================
日付
================================================== */

function getDateTime(value){

try{

if(
value &&
typeof value.toDate==="function"
){

return value.toDate().getTime();

}


const d=
new Date(value);


if(
isNaN(d.getTime())
){

return 0;

}


return d.getTime();

}catch(error){

return 0;

}

}

/* ==================================================
Copilotへコピー
================================================== */

async function copyCopilotPrompt(id){

const data=
allData.find(
item=>
String(item.id)===String(id)
);


if(!data){

alert(
"振り返りが見つかりません。"
);

return;

}


const text=
createCopilotPrompt(data);


try{

await navigator.clipboard.writeText(
text
);

alert(
"📋 Copilot用の文章をコピーしました！\n\nCopilotを開いて貼り付けてください。"
);


}catch(error){

console.error(error);


const textarea=
document.createElement(
"textarea"
);

textarea.value=text;

textarea.style.position=
"fixed";

textarea.style.left=
"-9999px";

document.body.appendChild(
textarea
);

textarea.focus();

textarea.select();


try{

document.execCommand(
"copy"
);

alert(
"📋 Copilot用の文章をコピーしました！"
);

}catch(copyError){

alert(
"コピーできませんでした。\n表示された文章を長押ししてコピーしてください。"
);

}


document.body.removeChild(
textarea
);

}

}
