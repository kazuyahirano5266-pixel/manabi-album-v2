<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2 先生ページ</title>

<style>

/* ==================================================
   基本
================================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
  background:#f3f6fa;
  color:#333;
}

button,
input,
select{
  font-family:inherit;
}

button{
  border:none;
  border-radius:12px;
  padding:11px 18px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.86;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:20px;
}

/* ==================================================
   ヘッダー
================================================== */

header{
  background:
    linear-gradient(
      135deg,
      #4f8cff,
      #6c63ff
    );
  color:white;
  padding:22px 25px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:6px 0 0;
  font-size:14px;
}

/* ==================================================
   ボックス
================================================== */

.box{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:
    0 4px 15px rgba(0,0,0,.06);
}

h2{
  margin-top:0;
}

/* ==================================================
   ボタン
================================================== */

.primary{
  background:#4f8cff;
  color:white;
}

.green{
  background:#43b883;
  color:white;
}

.orange{
  background:#f2a93b;
  color:white;
}

.red{
  background:#e85b5b;
  color:white;
}

.gray{
  background:#e9edf4;
  color:#333;
}

.button-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
}

/* ==================================================
   授業情報
================================================== */

.lesson-card{
  border-left:7px solid #43b883;
  background:#f8fffb;
  border-radius:15px;
  padding:20px;
}

.lesson-card.ended{
  border-left-color:#aaa;
  background:#f7f7f7;
}

.lesson-status{
  font-weight:bold;
  color:#43a56f;
}

.lesson-status.ended{
  color:#777;
}

.lesson-subject{
  font-size:30px;
  font-weight:bold;
  margin:8px 0;
}

.lesson-unit{
  font-size:19px;
  color:#555;
}

.lesson-id{
  margin-top:10px;
  font-size:13px;
  color:#888;
  word-break:break-all;
}

/* ==================================================
   授業開始
================================================== */

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  padding:13px;
  border:1px solid #d8dee8;
  border-radius:11px;
  font-size:16px;
  background:white;
}

/* ==================================================
   統計
================================================== */

.stats{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:14px;
}

.stat{
  background:#f7f9fc;
  border-radius:14px;
  padding:17px;
  text-align:center;
}

.stat-title{
  color:#777;
  font-size:13px;
}

.stat-number{
  font-size:29px;
  font-weight:bold;
  margin-top:5px;
}

/* ==================================================
   メニュー
================================================== */

.menu-grid{
  display:grid;
  grid-template-columns:
    repeat(2,1fr);
  gap:16px;
}

.menu-button{
  background:white;
  border:2px solid #e1e7f0;
  border-radius:17px;
  padding:25px;
  text-align:left;
  cursor:pointer;
}

.menu-button:hover{
  border-color:#4f8cff;
  background:#f8fbff;
}

.menu-icon{
  font-size:34px;
}

.menu-title{
  font-size:20px;
  font-weight:bold;
  margin-top:10px;
}

.menu-description{
  color:#777;
  margin-top:6px;
}

/* ==================================================
   パンくず
================================================== */

.breadcrumb{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.breadcrumb-current{
  color:#4f8cff;
  font-weight:bold;
}

/* ==================================================
   児童一覧
================================================== */

.search{
  margin-bottom:15px;
}

.student-table{
  width:100%;
  border-collapse:collapse;
}

.student-table th{
  background:#eef3f9;
  padding:13px;
  text-align:left;
  white-space:nowrap;
}

.student-table td{
  padding:13px;
  border-bottom:1px solid #edf0f4;
}

.student-row{
  cursor:pointer;
}

.student-row:hover{
  background:#f7fbff;
}

.student-name{
  font-size:17px;
  font-weight:bold;
}

.count{
  font-weight:bold;
}

.level3{
  color:#b87900;
  font-weight:bold;
}

.no-data{
  color:#aaa;
}

/* ==================================================
   教科
================================================== */

.subject-grid{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:14px;
}

.subject-card{
  border:2px solid #e2e7ef;
  border-radius:16px;
  padding:20px;
  text-align:center;
  cursor:pointer;
  background:white;
}

.subject-card:hover{
  border-color:#4f8cff;
  background:#f7faff;
}

.subject-name{
  font-size:20px;
  font-weight:bold;
}

.subject-count{
  color:#777;
  margin-top:7px;
}

/* ==================================================
   単元
================================================== */

.unit-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.unit-card{
  border:1px solid #e0e5ed;
  border-radius:14px;
  padding:18px;
  cursor:pointer;
}

.unit-card:hover{
  border-color:#4f8cff;
  background:#f7faff;
}

.unit-title{
  font-size:19px;
  font-weight:bold;
}

.unit-info{
  color:#777;
  margin-top:7px;
}

/* ==================================================
   振り返り
================================================== */

.reflection-card{
  border:1px solid #e2e7ee;
  border-radius:17px;
  padding:21px;
  margin-bottom:16px;
}

.reflection-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.subject-badge{
  display:inline-block;
  background:#eaf1ff;
  color:#3769c8;
  padding:5px 11px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.date{
  color:#888;
  font-size:13px;
}

.study-box{
  margin-top:17px;
  line-height:1.9;
  white-space:pre-wrap;
}

.ai-box{
  margin-top:17px;
  background:#eef7ff;
  border-left:6px solid #4f8cff;
  border-radius:10px;
  padding:15px;
  line-height:1.8;
  white-space:pre-wrap;
}

.deep-box{
  margin-top:17px;
  background:#fff9e8;
  border-left:6px solid #f2b94b;
  border-radius:10px;
  padding:15px;
  line-height:1.8;
  white-space:pre-wrap;
}

.no-deep{
  margin-top:17px;
  background:#f7f7f7;
  color:#888;
  border-radius:10px;
  padding:14px;
}

.level-badge{
  display:inline-block;
  margin-top:15px;
  padding:7px 13px;
  border-radius:20px;
  background:#edf1f6;
  font-weight:bold;
}

.level2{
  background:#eaf4ff;
  color:#3571c9;
}

.level3-badge{
  background:#fff0a8;
  color:#a56b00;
}

/* ==================================================
   クラス比較
================================================== */

.compare-info{
  background:#f5f8fc;
  border-radius:13px;
  padding:15px;
  margin-bottom:15px;
}

.compare-scroll{
  overflow-x:auto;
  border:1px solid #dfe5ec;
  border-radius:14px;
}

.compare-table{
  border-collapse:collapse;
  width:100%;
  min-width:1150px;
  background:white;
}

.compare-table th,
.compare-table td{
  border-bottom:1px solid #e4e8ee;
  border-right:1px solid #e4e8ee;
  padding:13px;
  vertical-align:top;
}

.compare-table th{
  background:#eef3f9;
  white-space:nowrap;
  text-align:left;
  position:sticky;
  top:0;
  z-index:2;
}

.compare-table th:first-child,
.compare-table td:first-child{
  position:sticky;
  left:0;
  z-index:3;
  background:#fff;
  min-width:135px;
}

.compare-table th:first-child{
  background:#e8eef7;
}

.compare-name{
  font-weight:bold;
  font-size:16px;
}

.compare-cell{
  min-width:240px;
  max-width:330px;
  line-height:1.7;
  white-space:pre-wrap;
}

.compare-ai{
  background:#f0f8ff;
}

.compare-deep{
  background:#fffaf0;
}

.compare-empty{
  color:#aaa;
  text-align:center;
}

.compare-level{
  min-width:110px;
  text-align:center;
  font-weight:bold;
}

.level1-cell{
  background:#f5f5f5;
}

.level2-cell{
  background:#edf7ff;
}

.level3-cell{
  background:#fff4bd;
  color:#9b6900;
}

.not-submit-row{
  background:#fafafa;
}

.not-submit{
  color:#999;
  font-weight:bold;
}

.compare-toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.compare-filter{
  width:auto;
  min-width:200px;
}

/* ==================================================
   空表示
================================================== */

.empty{
  text-align:center;
  color:#888;
  padding:40px 20px;
}

/* ==================================================
   レスポンシブ
================================================== */

@media(max-width:900px){

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .subject-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:650px){

  .container{
    padding:12px;
  }

  header h1{
    font-size:23px;
  }

  .menu-grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .subject-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .lesson-subject{
    font-size:25px;
  }

}

</style>

</head>


<body>


<header>

  <h1>👩‍🏫 学びアルバム Ver.2</h1>

  <p>
    先生ページ
  </p>

</header>


<div class="container">


<!-- ==================================================
     PAGE 1
     先生ホーム
================================================== -->

<section
  id="homePage"
  class="page active">

  <div class="box">

    <h2>📚 現在の授業</h2>

    <div id="lessonInfo">
      読み込んでいます……
    </div>

    <div class="button-row">

      <button
        class="green"
        onclick="showStartArea()">

        ▶️ 新しい授業を開始

      </button>

      <button
        class="red"
        onclick="endLesson()">

        ⏹️ 授業終了

      </button>

    </div>

  </div>


  <!-- 授業開始 -->

  <div
    id="startArea"
    class="box"
    style="display:none;">

    <h2>
      ▶️ 新しい授業を開始
    </h2>

    <div class="form-group">

      <label>
        教科
      </label>

      <select id="lessonSubject">

        <option value="">
          教科を選択してください
        </option>

        <option>国語</option>
        <option>算数</option>
        <option>生活</option>
        <option>理科</option>
        <option>社会</option>
        <option>総合</option>
        <option>道徳</option>
        <option>体育</option>

      </select>

    </div>


    <div class="form-group">

      <label>
        単元名
      </label>

      <input
        id="lessonUnit"
        type="text"
        placeholder="例：わり算の考え方">

    </div>


    <div class="button-row">

      <button
        class="green"
        onclick="startLesson()">

        授業を開始する

      </button>

      <button
        class="gray"
        onclick="hideStartArea()">

        キャンセル

      </button>

    </div>

  </div>


  <!-- 統計 -->

  <div class="box">

    <h2>
      📊 現在の授業の状況
    </h2>

    <div
      id="stats"
      class="stats">
    </div>

  </div>


  <!-- メニュー -->

  <div class="box">

    <h2>
      🔎 振り返りを見る
    </h2>

    <div class="menu-grid">

      <div
        class="menu-button"
        onclick="openStudents()">

        <div class="menu-icon">
          👦👧
        </div>

        <div class="menu-title">
          児童一覧から見る
        </div>

        <div class="menu-description">
          児童 → 教科 → 単元 → 振り返り
          の順に詳しく見る
        </div>

      </div>


      <div
        class="menu-button"
        onclick="openCompare()">

        <div class="menu-icon">
          📊
        </div>

        <div class="menu-title">
          クラス全員を比較する
        </div>

        <div class="menu-description">
          全員の振り返りを横並びで比較して、
          学びの深まりを見取る
        </div>

      </div>

    </div>

  </div>

</section>


<!-- ==================================================
     PAGE 2
     児童一覧
================================================== -->

<section
  id="studentsPage"
  class="page">

  <div class="breadcrumb">

    <button
      class="gray"
      onclick="showPage('homePage')">

      ← 先生ホーム

    </button>

    <span class="breadcrumb-current">
      👦👧 児童一覧
    </span>

  </div>


  <div class="box">

    <h2>
      👦👧 児童一覧
    </h2>

    <input
      id="studentSearch"
      class="search"
      placeholder="🔍 児童名を検索"
      oninput="displayStudents()">

    <div id="studentTableArea"></div>

  </div>

</section>


<!-- ==================================================
     PAGE 3
     教科
================================================== -->

<section
  id="subjectsPage"
  class="page">

  <div class="breadcrumb">

    <button
      class="gray"
      onclick="openStudents()">

      ← 児童一覧

    </button>

    <span
      id="breadcrumbStudent"
      class="breadcrumb-current">
    </span>

  </div>


  <div class="box">

    <h2 id="subjectsTitle">
      📚 教科を選択
    </h2>

    <div
      id="subjectGrid"
      class="subject-grid">
    </div>

  </div>

</section>


<!-- ==================================================
     PAGE 4
     単元
================================================== -->

<section
  id="unitsPage"
  class="page">

  <div class="breadcrumb">

    <button
      class="gray"
      onclick="openStudentSubjects()">

      ← 教科一覧

    </button>

    <span
      id="breadcrumbUnit"
      class="breadcrumb-current">
    </span>

  </div>


  <div class="box">

    <h2 id="unitsTitle">
      📘 単元を選択
    </h2>

    <div
      id="unitList"
      class="unit-list">
    </div>

  </div>

</section>


<!-- ==================================================
     PAGE 5
     振り返り
================================================== -->

<section
  id="reflectionsPage"
  class="page">

  <div class="breadcrumb">

    <button
      class="gray"
      onclick="openUnits()">

      ← 単元一覧

    </button>

    <span
      id="breadcrumbReflection"
      class="breadcrumb-current">
    </span>

  </div>


  <div class="box">

    <h2 id="reflectionsTitle">
      ✏️ 振り返り
    </h2>

    <div id="reflectionList"></div>

  </div>

</section>


<!-- ==================================================
     PAGE 6
     クラス比較
================================================== -->

<section
  id="comparePage"
  class="page">

  <div class="breadcrumb">

    <button
      class="gray"
      onclick="showPage('homePage')">

      ← 先生ホーム

    </button>

    <span class="breadcrumb-current">
      📊 クラス全員比較
    </span>

  </div>


  <div class="box">

    <h2>
      📊 クラス全員の振り返り比較
    </h2>

    <div
      id="compareLessonInfo"
      class="compare-info">
    </div>


    <div class="compare-toolbar">

      <select
        id="compareSubjectFilter"
        class="compare-filter"
        onchange="displayCompare()">

        <option value="">
          現在の授業
        </option>

      </select>


      <select
        id="compareLevelFilter"
        class="compare-filter"
        onchange="displayCompare()">

        <option value="">
          すべてのレベル
        </option>

        <option value="1">
          レベル1
        </option>

        <option value="2">
          レベル2
        </option>

        <option value="3">
          🌟 レベル3
        </option>

        <option value="0">
          未提出
        </option>

      </select>


      <input
        id="compareSearch"
        class="compare-filter"
        placeholder="🔍 児童名"
        oninput="displayCompare()">

    </div>


    <div
      class="compare-scroll">

      <div id="compareTableArea"></div>

    </div>

  </div>

</section>


</div>


<script type="module">


/* ==================================================
   Firebase
================================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  updateDoc,
  onSnapshot,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   Firebase設定
   ↓↓↓
   ここだけ今使っている設定にする
================================================== */

const firebaseConfig = {

  apiKey:
    "ここにAPI_KEY",

  authDomain:
    "ここにAUTH_DOMAIN",

  projectId:
    "ここにPROJECT_ID",

  storageBucket:
    "ここにSTORAGE_BUCKET",

  messagingSenderId:
    "ここにMESSAGING_SENDER_ID",

  appId:
    "ここにAPP_ID"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* ==================================================
   グローバル変数
================================================== */

let currentLesson = null;

let allReflections = [];

let selectedStudent = "";

let selectedSubject = "";

let selectedUnit = "";


/* ==================================================
   ページ切り替え
================================================== */

window.showPage =
function(pageId){

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove("active");

    });


  document
    .getElementById(pageId)
    .classList.add("active");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* ==================================================
   現在の授業をFirebaseから自動取得
================================================== */

const lessonRef =
  doc(
    db,
    "currentLesson",
    "today"
  );


onSnapshot(
  lessonRef,
  snapshot => {

    if(snapshot.exists()){

      currentLesson =
        snapshot.data();

    }else{

      currentLesson = null;

    }


    showLesson();

    loadReflections();

  },

  error => {

    console.error(error);

    document.getElementById(
      "lessonInfo"
    ).innerHTML = `

      <div class="empty">

        Firebaseとの接続を確認してください。

      </div>

    `;

  }

);


/* ==================================================
   授業表示
================================================== */

function showLesson(){

  const area =
    document.getElementById(
      "lessonInfo"
    );


  if(!currentLesson){

    area.innerHTML = `

      <div class="lesson-card ended">

        ⏸️ 現在、授業は設定されていません。

      </div>

    `;

    return;

  }


  const active =
    currentLesson.active === true;


  area.innerHTML = `

    <div
      class="
        lesson-card
        ${active ? "" : "ended"}
      ">

      <div
        class="
          lesson-status
          ${active ? "" : "ended"}
        ">

        ${active
          ? "🟢 授業中"
          : "⏸️ 授業終了"}

      </div>


      <div class="lesson-subject">

        ${escapeHtml(
          currentLesson.subject || ""
        )}

      </div>


      <div class="lesson-unit">

        📘
        ${escapeHtml(
          currentLesson.unit || ""
        )}

      </div>


      <div class="lesson-id">

        授業ID：
        ${escapeHtml(
          currentLesson.lessonId || ""
        )}

      </div>

    </div>

  `;

}


/* ==================================================
   授業開始画面
================================================== */

window.showStartArea =
function(){

  document.getElementById(
    "startArea"
  ).style.display = "block";

};


window.hideStartArea =
function(){

  document.getElementById(
    "startArea"
  ).style.display = "none";

};


/* ==================================================
   授業ID自動作成
================================================== */

function createLessonId(){

  const now =
    new Date();


  const datePart =

    now.getFullYear() +

    String(
      now.getMonth()+1
    ).padStart(2,"0") +

    String(
      now.getDate()
    ).padStart(2,"0") +

    "-" +

    String(
      now.getHours()
    ).padStart(2,"0") +

    String(
      now.getMinutes()
    ).padStart(2,"0") +

    String(
      now.getSeconds()
    ).padStart(2,"0");


  const randomPart =

    Math.random()
      .toString(36)
      .substring(2,7)
      .toUpperCase();


  return datePart +
         "-" +
         randomPart;

}


/* ==================================================
   授業開始
================================================== */

window.startLesson =
async function(){

  const subject =
    document
      .getElementById(
        "lessonSubject"
      )
      .value;


  const unit =
    document
      .getElementById(
        "lessonUnit"
      )
      .value
      .trim();


  if(!subject){

    alert(
      "教科を選択してください。"
    );

    return;

  }


  if(!unit){

    alert(
      "単元名を入力してください。"
    );

    return;

  }


  const lessonId =
    createLessonId();


  try{

    await setDoc(

      doc(
        db,
        "currentLesson",
        "today"
      ),

      {

        lessonId:lessonId,

        subject:subject,

        unit:unit,

        active:true,

        startedAt:
          serverTimestamp(),

        createdAt:
          new Date().toLocaleString(
            "ja-JP"
          )

      }

    );


    hideStartArea();


    alert(
      "授業を開始しました！"
    );


  }catch(error){

    console.error(error);

    alert(
      "授業を開始できませんでした。"
    );

  }

};

   授業終了
================================================== */

window.endLesson =
async function(){

  if(!currentLesson){

    );

    return;

  }


  if(!confirm(
    "現在の授業を終了しますか？"

  try{

      doc(
        db,
        "currentLesson",
        "today"
      ),

      {

        active:false,

        endedAt:
          serverTimestamp()

      }

    );


    alert(

    );


  }catch(error){

    alert(
      "授業を終了できませんでした。"
    );

  }

};


/* ==================================================
   全振り返り取得
================================================== */

async function loadReflections(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "manabi"
        )
      );


    allReflections = [];


    snapshot.forEach(
      item => {

        allReflections.push({

          id:item.id,

          ...item.data()

        });

      }
    );


    updateStats();


    if(
      document
        .getElementById(
          "studentsPage"
        )
        .classList
        .contains("active")
    ){

      displayStudents();

    }


    if(
      document
        .getElementById(
          "comparePage"
        )
        .classList
        .contains("active")
    ){

      setupCompare();

      displayCompare();

    }

  }catch(error){

    console.error(error);

  }

}


/* ==================================================
   現在の授業の振り返りだけ取得
================================================== */

function getCurrentLessonData(){

  if(!currentLesson){

    return [];

  }


  return allReflections.filter(

    item =>

      item.lessonId ===
      currentLesson.lessonId

  );

}


/* ==================================================
   統計
================================================== */

function updateStats(){

  const area =
    document.getElementById(
      "stats"
    );


  const data =
    getCurrentLessonData();


  const students =
    new Set(

      data
        .map(
          item => item.name
        )
        .filter(Boolean)

    );


  const level3 =
    data.filter(

      item =>
        Number(
          item.deepLevel || 0
        ) >= 3

    );


  const deep =
    data.filter(

      item =>
        item.deepReflection &&
        item.deepReflection.trim()

    );


  area.innerHTML = `

    <div class="stat">

      <div class="stat-title">
        👦👧 振り返りを書いた児童
      </div>

      <div class="stat-number">
        ${students.size}
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        ✏️ 振り返り数
      </div>

      <div class="stat-number">
        ${data.length}
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        🌱 深まり振り返り
      </div>

      <div class="stat-number">
        ${deep.length}
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        🌟 レベル3
      </div>

      <div class="stat-number">
        ${level3.length}
      </div>

    </div>

  `;

}

window.openStudents =
function(){

window.displayStudents =
function(){

  const area =
    document.getElementById(
      "studentTableArea"
    );


  const keyword =
    document
      .getElementById(
        "studentSearch"
      )
      .value
      .trim();


  const data =
    getCurrentLessonData();


  const map = {};


  data.forEach(
    item => {

      const name =
        item.name ||
        "名前なし";


      if(!map[name]){

        map[name] = {

          count:0,

          level3:0,

          latest:""

        };

      }


      map[name].count++;


      if(
        Number(
          item.deepLevel || 0
        ) >= 3
      ){

        map[name].level3++;

      }


      if(
        String(
          item.date || ""
        ) >
        String(
          map[name].latest || ""
        )
      ){

        map[name].latest =
          item.date || "";

      }

    }
  );


  let names =
    Object.keys(map)
      .sort(
        (a,b) =>
          a.localeCompare(
            b,
            "ja"
          )
      );


  if(keyword){

    names =
      names.filter(
        name =>
          name.includes(
            keyword
          )
      );

  }


  if(names.length === 0){

    area.innerHTML = `

      <div class="empty">

        この授業の振り返りは
        まだありません。

      </div>

    `;

    return;

  }


  area.innerHTML = `

    <table class="student-table">

      <thead>

        <tr>

          <th>児童名</th>

          <th>振り返り</th>

          <th>🌱 深まり</th>

          <th>🌟 レベル3</th>

          <th>最終提出</th>

        </tr>

      </thead>


      <tbody>

        ${names.map(
          name => {

            const studentData =
              data.filter(
                item =>
                  item.name === name
              );


            const deepCount =
              studentData.filter(
                item =>
                  item.deepReflection &&
                  item.deepReflection.trim()
              ).length;


            return `

              <tr
                class="student-row"
                onclick=
                "openStudent('${escapeJs(name)}')">

                <td>

                  <div
                    class="student-name">

                    👤
                    ${escapeHtml(name)}

                  </div>

                </td>


                <td class="count">

                  ${map[name].count}件

                </td>


                <td>

                  ${deepCount}件

                </td>


                <td
                  class=
                  "${
                    map[name].level3 > 0
                    ? "level3"
                    : "no-data"
                  }">

                  ${map[name].level3}件

                </td>


                <td>

                  ${escapeHtml(
                    map[name].latest ||
                    "-"
                  )}

                </td>

              </tr>

            `;

          }
        ).join("")}

      </tbody>

    </table>

  `;

};

/* ==================================================
   振り返りカード
================================================== */

function createReflectionCard(item){

  const level =
    Number(
      item.deepLevel || 1
    );


  let levelText =
    "レベル1";


  if(level === 2){

    levelText =
      "レベル2";

  }


  if(level >= 3){

    levelText =
      "🌟 レベル3";

  }


  return `

    <div class="reflection-card">


      <div class="reflection-header">

        <div>

          <span class="subject-badge">

            ${escapeHtml(
              item.subject || ""
            )}

          </span>

          <strong>

            ${escapeHtml(
              item.unit || ""
            )}

          </strong>

        </div>


        <div class="date">

          ${escapeHtml(
            item.date || ""
          )}

        </div>

      </div>


      <div class="study-box">

        <strong>
          ✏️ 今日の学び
        </strong>

        <br><br>

        ${escapeHtml(
          item.study || ""
        )}

      </div>


      ${
        item.aiQuestion
        ? `

          <div class="ai-box">

            <strong>
              🤖 AIからの問い
            </strong>

            <br><br>

            ${escapeHtml(
              item.aiQuestion
            )}

          </div>

        `
        : ""
      }


      <div
        class="
          level-badge
          ${
            level >= 3
              ? "level3-badge"
              : level === 2
              ? "level2"
              : ""
          }
        ">

        🌱
        振り返り
        ${levelText}

      </div>


      ${
        item.deepReflection
        ? `

          <div class="deep-box">

            <strong>
              🌱 深まり振り返り
            </strong>

            <br><br>

            ${escapeHtml(
              item.deepReflection
            )}

          </div>

        `
        : `

          <div class="no-deep">

            🌱
            まだ「深まり振り返り」は
            書かれていません。

          </div>

        `
      }

    </div>

  `;

}

/* ==================================================
   クラス比較表示
================================================== */

window.displayCompare =
function(){

  const area =
    document.getElementById(
      "compareTableArea"
    );


  if(!currentLesson){

    area.innerHTML = `

      <div class="empty">

        現在の授業がありません。

      </div>

    `;

    return;

  }


  const currentData =
    getCurrentLessonData();


  /*
    児童名は「これまでに一度でも
    振り返りを書いた児童」を基準にする。

    そのため、現在の授業にまだ
    提出していない児童も表示できる。
  */

  const knownNames =

    [...new Set(

      allReflections

        .map(
          item =>
            item.name
        )

        .filter(Boolean)

    )];


  const currentNames =

    currentData

      .map(
        item =>
          item.name
      )

      .filter(Boolean);


  const names =

    [...new Set(

      [
        ...knownNames,
        ...currentNames
      ]

    )]
    .sort(
      (a,b)=>
        a.localeCompare(
          b,
          "ja"
        )
    );


  const keyword =
    document
      .getElementById(
        "compareSearch"
      )
      .value
      .trim();


  const levelFilter =
    document
      .getElementById(
        "compareLevelFilter"
      )
      .value;


  let rows = [];


  names.forEach(
    name => {

      if(
        keyword &&
        !name.includes(
          keyword
        )
      ){

        return;

      }


      const reflections =
        currentData.filter(
          item =>
            item.name === name
        );


      /*
        同じ児童が同じ授業で
        複数回保存した場合は
        最新のものを採用
      */

      reflections.sort(
        (a,b) =>
          String(
            b.date || ""
          ).localeCompare(
            String(
              a.date || ""
            )
          )
      );


      const latest =
        reflections[0] || null;


      const level =
        latest
          ? Number(
              latest.deepLevel || 1
            )
          : 0;


      if(
        levelFilter === "0" &&
        latest
      ){

        return;

      }


      if(
        levelFilter &&
        levelFilter !== "0" &&
        level !==
          Number(levelFilter)
      ){

        return;

      }


      rows.push({
        name:name,
        item:latest,
        level:level
      });

    }
  );


  if(rows.length === 0){

    area.innerHTML = `

      <div class="empty">

        条件に合う児童はいません。

      </div>

    `;

    return;

  }


  area.innerHTML = `

    <table class="compare-table">

      <thead>

        <tr>

          <th>
            👤 児童
          </th>

          <th>
            📘 教科・単元
          </th>

          <th>
            ✏️ 今日の学び
          </th>

          <th>
            🤖 AIからの問い
          </th>

          <th>
            🌱 深まり振り返り
          </th>

          <th>
            🌟 レベル
          </th>

        </tr>

      </thead>


      <tbody>

        ${rows.map(
          row => {

            const item =
              row.item;


            if(!item){

              return `

                <tr
                  class="not-submit-row">

                  <td>

                    <div
                      class="compare-name">

                      👤
                      ${escapeHtml(
                        row.name
                      )}

                    </div>

                  </td>


                  <td
                    class="compare-cell
                           compare-empty">

                    —

                  </td>


                  <td
                    class="compare-cell
                           compare-empty">

                    <span class="not-submit">

                      未提出

                    </span>

                  </td>


                  <td
                    class="compare-cell
                           compare-empty">

                    —

                  </td>


                  <td
                    class="compare-cell
                           compare-empty">

                    —

                  </td>


                  <td
                    class="compare-level">

                    <span class="not-submit">

                      未提出

                    </span>

                  </td>

                </tr>

              `;

            }


            const levelClass =
              row.level >= 3
              ? "level3-cell"
              : row.level === 2
              ? "level2-cell"
              : "level1-cell";


            const levelText =
              row.level >= 3
              ? "🌟 レベル3"
              : row.level === 2
              ? "🌱 レベル2"
              : "🌱 レベル1";


            return `

              <tr>

                <td>

                  <div
                    class="compare-name">

                    👤
                    ${escapeHtml(
                      row.name
                    )}

                  </div>

                  <div
                    style="
                      margin-top:5px;
                      color:#888;
                      font-size:12px;
                    ">

                    ${escapeHtml(
                      item.date || ""
                    )}

                  </div>

                </td>


                <td class="compare-cell">

                  <strong>

                    ${escapeHtml(
                      item.subject || ""
                    )}

                  </strong>

                  <br>

                  ${escapeHtml(
                    item.unit || ""
                  )}

                </td>


                <td
                  class="
                    compare-cell
                  ">

                  ${escapeHtml(
                    item.study ||
                    "未入力"
                  )}

                </td>


                <td
                  class="
                    compare-cell
                    compare-ai
                  ">

                  ${escapeHtml(
                    item.aiQuestion ||
                    "—"
                  )}

                </td>


                <td
                  class="
                    compare-cell
                    compare-deep
                  ">

                  ${
                    item.deepReflection
                    ? escapeHtml(
                        item.deepReflection
                      )
                    : "まだ書かれていません"
                  }

                </td>


                <td
                  class="
                    compare-level
                    ${levelClass}
                  ">

                  ${levelText}

                </td>

              </tr>

            `;

          }
        ).join("")}

      </tbody>

    </table>

  `;

};

/* ==================================================
   HTML安全化
================================================== */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==================================================
   JavaScript文字列安全化
================================================== */

function escapeJs(value){

  return String(value)

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    );

}
