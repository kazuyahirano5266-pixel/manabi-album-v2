<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>学びアルバム｜先生ページ</title>

<style>

*{
box-sizing:border-box;
}

body{

font-family:sans-serif;

background:#f0f8ff;

margin:0;

padding:20px;

color:#333;

}

.box{

background:white;

padding:25px;

border-radius:25px;

max-width:1200px;

margin:0 auto 20px;

}

h1{

text-align:center;

}

h2{

margin-top:10px;

}

button{

padding:13px 24px;

border:none;

border-radius:20px;

background:#2b7a78;

color:white;

font-size:17px;

margin:7px;

cursor:pointer;

}

button:hover{

opacity:.85;

}

input,
select,
textarea{

width:90%;

padding:12px;

font-size:18px;

margin:8px;

border:1px solid #ccc;

border-radius:10px;

}

textarea{

min-height:140px;

line-height:1.7;

}

.hidden{

display:none;

}

.login-box{

max-width:500px;

margin:60px auto;

text-align:center;

}

.grid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:20px;

margin-top:20px;

}

.reflection-grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:20px;

margin-top:20px;

}

.card{

background:white;

padding:20px;

border-radius:20px;

box-shadow:
0 3px 8px #ccc;

}

.section-title{

background:#eaf6ff;

padding:15px;

border-radius:15px;

margin-top:20px;

}

.lesson-box{

background:#e8f7e8;

padding:25px;

border-radius:20px;

border:2px solid #a9d9a9;

margin-top:20px;

}

.current-box{

background:#eaf6ff;

padding:25px;

border-radius:20px;

margin-top:20px;

text-align:center;

}

.start-button{

background:#2b7a78;

font-size:20px;

padding:18px 30px;

}

.stop-button{

background:#c44;

}

.back-button{

background:#777;

}

.ai-box{

background:#fff4d6;

padding:20px;

border-radius:20px;

margin-top:20px;

border:2px solid #f0d98b;

}

.praise-box{

background:#fff4b8;

padding:20px;

border-radius:20px;

margin:15px 0;

line-height:1.8;

}

.study-box{

background:#f5f5f5;

padding:18px;

border-radius:15px;

margin:10px 0;

line-height:1.8;

white-space:pre-wrap;

word-break:break-word;

}

.deep-box{

background:#f0fff0;

padding:18px;

border-radius:15px;

margin:10px 0;

line-height:1.8;

white-space:pre-wrap;

word-break:break-word;

}

.level-box{

background:#eaf6ff;

padding:15px;

border-radius:15px;

margin:10px 0;

line-height:1.8;

}

.level1{

background:#f5f5f5;

}

.level2{

background:#eaffea;

}

.level3{

background:#fff4b8;

}

.date{

font-size:14px;

color:#777;

}

.message{

font-weight:bold;

font-size:18px;

padding:15px;

}

.empty{

padding:30px;

background:#f8f8f8;

border-radius:20px;

text-align:center;

margin-top:20px;

}

.loading{

padding:30px;

text-align:center;

font-size:20px;

}

.count{

font-size:18px;

font-weight:bold;

}

.logout{

background:#555;

}

@media(max-width:900px){

.grid{

grid-template-columns:
repeat(2,1fr);

}

}

@media(max-width:650px){

body{

padding:10px;

}

.box{

padding:15px;

}

.grid,
.reflection-grid{

grid-template-columns:1fr;

}

input,
select,
textarea{

width:95%;

}

}

</style>

</head>

<body>


<!-- ==================================================
先生ログイン
================================================== -->

<div
class="box login-box"
id="teacherLogin">

<h1>📚 学びアルバム</h1>

<h2>👩‍🏫 先生ページ</h2>

<p>🔑 パスワード</p>

<input
type="password"
id="teacherPassword"
placeholder="パスワードを入力"
inputmode="numeric">

<p
id="teacherMessage"
style="color:#d33;">
</p>

<button onclick="teacherLogin()">

先生ページに入る

</button>

</div>


<!-- ==================================================
先生メイン
================================================== -->

<div
class="box hidden"
id="teacherPage">

<h1>👩‍🏫 先生ページ</h1>


<!-- ==================================================
現在の授業
================================================== -->

<div class="lesson-box">

<h2>📚 今日の授業を開始</h2>

<p>

ここで設定した授業が
児童の画面に自動表示されます。

</p>


<h3>📚 教科</h3>

<select id="teacherSubject">

<option>国語</option>
<option>算数</option>
<option>生活</option>
<option>理科</option>
<option>社会</option>
<option>総合</option>
<option>道徳</option>
<option>体育</option>

</select>


<h3>📖 単元名</h3>

<input
id="teacherUnit"
placeholder="例：小数のわり算">


<br>

<button
class="start-button"
onclick="startLesson()">

▶️ この授業を開始する

</button>

</div>


<div
class="current-box"
id="currentLessonBox">

<h2>📢 現在の授業</h2>

<div id="currentLessonText">

現在、授業は設定されていません。

</div>

</div>


<div
style="text-align:center;">

<button
class="stop-button"
onclick="stopLesson()">

⏹️ 授業を終了する

</button>

</div>


<p
id="teacherStatus"
class="message">
</p>


<!-- ==================================================
児童一覧
================================================== -->

<div
id="studentArea">

<h2 class="section-title">

👦 児童一覧

</h2>

<div
id="studentList"
class="loading">

📚 振り返りを読み込んでいます...

</div>

</div>


<!-- ==================================================
詳細表示
================================================== -->

<div
id="detailArea"
class="hidden">

<button
class="back-button"
onclick="showStudents()">

← 児童一覧へ

</button>

<div id="detailContent"></div>

</div>


</div>


<script type="module">


/* ==================================================
Firebase
================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
query,
where,
getDocs,
doc,
setDoc,
onSnapshot

}

from

"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain:
"manabi-album-v2.firebaseapp.com",

projectId:
"manabi-album-v2",

storageBucket:
"manabi-album-v2.firebasestorage.app",

messagingSenderId:
"226258471812",

appId:
"1:258258471812:web:15230ba15e7e0bd7d86bd1"

};


/*
※ appIdが現在のFirebase設定と違う場合は、
児童側index.htmlと同じfirebaseConfigを使ってください。
*/

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


/* ==================================================
設定
================================================== */

const TEACHER_PASSWORD="9999";

let allData=[];

let selectedStudent="";

let currentLesson=null;


/* ==================================================
安全表示
================================================== */

function escapeHTML(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* ==================================================
日付
================================================== */

function formatDate(value){

if(!value){

return "日付なし";

}

try{

if(value.toDate){

return value
.toDate()
.toLocaleString("ja-JP");

}

return new Date(value)
.toLocaleString("ja-JP");

}catch{

return "日付なし";

}

}


/* ==================================================
先生ログイン
================================================== */

window.teacherLogin=function(){

const password=

document.getElementById(
"teacherPassword"
).value.trim();


if(password!==TEACHER_PASSWORD){

document.getElementById(
"teacherMessage"
).innerText=
"🔑 パスワードが違います。";

return;

}


localStorage.setItem(
"manabiTeacherLogin",
"true"
);


showTeacherPage();

};


/* ==================================================
先生ページ表示
================================================== */

function showTeacherPage(){

document.getElementById(
"teacherLogin"
).style.display="none";


document.getElementById(
"teacherPage"
).style.display="block";


watchLesson();

loadStudents();

}


/* ==================================================
授業ID自動作成
================================================== */

function createLessonId(){

const now=new Date();

const year=
now.getFullYear();

const month=
String(now.getMonth()+1)
.padStart(2,"0");

const day=
String(now.getDate())
.padStart(2,"0");

const hour=
String(now.getHours())
.padStart(2,"0");

const minute=
String(now.getMinutes())
.padStart(2,"0");

const second=
String(now.getSeconds())
.padStart(2,"0");

const random=
Math.random()
.toString(36)
.substring(2,8);


return (

`${year}${month}${day}_`+
`${hour}${minute}${second}_`+
`${random}`

);

}


/* ==================================================
授業開始
================================================== */

window.startLesson=async function(){

const subject=
document.getElementById(
"teacherSubject"
).value;

const unit=
document.getElementById(
"teacherUnit"
).value.trim();


if(!unit){

alert(
"単元名を入力してください。"
);

return;

}


const lessonId=
createLessonId();


try{

await setDoc(

doc(
db,
"currentLesson",
"today"
),

{

lessonId:
lessonId,

subject:
subject,

unit:
unit,

active:
true,

startedAt:
new Date()

}

);


document.getElementById(
"teacherStatus"
).innerText=

"🟢 授業を開始しました！";


}catch(error){

console.error(error);

alert(
"授業を開始できませんでした。"
);

}

};


/* ==================================================
授業終了
================================================== */

window.stopLesson=async function(){

try{

await setDoc(

doc(
db,
"currentLesson",
"today"
),

{

lessonId:"",
subject:"",
unit:"",
active:false,
endedAt:new Date()

}

);


document.getElementById(
"teacherStatus"
).innerText=

"⏹️ 授業を終了しました。";


}catch(error){

console.error(error);

alert(
"授業を終了できませんでした。"
);

}

};


/* ==================================================
現在の授業監視
================================================== */

function watchLesson(){

onSnapshot(

doc(
db,
"currentLesson",
"today"
),

snapshot=>{

if(!snapshot.exists()){

currentLesson=null;

showNoLesson();

return;

}


const data=
snapshot.data();


if(data.active!==true){

currentLesson=null;

showNoLesson();

return;

}


currentLesson=data;

showCurrentLesson();

}

);

}


/* ==================================================
現在の授業表示
================================================== */

function showCurrentLesson(){

if(!currentLesson){

return;

}


document.getElementById(
"currentLessonText"
).innerHTML=

`

<h2>
📚 ${escapeHTML(
currentLesson.subject
)}
</h2>

<h3>
📖 ${escapeHTML(
currentLesson.unit
)}
</h3>

<p>
🟢 現在この授業が
児童に表示されています。
</p>

`;

}


/* ==================================================
授業なし
================================================== */

function showNoLesson(){

document.getElementById(
"currentLessonText"
).innerHTML=

`

<p>
現在、授業は設定されていません。
</p>

`;

}


/* ==================================================
児童データ読み込み
================================================== */

async function loadStudents(){

try{

const snapshot=
await getDocs(
collection(db,"manabi")
);


allData=[];


snapshot.forEach(d=>{

allData.push({

id:d.id,

...d.data()

});

});


showStudents();


}catch(error){

console.error(error);

document.getElementById(
"studentList"
).innerHTML=

`

<div class="empty">

😢 振り返りを
読み込めませんでした。

<br><br>

<button onclick="loadStudents()">

🔄 もう一度読み込む

</button>

</div>

`;

}

}


/* ==================================================
児童一覧
================================================== */

function showStudents(){

document.getElementById(
"studentArea"
).style.display="block";


document.getElementById(
"detailArea"
).style.display="none";


const students=[];


allData.forEach(data=>{

const number=
String(
data.studentNumber ?? ""
);


if(
number &&
!students.includes(number)
){

students.push(number);

}

});


students.sort(
(a,b)=>
Number(a)-Number(b)
);


let html="";


if(students.length===0){

html=

`

<div class="empty">

📭 まだ振り返りはありません。

</div>

`;

}else{

html=

`<div class="grid">`;


students.forEach(number=>{

const count=
allData.filter(
data=>
String(
data.studentNumber
)===number
).length;


html+=

`

<div class="card">

<h2>
👦 ${escapeHTML(number)}番
</h2>

<p class="count">

📝 ${count}件の振り返り

</p>

<button
onclick="openStudent(${JSON.stringify(number)})">

📖 この児童を見る

</button>

</div>

`;

});


html+=`</div>`;

}


document.getElementById(
"studentList"
).innerHTML=html;

}


/* ==================================================
児童を開く
================================================== */

window.openStudent=function(number){

selectedStudent=
String(number);


document.getElementById(
"studentArea"
).style.display="none";


document.getElementById(
"detailArea"
).style.display="block";


showStudentSubjects();

}


/* ==================================================
児童：教科
================================================== */

function showStudentSubjects(){

const data=
allData.filter(

item=>
String(
item.studentNumber
)===selectedStudent

);


let subjects=[];


data.forEach(item=>{

if(
item.subject &&
!subjects.includes(
item.subject
)
){

subjects.push(
item.subject
);

}

});


let html=

`

<button
class="back-button"
onclick="showStudents()">

← 児童一覧

</button>

<h2 class="section-title">

👦 ${escapeHTML(
selectedStudent
)}番

</h2>

<h3>
📚 教科を選んでください
</h3>

<div class="grid">

`;


subjects.forEach(subject=>{

const count=
data.filter(
item=>
item.subject===subject
).length;


html+=

`

<div class="card">

<h2>
📚 ${escapeHTML(subject)}
</h2>

<p>
${count}件の振り返り
</p>

<button
onclick="openStudentSubject(
${JSON.stringify(subject)}
)">

見る

</button>

</div>

`;

});


html+=`</div>`;


if(subjects.length===0){

html+=

`

<div class="empty">

まだ振り返りがありません。

</div>

`;

}


document.getElementById(
"detailContent"
).innerHTML=html;

}


/* ==================================================
児童：単元
================================================== */

window.openStudentSubject=function(subject){

const data=
allData.filter(

item=>

String(
item.studentNumber
)===selectedStudent &&

item.subject===subject

);


const units=[];


data.forEach(item=>{

const unit=
item.unit || "単元名なし";


if(!units.includes(unit)){

units.push(unit);

}

});


let html=

`

<button
class="back-button"
onclick="showStudentSubjects()">

← 教科一覧

</button>

<h2 class="section-title">

📚 ${escapeHTML(subject)}

</h2>

<h3>
📖 単元を選んでください
</h3>

<div class="grid">

`;


units.forEach(unit=>{

const count=
data.filter(
item=>
(item.unit||"単元名なし")===unit
).length;


html+=

`

<div class="card">

<h2>
📖 ${escapeHTML(unit)}
</h2>

<p>
${count}件
</p>

<button
onclick="openStudentUnit(
${JSON.stringify(subject)},
${JSON.stringify(unit)}
)">

見る

</button>

</div>

`;

});


html+=`</div>`;


document.getElementById(
"detailContent"
).innerHTML=html;

}


/* ==================================================
教科一覧へ
================================================== */

window.showStudentSubjects=function(){

showStudentSubjects();

};


/* ==================================================
児童：振り返り一覧
================================================== */

window.openStudentUnit=function(
subject,
unit
){

const data=
allData.filter(

item=>

String(
item.studentNumber
)===selectedStudent &&

item.subject===subject &&

(item.unit||"単元名なし")===unit

);


let html=

`

<button
class="back-button"
onclick="openStudentSubject(
${JSON.stringify(subject)}
)">

← 単元一覧

</button>

<h2 class="section-title">

👦 ${escapeHTML(
selectedStudent
)}番

<br>

📚 ${escapeHTML(subject)}

<br>

📖 ${escapeHTML(unit)}

</h2>

`;


data.sort((a,b)=>{

const da=
a.date?.toDate
?
a.date.toDate()
:
new Date(a.date||0);

const db=
b.date?.toDate
?
b.date.toDate()
:
new Date(b.date||0);

return db-da;

});


data.forEach(item=>{

const level=
Number(
item.reflectionLevel
||1
);


html+=

`

<div class="card">

<p class="date">

📅 ${formatDate(item.date)}

</p>


${getLevelHTML(level)}


<div class="study-box">

<b>
📝 最初の振り返り
</b>

<br><br>

${escapeHTML(
item.study
)}

</div>


<div class="ai-box">

<b>
🤖 AIからの問い
</b>

<br><br>

${escapeHTML(
item.aiQuestion
||
"まだありません"
)}

</div>


<div class="deep-box">

<b>
✏️ 最終的な振り返り
</b>

<br><br>

${escapeHTML(
item.deepReflection
||
"まだ入力されていません"
)}

</div>


<button
onclick="createAIComment(
${JSON.stringify(item.id)}
)">

🤖 この振り返りからAI所見を作る

</button>


<div
id="aiComment-${escapeHTML(item.id)}">

</div>


</div>

`;

});


document.getElementById(
"detailContent"
).innerHTML=html;

}


/* ==================================================
レベル表示
================================================== */

function getLevelHTML(level){

if(level===3){

return `

<div class="level-box level3">

🌳 <strong>レベル3</strong>

<br><br>

友達の考えや資料などをもとに、
自分の考えを深めています。

</div>

`;

}


if(level===2){

return `

<div class="level-box level2">

🌿 <strong>レベル2</strong>

<br><br>

分かったことや気付いたことを
具体的に書いています。

</div>

`;

}


return `

<div class="level-box level1">

🌱 <strong>レベル1</strong>

<br><br>

自分の気持ちや感じたことを
書いています。

</div>

`;

}


/* ==================================================
AI所見作成
※外部AI APIは使用せず、
振り返り内容から所見候補を作成
================================================== */

window.createAIComment=function(id){

const item=
allData.find(
data=>data.id===id
);


if(!item){

return;

}


const target=
document.getElementById(
"aiComment-"+id
);


const study=
item.study || "";

const deep=
item.deepReflection || "";

const level=
Number(
item.reflectionLevel || 1
);


let comment="";


if(level===3){

comment=

`${item.subject}の学習では、${study.substring(0,70)}。友達の考えや学習したことをもとに自分の考えを深め、具体的に振り返ることができました。`;

}

else if(level===2){

comment=

`${item.subject}の学習では、${study.substring(0,70)}。分かったことや気付いたことを自分の言葉で具体的に振り返ることができました。`;

}

else{

comment=

`${item.subject}の学習では、${study.substring(0,70)}。自分の感じたことや学んだことを振り返ることができました。`;

}


if(deep){

comment+=

` 最後には「${deep.substring(0,50)}」と考えをさらに深めることができました。`;

}


target.innerHTML=

`

<div class="ai-box">

<h3>
🤖 AI所見案
</h3>

<textarea
id="commentText-${escapeHTML(id)}"
>${escapeHTML(comment)}</textarea>

<br>

<button
onclick="copyComment(
${JSON.stringify(id)}
)">

📋 所見をコピー

</button>

</div>

`;

};


/* ==================================================
所見コピー
================================================== */

window.copyComment=function(id){

const textarea=
document.getElementById(
"commentText-"+id
);


if(!textarea){

return;

}


textarea.select();


navigator.clipboard.writeText(
textarea.value
)
.then(()=>{

alert(
"📋 所見をコピーしました！"
);

})
.catch(()=>{

alert(
"コピーできませんでした。"
);

});

};


/* ==================================================
起動
================================================== */

if(
localStorage.getItem(
"manabiTeacherLogin"
)==="true"
){

showTeacherPage();

}

console.log(
"👩‍🏫 学びアルバム 先生ページ 起動"
);

</script>

</body>

</html>
