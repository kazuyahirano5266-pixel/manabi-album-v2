<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>学びアルバム 先生ページ</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:sans-serif;
background:#f0f8ff;
margin:0;
padding:20px;
color:#333;
}

.box{
background:white;
padding:25px;
border-radius:25px;
max-width:1300px;
margin:0 auto 20px;
}

h1{
text-align:center;
}

button{
padding:12px 22px;
border:none;
border-radius:20px;
background:#2b7a78;
color:white;
font-size:16px;
margin:6px;
cursor:pointer;
}

button:hover{
opacity:.85;
}

input,
select,
textarea{
padding:12px;
font-size:17px;
border:1px solid #ccc;
border-radius:10px;
margin:6px;
}

select{
min-width:180px;
}

.menu{
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
margin:20px 0;
}

.menu button{
font-size:19px;
padding:18px 25px;
}

.hidden{
display:none;
}

.lesson-box{
background:#eef9ff;
padding:20px;
border-radius:20px;
margin:20px 0;
border:2px solid #d4edf7;
}

.lesson-id{
background:#f4f4f4;
padding:12px;
border-radius:10px;
font-size:14px;
word-break:break-all;
}

.status-box{
background:#eaffea;
padding:25px;
border-radius:25px;
text-align:center;
margin:20px 0;
}

.status-number{
font-size:48px;
font-weight:bold;
color:#2b7a78;
}

.status-sub{
font-size:20px;
}

.progress{
height:30px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin:15px 0;
}

.progress-bar{
height:100%;
background:#2b7a78;
width:0%;
transition:.4s;
}

.number-grid{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:8px;
margin-top:20px;
}

.number-card{
padding:12px 5px;
border-radius:12px;
text-align:center;
font-weight:bold;
}

.submitted{
background:#d9f5df;
border:2px solid #6fcf7a;
}

.not-submitted{
background:#fff0f0;
border:2px solid #f1a5a5;
}

.card{
background:white;
padding:18px;
border-radius:20px;
box-shadow:0 3px 8px #ccc;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:20px;
}

.reflection-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.study-box{
background:#f5f5f5;
padding:15px;
border-radius:15px;
line-height:1.8;
white-space:pre-wrap;
}

.deep-box{
background:#f0fff0;
padding:15px;
border-radius:15px;
line-height:1.8;
white-space:pre-wrap;
}

.advice-box{
background:#eaf6ff;
padding:15px;
border-radius:15px;
line-height:1.8;
}

.level3{
background:#fff4b8;
}

.level2{
background:#eaffea;
}

.level1{
background:#f5f5f5;
}

.level-box{
padding:15px;
border-radius:15px;
margin:10px 0;
line-height:1.7;
}

.section-title{
background:#eaf6ff;
padding:15px;
border-radius:15px;
margin-top:20px;
}

.empty{
padding:30px;
background:#f8f8f8;
border-radius:20px;
text-align:center;
}

.loading{
padding:30px;
text-align:center;
font-size:20px;
}

.date{
font-size:14px;
color:#777;
}

.logout{
background:#555;
}

@media(max-width:900px){

.grid{
grid-template-columns:repeat(2,1fr);
}

.number-grid{
grid-template-columns:repeat(6,1fr);
}

}

@media(max-width:650px){

body{
padding:10px;
}

.box{
padding:15px;
}

.grid,
.reflection-grid{
grid-template-columns:1fr;
}

.number-grid{
grid-template-columns:repeat(5,1fr);
}

}

</style>

</head>


<body>


<!-- =========================================
先生ページ
========================================= -->

<div class="box">

<h1>👩‍🏫 学びアルバム・先生ページ</h1>

<div class="menu">

<button onclick="showLessonSelect()">
📚 今日の授業
</button>

<button onclick="showAllStudents()">
👦 児童一覧
</button>

<button onclick="loadTodayAll()">
📊 今日の提出状況
</button>

<button class="logout"
onclick="location.reload()">
🚪 更新
</button>

</div>

</div>


<!-- =========================================
授業選択
========================================= -->

<div class="box" id="lessonPage">

<h2 class="section-title">
📚 今日の授業を選択
</h2>

<p>
先生が「教科」と「単元名」を選ぶだけです。
</p>

<select id="teacherSubject"
onchange="updateTeacherLessonId()">

<option>国語</option>
<option>算数</option>
<option>生活</option>
<option>理科</option>
<option>社会</option>
<option>総合</option>
<option>道徳</option>
<option>体育</option>

</select>

<input
id="teacherUnit"
placeholder="今日の単元名"
oninput="updateTeacherLessonId()">

<div class="lesson-box">

<h3>🔐 授業ID</h3>

<div
class="lesson-id"
id="teacherLessonId">

教科と単元を選ぶと
授業IDが自動作成されます。

</div>

</div>

<button onclick="loadLessonStatus()">
🔄 この授業の提出状況を見る
</button>

<div id="statusArea"></div>

</div>


<!-- =========================================
児童一覧
========================================= -->

<div class="box hidden" id="studentPage">

<h2 class="section-title">
👦 児童一覧
</h2>

<div id="studentList"></div>

</div>


<!-- =========================================
児童詳細
========================================= -->

<div class="box hidden" id="detailPage">

<button onclick="showAllStudents()">
← 児童一覧
</button>

<div id="studentDetail"></div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
where
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


/* =========================================
Firebase
========================================= */

const firebaseConfig={

apiKey:"AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain:"manabi-album-v2.firebaseapp.com",

projectId:"manabi-album-v2",

storageBucket:"manabi-album-v2.firebasestorage.app",

messagingSenderId:"226258471812",

appId:"1:226258471812:web:15230ba15e7e0bd7d86bd1"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


/* =========================================
授業ID自動作成
========================================= */

function getTodayKey(){

const d=new Date();

return d.getFullYear()+
String(d.getMonth()+1).padStart(2,"0")+
String(d.getDate()).padStart(2,"0");

}


function createLessonId(subject,unit){

return getTodayKey()+"_"+
String(subject||"").trim().replace(/\s+/g,"")+
"_"+String(unit||"").trim().replace(/\s+/g,"");

}


window.updateTeacherLessonId=function(){

const subject=
document.getElementById("teacherSubject").value;

const unit=
document.getElementById("teacherUnit").value.trim();

const area=
document.getElementById("teacherLessonId");

if(!unit){

area.innerHTML=
"教科と単元名を入力してください。";

return;

}

const lessonId=
createLessonId(subject,unit);

area.innerHTML=
"🔐 自動作成された授業ID<br><br>"+
"<strong>"+escapeHTML(lessonId)+"</strong>";

};


/* =========================================
画面切替
========================================= */

function hidePages(){

document.getElementById("lessonPage")
.classList.add("hidden");

document.getElementById("studentPage")
.classList.add("hidden");

document.getElementById("detailPage")
.classList.add("hidden");

}


window.showLessonSelect=function(){

hidePages();

document.getElementById("lessonPage")
.classList.remove("hidden");

};


window.showAllStudents=function(){

hidePages();

document.getElementById("studentPage")
.classList.remove("hidden");

loadAllStudents();

};


/* =========================================
安全表示
========================================= */

function escapeHTML(value){

if(value===undefined||value===null)
return "";

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
深まり判定
========================================= */

function judgeReflectionLevel(text){

const study=(text||"").trim();

if(!study)return 1;

const length=study.length;

const level3=[
"友達","友だち","教科書","資料",
"話し合い","意見","比べ","くらべ",
"違い","ちがい","結果","理由",
"なぜ","どうして","根拠","参考"
];

let count=0;

level3.forEach(w=>{
if(study.includes(w))count++;
});

if(length>=35&&count>=1)
return 3;

if(
length>=25||
study.includes("分かった")||
study.includes("わかった")||
study.includes("気付")||
study.includes("気づ")||
study.includes("工夫")||
study.includes("方法")
)
return 2;

return 1;

}


function getLevelHTML(level){

if(level===3){

return `
<div class="level-box level3">
🌳 <strong>レベル3</strong><br>
いろいろな考えや資料などをもとに、
自分の考えを深めています。
</div>
`;

}

if(level===2){

return `
<div class="level-box level2">
🌿 <strong>レベル2</strong><br>
分かったことや気付いたことを
具体的に書けています。
</div>
`;

}

return `
<div class="level-box level1">
🌱 <strong>レベル1</strong><br>
自分の気持ちや感じたことを
書けています。
</div>
`;

}


/* =========================================
今日の授業・提出状況
========================================= */

window.loadLessonStatus=async function(){

const subject=
document.getElementById("teacherSubject").value;

const unit=
document.getElementById("teacherUnit")
.value.trim();

if(!unit){

alert("単元名を入力してください。");

return;

}

const lessonId=
createLessonId(subject,unit);

document.getElementById("statusArea").innerHTML=
'<div class="loading">📊 提出状況を確認しています...</div>';

try{

const q=query(
collection(db,"manabi"),
where("lessonId","==",lessonId)
);

const snapshot=await getDocs(q);

const submittedNumbers=[];

snapshot.forEach(d=>{

const data=d.data();

const number=
Number(data.studentNumber);

if(
number>=1&&
number<=30&&
!submittedNumbers.includes(number)
){

submittedNumbers.push(number);

}

});

submittedNumbers.sort((a,b)=>a-b);

const submitted=submittedNumbers.length;

const notSubmitted=30-submitted;

const percent=
Math.round((submitted/30)*100);

let html=`

<div class="status-box">

<div class="status-sub">
📚 今日の授業の提出状況
</div>

<div class="status-number">
30人中 ${submitted}人
</div>

<div class="status-sub">
提出済み
</div>

<div class="progress">
<div
class="progress-bar"
style="width:${percent}%">
</div>
</div>

<p>
提出率 ${percent}%　
・　
未提出 ${notSubmitted}人
</p>

</div>

<div class="lesson-box">

<h3>📌 授業情報</h3>

<p>
<strong>教科：</strong>
${escapeHTML(subject)}
</p>

<p>
<strong>単元：</strong>
${escapeHTML(unit)}
</p>

<p class="lesson-id">
授業ID：${escapeHTML(lessonId)}
</p>

</div>

<h2 class="section-title">
👦 出席番号別の提出状況
</h2>

<div class="number-grid">
`;

for(let i=1;i<=30;i++){

const isSubmitted=
submittedNumbers.includes(i);

html+=`

<div class="
number-card
${isSubmitted?
"submitted":
"not-submitted"}
">

${isSubmitted?"✅":"❌"}

<br>

${i}番

<br>

<small>
${isSubmitted?
"提出済み":
"未提出"}
</small>

</div>

`;

}

html+=`
</div>

<div class="lesson-box">

<h3>📝 未提出の児童</h3>
`;

if(notSubmitted===0){

html+=`
<p>
🎉 30人全員が提出しています！
</p>
`;

}else{

html+=`
<p>
${Array.from(
{length:30},
(_,i)=>i+1
)
.filter(i=>!submittedNumbers.includes(i))
.map(i=>i+"番")
.join("　")}
</p>
`;

}

html+=`</div>`;

document.getElementById("statusArea").innerHTML=html;

}catch(error){

console.error(error);

document.getElementById("statusArea").innerHTML=
`
<div class="empty">
提出状況の読み込みに失敗しました。
<br><br>
<button onclick="loadLessonStatus()">
🔄 もう一度確認
</button>
</div>
`;

}

};


/* =========================================
今日の全体提出状況
========================================= */

window.loadTodayAll=async function(){

hidePages();

document.getElementById("lessonPage")
.classList.remove("hidden");

document.getElementById("statusArea").innerHTML=
'<div class="loading">📊 今日の提出状況を集計しています...</div>';

try{

const snapshot=
await getDocs(collection(db,"manabi"));

const today=getTodayKey();

const lessons={};

snapshot.forEach(d=>{

const data=d.data();

if(!data.lessonId)return;

const id=String(data.lessonId);

if(!id.startsWith(today))
return;

if(!lessons[id]){

lessons[id]={
subject:data.subject||"",
unit:data.unit||"",
students:[]
};

}

const number=Number(data.studentNumber);

if(
number>=1&&
number<=30&&
!lessons[id].students.includes(number)
){

lessons[id].students.push(number);

}

});

let html=`
<h2 class="section-title">
📊 今日の授業一覧
</h2>

<div class="grid">
`;

Object.entries(lessons).forEach(
([lessonId,lesson])=>{

const count=lesson.students.length;

const percent=Math.round(count/30*100);

html+=`

<div class="card">

<h2>
📚 ${escapeHTML(lesson.subject)}
</h2>

<h3>
📖 ${escapeHTML(lesson.unit)}
</h3>

<p>
<strong>
30人中 ${count}人提出
</strong>
</p>

<div class="progress">
<div
class="progress-bar"
style="width:${percent}%">
</div>
</div>

<p>
提出率 ${percent}%
</p>

<button
onclick="
selectLessonFromAll(
'${lessonId}',
'${escapeHTML(lesson.subject)}',
'${escapeHTML(lesson.unit)}'
)">
詳しく見る
</button>

</div>
`;

});

html+=`</div>`;

if(Object.keys(lessons).length===0){

html+=`
<div class="empty">
📭 今日の提出はまだありません。
</div>
`;

}

document.getElementById("statusArea").innerHTML=html;

}catch(error){

console.error(error);

document.getElementById("statusArea").innerHTML=
'<div class="empty">読み込みに失敗しました。</div>';

}

};


window.selectLessonFromAll=function(
lessonId,
subject,
unit
){

document.getElementById("teacherSubject")
.value=subject;

document.getElementById("teacherUnit")
.value=unit;

updateTeacherLessonId();

loadLessonStatus();

};


/* =========================================
全児童
========================================= */

async function loadAllStudents(){

document.getElementById("studentList").innerHTML=
'<div class="loading">👦 児童を読み込んでいます...</div>';

try{

const snapshot=
await getDocs(collection(db,"manabi"));

const students={};

snapshot.forEach(d=>{

const data=d.data();

const number=
Number(data.studentNumber);

if(number>=1&&number<=30){

if(!students[number])
students[number]=0;

students[number]++;

}

});

let html=`
<div class="grid">
`;

for(let i=1;i<=30;i++){

html+=`

<div class="card">

<h2>👤 ${i}番</h2>

<p>
振り返り
<strong>
${students[i]||0}
</strong>
件
</p>

<button
onclick="openStudent(${i})">
見る
</button>

</div>
`;

}

html+=`</div>`;

document.getElementById("studentList").innerHTML=html;

}catch(error){

console.error(error);

document.getElementById("studentList").innerHTML=
'<div class="empty">読み込みに失敗しました。</div>';

}

}


/* =========================================
児童詳細
========================================= */

window.openStudent=async function(number){

hidePages();

document.getElementById("detailPage")
.classList.remove("hidden");

document.getElementById("studentDetail").innerHTML=
'<div class="loading">📚 読み込んでいます...</div>';

try{

const q=query(
collection(db,"manabi"),
where(
"studentNumber",
"==",
Number(number)
)
);

const snapshot=await getDocs(q);

let html=`
<h2 class="section-title">
👤 ${number}番の学び
</h2>

<div class="reflection-grid">
`;

let count=0;

snapshot.forEach(d=>{

const data=d.data();

count++;

const level=
Number(data.reflectionLevel)||
judgeReflectionLevel(data.study);

html+=`

<div class="card">

<p class="date">
${formatDate(data.date)}
</p>

<h3>
📚 ${escapeHTML(data.subject)}
</h3>

<h4>
📖 ${escapeHTML(data.unit)}
</h4>

${getLevelHTML(level)}

<div class="study-box">

<b>📝 最初の振り返り</b>

<br><br>

${escapeHTML(data.study)}

</div>

<div class="advice-box">

<b>🤖 AIからの問い</b>

<br><br>

${escapeHTML(
data.aiQuestion||"まだありません"
)}

</div>

<div class="deep-box">

<b>✏️ 最終的な振り返り</b>

<br><br>

${escapeHTML(
data.deepReflection||
"まだ入力されていません"
)}

</div>

</div>
`;

});

html+=`</div>`;

if(count===0){

html+=`
<div class="empty">
まだ振り返りがありません。
</div>
`;

}

document.getElementById("studentDetail").innerHTML=html;

}catch(error){

console.error(error);

document.getElementById("studentDetail").innerHTML=
'<div class="empty">読み込みに失敗しました。</div>';

}

};


/* =========================================
日付
========================================= */

function formatDate(value){

if(!value)return "日付なし";

try{

if(value.toDate)
return value.toDate().toLocaleString("ja-JP");

return new Date(value).toLocaleString("ja-JP");

}catch{

return "日付なし";

}

}


/* =========================================
初期表示
========================================= */

showLessonSelect();

console.log(
"👩‍🏫 学びアルバム先生ページ 起動"
);

</script>

</body>
</html>
