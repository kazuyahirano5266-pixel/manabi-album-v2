<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2 先生ページ</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
  background: #f4f8fb;
  color: #333;
}

header {
  background: #3f78ad;
  color: white;
  text-align: center;
  padding: 18px 10px;
  font-size: 24px;
  font-weight: bold;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.page {
  background: white;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 3px 15px rgba(0,0,0,.08);
  margin-bottom: 20px;
}

.hidden {
  display: none;
}

h2 {
  margin-top: 0;
}

h3 {
  margin-bottom: 8px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 17px;
  margin: 5px 3px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  background: #4c8dcc;
  color: white;
}

button:hover {
  opacity: .9;
}

.green {
  background: #4d9c68;
}

.orange {
  background: #d68c36;
}

.purple {
  background: #7656a8;
}

.red {
  background: #c75b5b;
}

.gray {
  background: #777;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccd5dd;
  border-radius: 10px;
  font-size: 16px;
  font-family: inherit;
}

textarea {
  min-height: 150px;
  line-height: 1.8;
  resize: vertical;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
  margin-bottom: 6px;
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.menu-button {
  min-height: 110px;
  font-size: 18px;
}

.box {
  background: #eef7ff;
  border-left: 6px solid #4c8dcc;
  padding: 16px;
  border-radius: 10px;
  margin: 15px 0;
}

.lesson-box {
  background: #eef9f0;
  border-left: 6px solid #4d9c68;
  padding: 18px;
  border-radius: 10px;
  margin: 15px 0;
}

.warning-box {
  background: #fff8dd;
  border-left: 6px solid #d68c36;
  padding: 16px;
  border-radius: 10px;
  margin: 15px 0;
}

.student-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.student-card {
  background: #fafcff;
  border: 2px solid #dbe7f0;
  border-radius: 14px;
  padding: 15px;
}

.student-number {
  font-size: 13px;
  color: #666;
}

.student-name {
  font-size: 19px;
  font-weight: bold;
  margin: 5px 0 10px;
}

.count {
  color: #4c8dcc;
  font-weight: bold;
}

.reflection-card {
  background: #fafcff;
  border: 1px solid #dbe7f0;
  border-radius: 14px;
  padding: 17px;
  margin: 12px 0;
}

.subject-title {
  color: #3f78ad;
  font-weight: bold;
  font-size: 18px;
}

.date {
  color: #777;
  font-size: 13px;
}

.deep {
  background: #eef9f0;
  border-left: 5px solid #4d9c68;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
}

.ai-box {
  background: #fff8dd;
  border-left: 5px solid #d68c36;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
}

.comment-box {
  background: #f7f3ff;
  border-left: 5px solid #7656a8;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
}

.roster-row {
  display: grid;
  grid-template-columns: 90px 1fr auto;
  gap: 8px;
  align-items: center;
  margin: 8px 0;
}

.subject-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 15px 0;
}

.subject-button {
  background: #edf5fc;
  color: #3f78ad;
  border: 2px solid #d5e5f3;
}

.summary-box {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 15px 0;
}

.summary-item {
  background: #f7f9fb;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.summary-number {
  font-size: 28px;
  font-weight: bold;
  color: #3f78ad;
}

textarea.comment {
  min-height: 130px;
}

.small {
  font-size: 13px;
  color: #666;
}

@media(max-width:700px) {

  .menu-grid,
  .student-grid,
  .subject-grid,
  .summary-box {
    grid-template-columns: 1fr 1fr;
  }

}

@media(max-width:500px) {

  .menu-grid,
  .student-grid,
  .subject-grid,
  .summary-box {
    grid-template-columns: 1fr;
  }

  .roster-row {
    grid-template-columns: 65px 1fr;
  }

  .roster-row button {
    grid-column: 2;
  }

}

</style>

</head>


<body>

<header>
👩‍🏫 学びアルバム Ver.2　先生ページ
</header>


<div class="container">


<!-- ==================================================
     HOME
================================================== -->

<div id="homePage" class="page">

  <h2>
    👩‍🏫 先生メニュー
  </h2>

  <div id="lessonStatusHome"></div>

  <div class="menu-grid">

    <button
      class="menu-button"
      onclick="openLessonSettings()">

      🟢 授業を開始・終了

    </button>

    <button
      class="menu-button"
      onclick="openStudentSettings()">

      👤 児童名・出席番号設定

    </button>

    <button
      class="menu-button"
      onclick="openStudentList()">

      📚 児童一覧・振り返り

    </button>

    <button
      class="menu-button"
      onclick="openAnnualSummary()">

      📖 1年間の振り返り

    </button>

  </div>

</div>


<!-- ==================================================
     LESSON SETTINGS
================================================== -->

<div id="lessonPage"
     class="page hidden">

  <h2>
    🟢 授業の設定
  </h2>

  <div id="lessonCurrent"></div>

  <label>
    教科
  </label>

  <select id="lessonSubject">

    <option value="">
      教科を選んでください
    </option>

    <option>国語</option>
    <option>算数</option>
    <option>生活</option>
    <option>理科</option>
    <option>社会</option>
    <option>総合</option>
    <option>道徳</option>
    <option>体育</option>

  </select>

  <label>
    単元名
  </label>

  <input
    id="lessonUnit"
    placeholder="単元名">

  <button
    class="green"
    onclick="startLesson()">

    ▶️ この授業を開始する

  </button>

  <button
    class="red"
    onclick="endLesson()">

    ⏹️ 授業を終了する

  </button>

  <br>

  <button
    class="gray"
    onclick="goHome()">

    戻る

  </button>

</div>


<!-- ==================================================
     STUDENT SETTINGS
================================================== -->

<div id="studentSettingsPage"
     class="page hidden">

  <h2>
    👤 児童名・出席番号設定
  </h2>

  <div class="box">

    <strong>
      この設定は先生ページだけで使用します。
    </strong>

    <p>
      児童側の「みんなの振り返り」には、
      名前も出席番号も表示されません。
    </p>

    <p>
      振り返り本文にも児童名は保存しません。
    </p>

  </div>

  <label>
    出席番号
  </label>

  <input
    id="newStudentNumber"
    type="number"
    min="1"
    max="50"
    placeholder="例：1">

  <label>
    児童名
  </label>

  <input
    id="newStudentName"
    placeholder="例：山田 太郎">

  <button
    class="green"
    onclick="saveStudent()">

    💾 登録・更新する

  </button>

  <div id="rosterList"></div>

  <button
    class="gray"
    onclick="goHome()">

    戻る

  </button>

</div>


<!-- ==================================================
     STUDENT LIST
================================================== -->

<div id="studentListPage"
     class="page hidden">

  <h2>
    📚 児童一覧
  </h2>

  <div id="studentList"></div>

  <button
    class="gray"
    onclick="goHome()">

    戻る

  </button>

</div>


<!-- ==================================================
     SUBJECT SELECT
================================================== -->

<div id="subjectPage"
     class="page hidden">

  <h2 id="subjectStudentTitle">
    教科を選んでください
  </h2>

  <div id="studentSummary"></div>

  <div class="subject-grid">

    <button
      class="subject-button"
      onclick="openSubject('国語')">
      国語
    </button>

    <button
      class="subject-button"
      onclick="openSubject('算数')">
      算数
    </button>

    <button
      class="subject-button"
      onclick="openSubject('生活')">
      生活
    </button>

    <button
      class="subject-button"
      onclick="openSubject('理科')">
      理科
    </button>

    <button
      class="subject-button"
      onclick="openSubject('社会')">
      社会
    </button>

    <button
      class="subject-button"
      onclick="openSubject('総合')">
      総合
    </button>

    <button
      class="subject-button"
      onclick="openSubject('道徳')">
      道徳
    </button>

    <button
      class="subject-button"
      onclick="openSubject('体育')">
      体育
    </button>

  </div>

  <button
    class="gray"
    onclick="openStudentList()">

    児童一覧へ戻る

  </button>

</div>


<!-- ==================================================
     SUBJECT REFLECTIONS
================================================== -->

<div id="subjectReflectionPage"
     class="page hidden">

  <h2 id="subjectReflectionTitle"></h2>

  <div id="subjectReflectionList"></div>

  <button
    class="gray"
    onclick="openSubjectPage()">

    教科選択へ戻る

  </button>

</div>


<!-- ==================================================
     ANNUAL SUMMARY
================================================== -->

<div id="annualPage"
     class="page hidden">

  <h2>
    📖 1年間の振り返り
  </h2>

  <label>
    児童を選択
  </label>

  <select
    id="annualStudentSelect"
    onchange="loadAnnualSummary()">

    <option value="">
      児童を選んでください
    </option>

  </select>

  <div id="annualSummary"></div>

  <button
    class="gray"
    onclick="goHome()">

    戻る

  </button>

</div>


</div>


<script type="module">


/* ==================================================
   Firebase
================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

  authDomain:
    "manabi-album-v2.firebaseapp.com",

  projectId:
    "manabi-album-v2",

  storageBucket:
    "manabi-album-v2.firebasestorage.app",

  messagingSenderId:
    "226258471812",

  appId:
    "1:226258471812:web:15230ba15e7e0bd7d86bd1"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


/* ==================================================
   状態
================================================== */

let students = [];

let currentStudentNumber = null;

let currentStudentName = "";

let currentSubject = "";


/* ==================================================
   画面切替
================================================== */

function showPage(id) {

  const pages = [

    "homePage",
    "lessonPage",
    "studentSettingsPage",
    "studentListPage",
    "subjectPage",
    "subjectReflectionPage",
    "annualPage"

  ];


  pages.forEach(
    page => {

      document
        .getElementById(page)
        .classList
        .add("hidden");

    }
  );


  document
    .getElementById(id)
    .classList
    .remove("hidden");

}


window.goHome =
function() {

  showPage(
    "homePage"
  );

  loadCurrentLessonStatus();

};


/* ==================================================
   授業設定
================================================== */

window.openLessonSettings =
async function() {

  showPage(
    "lessonPage"
  );


  await displayLesson();

};


/* ==================================================
   現在の授業
================================================== */

async function getCurrentLesson() {

  try {

    const ref =
      doc(
        db,
        "currentLesson",
        "today"
      );


    const snap =
      await getDoc(ref);


    if (
      !snap.exists()
    ) {

      return null;

    }


    const data =
      snap.data();


    if (
      data.active !== true
    ) {

      return null;

    }


    return data;

  }
  catch(error) {

    console.error(error);

    return null;

  }

}


/* ==================================================
   授業表示
================================================== */

async function displayLesson() {

  const area =
    document.getElementById(
      "lessonCurrent"
    );


  const lesson =
    await getCurrentLesson();


  if (!lesson) {

    area.innerHTML = `

      <div class="warning-box">

        🔴 現在、授業は開始されていません。

      </div>

    `;

    return;

  }


  area.innerHTML = `

    <div class="lesson-box">

      🟢 <strong>授業中</strong>

      <br><br>

      教科：
      <strong>
        ${escapeHtml(
          lesson.subject || ""
        )}
      </strong>

      <br>

      単元：
      <strong>
        ${escapeHtml(
          lesson.unit || ""
        )}
      </strong>

      <br><br>

      授業ID：
      ${escapeHtml(
        lesson.lessonId || ""
      )}

    </div>

  `;


  document.getElementById(
    "lessonSubject"
  ).value =
    lesson.subject || "";


  document.getElementById(
    "lessonUnit"
  ).value =
    lesson.unit || "";

}


/* ==================================================
   授業開始
================================================== */

window.startLesson =
async function() {

  const subject =
    document.getElementById(
      "lessonSubject"
    ).value;


  const unit =
    document.getElementById(
      "lessonUnit"
    ).value.trim();


  if (!subject) {

    alert(
      "教科を選んでください。"
    );

    return;

  }


  if (!unit) {

    alert(
      "単元名を入力してください。"
    );

    return;

  }


  /*
    授業IDを自動作成
  */

  const lessonId =
    "lesson_" +
    Date.now();


  try {

    await setDoc(

      doc(
        db,
        "currentLesson",
        "today"
      ),

      {

        active:
          true,

        subject:
          subject,

        unit:
          unit,

        lessonId:
          lessonId,

        startedAt:
          serverTimestamp()

      }

    );


    alert(
      "授業を開始しました！"
    );


    await displayLesson();

    loadCurrentLessonStatus();

  }
  catch(error) {

    console.error(error);

    alert(
      "授業を開始できませんでした。\n" +
      error.message
    );

  }

};


/* ==================================================
   授業終了
================================================== */

window.endLesson =
async function() {

  const lesson =
    await getCurrentLesson();


  if (!lesson) {

    alert(
      "現在、授業は開始されていません。"
    );

    return;

  }


  const ok =
    confirm(
      "この授業を終了しますか？"
    );


  if (!ok)
    return;


  try {

    await updateDoc(

      doc(
        db,
        "currentLesson",
        "today"
      ),

      {

        active:
          false,

        endedAt:
          serverTimestamp()

      }

    );


    alert(
      "授業を終了しました。"
    );


    await displayLesson();

    loadCurrentLessonStatus();

  }
  catch(error) {

    console.error(error);

    alert(
      "授業を終了できませんでした。\n" +
      error.message
    );

  }

};


/* ==================================================
   HOMEの授業状態
================================================== */

async function loadCurrentLessonStatus() {

  const area =
    document.getElementById(
      "lessonStatusHome"
    );


  const lesson =
    await getCurrentLesson();


  if (!lesson) {

    area.innerHTML = `

      <div class="warning-box">

        🔴 現在、授業は開始されていません。

      </div>

    `;

    return;

  }


  area.innerHTML = `

    <div class="lesson-box">

      🟢 <strong>授業中</strong>

      <br><br>

      ${escapeHtml(
        lesson.subject
      )}

      ／

      ${escapeHtml(
        lesson.unit
      )}

    </div>

  `;

}


/* ==================================================
   児童名設定
================================================== */

window.openStudentSettings =
async function() {

  showPage(
    "studentSettingsPage"
  );


  await loadStudents();

};


/* ==================================================
   児童一覧取得
================================================== */

async function loadStudents() {

  try {

    const snapshot =
      await getDocs(
        collection(
          db,
          "students"
        )
      );


    students =
      snapshot.docs

        .map(
          d => ({

            id:
              d.id,

            ...d.data()

          })
        )

        .sort(
          (a,b) =>
            Number(
              a.studentNumber
            ) -
            Number(
              b.studentNumber
            )
        );


    displayRoster();

  }
  catch(error) {

    console.error(error);

    alert(
      "児童名を読み込めませんでした。\n" +
      error.message
    );

  }

}


/* ==================================================
   児童登録
================================================== */

window.saveStudent =
async function() {

  const number =
    document.getElementById(
      "newStudentNumber"
    ).value.trim();


  const name =
    document.getElementById(
      "newStudentName"
    ).value.trim();


  if (!number) {

    alert(
      "出席番号を入力してください。"
    );

    return;

  }


  if (!name) {

    alert(
      "児童名を入力してください。"
    );

    return;

  }


  const num =
    Number(number);


  if (
    num < 1 ||
    num > 50
  ) {

    alert(
      "出席番号は1～50で入力してください。"
    );

    return;

  }


  try {

    /*
      出席番号をドキュメントIDにする。

      例：
      students/1
      students/2
      students/3

      → 出席番号から児童名を
        すぐに確認できる。
    */

    await setDoc(

      doc(
        db,
        "students",
        String(num)
      ),

      {

        studentNumber:
          num,

        name:
          name,

        updatedAt:
          serverTimestamp()

      },

      {

        merge:
          true

      }

    );


    document.getElementById(
      "newStudentNumber"
    ).value = "";


    document.getElementById(
      "newStudentName"
    ).value = "";


    alert(
      "児童名を登録しました！"
    );


    await loadStudents();

  }
  catch(error) {

    console.error(error);

    alert(
      "登録できませんでした。\n" +
      error.message
    );

  }

};


/* ==================================================
   名簿表示
================================================== */

function displayRoster() {

  const area =
    document.getElementById(
      "rosterList"
    );


  if (!students.length) {

    area.innerHTML = `

      <div class="box">

        まだ児童が登録されていません。

      </div>

    `;

    return;

  }


  area.innerHTML = `

    <h3>
      📋 登録されている児童
    </h3>

    ${
      students
        .map(
          student => `

            <div class="roster-row">

              <strong>
                ${student.studentNumber}番
              </strong>

              <input
                id="name_${student.studentNumber}"
                value="${escapeHtml(
                  student.name || ""
                )}">

              <button
                class="green"
                onclick="updateStudent(${student.studentNumber})">

                更新

              </button>

            </div>

          `
        )
        .join("")
    }

  `;

}


/* ==================================================
   児童名更新
================================================== */

window.updateStudent =
async function(number) {

  const input =
    document.getElementById(
      "name_" + number
    );


  if (!input)
    return;


  const name =
    input.value.trim();


  if (!name) {

    alert(
      "児童名を入力してください。"
    );

    return;

  }


  try {

    await updateDoc(

      doc(
        db,
        "students",
        String(number)
      ),

      {

        name:
          name,

        updatedAt:
          serverTimestamp()

      }

    );


    alert(
      number +
      "番の児童名を更新しました。"
    );


    await loadStudents();

  }
  catch(error) {

    console.error(error);

    alert(
      "更新できませんでした。\n" +
      error.message
    );

  }

};


/* ==================================================
   児童一覧
================================================== */

window.openStudentList =
async function() {

  showPage(
    "studentListPage"
  );


  await loadStudentsForList();

};


/* ==================================================
   児童一覧表示
================================================== */

async function loadStudentsForList() {

  const area =
    document.getElementById(
      "studentList"
    );


  area.innerHTML =
    "児童一覧を読み込んでいます...";


  try {

    const snapshot =
      await getDocs(
        collection(
          db,
          "students"
        )
      );


    const roster =
      snapshot.docs

        .map(
          d => ({
            id:
              d.id,
            ...d.data()
          })
        )

        .sort(
          (a,b) =>
            Number(
              a.studentNumber
            ) -
            Number(
              b.studentNumber
            )
        );


    /*
      振り返り数を取得
    */

    const reflectionSnapshot =
      await getDocs(
        collection(
          db,
          "manabi"
        )
      );


    const counts = {};


    reflectionSnapshot.docs
      .forEach(
        d => {

          const data =
            d.data();


          const num =
            Number(
              data.studentNumber
            );


          if (!num)
            return;


          counts[num] =
            (counts[num] || 0) + 1;

        }
      );


    if (!roster.length) {

      area.innerHTML = `

        <div class="warning-box">

          児童名・出席番号が
          まだ登録されていません。

          <br><br>

          「児童名・出席番号設定」
          から登録してください。

        </div>

      `;

      return;

    }


    area.innerHTML = `

      <div class="student-grid">

        ${
          roster
            .map(
              student => `

                <div class="student-card">

                  <div class="student-number">

                    ${student.studentNumber}番

                  </div>

                  <div class="student-name">

                    ${escapeHtml(
                      student.name || ""
                    )}

                  </div>

                  <div class="count">

                    振り返り
                    ${counts[
                      student.studentNumber
                    ] || 0}
                    件

                  </div>

                  <br>

                  <button
                    onclick="openStudent(
                      ${student.studentNumber},
                      '${escapeJs(
                        student.name || ""
                      )}'
                    )">

                    📖 振り返りを見る

                  </button>

                </div>

              `
            )
            .join("")
        }

      </div>

    `;

  }
  catch(error) {

    console.error(error);

    area.innerHTML = `

      <div class="warning-box">

        読み込みエラー

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}

/* ==================================================
   児童概要
================================================== */

async function loadStudentSummary() {

  const area =
    document.getElementById(
      "studentSummary"
    );


  try {

    const q =
      query(

        collection(
          db,
          "manabi"
        ),

        where(
          "studentNumber",
          "==",
          Number(
            currentStudentNumber
          )
        )

      );


    const snapshot =
      await getDocs(q);


    const data =
      snapshot.docs;


    const subjects =
      new Set();


    data.forEach(
      d => {

        const item =
          d.data();


        if (
          item.subject
        ) {

          subjects.add(
            item.subject
          );

        }

      }
    );


    area.innerHTML = `

      <div class="summary-box">

        <div class="summary-item">

          <div class="summary-number">
            ${data.length}
          </div>

          <div>
            振り返り数
          </div>

        </div>

        <div class="summary-item">

          <div class="summary-number">
            ${subjects.size}
          </div>

          <div>
            教科数
          </div>

        </div>

        <div class="summary-item">

          <div class="summary-number">
            ${
              data.filter(
                d =>
                  d.data().deepReflection
              ).length
            }
          </div>

          <div>
            深めた振り返り
          </div>

        </div>

      </div>

    `;

  }
  catch(error) {

    console.error(error);

  }

}

    );

    "読み込み中...";


  try {

    const q =
      query(

        collection(
          db,
          "manabi"
        ),

        where(
          "studentNumber",
          "==",
          Number(
            currentStudentNumber
          )
        ),

        where(
          "subject",
          "==",
          currentSubject
        )

      );


    const snapshot =
      await getDocs(q);


    const data =
      snapshot.docs

        .map(
          d => ({
            id:
              d.id,

            ...d.data()

          })
        )

        .sort(
          (a,b) =>
            new Date(b.date) -
            new Date(a.date)
        );


    if (!data.length) {

      area.innerHTML = `

        <div class="box">

            currentSubject

      return;

    }


    area.innerHTML =
      data
        .map(
          item => `

            <div class="reflection-card">

              <div class="date">

                ${formatDate(
                  item.date
                )}

              </div>

              <div class="subject-title">

                ${escapeHtml(
                  item.subject || ""
                )}

                ／

                ${escapeHtml(
                  item.unit || ""
                )}

              </div>

              <p>

                ${escapeHtml(
                  item.study || ""
                )}

              </p>

              ${
                item.aiQuestion
                ?
                `

                  <div class="ai-box">

                    🤖 AIからの問い

                    <br>

                    ${escapeHtml(
                      item.aiQuestion
                    )}

                  </div>

                `
                :
                ""
              }


              ${
                item.deepReflection
                ?
                `

                  <div class="deep">

                    🌱 <strong>
                    深めた考え
                    </strong>

                    <br><br>

                    ${escapeHtml(
                      item.deepReflection
                    )}

                    <br><br>

                    深まりレベル：
                    ${escapeHtml(
                      item.deepLevel ||
                      item.reflectionLevel ||
                      ""
                    )}

                  </div>

                `
                :

              }

          `
        )

  }
  catch(error) {

      <div class="warning-box">

        読み込みエラー

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}

    student
      ? student.name

    "1年間の振り返りを整理しています...";


  try {

    const q =
      query(

        collection(
          db,
          "manabi"

          "studentNumber",
          "==",

        )

      );

      await getDocs(q);

        .map(

/* ==================================================
   所見作成用データ
================================================== */

function createAnnualText(
  name,
  data,
  subjects
) {

  let text = "";


  text +=
    "【児童名】\n" +
    name +
    "\n\n";


  text +=
    "【1年間の振り返り件数】\n" +
    data.length +
    "件\n\n";


  text +=
    "【教科別の学び】\n";


  Object.keys(subjects)
    .forEach(
      subject => {

        text +=
          "\n■ " +
          subject +
          "\n";


        subjects[
          subject
        ].forEach(
          item => {

            text +=
              "・" +
              (
                item.study ||
                ""
              );


            if (
              item.deepReflection
            ) {

              text +=
                "【深めた考え】" +
                item.deepReflection;

            }


            text +=
              "\n";

          }
        );

      }
    );


  text +=
    "\n【特に深い振り返り】\n";


  data
    .filter(
      item =>
        Number(
          item.deepLevel ||
          item.reflectionLevel ||
          0
        ) === 3
    )
    .forEach(
      item => {

        text +=
          "・" +
          (
            item.deepReflection ||
            item.study ||
            ""
          ) +
          "\n";

      }
    );


  text +=
    "\n【所見作成時の参考】\n";

  text +=
    "上記の児童の1年間の振り返りをもとに、";
  
  text +=
    "具体的な学びや考えの変化、";
  
  text +=
    "友達との関わり、";
  
  text +=
    "自分の考えを深めた姿などを";
  
  text +=
    "大切にして所見を作成する。";


  return text;

}


/* ==================================================
   コピー
================================================== */

window.copyAnnualText =
async function() {

  const textarea =
    document.getElementById(
      "annualCopyText"
    );


  if (!textarea)
    return;


  try {

    await navigator.clipboard.writeText(
      textarea.value
    );


    alert(
      "所見作成用データをコピーしました！"
    );

  }
  catch(error) {

    textarea.select();

    document.execCommand(
      "copy"
    );


    alert(
      "コピーしました！"
    );

  }

};


/* ==================================================
   日付
================================================== */

function formatDate(value) {

  if (!value)
    return "";


  const d =
    new Date(value);


  if (
    isNaN(
      d.getTime()
    )
  ) {

    return String(value);

  }


  return (

    d.getFullYear() +
    "年" +
    (d.getMonth() + 1) +
    "月" +
    d.getDate() +
    "日"

  );

}


/* ==================================================
   HTML安全化
================================================== */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ==================================================
   JavaScript文字列安全化
================================================== */

function escapeJs(value) {

  return String(
    value || ""
  )

  .replaceAll(
    "\\",
    "\\\\"
  )

  .replaceAll(
    "'",
    "\\'"
  )

  .replaceAll(
    "\n",
    "\\n"
  )

  .replaceAll(
    "\r",
    "\\r"
  );

}
