<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>学びアルバム Ver.2 先生ページ</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    "Noto Sans JP",
    sans-serif;
  background: #f4f7fb;
  color: #333;
}

header {
  background: #3d7cc9;
  color: white;
  padding: 18px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}

.container {
  max-width: 1150px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow:
    0 3px 12px rgba(0,0,0,.08);
}

.hidden {
  display: none;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  margin: 5px;
  font-size: 16px;
  cursor: pointer;
  background: #3d7cc9;
  color: white;
  font-weight: bold;
}

button:hover {
  opacity: .9;
}

.green {
  background: #4c9b65;
}

.orange {
  background: #d98b35;
}

.purple {
  background: #7656a8;
}

.red {
  background: #c85c5c;
}

.gray {
  background: #777;
}

.lesson-box {
  background: #eef7ff;
  border-left: 6px solid #3d7cc9;
  padding: 18px;
  border-radius: 10px;
  margin: 15px 0;
}

.active-box {
  background: #eef9f0;
  border-left: 6px solid #4c9b65;
  padding: 18px;
  border-radius: 10px;
  margin: 15px 0;
}

.ai-box {
  background: #fff8dd;
  border-left: 6px solid #e2aa32;
  padding: 18px;
  border-radius: 10px;
  margin: 15px 0;
}

.student-grid {
  display: grid;
  grid-template-columns:
    repeat(5,1fr);
  gap: 15px;
}

.student-card {
  background: #eef6ff;
  border: 2px solid #c9e0f7;
  border-radius: 14px;
  padding: 18px;
  cursor: pointer;
}

.student-card:hover {
  background: #e3f1ff;
}

.subject-grid {
  display: grid;
  grid-template-columns:
    repeat(4,1fr);
  gap: 12px;
}

.subject-card {
  background: #f4f8ff;
  border: 2px solid #d6e4f3;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
}

.reflection-card {
  background: #f9fbfd;
  border-left: 5px solid #55a96d;
  padding: 15px;
  border-radius: 10px;
  margin: 12px 0;
}

.summary-box {
  background: #f8f7ff;
  border-left: 5px solid #7656a8;
  padding: 18px;
  border-radius: 10px;
  margin: 15px 0;
}

.growth-box {
  background: #eef9f0;
  border-left: 5px solid #4c9b65;
  padding: 18px;
  border-radius: 10px;
  margin: 15px 0;
}

.stat-grid {
  display: grid;
  grid-template-columns:
    repeat(4,1fr);
  gap: 10px;
}

.stat-card {
  background: #f5f7fa;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}

.stat-number {
  font-size: 28px;
  font-weight: bold;
  color: #3d7cc9;
}

textarea {
  width: 100%;
  min-height: 320px;
  padding: 15px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 15px;
  line-height: 1.8;
}

.copy-message {
  color: #267a3b;
  font-weight: bold;
  margin: 10px 0;
}

@media(max-width:900px) {

  .student-grid {
    grid-template-columns:
      repeat(4,1fr);
  }

}

@media(max-width:700px) {

  .student-grid,
  .subject-grid {
    grid-template-columns:
      repeat(2,1fr);
  }

  .stat-grid {
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:500px) {

  .student-grid,
  .subject-grid {
    grid-template-columns:
      1fr;
  }

}

</style>
</head>

<body>

<header>
👩‍🏫 学びアルバム Ver.2　先生ページ
</header>

<div class="container">


<!-- ==================================================
     HOME
================================================== -->

<div id="homePage" class="card">

<h2>🏫 今日の授業</h2>

<div id="lessonStatus">
読み込み中...
</div>

<button
  class="green"
  onclick="startLesson()"
>
▶️ 授業を開始する
</button>

<button
  class="red"
  onclick="endLesson()"
>
⏹ 授業を終了する
</button>

<hr>

<h2>📚 1年間の学び</h2>

<button onclick="loadStudents()">
👧 児童一覧
</button>

<button
  class="orange"
  onclick="refreshData()"
>
🔄 最新データに更新
</button>

</div>


<!-- ==================================================
     STUDENT LIST
================================================== -->

<div
  id="studentPage"
  class="card hidden"
>

<h2>👧 児童一覧</h2>

<div
  class="lesson-box"
>
1年間の振り返りを児童ごとに確認できます。
</div>

<div
  id="studentList"
  class="student-grid"
></div>

<button
  class="gray"
  onclick="goHome()"
>
戻る
</button>

</div>


<!-- ==================================================
     STUDENT MENU
================================================== -->

<div
  id="studentMenuPage"
  class="card hidden"
>

<h2 id="studentMenuTitle">
👤 児童
</h2>

<button
  class="green"
  onclick="openYearSummary()"
>
📚 1年間の振り返り
</button>

<button
  onclick="openSubjectSelection()"
>
📖 教科別に見る
</button>

<button
  class="purple"
  onclick="openCommentData()"
>
📝 所見作成用データ
</button>

<button
  class="gray"
  onclick="loadStudents()"
>
児童一覧へ
</button>

</div>


<!-- ==================================================
     SUBJECT
================================================== -->

<div
  id="subjectPage"
  class="card hidden"
>

<h2 id="subjectTitle">
📖 教科を選択
</h2>

<div
  id="subjectList"
  class="subject-grid"
></div>

<button
  class="gray"
  onclick="openStudentMenu()"
>
戻る
</button>

</div>


<!-- ==================================================
     REFLECTION
================================================== -->

<div
  id="reflectionPage"
  class="card hidden"
>

<h2 id="reflectionTitle">
📝 振り返り
</h2>

<div
  id="reflectionList"
></div>

<button
  class="gray"
  onclick="openSubjectSelection()"
>
教科一覧へ
</button>

</div>


<!-- ==================================================
     YEAR SUMMARY
================================================== -->

<div
  id="yearPage"
  class="card hidden"
>

<h2 id="yearTitle">
📚 1年間の振り返り
</h2>

<div id="yearStats"></div>

<div id="yearContent"></div>

<button
  class="gray"
  onclick="openStudentMenu()"
>
戻る
</button>

</div>


<!-- ==================================================
     COMMENT
================================================== -->

<div
  id="commentPage"
  class="card hidden"
>

<h2 id="commentTitle">
📝 所見作成
</h2>

<div id="commentSummary"></div>

<div class="ai-box">

<h3>
🤖 Copilot用文章
</h3>

<p>
この児童の1年間の振り返りから、
所見作成に必要な情報を自動整理します。
</p>

</div>

<textarea
  id="commentText"
></textarea>

<button
  class="purple"
  onclick="copyComment()"
>
📋 Copilot用文章をコピー
</button>

<button
  class="purple"
  onclick="openCopilot()"
>
🤖 Microsoft Copilotを開く
</button>

<div
  id="copyMessage"
  class="copy-message"
></div>

<button
  class="gray"
  onclick="openStudentMenu()"
>
戻る
</button>

</div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  setDoc,
  getDoc,
  updateDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   Firebase
================================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

  authDomain:
  "manabi-album-v2.firebaseapp.com",

  projectId:
  "manabi-album-v2",

  storageBucket:
  "manabi-album-v2.firebasestorage.app",

  messagingSenderId:
  "226258471812",

  appId:
  "1:226258471812:web:15230ba15e7e0bd7d86bd1"

};

const app =
  initializeApp(
    firebaseConfig
  );

const db =
  getFirestore(app);


/* ==================================================
   設定
================================================== */

const SCHOOL_YEAR = 2026;

const SUBJECTS = [
  "国語",
  "算数",
  "生活",
  "理科",
  "社会",
  "総合",
  "道徳",
  "体育"
];

const CACHE_KEY =
  "manabiTeacherData2026";


/* ==================================================
   状態
================================================== */

let allData = [];

let currentStudent =
  null;

let currentSubject =
  null;


/* ==================================================
   画面
================================================== */

function showPage(id) {

  const pages = [
    "homePage",
    "studentPage",
    "studentMenuPage",
    "subjectPage",
    "reflectionPage",
    "yearPage",
    "commentPage"
  ];

  pages.forEach(
    p =>
      document
        .getElementById(p)
        .classList.add("hidden")
  );

  document
    .getElementById(id)
    .classList.remove("hidden");
}


/* ==================================================
   HOME
================================================== */

window.goHome =
function() {

  showPage("homePage");

};


/* ==================================================
   授業状態
================================================== */

async function loadLessonStatus() {

  const ref =
    doc(
      db,
      "currentLesson",
      "today"
    );

  const snap =
    await getDoc(ref);

  const area =
    document.getElementById(
      "lessonStatus"
    );

  if (
    !snap.exists() ||
    !snap.data().active
  ) {

    area.innerHTML = `
      <div class="lesson-box">
        🔴 現在、授業は開始されていません。
      </div>
    `;

    return;

  }

  const d =
    snap.data();

  area.innerHTML = `

    <div class="active-box">

      🟢 <strong>授業中</strong>

      <br><br>

      教科：
      <strong>
        ${escapeHtml(d.subject || "")}
      </strong>

      <br>

      単元：
      <strong>
        ${escapeHtml(d.unit || "")}
      </strong>

      <br>

      授業ID：
      <strong>
        ${escapeHtml(d.lessonId || "")}
      </strong>

    </div>

  `;

}


/* ==================================================
   授業開始
================================================== */

window.startLesson =
async function() {

  const subject =
    prompt(
      "教科を入力してください。\n\n例：算数"
    );

  if (!subject) return;


  const unit =
    prompt(
      "単元名を入力してください。"
    );

  if (!unit) return;


  const lessonId =
    "L" +
    Date.now()
      .toString(36)
      .toUpperCase();


  await setDoc(
    doc(
      db,
      "currentLesson",
      "today"
    ),
    {

      active: true,

      schoolYear:
        SCHOOL_YEAR,

      lessonId:
        lessonId,

      subject:
        subject,

      unit:
        unit,

      startedAt:
        serverTimestamp()

    }
  );


  alert(
    "授業を開始しました！\n\n授業ID：" +
    lessonId
  );


  loadLessonStatus();

};


/* ==================================================
   授業終了
================================================== */

window.endLesson =
async function() {

  await setDoc(
    doc(
      db,
      "currentLesson",
      "today"
    ),
    {

      active: false,

      endedAt:
        serverTimestamp()

    },
    {
      merge: true
    }
  );


  alert(
    "授業を終了しました。"
  );


  loadLessonStatus();

};


/* ==================================================
   データ取得
================================================== */

window.loadStudents =
async function() {

  showPage(
    "studentPage"
  );


  const list =
    document.getElementById(
      "studentList"
    );


  list.innerHTML =
    "📡 データを確認しています...";


  try {

    const cached =
      localStorage.getItem(
        CACHE_KEY
      );


    if (cached) {

      allData =
        JSON.parse(
          cached
        );

    }
    else {

      await fetchData();

    }


    displayStudents();

  }
  catch(error) {

    console.error(error);

    list.innerHTML =
    `
      ❌ 読み込みエラー
      <br>
      ${escapeHtml(error.message)}
    `;

  }

};


/* ==================================================
   Firebaseから取得
================================================== */

async function fetchData() {

  const q =
    query(

      collection(
        db,
        "manabi"
      ),

      where(
        "schoolYear",
        "==",
        SCHOOL_YEAR
      )

    );


  const snapshot =
    await getDocs(q);


  allData =
    snapshot.docs.map(
      d => ({
        id:
          d.id,
        ...d.data()
      })
    );


  localStorage.setItem(
    CACHE_KEY,
    JSON.stringify(allData)
  );

}


/* ==================================================
   最新データ
================================================== */

window.refreshData =
async function() {

  localStorage.removeItem(
    CACHE_KEY
  );


  await fetchData();


  alert(
    "最新データに更新しました。"
  );


  if (
    !document
      .getElementById("studentPage")
      .classList
      .contains("hidden")
  ) {

    displayStudents();

  }

};


/* ==================================================
   児童一覧
================================================== */

function displayStudents() {

  const list =
    document.getElementById(
      "studentList"
    );


  const students = {};


  allData.forEach(
    item => {

      const number =
        String(
          item.studentNumber ??
          item.name ??
          ""
        );


      if (!number) return;


      if (!students[number]) {

        students[number] = 0;

      }


      students[number]++;

    }
  );


  const numbers =
    Object.keys(
      students
    ).sort(
      (a,b) =>
        Number(a) -
        Number(b)
    );


  if (!numbers.length) {

    list.innerHTML =
      "まだ振り返りがありません。";

    return;

  }


  list.innerHTML = "";


  numbers.forEach(
    number => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "student-card";


      card.innerHTML = `

        <h3>
          ${escapeHtml(number)}番
        </h3>

        <p>
          📝 ${students[number]}件
        </p>

        <small>
          タップして開く
        </small>

      `;


      card.onclick =
        () =>
          openStudent(
            number
          );


      list.appendChild(
        card
      );

    }
  );

}


/* ==================================================
   児童
================================================== */

function openStudent(
  number
) {

  currentStudent =
    String(number);


  document.getElementById(
    "studentMenuTitle"
  ).textContent =
    `👤 ${currentStudent}番の学び`;


  showPage(
    "studentMenuPage"
  );

}

window.openStudentMenu =
function() {

  showPage(
    "studentMenuPage"
  );

};


/* ==================================================
   教科一覧
================================================== */

window.openSubjectSelection =
function() {

  showPage(
    "subjectPage"
  );


  document.getElementById(
    "subjectTitle"
  ).textContent =
    `📖 ${currentStudent}番　教科を選択`;


  const list =
    document.getElementById(
      "subjectList"
    );


  list.innerHTML = "";


  SUBJECTS.forEach(
    subject => {

      const count =
        getStudentData()
          .filter(
            x =>
              x.subject ===
              subject
          ).length;


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "subject-card";


      card.innerHTML = `
        📖 ${subject}
        <br>
        <small>
          ${count}件
        </small>
      `;


      card.onclick =
        () =>
          openSubject(
            subject
          );


      list.appendChild(
        card
      );

    }
  );

};


/* ==================================================
   教科
================================================== */

function openSubject(
  subject
) {

  currentSubject =
    subject;


  showPage(
    "reflectionPage"
  );


  document.getElementById(
    "reflectionTitle"
  ).textContent =
    `📝 ${currentStudent}番　${subject}`;


  const data =
    getStudentData()
      .filter(
        x =>
          x.subject ===
          subject
      )
      .sort(
        (a,b) =>
          new Date(b.date) -
          new Date(a.date)
      );


  const area =
    document.getElementById(
      "reflectionList"
    );


  if (!data.length) {

    area.innerHTML =
      "この教科の振り返りはありません。";

    return;

  }


  area.innerHTML =
    data.map(
      item => `

      <div class="reflection-card">

        <small>
          ${formatDate(item.date)}
        </small>

        <h3>
          ${escapeHtml(
            item.unit || ""
          )}
        </h3>

        <p>
          ${escapeHtml(
            item.study || ""
          )}
        </p>

        ${
          item.aiQuestion
          ?
          `
          <div class="lesson-box">
            🤖 AIからの問い
            <br>
            ${escapeHtml(
              item.aiQuestion
            )}
          </div>
          `
          :
          ""
        }

        ${
          item.deepReflection
          ?
          `
          <div class="active-box">

            🌱 深まりレベル：
            ${escapeHtml(
              item.deepLevel || ""
            )}

            <p>
              ${escapeHtml(
                item.deepReflection
              )}
            </p>

          </div>
          `
          :
          ""
        }

      </div>

    `
    ).join("");

}


/* ==================================================
   児童データ
================================================== */

function getStudentData() {

  return allData.filter(
    item =>
      String(
        item.studentNumber ??
        item.name ??
        ""
      ) ===
      String(
        currentStudent
      )
  );

}


/* ==================================================
   1年間
================================================== */

window.openYearSummary =
function() {

  showPage(
    "yearPage"
  );


  const data =
    getStudentData()
      .sort(
        (a,b) =>
          new Date(a.date) -
          new Date(b.date)
      );


  document.getElementById(
    "yearTitle"
  ).textContent =
    `📚 ${currentStudent}番　1年間の振り返り`;


  createYearSummary(
    data
  );

};


/* ==================================================
   年間集計
================================================== */

function createYearSummary(
  data
) {

  const stats =
    document.getElementById(
      "yearStats"
    );

  const content =
    document.getElementById(
      "yearContent"
    );


  const l1 =
    data.filter(
      x =>
        String(
          x.deepLevel
        ) === "1"
    ).length;


  const l2 =
    data.filter(
      x =>
        String(
          x.deepLevel
        ) === "2"
    ).length;


  const l3 =
    data.filter(
      x =>
        String(
          x.deepLevel
        ) === "3"
    ).length;


  stats.innerHTML = `

    <div class="stat-grid">

      <div class="stat-card">
        📝
        <div class="stat-number">
          ${data.length}
        </div>
        振り返り
      </div>

      <div class="stat-card">
        🌱
        <div class="stat-number">
          ${l1}
        </div>
        レベル1
      </div>

      <div class="stat-card">
        🌿
        <div class="stat-number">
          ${l2}
        </div>
        レベル2
      </div>

      <div class="stat-card">
        🌳
        <div class="stat-number">
          ${l3}
        </div>
        レベル3
      </div>

    </div>

  `;


  let html =
    "<h3>📖 教科別の学び</h3>";


  SUBJECTS.forEach(
    subject => {

      const items =
        data.filter(
          x =>
            x.subject ===
            subject
        );


      if (!items.length) return;


      html += `

        <div class="summary-box">

          <h3>
            📘 ${subject}
          </h3>

          <p>
            振り返り：
            ${items.length}件
          </p>

      `;


      items
        .slice(-5)
        .reverse()
        .forEach(
          item => {

            html += `

              <div
                class="reflection-card"
              >

                <small>
                  ${formatDate(
                    item.date
                  )}
                </small>

                <strong>
                  ${escapeHtml(
                    item.unit || ""
                  )}
                </strong>

                <p>
                  ${escapeHtml(
                    item.study || ""
                  )}
                </p>

              </div>

            `;

          }
        );


      html +=
        "</div>";

    }
  );


  const growth =
    data.filter(
      x =>
        String(
          x.deepLevel
        ) === "3"
    );


  html += `
    <div class="growth-box">

      <h3>
        🌳 成長が見られる振り返り
      </h3>
  `;


  if (growth.length) {

    growth
      .slice(-10)
      .reverse()
      .forEach(
        item => {

          html += `

            <p>
              <strong>
                ${escapeHtml(
                  item.subject
                )}
              </strong>
              ・
              ${escapeHtml(
                item.unit
              )}
              <br>

              ${escapeHtml(
                item.study
              )}

              ${
                item.deepReflection
                ?
                `<br>
                 🌱
                 ${escapeHtml(
                   item.deepReflection
                 )}`
                :
                ""
              }

            </p>

          `;

        }
      );

  }
  else {

    html +=
      "<p>まだレベル3の振り返りはありません。</p>";

  }


  html +=
    "</div>";

window.copyComment =
async function() {

  const text =
    document.getElementById(
      "commentText"
    ).value;


  try {

    await navigator.clipboard
      .writeText(text);

    document.getElementById(
      "copyMessage"
    ).textContent =
      "📋 Copilot用文章をコピーしました！";

  }
  catch {

    const textarea =
      document.getElementById(
        "commentText"
      );

    textarea.select();

    document.execCommand(
      "copy"
    );

    document.getElementById(
      "copyMessage"
    ).textContent =
      "📋 コピーしました！";

  }

};

/* ==================================================
   日付
================================================== */

function formatDate(
  value
) {

  if (!value)
    return "";

  const d =
    new Date(value);


  if (
    isNaN(
      d.getTime()
    )
  )
    return String(value);


  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;

}


/* ==================================================
   HTML安全化
================================================== */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  )
    return "";


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
