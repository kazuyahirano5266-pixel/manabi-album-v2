<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2 先生ページ</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
  background:#f3f6fa;
  color:#333;
}

/* =========================
   ヘッダー
========================= */

header{
  background:linear-gradient(
    135deg,
    #4f8cff,
    #6c63ff
  );
  color:white;
  padding:22px 25px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:6px 0 0;
  font-size:14px;
}

/* =========================
   全体
========================= */

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.box{
  background:white;
  border-radius:18px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:
    0 4px 15px rgba(0,0,0,.07);
}

/* =========================
   授業情報
========================= */

.lesson-card{
  border-left:7px solid #43b883;
  background:#f8fffb;
}

.lesson-card.ended{
  border-left-color:#aaa;
  background:#f7f7f7;
}

.lesson-status{
  font-size:14px;
  font-weight:bold;
  color:#43a56f;
}

.lesson-status.ended{
  color:#777;
}

.lesson-subject{
  font-size:30px;
  font-weight:bold;
  margin:8px 0;
}

.lesson-unit{
  font-size:19px;
  color:#555;
}

.lesson-id{
  margin-top:12px;
  font-size:13px;
  color:#888;
}

/* =========================
   ボタン
========================= */

button{
  border:none;
  border-radius:11px;
  padding:12px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.85;
}

.primary{
  background:#4f8cff;
  color:white;
}

.green{
  background:#43b883;
  color:white;
}

.red{
  background:#e85b5b;
  color:white;
}

.gray{
  background:#e9edf4;
  color:#333;
}

.button-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

/* =========================
   統計
========================= */

.stats{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:15px;
}

.stat{
  background:#f7f9fc;
  border-radius:14px;
  padding:18px;
  text-align:center;
}

.stat-title{
  font-size:14px;
  color:#777;
}

.stat-number{
  font-size:30px;
  font-weight:bold;
  margin-top:5px;
}

/* =========================
   ナビゲーション
========================= */

.breadcrumb{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
  color:#777;
  font-size:14px;
}

.breadcrumb span{
  font-weight:bold;
  color:#4f8cff;
}

/* =========================
   児童一覧
========================= */

.student-table{
  width:100%;
  border-collapse:collapse;
}

.student-table th{
  background:#f0f4fa;
  padding:14px;
  text-align:left;
  font-size:14px;
}

.student-table td{
  padding:14px;
  border-bottom:1px solid #eee;
}

.student-row{
  cursor:pointer;
}

.student-row:hover{
  background:#f8fbff;
}

.student-name{
  font-size:18px;
  font-weight:bold;
}

.number{
  font-weight:bold;
}

.level3{
  color:#d88b00;
  font-weight:bold;
}

.not-submitted{
  color:#999;
}

.search{
  width:100%;
  padding:14px;
  border:
    1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:15px;
}

/* =========================
   教科
========================= */

.subject-grid{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:14px;
}

.subject-card{
  background:#fff;
  border:2px solid #e4e9f2;
  border-radius:15px;
  padding:20px;
  cursor:pointer;
  text-align:center;
}

.subject-card:hover{
  border-color:#4f8cff;
  background:#f7faff;
}

.subject-name{
  font-size:20px;
  font-weight:bold;
}

.subject-count{
  margin-top:7px;
  color:#777;
  font-size:14px;
}

/* =========================
   単元
========================= */

.unit-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.unit-card{
  background:white;
  border:
    1px solid #e1e6ef;
  border-radius:14px;
  padding:18px;
  cursor:pointer;
}

.unit-card:hover{
  background:#f7faff;
  border-color:#4f8cff;
}

.unit-title{
  font-size:19px;
  font-weight:bold;
}

.unit-info{
  color:#777;
  margin-top:6px;
  font-size:14px;
}

/* =========================
   振り返り
========================= */

.reflection-card{
  background:white;
  border-radius:17px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:
    0 3px 12px rgba(0,0,0,.06);
}

.reflection-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.date{
  color:#888;
  font-size:13px;
}

.study-box{
  margin-top:18px;
  line-height:1.9;
  white-space:pre-wrap;
}

.ai-box{
  margin-top:18px;
  background:#eef7ff;
  border-left:6px solid #4f8cff;
  border-radius:10px;
  padding:16px;
  line-height:1.7;
}

.deep-box{
  margin-top:18px;
  background:#fff9e8;
  border-left:6px solid #f2b94b;
  border-radius:10px;
  padding:16px;
  line-height:1.8;
  white-space:pre-wrap;
}

.no-deep{
  margin-top:18px;
  background:#f7f7f7;
  color:#888;
  border-radius:10px;
  padding:15px;
}

.level-badge{
  display:inline-block;
  margin-top:15px;
  padding:7px 13px;
  border-radius:20px;
  background:#fff0c7;
  font-weight:bold;
}

.level3-badge{
  background:#fff0a8;
  color:#a56b00;
}

.subject-badge{
  display:inline-block;
  background:#eaf1ff;
  color:#3769c8;
  padding:5px 11px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

/* =========================
   空表示
========================= */

.empty{
  text-align:center;
  color:#888;
  padding:40px 20px;
}

/* =========================
   スマホ
========================= */

@media(max-width:800px){

  .stats{
    grid-template-columns:1fr;
  }

  .subject-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .student-table th:nth-child(3),
  .student-table td:nth-child(3),
  .student-table th:nth-child(4),
  .student-table td:nth-child(4){
    display:none;
  }

}

@media(max-width:600px){

  .container{
    padding:12px;
  }

  header h1{
    font-size:23px;
  }

  .subject-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .lesson-subject{
    font-size:25px;
  }

}

</style>

</head>

<body>

<header>

  <h1>👩‍🏫 学びアルバム Ver.2</h1>

  <p>
    先生ページ
  </p>

</header>


<div class="container">


<!-- ==================================================
     PAGE 1 授業管理
================================================== -->

<section
  id="lessonPage"
  class="page active">

  <div class="box">

    <h2>📚 現在の授業</h2>

    <div
      id="lessonInfo">

      授業情報を読み込んでいます……

    </div>

    <div class="button-row">

      <button
        class="primary"
        onclick="showStartArea()">

        ▶️ 新しい授業を開始

      </button>

      <button
        class="red"
        onclick="endLesson()">

        ⏹️ 授業終了

      </button>

    </div>

  </div>


  <!-- 授業開始入力 -->

  <div
    id="startArea"
    class="box"
    style="display:none;">

    <h2>
      ▶️ 授業を開始
    </h2>

    <label>
      教科
    </label>

    <select id="subject">

      <option value="">
        教科を選択してください
      </option>

      <option>国語</option>
      <option>算数</option>
      <option>生活</option>
      <option>理科</option>
      <option>社会</option>
      <option>総合</option>
      <option>道徳</option>
      <option>体育</option>

    </select>


    <label>
      単元名
    </label>

    <input
      id="unit"
      type="text"
      placeholder="例：わり算の考え方">


    <div class="button-row">

      <button
        class="green"
        onclick="startLesson()">

        授業を開始する

      </button>

      <button
        class="gray"
        onclick="hideStartArea()">

        キャンセル

      </button>

    </div>

  </div>


  <!-- 統計 -->

  <div class="box">

    <h2>
      📊 現在の授業の状況
    </h2>

    <div
      id="stats"
      class="stats">
    </div>

  </div>


  <div class="box">

    <button
      class="primary"
      onclick="openStudents()">

      👦👧 児童の振り返りを見る

    </button>

  </div>

</section>


<!-- ==================================================
     PAGE 2 児童一覧
================================================== -->

<section
  id="studentsPage"
  class="page">

  <div class="breadcrumb">

    <button
      class="gray"
      onclick="showPage('lessonPage')">

      ← 授業管理

    </button>

    <span>
      児童一覧
    </span>

  </div>


  <div class="box">

    <h2>
      👦👧 児童一覧
    </h2>

    <p>
      児童を選ぶと、その児童の学びを詳しく見ることができます。
    </p>


    <input
      id="studentSearch"
      class="search"
      placeholder="🔍 児童名を検索"
      oninput="displayStudents()">


    <div id="studentTableArea">

    </div>

  </div>

</section>


<!-- ==================================================
     PAGE 3 教科一覧
================================================== -->

<section
  id="subjectsPage"
  class="page">

  <div class="breadcrumb">

    <button
      class="gray"
      onclick="openStudents()">

      ← 児童一覧

    </button>

    <span id="breadcrumbStudent">
    </span>

  </div>


  <div class="box">

    <h2 id="subjectsTitle">
      📚 教科を選択
    </h2>

    <p>
      見たい教科を選択してください。
    </p>

    <div
      id="subjectGrid"
      class="subject-grid">

    </div>

  </div>

</section>


<!-- ==================================================
     PAGE 4 単元一覧
================================================== -->

<section
  id="unitsPage"
  class="page">

  <div class="breadcrumb">

    <button
      class="gray"
      onclick="openStudentSubjects()">

      ← 教科一覧

    </button>

    <span id="breadcrumbUnit">
    </span>

  </div>


  <div class="box">

    <h2 id="unitsTitle">
      📘 単元を選択
    </h2>

    <div
      id="unitList"
      class="unit-list">

    </div>

  </div>

</section>


<!-- ==================================================
     PAGE 5 振り返り一覧
================================================== -->

<section
  id="reflectionsPage"
  class="page">

  <div class="breadcrumb">

    <button
      class="gray"
      onclick="openUnits()">

      ← 単元一覧

    </button>

    <span id="breadcrumbReflection">
    </span>

  </div>


  <div
    class="box">

    <h2 id="reflectionsTitle">
      ✏️ 振り返り
    </h2>

    <div
      id="reflectionList">

    </div>

  </div>

</section>


</div>


<script type="module">


/* ==================================================
   Firebase
================================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  updateDoc,
  onSnapshot,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   Firebase設定
================================================== */

const firebaseConfig = {

  apiKey:
    "ここにAPI_KEY",

  authDomain:
    "ここにAUTH_DOMAIN",

  projectId:
    "ここにPROJECT_ID",

  storageBucket:
    "ここにSTORAGE_BUCKET",

  messagingSenderId:
    "ここにMESSAGING_SENDER_ID",

  appId:
    "ここにAPP_ID"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* ==================================================
   データ
================================================== */

let currentLesson = null;

let allReflections = [];

let selectedStudent = "";

let selectedSubject = "";

let selectedUnit = "";


/* ==================================================
   ページ切り替え
================================================== */

window.showPage =
function(pageId){

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document
    .getElementById(pageId)
    .classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* ==================================================
   現在の授業を監視
================================================== */

const lessonRef =
  doc(
    db,
    "currentLesson",
    "today"
  );


onSnapshot(
  lessonRef,
  snapshot=>{

    if(snapshot.exists()){

      currentLesson =
        snapshot.data();

    }else{

      currentLesson = null;

    }

    showLesson();

    loadReflections();

  },
  error=>{

    console.error(error);

    document.getElementById(
      "lessonInfo"
    ).innerHTML =

      `<div class="empty">
        Firebaseとの接続を確認してください。
      </div>`;

  }
);


/* ==================================================
   授業表示
================================================== */

function showLesson(){

  const area =
    document.getElementById(
      "lessonInfo"
    );


  if(!currentLesson){

    area.innerHTML =
      `<div class="lesson-card ended box">
        ⏸️ 現在、授業は設定されていません。
      </div>`;

    return;

  }


  const active =
    currentLesson.active === true;


  area.innerHTML = `

    <div class="
      lesson-card
      ${active ? "" : "ended"}
      box">

      <div class="
        lesson-status
        ${active ? "" : "ended"}">

        ${active
          ? "🟢 授業中"
          : "⏸️ 授業終了"}

      </div>

      <div class="lesson-subject">

        ${escapeHtml(
          currentLesson.subject || ""
        )}

      </div>

      <div class="lesson-unit">

        📘
        ${escapeHtml(
          currentLesson.unit || ""
        )}

      </div>

      <div class="lesson-id">

        授業ID：
        ${escapeHtml(
          currentLesson.lessonId || ""
        )}

      </div>

    </div>

  `;

}


/* ==================================================
   授業開始画面
================================================== */

window.showStartArea =
function(){

  document.getElementById(
    "startArea"
  ).style.display = "block";

};


window.hideStartArea =
function(){

  document.getElementById(
    "startArea"
  ).style.display = "none";

};


/* ==================================================
   授業ID自動作成
================================================== */

function createLessonId(){

  const now =
    new Date();


  const datePart =

    now.getFullYear() +

    String(
      now.getMonth()+1
    ).padStart(2,"0") +

    String(
      now.getDate()
    ).padStart(2,"0") +

    "-" +

    String(
      now.getHours()
    ).padStart(2,"0") +

    String(
      now.getMinutes()
    ).padStart(2,"0") +

    String(
      now.getSeconds()
    ).padStart(2,"0");


  const randomPart =

    Math.random()
      .toString(36)
      .substring(2,7)
      .toUpperCase();


  return datePart +
         "-" +
         randomPart;

}


/* ==================================================
   授業開始
================================================== */

window.startLesson =
async function(){

  const subject =
    document
      .getElementById("subject")
      .value;


  const unit =
    document
      .getElementById("unit")
      .value
      .trim();


  if(!subject){

    alert(
      "教科を選択してください。"
    );

    return;

  }


  if(!unit){

    alert(
      "単元名を入力してください。"
    );

    return;

  }


  const lessonId =
    createLessonId();


  try{

    await setDoc(

      doc(
        db,
        "currentLesson",
        "today"
      ),

      {

        lessonId:lessonId,

        subject:subject,

        unit:unit,

        active:true,

        startedAt:
          serverTimestamp(),

        createdAt:
          new Date().toLocaleString(
            "ja-JP"
          )

      }

    );


    hideStartArea();


    alert(
      "授業を開始しました！"
    );


  }catch(error){

    console.error(error);

    alert(
      "授業を開始できませんでした。"
    );

  }

};


/* ==================================================
   授業終了
================================================== */

window.endLesson =
async function(){

  if(!currentLesson){

    alert(
      "現在の授業はありません。"
    );

    return;

  }


  if(!confirm(
    "現在の授業を終了しますか？"
  )){

    return;

  }


  try{

    await updateDoc(

      doc(
        db,
        "currentLesson",
        "today"
      ),

      {

        active:false,

        endedAt:
          serverTimestamp()

      }

    );


    alert(
      "授業を終了しました。"
    );


  }catch(error){

    console.error(error);

    alert(
      "授業を終了できませんでした。"
    );

  }

};


/* ==================================================
   振り返り読み込み
================================================== */

async function loadReflections(){

  try{

    const snapshot =
      await getDocs(
        collection(db,"manabi")
      );


    allReflections = [];


    snapshot.forEach(
      item=>{

        allReflections.push({

          id:item.id,

          ...item.data()

        });

      }
    );


    updateStats();


    if(
      document
        .getElementById(
          "studentsPage"
        )
        .classList
        .contains("active")
    ){

      displayStudents();

    }


  }catch(error){

    console.error(error);

  }

}


/* ==================================================
   現在授業のデータ
================================================== */

function getCurrentLessonData(){

  if(!currentLesson){

    return [];

  }


  return allReflections.filter(

    item =>
      item.lessonId ===
      currentLesson.lessonId

  );

}


/* ==================================================
   統計
================================================== */

function updateStats(){

  const area =
    document.getElementById(
      "stats"
    );


  const data =
    getCurrentLessonData();


  const students =
    new Set(
      data
        .map(item=>item.name)
        .filter(Boolean)
    );


  const level3 =
    data.filter(
      item =>
        Number(
          item.deepLevel || 0
        ) >= 3
    );


  area.innerHTML = `

    <div class="stat">

      <div class="stat-title">
        👦👧 振り返りを書いた児童
      </div>

      <div class="stat-number">
        ${students.size}
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        ✏️ 振り返り数
      </div>

      <div class="stat-number">
        ${data.length}
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        🌟 レベル3
      </div>

      <div class="stat-number">
        ${level3.length}
      </div>

    </div>

  `;

}


/* ==================================================
   児童一覧
================================================== */

window.openStudents =
function(){

  showPage(
    "studentsPage"
  );

  displayStudents();

};


window.displayStudents =
function(){

  const area =
    document.getElementById(
      "studentTableArea"
    );


  const keyword =
    document
      .getElementById(
        "studentSearch"
      )
      .value
      .trim();


  const data =
    getCurrentLessonData();


  const map = {};


  data.forEach(item=>{

    const name =
      item.name || "名前なし";


    if(!map[name]){

      map[name] = {

        count:0,

        level3:0,

        latest:""

      };

    }


    map[name].count++;


    if(
      Number(
        item.deepLevel || 0
      ) >= 3
    ){

      map[name].level3++;

    }


    if(
      String(item.date || "")
        > String(map[name].latest || "")
    ){

      map[name].latest =
        item.date || "";

    }

  });


  let names =
    Object.keys(map)
      .sort(
        (a,b)=>
          a.localeCompare(
            b,
            "ja"
          )
      );


  if(keyword){

    names =
      names.filter(
        name =>
          name.includes(
            keyword
          )
      );

  }


  if(names.length === 0){

    area.innerHTML =

      `<div class="empty">
        この授業の振り返りはまだありません。
      </div>`;

    return;

  }


  area.innerHTML = `

    <table
      class="student-table">

      <thead>

        <tr>

          <th>
            児童名
          </th>

          <th>
            振り返り
          </th>

          <th>
            🌟レベル3
          </th>

          <th>
            最終提出
          </th>

        </tr>

      </thead>

      <tbody>

        ${
          names
            .map(
              name=>`

                <tr
                  class="student-row"
                  onclick=
                  "openStudent('${escapeJs(name)}')">

                  <td>

                    <div class="student-name">
                      👤
                      ${escapeHtml(name)}
                    </div>

                  </td>

                  <td class="number">

                    ${map[name].count}件

                  </td>

                  <td
                    class=
                    "${
                      map[name].level3 > 0
                      ? "level3"
                      : "not-submitted"
                    }">

                    ${map[name].level3}件

                  </td>

                  <td>

                    ${escapeHtml(
                      map[name].latest ||
                      "-"
                    )}

                  </td>

                </tr>

              `
            )
            .join("")
        }

      </tbody>

    </table>

  `;

};


/* ==================================================
   児童 → 教科
================================================== */

window.openStudent =
function(name){

  selectedStudent =
    name;


  showPage(
    "subjectsPage"
  );


  document.getElementById(
    "breadcrumbStudent"
  ).textContent =
    name;


  document.getElementById(
    "subjectsTitle"
  ).textContent =
    "📚 " +
    name +
    " さんの教科";


  const data =
    allReflections.filter(
      item =>
        item.name === name
    );


  const subjects =
    [...new Set(
      data.map(
        item=>item.subject
      )
    )];


  const area =
    document.getElementById(
      "subjectGrid"
    );


  if(subjects.length === 0){

    area.innerHTML =
      `<div class="empty">
        振り返りはありません。
      </div>`;

    return;

  }


  area.innerHTML =

    subjects
      .map(
        subject=>{

          const count =
            data.filter(
              item =>
                item.subject ===
                subject
            ).length;


          return `

            <div
              class="subject-card"
              onclick=
              "openSubject('${escapeJs(subject)}')">

              <div class="subject-name">

                📚
                ${escapeHtml(subject)}

              </div>

              <div class="subject-count">

                振り返り
                ${count}件

              </div>

            </div>

          `;

        }
      )
      .join("");

};


/* ==================================================
   教科一覧へ戻る
================================================== */

window.openStudentSubjects =
function(){

  openStudent(
    selectedStudent
  );

};


/* ==================================================
   教科 → 単元
================================================== */

window.openSubject =
function(subject){

  selectedSubject =
    subject;


  showPage(
    "unitsPage"
  );


  document.getElementById(
    "breadcrumbUnit"
  ).textContent =
    selectedStudent +
    " ＞ " +
    subject;


  document.getElementById(
    "unitsTitle"
  ).textContent =
    "📘 " +
    subject +
    " の単元";


  const data =
    allReflections.filter(

      item =>
        item.name ===
        selectedStudent &&

        item.subject ===
        subject

    );


  const unitMap = {};


  data.forEach(item=>{

    const unit =
      item.unit ||
      "単元名なし";


    if(!unitMap[unit]){

      unitMap[unit] = {

        count:0,

        latest:""

      };

    }


    unitMap[unit].count++;


    if(
      String(item.date || "")
        >
      String(
        unitMap[unit].latest || ""
      )
    ){

      unitMap[unit].latest =
        item.date || "";

    }

  });


  const area =
    document.getElementById(
      "unitList"
    );


  const units =
    Object.keys(unitMap);


  if(units.length === 0){

    area.innerHTML =
      `<div class="empty">
        単元はありません。
      </div>`;

    return;

  }


  area.innerHTML =

    units
      .map(
        unit=>`

          <div
            class="unit-card"
            onclick=
            "openUnit('${escapeJs(unit)}')">

            <div class="unit-title">

              📘
              ${escapeHtml(unit)}

            </div>

            <div class="unit-info">

              振り返り
              ${unitMap[unit].count}件
              ／
              最終提出
              ${escapeHtml(
                unitMap[unit].latest ||
                "-"
              )}

            </div>

          </div>

        `
      )
      .join("");

};


/* ==================================================
   単元一覧へ戻る
================================================== */

window.openUnits =
function(){

  openSubject(
    selectedSubject
  );

};


/* ==================================================
   単元 → 振り返り
================================================== */

window.openUnit =
function(unit){

  selectedUnit =
    unit;


  showPage(
    "reflectionsPage"
  );


  document.getElementById(
    "breadcrumbReflection"
  ).textContent =

    selectedStudent +
    " ＞ " +
    selectedSubject +
    " ＞ " +
    selectedUnit;


  document.getElementById(
    "reflectionsTitle"
  ).textContent =

    "✏️ " +
    selectedStudent +
    " さん ／ " +
    selectedSubject +
    " ／ " +
    selectedUnit;


  const data =
    allReflections.filter(

      item =>

        item.name ===
        selectedStudent &&

        item.subject ===
        selectedSubject &&

        (
          item.unit ||
          "単元名なし"
        ) === selectedUnit

    );


  data.sort(

    (a,b)=>
      String(
        b.date || ""
      ).localeCompare(
        String(
          a.date || ""
        )
      )

  );


  const area =
    document.getElementById(
      "reflectionList"
    );


  if(data.length === 0){

    area.innerHTML =
      `<div class="empty">
        振り返りはありません。
      </div>`;

    return;

  }


  area.innerHTML =
    data
      .map(
        item =>
          createReflectionCard(
            item
          )
      )
      .join("");

};


/* ==================================================
   振り返りカード
================================================== */

function createReflectionCard(item){

  const level =
    Number(
      item.deepLevel || 1
    );


  let levelText =
    "レベル1";


  if(level === 2){

    levelText =
      "レベル2";

  }


  if(level >= 3){

    levelText =
      "🌟 レベル3";

  }


  return `

    <div class="reflection-card">

      <div
        class="reflection-header">

        <div>

          <span class="subject-badge">

            ${escapeHtml(
              item.subject || ""
            )}

          </span>

          <strong>

            ${escapeHtml(
              item.unit || ""
            )}

          </strong>

        </div>


        <div class="date">

          ${escapeHtml(
            item.date || ""
          )}

        </div>

      </div>


      <!-- 今日の学び -->

      <div class="study-box">

        <strong>
          ✏️ 今日の学び
        </strong>

        <br><br>

        ${escapeHtml(
          item.study || ""
        )}

      </div>


      <!-- AIの問い -->

      ${
        item.aiQuestion

        ? `

          <div class="ai-box">

            <strong>
              🤖 AIからの問い
            </strong>

            <br><br>

            ${escapeHtml(
              item.aiQuestion
            )}

          </div>

        `

        : ""

      }


      <!-- レベル -->

      <div
        class="
          level-badge
          ${
            level >= 3
              ? "level3-badge"
              : ""
          }
        ">

        🌱
        振り返り
        ${levelText}

      </div>


      <!-- 深まり -->

      ${
        item.deepReflection

        ? `

          <div class="deep-box">

            <strong>
              🌱 深まり振り返り
            </strong>

            <br><br>

            ${escapeHtml(
              item.deepReflection
            )}

          </div>

        `

        : `

          <div class="no-deep">

            🌱
            まだ「深まり振り返り」は
            書かれていません。

          </div>

        `

      }

    </div>

  `;

}


/* ==================================================
   HTML安全化
================================================== */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJs(value){

  return String(value)

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    );

}
