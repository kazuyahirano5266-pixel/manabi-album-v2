<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:sans-serif;
background:#f0f8ff;
margin:0;
padding:25px;
color:#333;
}

.box{
background:white;
padding:25px;
border-radius:25px;
max-width:1100px;
margin:0 auto;
}

h1{
text-align:center;
}

button{
padding:13px 25px;
border:none;
border-radius:20px;
background:#2b7a78;
color:white;
font-size:17px;
margin:8px;
cursor:pointer;
}

button:hover{
opacity:0.85;
}

input,
textarea,
select{
width:90%;
padding:12px;
font-size:18px;
margin:8px;
border:1px solid #ccc;
border-radius:10px;
}

textarea{
min-height:100px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 3px 8px #ccc;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:20px;
}

.reflection-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-top:20px;
}

.advice-box{
background:#eaf6ff;
padding:15px;
border-radius:20px;
margin:15px 0;
}

.comment-box{
background:#fff4d6;
padding:15px;
border-radius:20px;
margin:15px 0;
}

.study-box{
background:#f5f5f5;
padding:15px;
border-radius:15px;
margin:10px 0;
line-height:1.7;
}

.deep-box{
background:#f0fff0;
padding:15px;
border-radius:15px;
margin:10px 0;
line-height:1.7;
}

.level-box{
background:#eaf6ff;
padding:12px;
border-radius:15px;
margin:10px 0;
}

.hidden{
display:none;
}

.menu-button{
display:block;
width:80%;
max-width:600px;
margin:18px auto;
font-size:20px;
padding:18px;
}

.back-button{
background:#777;
}

.small-button{
font-size:15px;
padding:10px 18px;
}

.like-button{
background:#f0a500;
}

.empty{
padding:30px;
background:#f8f8f8;
border-radius:20px;
margin-top:20px;
}

.date{
font-size:14px;
color:#777;
}

@media(max-width:900px){

.grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:650px){

body{
padding:10px;
}

.box{
padding:15px;
}

.grid,
.reflection-grid{
grid-template-columns:1fr;
}

.menu-button{
width:95%;
}

}

</style>

</head>

<body>


<!-- =========================
スタートメニュー
========================= -->

<div class="box" id="home">

<h1>
📚 学びアルバム Ver.2
</h1>

<p>
自分の学びを残そう！
</p>

<button
class="menu-button"
onclick="openReflection()">

✏️ 今日の振り返りを書く

</button>

<button
class="menu-button"
onclick="openHistory()">

📖 自分の振り返りを見る

</button>

<button
class="menu-button"
onclick="openEveryoneHistory()">

👫 みんなの振り返りを見る

</button>

</div>



<!-- =========================
振り返り入力
========================= -->

<div
class="box hidden"
id="reflectionPage">

<h1>
✏️ 今日の振り返り
</h1>

<p>名前</p>

<input
id="name"
placeholder="名前を入力してください">


<p>教科</p>

<select id="subject">

<option>国語</option>
<option>算数</option>
<option>生活</option>
<option>理科</option>
<option>社会</option>
<option>総合</option>
<option>道徳</option>
<option>体育</option>

</select>


<p>単元名</p>

<input
id="unit"
placeholder="例：ごんぎつね">


<p>📝 今日の学び</p>

<textarea
id="study"
placeholder="今日の学習で分かったこと、できたことを書こう"
oninput="showAdvice()">
</textarea>


<div class="advice-box">

<h3>
🤖 AIからの問い
</h3>

<p id="studyAdvice">

振り返りを書くと、
学びを深める質問が出ます。

</p>

</div>


<!-- 最初は表示しない -->

<div
id="firstSaveArea">

<button
onclick="save()">

🌟 学びを保存する

</button>

</div>


<p id="msg"></p>


<!-- 保存後に表示 -->

<div
id="deepReflectionArea"
style="display:none;">

<div class="comment-box">

<h3>
✏️ もう一度考えてみよう
</h3>

<p>
AIからの問いをもとに、
もう一度自分の考えを深めてみよう😊
</p>

<textarea
id="deepReflection"
placeholder="考えが変わったことや、新しく気付いたことを書こう">
</textarea>

</div>

<button
onclick="saveDeepReflection()">

✏️ 考えを深めて保存する

</button>

</div>


<br>

<button
class="back-button"
onclick="backHome()">

🏠 戻る

</button>

</div>



<!-- =========================
自分の振り返り
========================= -->

<div
class="box hidden"
id="historyPage">

<h1>
📖 自分の学びアルバム
</h1>

<div id="historyList"></div>

<br>

<button
class="back-button"
onclick="backHome()">

🏠 戻る

</button>

</div>



<!-- =========================
みんなの振り返り
========================= -->

<div
class="box hidden"
id="everyonePage">

<h1>
👫 みんなの振り返り
</h1>

<div id="everyoneList"></div>

<br>

<button
class="back-button"
onclick="backHome()">

🏠 戻る

</button>

</div>



<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {

getFirestore,
collection,
addDoc,
query,
where,
getDocs,
updateDoc,
doc

}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


/* =========================
Firebase
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain:
"manabi-album-v2.firebaseapp.com",

projectId:
"manabi-album-v2",

storageBucket:
"manabi-album-v2.firebasestorage.app",

messagingSenderId:
"226258471812",

appId:
"1:226258471812:web:15230ba15e7e0bd7d86bd1"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =========================
一時保存
========================= */

let currentDocumentId = "";

let currentAdvice = "";

let myData = [];

let everyoneData = [];


/* =========================
ページ移動
========================= */

window.openReflection=function(){

document.getElementById("home").style.display="none";

document.getElementById("historyPage").style.display="none";

document.getElementById("everyonePage").style.display="none";

document.getElementById("reflectionPage").style.display="block";

};


window.backHome=function(){

document.getElementById("home").style.display="block";

document.getElementById("reflectionPage").style.display="none";

document.getElementById("historyPage").style.display="none";

document.getElementById("everyonePage").style.display="none";

};


/* =========================
AIからの問い
========================= */

window.showAdvice=function(){

const subject =
document.getElementById("subject").value;

const study =
document.getElementById("study").value;

let advice="";


if(!study){

document.getElementById("studyAdvice").innerHTML=
"振り返りを書くと、学びを深める質問が出ます。";

currentAdvice="";

return;

}


/* 国語 */

if(subject==="国語"){

if(study.includes("友達")){

advice=
"友達のどんな考えを聞いて、自分の考えはどのように変わりましたか？";

}

else if(
study.includes("理由") ||
study.includes("考え")
){

advice=
"その考えを支える理由や、もとになった言葉は何ですか？";

}

else{

advice=
"文章や友達の考えから、新しく気付いたことは何ですか？";

}

}


/* 算数 */

else if(subject==="算数"){

advice=
"その考え方は、別の問題でも使えそうですか？工夫したところを説明してみよう。";

}


/* 理科 */

else if(subject==="理科"){

advice=
"予想と結果を比べて、なぜその結果になったのか考えてみよう。";

}


/* 社会 */

else if(subject==="社会"){

advice=
"調べて分かったことは、私たちの生活とどんな関係がありますか？";

}


/* 生活 */

else if(subject==="生活"){

advice=
"見つけたことや気付いたことから、どんな発見や驚きがありましたか？";

}


/* 総合 */

else if(subject==="総合"){

if(
study.includes("地域") ||
study.includes("武蔵村山")
){

advice=
"その学びを誰に伝えたいですか？伝えるためにどんな工夫ができますか？";

}

else{

advice=
"調べたことから、新しく生まれた疑問や課題は何ですか？";

}

}


/* 道徳 */

else if(subject==="道徳"){

advice=
"その考えを大切にした理由は何ですか？自分の生活でどう生かせそうですか？";

}


/* 体育 */

else if(subject==="体育"){

advice=
"できるようになるために工夫したことや、友達から学んだことは何ですか？";

}


else{

advice=
"今日の学びから、新しく気付いたことを書いてみよう。";

}


currentAdvice=advice;

document.getElementById("studyAdvice").innerHTML=
"🤖 "+advice;

};


/* =========================
学びを保存
========================= */

window.save=async function(){

const name=
document.getElementById("name").value.trim();

const subject=
document.getElementById("subject").value;

const unit=
document.getElementById("unit").value.trim();

const study=
document.getElementById("study").value.trim();


if(!name){

alert("名前を入力してください");

return;

}


if(!study){

alert("今日の学びを書いてください");

return;

}


/* AIの問いを作成 */

showAdvice();


try{

const saveData=
await addDoc(

collection(db,"manabi"),

{

name:name,

subject:subject,

unit:unit,

study:study,

aiQuestion:currentAdvice,

deepReflection:"",

likes:0,

date:new Date()

}

);


currentDocumentId=
saveData.id;


document.getElementById("msg").innerHTML=
"🌟 学びを保存しました！";


/* 最初の保存ボタンを消す */

document.getElementById("firstSaveArea").style.display=
"none";


/* 深めるエリアを表示 */

document.getElementById("deepReflectionArea").style.display=
"block";


}catch(error){

console.error(error);

alert(
"保存できませんでした。もう一度試してください。"
);

}

};


/* =========================
深めた考えを保存
========================= */

window.saveDeepReflection=
async function(){

if(!currentDocumentId){

alert("先に「学びを保存する」を押してください");

return;

}


const deep=
document.getElementById("deepReflection").value.trim();


if(!deep){

alert("考えを深めて書いてみましょう😊");

return;

}


try{

await updateDoc(

doc(
db,
"manabi",
currentDocumentId
),

{

deepReflection:deep

}

);


document.getElementById("msg").innerHTML=
"✏️ 考えを深めて保存しました！😊";


}catch(error){

console.error(error);

alert(
"保存できませんでした。"
);

}

};


/* =========================
自分の振り返り
========================= */

window.openHistory=
async function(){

const name=
document.getElementById("name").value.trim();


if(!name){

alert(
"最初に「今日の振り返りを書く」で名前を入力してください。"
);

return;

}


document.getElementById("home").style.display="none";

document.getElementById("historyPage").style.display="block";

document.getElementById("reflectionPage").style.display="none";


try{

const q=query(

collection(db,"manabi"),

where("name","==",name)

);


const result=
await getDocs(q);


myData=[];


result.forEach(d=>{

const data=d.data();

data.id=d.id;

myData.push(data);

});


showMySubjects();


}catch(error){

console.error(error);

alert("読み込みに失敗しました。");

}

};


/* =========================
自分：教科一覧
========================= */

function showMySubjects(){

let html=`

<h2>📁 教科を選んでください</h2>

<div class="grid">

`;


const subjects=[];


myData.forEach(data=>{

if(
data.subject &&
!subjects.includes(data.subject)
){

subjects.push(data.subject);

}

});


subjects.forEach(subject=>{

html+=`

<div class="card">

<h2>
📚 ${subject}
</h2>

<button
onclick="openMySubject('${subject}')">

見る

</button>

</div>

`;

});


html+=`

</div>
`;


if(subjects.length===0){

html+=`

<div class="empty">

まだ振り返りがありません。

</div>

`;

}


document.getElementById("historyList").innerHTML=
html;

}


/* =========================
自分：単元一覧
========================= */

window.openMySubject=
function(subject){

let html=`

<button
class="back-button small-button"
onclick="showMySubjects()">

← 教科一覧へ

</button>

<h2>
📚 ${subject}
</h2>

<h3>
📖 単元を選んでください
</h3>

<div class="grid">

`;


const units=[];


myData.forEach(data=>{

if(
data.subject===subject &&
!units.includes(data.unit)
){

units.push(data.unit);

}

});


units.forEach(unit=>{

html+=`

<div class="card">

<h2>
📖 ${unit || "単元名なし"}
</h2>

<button
onclick="openMyUnit('${subject}', ${JSON.stringify(unit)})">

見る

</button>

</div>

`;

});


html+=`

</div>
`;


document.getElementById("historyList").innerHTML=
html;

};


/* =========================
自分：振り返り一覧
========================= */

window.openMyUnit=
function(subject,unit){

let html=`

<button
class="back-button small-button"
onclick="openMySubject('${subject}')">

← 単元一覧へ

</button>

<h2>
📖 ${unit || "単元名なし"}
</h2>

<div class="reflection-grid">

`;


myData.forEach(data=>{

if(
data.subject===subject &&
data.unit===unit
){

html+=`

<div class="card">

<p class="date">
📅 振り返り
</p>

<div class="study-box">

<b>📝 今日の学び</b>

<br><br>

${data.study || ""}

</div>


<div class="advice-box">

<b>🤖 AIからの問い</b>

<br><br>

${data.aiQuestion || "ありません"}

</div>


<div class="deep-box">

<b>✏️ 深めた考え</b>

<br><br>

${data.deepReflection || "まだありません"}

</div>


<div class="level-box">

⭐ 参考にした人数：
${data.likes || 0}人

</div>

</div>

`;

}

});


html+=`

</div>
`;


document.getElementById("historyList").innerHTML=
html;

};


/* =========================
みんなの振り返り
========================= */

window.openEveryoneHistory=
async function(){

document.getElementById("home").style.display="none";

document.getElementById("reflectionPage").style.display="none";

document.getElementById("historyPage").style.display="none";

document.getElementById("everyonePage").style.display="block";


document.getElementById("everyoneList").innerHTML=
"📚 読み込み中...";


try{

const result=
await getDocs(
collection(db,"manabi")
);


everyoneData=[];


result.forEach(d=>{

const data=d.data();

data.id=d.id;

everyoneData.push(data);

});


showEveryoneSubjects();


}catch(error){

console.error(error);

document.getElementById("everyoneList").innerHTML=
"読み込みに失敗しました。";

}

};


/* =========================
みんな：教科一覧
========================= */

function showEveryoneSubjects(){

let html=`

<h2>
📁 教科を選んでください
</h2>

<div class="grid">

`;


const subjects=[];


everyoneData.forEach(data=>{

if(
data.subject &&
!subjects.includes(data.subject)
){

subjects.push(data.subject);

}

});


subjects.forEach(subject=>{

html+=`

<div class="card">

<h2>
📚 ${subject}
</h2>

<button
onclick="openEveryoneSubject(${JSON.stringify(subject)})">

見る

</button>

</div>

`;

});


html+=`

</div>
`;


if(subjects.length===0){

html+=`

<div class="empty">

まだみんなの振り返りがありません。

</div>

`;

}


document.getElementById("everyoneList").innerHTML=
html;

}


/* =========================
みんな：単元一覧
========================= */

window.openEveryoneSubject=
function(subject){

let html=`

<button
class="back-button small-button"
onclick="showEveryoneSubjects()">

← 教科一覧へ

</button>

<h2>
📚 ${subject}
</h2>

<h3>
📖 単元を選んでください
</h3>

<div class="grid">

`;


const units=[];


everyoneData.forEach(data=>{

if(
data.subject===subject &&
!units.includes(data.unit)
){

units.push(data.unit);

}

});


units.forEach(unit=>{

html+=`

<div class="card">

<h2>
📖 ${unit || "単元名なし"}
</h2>

<button
onclick="openEveryoneUnit(${JSON.stringify(subject)}, ${JSON.stringify(unit)})">

見る

</button>

</div>

`;

});


html+=`

</div>
`;


document.getElementById("everyoneList").innerHTML=
html;

};


/* =========================
みんな：振り返り一覧
========================= */

window.openEveryoneUnit=
function(subject,unit){

let html=`

<button
class="back-button small-button"
onclick="openEveryoneSubject(${JSON.stringify(subject)})">

← 単元一覧へ

</button>

<h2>
📖 ${unit || "単元名なし"}
</h2>

<div class="reflection-grid">

`;


everyoneData.forEach(data=>{

if(
data.subject===subject &&
data.unit===unit
){

html+=`

<div class="card">

<h3>
👤 友達の振り返り
</h3>


<div class="study-box">

<b>📝 今日の学び</b>

<br><br>

${data.study || ""}

</div>


<div class="advice-box">

<b>🤖 AIからの問い</b>

<br><br>

${data.aiQuestion || "ありません"}

</div>


<div class="deep-box">

<b>✏️ 深めた考え</b>

<br><br>

${data.deepReflection || "まだ入力されていません"}

</div>


<button
class="like-button"
onclick="addLike('${data.id}')">

⭐ この考えが参考になった

</button>


<p>

⭐ 参考にした人数：
<b>${data.likes || 0}</b>人

</p>


</div>

`;

}

});


html+=`

</div>
`;


document.getElementById("everyoneList").innerHTML=
html;

};


/* =========================
参考になった
========================= */

window.addLike=
async function(id){

const target=
everyoneData.find(
data=>data.id===id
);


if(!target){

return;

}


try{

await updateDoc(

doc(
db,
"manabi",
id
),

{

likes:
(target.likes || 0)+1

}

);


target.likes=
(target.likes || 0)+1;


alert(
"⭐ 参考にしました！"
);


/* 同じ画面を再表示 */

openEveryoneUnit(
target.subject,
target.unit
);


}catch(error){

console.error(error);

alert(
"保存できませんでした。"
);

}

};


console.log(
"📚 学びアルバム Ver.2 Dynabook版 起動"
);

</script>

</body>

</html>
