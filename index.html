<html lang="ja">

<head>

<meta charset="UTF-8">

<title>学びアルバム Ver.2</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:sans-serif;
background:#f0f8ff;
margin:0;
padding:20px;
color:#333;
}

.box{
background:white;
padding:25px;
border-radius:25px;
max-width:1200px;
margin:0 auto 20px;
}

h1{
text-align:center;
}

h2{
margin-top:10px;
}

border:none;
border-radius:20px;
background:#2b7a78;

}

margin-top:20px;

.reflection-grid{

.comment-box{

}

.study-box{

padding:15px;
border-radius:15px;
margin:10px 0;
line-height:1.7;
}

.deep-box{
background:#f0fff0;
padding:15px;
border-radius:15px;
margin:10px 0;
line-height:1.7;
}

.level-box{
background:#eaf6ff;
padding:12px;
border-radius:15px;
margin:10px 0;
}

.menu-button{
display:block;
width:80%;
max-width:650px;
margin:18px auto;
font-size:20px;
padding:18px;
}

.back-button{
background:#777;
}

.small-button{
font-size:15px;
padding:10px 18px;
}

.like-button{
background:#f0a500;
}

.logout-button{
background:#555;
}

.empty{
padding:30px;
background:#f8f8f8;
border-radius:20px;
margin-top:20px;
text-align:center;
}

.loading{
padding:30px;
text-align:center;
font-size:20px;
}

.section-title{
background:#eaf6ff;
padding:15px;
border-radius:15px;
margin-top:20px;
}

.login-message{
color:#d33;
font-weight:bold;
min-height:25px;
}

.student-info{
text-align:center;
background:#eaf6ff;
padding:12px;
border-radius:15px;
margin-bottom:20px;
font-size:18px;
}

.hidden{
display:none;
}

@media(max-width:900px){

.grid{
grid-template-columns:repeat(2,1fr);
}

.number-grid{
grid-template-columns:repeat(5,1fr);
}

}

@media(max-width:650px){

body{
padding:10px;
}

.box{
padding:15px;
}

.grid,
.reflection-grid{
grid-template-columns:1fr;
}

width:95%;
}

.number-grid{
grid-template-columns:repeat(4,1fr);
}

input,
textarea,
select{
width:95%;
}

}

</style>

</head>

<body>


<!-- ==================================================
ログイン
================================================== -->

📚 学びアルバム

</h1>

番

<option>生活</option>

自分の振り返り
================================================== -->

<div
class="box hidden"
id="historyPage">

📖 自分の学びアルバム
</h1>

<div id="historyList"></div>

<button
class="back-button"
onclick="backHome()">

🏠 戻る

</button>

</div>

みんなの振り返り
================================================== -->

<div
class="box hidden"
id="everyonePage">

<h1>
👫 みんなの振り返り
</h1>

<p style="text-align:center;">
友達の考えを見て、自分の学びをさらに深めよう！
</p>

<div id="everyoneList"></div>

<br>

<button
class="back-button"
onclick="backHome()">

🏠 戻る

</button>

<script type="module">


/* ==================================================
Firebase
================================================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {

getFirestore,
collection,
addDoc,
query,
where,
getDocs,
updateDoc,
doc

}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain:
"manabi-album-v2.firebaseapp.com",

projectId:
"manabi-album-v2",

storageBucket:
"manabi-album-v2.firebasestorage.app",

messagingSenderId:
"226258471812",

appId:
"1:226258471812:web:15230ba15e7e0bd7d86bd1"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* ==================================================
設定
================================================== */

const DEFAULT_PASSWORD = "1111";

let currentStudentNumber = "";

let currentDocumentId = "";

let currentAdvice = "";

let myData = [];

let everyoneData = [];


/* ==================================================
40人の番号ボタン
================================================== */

function createNumberButtons(){

let html="";

for(let i=1;i<=40;i++){

html+=`

<button
class="number-button"
onclick="selectNumber(${i})">

${i}

</button>

`;

}

document.getElementById("numberGrid").innerHTML=html;

}

createNumberButtons();


/* ==================================================
番号選択
================================================== */

window.selectNumber=function(number){

currentStudentNumber=String(number);

document.getElementById("loginPassword").value="";

document.getElementById("loginMessage").innerHTML=

"出席番号："+number+"番を選択しました。";

};


/* ==================================================
ログイン
================================================== */

window.loginStudent=function(){

const password=
document.getElementById("loginPassword").value.trim();

if(!currentStudentNumber){

document.getElementById("loginMessage").innerHTML=
"先に出席番号を選んでください。";

return;

}

if(password!==DEFAULT_PASSWORD){

document.getElementById("loginMessage").innerHTML=
"🔑 パスワードが違います。";

return;

}

localStorage.setItem(
"manabiStudentNumber",
currentStudentNumber
);

showHome();

};


/* ==================================================
自動ログイン
================================================== */

function checkLogin(){

const saved=
localStorage.getItem(
"manabiStudentNumber"
);

if(saved){

currentStudentNumber=saved;

showHome();

}

}


/* ==================================================
ホーム表示
================================================== */

function showHome(){

document.getElementById("loginPage").style.display="none";

document.getElementById("reflectionPage").style.display="none";

document.getElementById("historyPage").style.display="none";

document.getElementById("everyonePage").style.display="none";

document.getElementById("home").style.display="block";

document.getElementById("currentNumber").innerText=
currentStudentNumber;

}


/* ==================================================
ログアウト
================================================== */

window.logoutStudent=function(){

localStorage.removeItem(
"manabiStudentNumber"
);

currentStudentNumber="";

document.getElementById("home").style.display="none";

document.getElementById("reflectionPage").style.display="none";

document.getElementById("historyPage").style.display="none";

document.getElementById("everyonePage").style.display="none";

document.getElementById("loginPage").style.display="block";

document.getElementById("loginPassword").value="";

};


/* ==================================================
ページ移動
================================================== */

window.openReflection=function(){

document.getElementById("home").style.display="none";

document.getElementById("historyPage").style.display="none";

document.getElementById("everyonePage").style.display="none";

document.getElementById("reflectionPage").style.display="block";

document.getElementById("reflectionNumber").innerText=
currentStudentNumber;

};


window.backHome=function(){

showHome();

};


/* ==================================================
安全表示
================================================== */

function escapeHTML(value){

if(value===undefined || value===null){

return "";

}

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==================================================
日付
================================================== */

function formatDate(value){

if(!value){

return "日付なし";

}

try{

if(value.toDate){

return value.toDate().toLocaleString("ja-JP");

}

return new Date(value).toLocaleString("ja-JP");

}catch{

return "日付なし";

}

}


/* ==================================================
AIからの問い
================================================== */

window.showAdvice=function(){

const subject=
document.getElementById("subject").value;

const study=
document.getElementById("study").value;

let advice="";

if(!study){

document.getElementById("studyAdvice").innerHTML=
"振り返りを書くと、学びを深める質問が出ます。";

currentAdvice="";

return;

}


if(subject==="国語"){

if(study.includes("友達")){

advice=
"友達のどんな考えを聞いて、自分の考えはどのように変わりましたか？";

}else if(
study.includes("理由") ||
study.includes("考え")
){

advice=
"その考えを支える理由や、もとになった言葉は何ですか？";

}else{

advice=
"文章や友達の考えから、新しく気付いたことは何ですか？";

}

}

else if(subject==="算数"){

advice=
"その考え方は、別の問題でも使えそうですか？工夫したところを説明してみよう。";

}

else if(subject==="理科"){

advice=
"予想と結果を比べて、なぜその結果になったのか考えてみよう。";

}

else if(subject==="社会"){

advice=
"調べて分かったことは、私たちの生活とどんな関係がありますか？";

}

else if(subject==="生活"){

advice=
"見つけたことや気付いたことから、どんな発見や驚きがありましたか？";

}

else if(subject==="総合"){

if(
study.includes("地域") ||
study.includes("武蔵村山")
){

advice=
"その学びを誰に伝えたいですか？伝えるためにどんな工夫ができますか？";

}else{

advice=
"調べたことから、新しく生まれた疑問や課題は何ですか？";

}

}

else if(subject==="道徳"){

advice=
"その考えを大切にした理由は何ですか？自分の生活でどう生かせそうですか？";

}

else if(subject==="体育"){

advice=
"できるようになるために工夫したことや、友達から学んだことは何ですか？";

}

else{

advice=
"今日の学びから、新しく気付いたことを書いてみよう。";

}

currentAdvice=advice;

document.getElementById("studyAdvice").innerHTML=
"🤖 "+escapeHTML(advice);

};


/* ==================================================
保存
================================================== */

window.save=async function(){

const subject=
document.getElementById("subject").value;

const unit=
document.getElementById("unit").value.trim();

const study=
document.getElementById("study").value.trim();


if(!currentStudentNumber){

alert("ログインしてください。");

return;

}

if(!study){

alert("今日の学びを書いてください。");

return;

}

showAdvice();


try{

const saveData=
await addDoc(

collection(db,"manabi"),

{

/*
名前は保存しない
*/

studentNumber:
Number(currentStudentNumber),

subject:subject,

unit:unit,

study:study,

aiQuestion:currentAdvice,

deepReflection:"",

likes:0,

date:new Date()

}

);


currentDocumentId=
saveData.id;


document.getElementById("msg").innerHTML=
"🌟 学びを保存しました！";


document.getElementById("firstSaveArea").style.display=
"none";

document.getElementById("deepReflectionArea").style.display=
"block";


}catch(error){

console.error(error);

alert(
"保存できませんでした。もう一度試してください。"
);

}

};


/* ==================================================
深めた考え
================================================== */

window.saveDeepReflection=async function(){

if(!currentDocumentId){

alert("先に「学びを保存する」を押してください。");

return;

}

const deep=
document.getElementById("deepReflection").value.trim();

if(!deep){

alert("考えを深めて書いてみましょう😊");

return;

}

try{

await updateDoc(

doc(
db,
"manabi",
currentDocumentId
),

{

deepReflection:deep

}

);

document.getElementById("msg").innerHTML=
"✏️ 考えを深めて保存しました！😊";

}catch(error){

console.error(error);

alert("保存できませんでした。");

}

};


/* ==================================================
自分の振り返り
================================================== */

window.openHistory=async function(){

document.getElementById("home").style.display="none";

document.getElementById("reflectionPage").style.display="none";

document.getElementById("everyonePage").style.display="none";

document.getElementById("historyPage").style.display="block";

document.getElementById("historyList").innerHTML=
'<div class="loading">📚 読み込み中...</div>';


try{

const q=query(

collection(db,"manabi"),

where(
"studentNumber",
"==",
Number(currentStudentNumber)
)

);

const result=
await getDocs(q);

myData=[];

result.forEach(d=>{

myData.push({

...d.data(),

id:d.id

});

});

showMySubjects();

}catch(error){

console.error(error);

document.getElementById("historyList").innerHTML=
'<div class="empty">読み込みに失敗しました。<br>もう一度試してください。</div>';

}

};


/* ==================================================
自分：教科
================================================== */

function showMySubjects(){

let html=`

<h2 class="section-title">
📁 教科を選んでください
</h2>

<div class="grid">
`;

const subjects=[];

myData.forEach(data=>{

if(
data.subject &&
!subjects.includes(data.subject)
){

subjects.push(data.subject);

}

});


subjects.forEach(subject=>{

html+=`

<div class="card">

<h2>
📚 ${escapeHTML(subject)}
</h2>

<button
onclick="openMySubject(${JSON.stringify(subject)})">

見る

</button>

</div>

`;

});


html+=`</div>`;


if(subjects.length===0){

html+=`

<div class="empty">
まだ振り返りがありません。
</div>

`;

}

document.getElementById("historyList").innerHTML=
html;

}


/* ==================================================
自分：単元
================================================== */

window.openMySubject=function(subject){

let html=`

<button
class="back-button small-button"
onclick="showMySubjects()">

← 教科一覧へ

</button>

<h2 class="section-title">
📚 ${escapeHTML(subject)}
</h2>

<h3>
📖 単元を選んでください
</h3>

<div class="grid">
`;

const units=[];

myData.forEach(data=>{

if(data.subject===subject){

const unit=data.unit || "";

if(!units.includes(unit)){

units.push(unit);

}

}

});


units.forEach(unit=>{

html+=`

<div class="card">

<h2>
📖 ${escapeHTML(unit || "単元名なし")}
</h2>

<button
onclick="openMyUnit(
${JSON.stringify(subject)},
${JSON.stringify(unit)}
)">

見る

</button>

</div>

`;

});


html+=`</div>`;

document.getElementById("historyList").innerHTML=
html;

};


/* ==================================================
自分：振り返り
================================================== */

window.openMyUnit=function(subject,unit){

let html=`

<button
class="back-button small-button"
onclick="openMySubject(${JSON.stringify(subject)})">

← 単元一覧へ

</button>

<h2 class="section-title">
📖 ${escapeHTML(unit || "単元名なし")}
</h2>

<div class="reflection-grid">
`;

let count=0;

myData.forEach(data=>{

if(
data.subject===subject &&
(data.unit || "")===unit
){

count++;

html+=`

<div class="card">

<p class="date">
📅 ${formatDate(data.date)}
</p>

<div class="study-box">

<b>📝 今日の学び</b>

<br><br>

${escapeHTML(data.study)}

</div>

<div class="advice-box">

<b>🤖 AIからの問い</b>

<br><br>

${escapeHTML(data.aiQuestion || "ありません")}

</div>

<div class="deep-box">

<b>✏️ 深めた考え</b>

<br><br>

${escapeHTML(
data.deepReflection ||
"まだありません"
)}

</div>

<div class="level-box">

⭐ 参考にした人数：
${Number(data.likes || 0)}人

</div>

</div>

`;

}

});


html+=`</div>`;


if(count===0){

html+=`

<div class="empty">
この単元の振り返りはありません。
</div>

`;

}

document.getElementById("historyList").innerHTML=
html;

};


/* ==================================================
みんなの振り返り
================================================== */

window.openEveryoneHistory=async function(){

document.getElementById("home").style.display="none";

document.getElementById("reflectionPage").style.display="none";

document.getElementById("historyPage").style.display="none";

document.getElementById("everyonePage").style.display="block";

document.getElementById("everyoneList").innerHTML=
'<div class="loading">👫 読み込んでいます...</div>';


try{

const snapshot=
await getDocs(
collection(db,"manabi")
);

everyoneData=[];

snapshot.forEach(d=>{

const data=d.data();

everyoneData.push({

id:d.id,

subject:data.subject || "",

unit:data.unit || "",

study:data.study || "",

aiQuestion:data.aiQuestion || "",

deepReflection:data.deepReflection || "",

likes:Number(data.likes || 0),

date:data.date || null

});

});


showEveryoneSubjects();


}catch(error){

console.error(error);

document.getElementById("everyoneList").innerHTML=`

<div class="empty">

<h2>😢 読み込めませんでした</h2>

<p>
もう一度試してください。
</p>

<button onclick="openEveryoneHistory()">
🔄 もう一度読み込む
</button>

</div>

`;

}

};


/* ==================================================
みんな：教科
================================================== */

function showEveryoneSubjects(){

let html=`

<h2 class="section-title">
📁 教科を選んでください
</h2>

<div class="grid">
`;

const subjects=[];

everyoneData.forEach(data=>{

if(
data.subject &&
!subjects.includes(data.subject)
){

subjects.push(data.subject);

}

});


if(subjects.length===0){

document.getElementById("everyoneList").innerHTML=`

<div class="empty">

<h2>📭 まだ振り返りがありません</h2>

</div>

`;

return;

}


subjects.forEach(subject=>{

html+=`

<div class="card">

<h2>
📚 ${escapeHTML(subject)}
</h2>

<button
onclick="openEveryoneSubject(
${JSON.stringify(subject)}
)">

見る

</button>

</div>

`;

});


html+=`</div>`;

document.getElementById("everyoneList").innerHTML=
html;

}


/* ==================================================
みんな：単元
================================================== */

window.openEveryoneSubject=function(subject){

let html=`

<button

/* ==================================================
みんな：振り返り
================================================== */

window.openEveryoneUnit=function(subject,unit){

let html=`

<button
class="back-button small-button"
onclick="openEveryoneSubject(
${JSON.stringify(subject)}
)">

← 単元一覧へ

</button>

<h2 class="section-title">
📖 ${escapeHTML(unit || "単元名なし")}
</h2>

<div class="reflection-grid">
`;

let count=0;

everyoneData.forEach(data=>{

if(
data.subject===subject &&
(data.unit || "")===unit
){

count++;

html+=`

<div class="card">

<h3>
💡 友達の振り返り
</h3>

<p class="date">
📅 ${formatDate(data.date)}
</p>

<div class="study-box">

<b>📝 今日の学び</b>

<br><br>

${escapeHTML(data.study)}

</div>

<div class="advice-box">

<b>🤖 AIからの問い</b>

<br><br>

${escapeHTML(
data.aiQuestion ||
"ありません"
)}

</div>

<div class="deep-box">

<b>✏️ 深めた考え</b>

<br><br>

${escapeHTML(
data.deepReflection ||
"まだ入力されていません"
)}

</div>

<div class="level-box">

⭐ 参考にした人数：
<b>${Number(data.likes || 0)}</b>人

</div>

<button
class="like-button"
onclick="addLike(
${JSON.stringify(data.id)}
)">

⭐ この考えが参考になった

</button>

</div>

`;

}

});


html+=`</div>`;


if(count===0){

html+=`

<div class="empty">

この単元の振り返りはありません。

</div>

`;

}

document.getElementById("everyoneList").innerHTML=
html;

};


/* ==================================================
参考になった
================================================== */

window.addLike=async function(id){

const target=
everyoneData.find(
data=>data.id===id
);

if(!target){

return;

}

try{

const newLikes=
Number(target.likes || 0)+1;

await updateDoc(

doc(
db,
"manabi",
id
),

{

likes:newLikes

}

);

target.likes=newLikes;

openEveryoneUnit(
target.subject,
target.unit
);

}catch(error){

console.error(error);

alert(
"保存できませんでした。"
);

}

};


/* ==================================================
起動
================================================== */

checkLogin();

console.log(
"📚 学びアルバム Ver.2 児童ページ 起動"
);

</script>

</body>

</html>
