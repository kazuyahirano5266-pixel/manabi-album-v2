<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2</title>

<style>
body{
font-family:sans-serif;
background:#f0f8ff;
text-align:center;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:20px;
max-width:500px;
margin:auto;
}

input,textarea,select{
width:90%;
padding:10px;
font-size:18px;
margin:8px;
}

button{
padding:15px 30px;
border:none;
border-radius:20px;
background:#2b7a78;
color:white;
font-size:18px;
}
.advice-box{

background:#eaf6ff;
border-radius:20px;
padding:15px;
margin-top:20px;

}
</style>

</head>

<body>

<div class="box">

<h1>📚 学びアルバム Ver.2</h1>

<p>名前</p>
<input id="name">

<p>教科</p>

<select id="subject">

<option>国語</option>
<option>算数</option>
<option>生活</option>
<option>理科</option>
<option>社会</option>
<option>総合</option>
<option>道徳</option>
<option>体育</option>

</select>


<p>単元名</p>

<input id="unit" placeholder="例：ごんぎつね">


<p>今日の学び</p>
<textarea id="study"></textarea>

<p>💡 AIからの問い</p>

<div class="advice-box">

<p id="studyAdvice">
振り返りを書くと、
学びを深める質問が出ます。
</p>

</div>


<p>✏️ もう一度考えてみよう</p>

<textarea id="deepReflection"
placeholder="AIの問いをもとに、考えを深めて書こう"></textarea>
<button onclick="saveDeepReflection()">
✏️ 深めた考えを保存
</button>

<button onclick="save()">保存する</button>

<p id="msg"></p>
<button onclick="loadComment()">
💬 先生コメントを見る
</button>
 <div class="comment-box">

<h3>💬 先生からのコメント</h3>

<p id="teacherComment">
先生がまだコメントしていません
</p>

</div>
<div class="advice-box">

<h3>🤖 学びアドバイス</h3>

<p id="levelAdvice">
</p>
</div>
</div>


<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import { 
getFirestore,
collection,
addDoc,
query,
where,
getDocs,
updateDoc,
doc
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain: "manabi-album-v2.firebaseapp.com",

projectId: "manabi-album-v2",

storageBucket: "manabi-album-v2.firebasestorage.app",

messagingSenderId: "226258471812",

appId: "1:226258471812:web:15230ba15e7e0bd7d86bd1"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



window.save = async function(){

showAdvice();

await addDoc(collection(db,"manabi"),{

name:document.getElementById("name").value,

subject:document.getElementById("subject").value,

unit: document.getElementById("unit").value,

study:document.getElementById("study").value,

deepReflection:"",

aiQuestion:
window.currentAdvice || "",

level: window.currentLevel || "",

date:new Date()

});


document.getElementById("msg").innerHTML =
"🌟 保存しました！";

};


window.loadComment = async function(){

const name =
document.getElementById("name").value;


const q = query(
collection(db,"manabi"),
where("name","==",name)
);


const result = await getDocs(q);


result.forEach((doc)=>{

const data = doc.data();


if(data.comment){

document.getElementById("teacherComment").innerHTML =
data.comment;

}

});

}

function showAdvice(){

const subject =
document.getElementById("subject").value;

const study =
document.getElementById("study").value;


let advice="";


// 国語
if(subject==="国語"){

if(study.includes("友達")){

advice =
"友達のどんな考えを聞いて、自分の考えはどのように変わりましたか？";

}

else if(study.includes("理由") || study.includes("考え")){

advice =
"その考えを支える理由や、もとになった言葉は何ですか？";

}

else{

advice =
"文章や友達の考えから、新しく気付いたことは何ですか？";

}

}


// 算数
else if(subject==="算数"){

advice =
"その考え方は、別の問題でも使えそうですか？工夫したところを説明してみよう。";

}


// 理科
else if(subject==="理科"){

advice =
"予想と結果を比べて、なぜその結果になったのか考えてみよう。";

}


// 社会
else if(subject==="社会"){

advice =
"調べて分かったことは、私たちの生活とどんな関係がありますか？";

}


// 生活
else if(subject==="生活"){

advice =
"見つけたことや気付いたことから、どんな発見や驚きがありましたか？";

}


// 総合
else if(subject==="総合"){

if(study.includes("地域") || study.includes("武蔵村山")){

advice =
"その学びを誰に伝えたいですか？伝えるためにどんな工夫ができますか？";

}

else{

advice =
"調べたことから、新しく生まれた疑問や課題は何ですか？";

}

}


// 道徳
else if(subject==="道徳"){

advice =
"その考えを大切にした理由は何ですか？自分の生活でどう生かせそうですか？";

}


// 体育
else if(subject==="体育"){

advice =
"できるようになるために工夫したことや、友達から学んだことは何ですか？";

}


else{

advice =
"今日の学びから、新しく気付いたことを書いてみよう。";

}



document.getElementById("studyAdvice").innerHTML =
"🤖 "+advice;


// 保存用
window.currentAdvice = advice;


// 深まり判定
checkLevel(study);


}

function checkLevel(study){

let levelText="";


if(
study.includes("理由") ||
study.includes("なぜ") ||
study.includes("考え")
){

levelText =
"🌳 深まりレベル3：理由や考えを書けています。さらに友達の考えとの違いも比べてみよう。";

}


else if(
study.includes("友達") ||
study.includes("協力") ||
study.includes("工夫")
){

levelText =
"🌿 深まりレベル2：友達との関わりや工夫が書けています。どんな変化があったか考えてみよう。";

}


else if(
study.includes("できた") ||
study.includes("分かった") ||
study.includes("楽しかった")
){

levelText =
"🌱 深まりレベル1：できたことが書けています。なぜできたのか、詳しく振り返ってみよう。";

}


else{

levelText =
"🌱 今日の学びで大切だったことを、具体的な出来事と一緒に書いてみよう。";

}


document.getElementById("levelAdvice").innerHTML =
levelText;
window.currentLevel = levelText;
}
window.saveDeepReflection = async function(){

const name =
document.getElementById("name").value;


const q = query(
collection(db,"manabi"),
where("name","==",name)
);


const result = await getDocs(q);


let lastDoc = null;


result.forEach((d)=>{

lastDoc = d;

});



if(lastDoc){


await updateDoc(
doc(db,"manabi",lastDoc.id),
{

deepReflection:
document.getElementById("deepReflection").value

}

);


alert("✏️ 深めた考えを保存しました😊");


}

else{

alert("先に振り返りを保存してください");

}


}
</script>


</body>
</html>
