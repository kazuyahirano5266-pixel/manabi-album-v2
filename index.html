<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
  background:#f3f6fa;
  color:#333;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  border:none;
  border-radius:14px;
  padding:13px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.85;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

/* =========================
ヘッダー
========================= */

header{
  background:
    linear-gradient(
      135deg,
      #4f8cff,
      #6c63ff
    );
  color:white;

}

header h1{

}

  margin:7px 0 0;

/* =========================
ボックス

.box{

h2{

/* =========================
授業情報
========================= */

.lesson-box{
  background:#f0fff7;

  padding:18px;
  margin-bottom:18px;
}

.lesson-status{
  color:#26915e;

}

.lesson-subject{
  font-size:25px;
  font-weight:bold;

}

.lesson-unit{
  margin-top:6px;
  font-size:17px;
}

.lesson-id{
  margin-top:10px;
  font-size:12px;

  word-break:break-all;
}

/* =========================
フォーム
========================= */

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

input,
textarea,
select{
  width:100%;
  padding:14px;
  border:1px solid #d8dee8;

.primary{

.menu-button{

}

.menu-description{

/* =========================
AI
========================= */

}

/* =========================
深まり
========================= */

.level-box{

}

/* =========================
履歴
========================= */

.history-card{
  background:white;
  border:1px solid #e1e6ed;
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
}

.history-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.subject-badge{
  display:inline-block;
  background:#eaf1ff;
  color:#3769c8;
  padding:5px 11px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.date{
  color:#888;
  font-size:13px;
}

.history-study{
  margin-top:15px;
  line-height:1.8;
  white-space:pre-wrap;
}

.history-deep{
  margin-top:14px;
  background:#fff9e8;
  padding:14px;
  border-radius:10px;
  line-height:1.8;
  white-space:pre-wrap;
}

/* =========================
みんな
========================= */

.subject-grid{
  display:grid;
  grid-template-columns:
    repeat(2,1fr);
  gap:14px;
}

.subject-card{
  border:2px solid #e1e7ef;
  border-radius:17px;
  padding:20px;
  background:white;
  text-align:center;
  cursor:pointer;
}

.subject-card:hover{
  border-color:#4f8cff;
  background:#f7faff;
}

.subject-name{
  font-size:20px;
  font-weight:bold;
}

.everyone-card{
  background:white;
  border:1px solid #e1e6ed;
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
}

.student-name{
  font-size:18px;
  font-weight:bold;
}

.everyone-study{
  margin-top:12px;
  line-height:1.8;
  white-space:pre-wrap;
}

.empty{
  text-align:center;
  color:#888;
  padding:35px 15px;
}

/* =========================
レスポンシブ
========================= */

@media(max-width:700px){

  .menu-grid{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:24px;
  }

}

</style>

</head>

<header>

<div class="container">


<!-- =========================
ホーム

<section

<section

  <div class="box">

</section>

<script type="module">


/* ==================================================
   Firebase
================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  query,
  where,
  onSnapshot,
  doc,
  updateDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   Firebase設定
================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

  authDomain:
    "manabi-album-v2.firebaseapp.com",

  projectId:
    "manabi-album-v2",

  storageBucket:
    "manabi-album-v2.firebasestorage.app",

  messagingSenderId:
    "226258471812",

  appId:
    "1:226258471812:web:15230ba15e7e0bd7d86bd1"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* ==================================================
   変数
================================================== */

let currentLesson = null;

let currentReflectionId = null;

let everyoneData = [];


/* ==================================================
   ページ切り替え
================================================== */

window.showPage =
function(id){

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove("active");

    });


  document
    .getElementById(id)
    .classList.add("active");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* ==================================================
   現在の授業を自動取得
================================================== */

const lessonRef =
  doc(
    db,
    "currentLesson",
    "today"
  );


onSnapshot(
  lessonRef,

  snapshot => {

    if(snapshot.exists()){

      currentLesson =
        snapshot.data();

    }else{

      currentLesson =
        null;

    }


    displayCurrentLesson();

  },

  error => {

    console.error(error);

    document.getElementById(
      "lessonArea"
    ).innerHTML = `

      <div>
        ⚠️ 授業情報を取得できません。
      </div>

    `;

  }

);


/* ==================================================
   授業表示
================================================== */

function displayCurrentLesson(){

  const area =
    document.getElementById(
      "lessonArea"
    );


  if(!currentLesson){

    area.innerHTML = `

      <div>

        ⏸️ 現在、授業が設定されていません。

      </div>

    `;

    return;

  }


  if(currentLesson.active !== true){

    area.innerHTML = `

      <div>

        ⏸️ 現在の授業は終了しています。

        <br><br>

        次の授業が始まるまで待ってください。

      </div>

    `;

    return;

  }


  area.innerHTML = `

    <div class="lesson-status">

      🟢 現在の授業

    </div>

    <div class="lesson-subject">

      ${escapeHtml(
        currentLesson.subject || ""
      )}

    </div>

    <div class="lesson-unit">

      📘
      ${escapeHtml(
        currentLesson.unit || ""
      )}

    </div>

    <div class="lesson-id">

      授業ID：
      ${escapeHtml(
        currentLesson.lessonId || ""
      )}

    </div>

  `;

}


/* ==================================================
   振り返りページ
================================================== */

window.openReflection =
function(){

  if(
    !currentLesson ||
    currentLesson.active !== true
  ){

    alert(
      "現在、授業が開始されていません。\n先生が授業を開始してから入力してください。"
    );

    return;

  }


  showPage(
    "reflectionPage"
  );


  document.getElementById(
    "reflectionLesson"
  ).innerHTML = `

    <div class="lesson-status">
      🟢 現在の授業
    </div>

    <div class="lesson-subject">

      ${escapeHtml(
        currentLesson.subject || ""
      )}

    </div>

    <div class="lesson-unit">

      📘
      ${escapeHtml(
        currentLesson.unit || ""
      )}

    </div>

    <div class="lesson-id">

      授業IDは自動取得されています。

    </div>

  `;


  document.getElementById(
    "subject"
  ).value =
    currentLesson.subject || "";


  document.getElementById(
    "unit"
  ).value =
    currentLesson.unit || "";

};


/* ==================================================
   AIからの問い
================================================== */

window.showAdvice =
function(){

  const subject =
    document.getElementById(
      "subject"
    ).value;


  const text =
    document.getElementById(
      "study"
    ).value
    .trim();


  const box =
    document.getElementById(
      "adviceBox"
    );


  const question =
    document.getElementById(
      "aiQuestion"
    );


  if(!text){

    box.style.display =
      "none";

    return;

  }


  let q =
    "今日の学びで、一番大切だと思ったことは何ですか？";


  if(subject === "国語"){

    if(
      text.includes("考え") ||
      text.includes("思った")
    ){

      q =
        "その考えになった理由や、友達の考えとの違いは何ですか？";

    }else{

      q =
        "今日の学習で、言葉や文章について新しく気づいたことは何ですか？";

    }

  }


  else if(subject === "算数"){

    q =
      "その方法を使うと、なぜ答えを求めることができるのでしょう？";

  }


  else if(subject === "理科"){

    q =
      "実験や観察の結果から、どんなことが分かったのですか？";

  }


  else if(subject === "社会"){

    q =
      "今日分かったことは、私たちの生活とどのようにつながっていますか？";

  }


  else if(subject === "生活"){

    q =
      "やってみて分かったことや、最初の予想と違ったことはありましたか？";

  }


  else if(subject === "総合"){

    q =
      "今日の学びを、これからの活動にどう生かせそうですか？";

  }


  else if(subject === "道徳"){

    q =
      "今日考えたことを、自分の生活の中ではどのように生かせそうですか？";

  }


  else if(subject === "体育"){

    q =
      "うまくできた理由や、次にもっと上手にするためにできそうなことは何ですか？";

  }


  question.textContent =
    q;


  box.style.display =
    "block";

};


/* ==================================================
   振り返り保存
================================================== */

window.saveReflection =
async function(){

  if(
    !currentLesson ||
    currentLesson.active !== true
  ){

    alert(
      "授業が終了しています。"
    );

    return;

  }


  const name =
    document.getElementById(
      "studentName"
    ).value
    .trim();


  const subject =
    document.getElementById(
      "subject"
    ).value;


  const unit =
    document.getElementById(
      "unit"
    ).value
    .trim();


  const study =
    document.getElementById(
      "study"
    ).value
    .trim();


  if(!name){

    alert(
      "なまえを入力してください。"
    );

    return;

  }


  if(!subject){

    alert(
      "教科を選択してください。"
    );

    return;

  }


  if(!unit){

    alert(
      "単元名を入力してください。"
    );

    return;

  }


  if(!study){

    alert(
      "今日の学びを書いてください。"
    );

    return;

  }


  const aiQuestion =
    document.getElementById(
      "aiQuestion"
    ).textContent;


  try{

    const ref =
      await addDoc(

        collection(
          db,
          "manabi"
        ),

        {

          name:name,

          subject:subject,

          unit:unit,

          study:study,

          aiQuestion:
            aiQuestion || "",

          deepReflection:"",

          deepLevel:1,

          lessonId:
            currentLesson.lessonId,

          lessonSubject:
            currentLesson.subject,

          lessonUnit:
            currentLesson.unit,

          date:
            new Date().toLocaleString(
              "ja-JP"
            ),

          createdAt:
            serverTimestamp()

        }

      );


    currentReflectionId =
      ref.id;


    document.getElementById(
      "deepReflectionArea"
    ).style.display =
      "block";


    document.getElementById(
      "levelResult"
    ).innerHTML = `

      <strong>
        🌱 レベル1
      </strong>

      <br>

      まずは自分の考えを
      書くことができました！

    `;


    alert(
      "振り返りを保存しました！\n続いて、もう一歩深く考えてみましょう。"
    );


  }catch(error){

    console.error(error);

    alert(
      "保存できませんでした。\nFirebaseの設定を確認してください。"
    );

  }

};


/* ==================================================
   深まりレベル判定
================================================== */

function judgeLevel(text){

  const length =
    text.length;


  const keywords = [

    "なぜ",

    "どうして",

    "理由",

    "だから",

    "比べ",

    "違い",

    "同じ",

    "つなが",

    "生か",

    "次は",

    "これから",

    "工夫",

    "分かった",

    "気づいた"

  ];


  let score = 0;


  keywords.forEach(
    word => {

      if(text.includes(word)){

        score++;

      }

    }
  );


  if(
    length >= 80 ||
    score >= 3
  ){

    return 3;

  }


  if(
    length >= 35 ||
    score >= 1
  ){

    return 2;

  }


  return 1;

}


/* ==================================================
   深まり保存
================================================== */

window.saveDeepReflection =
async function(){

  if(!currentReflectionId){

    alert(
      "先に「振り返りを保存」してください。"
    );

    return;

  }


  const text =
    document.getElementById(
      "deepReflection"
    ).value
    .trim();


  if(!text){

    alert(
      "深まり振り返りを書いてください。"
    );

    return;

  }


  const level =
    judgeLevel(text);


  try{

    await updateDoc(

      doc(
        db,
        "manabi",
        currentReflectionId
      ),

      {

        deepReflection:text,

        deepLevel:level,

        deepUpdatedAt:
          serverTimestamp()

      }

    );


    if(level >= 3){

      document.getElementById(
        "levelResult"
      ).innerHTML = `

        <strong>
          🌟 レベル3
        </strong>

        <br>

        自分の考えを深め、
        理由やつながりまで考えています。
        とてもすばらしい振り返りです！

      `;

    }else if(level === 2){

      document.getElementById(
        "levelResult"
      ).innerHTML = `

        <strong>
          🌱 レベル2
        </strong>

        <br>

        学んだことをもとに、
        自分の考えを広げています！

      `;

    }else{

      document.getElementById(
        "levelResult"
      ).innerHTML = `

        <strong>
          🌱 レベル1
        </strong>

        <br>

        自分の学びを振り返ることができました！

      `;

    }


    alert(
      "深まり振り返りを保存しました！"
    );


  }catch(error){

    console.error(error);

    alert(
      "保存できませんでした。"
    );

  }

};

window.loadMyHistory =
async function(){

  const name =
    document.getElementById(
      "historyName"
    ).value
    .trim();


  const area =
    document.getElementById(
      "historyList"
    );


  if(!name){

    alert(
      "なまえを入力してください。"
    );

    return;

  }


  try{

    const q =
      query(

        collection(
          db,
          "manabi"
        ),

        where(
          "name",
          "==",
          name
        )

      );


    const snapshot =
      await getDocs(q);


    const data = [];


    snapshot.forEach(
      item => {

        data.push({
          id:item.id,
          ...item.data()
        });

      }
    );


    data.sort(
      (a,b) =>
        String(
          b.date || ""
        ).localeCompare(
          String(
            a.date || ""
          )
        )
    );


    if(data.length === 0){

      area.innerHTML = `

        <div class="box empty">

          まだ振り返りがありません。

        </div>

      `;

      return;

    }


    area.innerHTML =
      data.map(
        item => `

          <div class="history-card">

            <div class="history-header">

              <div>

                <span class="subject-badge">

                  ${escapeHtml(
                    item.subject || ""
                  )}

                </span>

                <strong>

                  ${escapeHtml(
                    item.unit || ""
                  )}

                </strong>

              </div>

              <div class="date">

                ${escapeHtml(
                  item.date || ""
                )}

              </div>

            </div>


            <div class="history-study">

              <strong>
                ✏️ 今日の学び
              </strong>

              <br><br>

              ${escapeHtml(
                item.study || ""
              )}

            </div>


            ${
              item.deepReflection
              ? `

                <div class="history-deep">

                  <strong>
                    🌱 深まり振り返り
                  </strong>

                  <br><br>

                  ${escapeHtml(
                    item.deepReflection
                  )}

                </div>

              `
              : ""
            }

          </div>

        `
      ).join("");


  }catch(error){

    console.error(error);

    area.innerHTML = `

      <div class="box empty">

        読み込みに失敗しました。

      </div>

    `;

  }

};

window.openEveryoneHistory =
async function(){

  showPage(
    "everyonePage"
  );


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "manabi"
        )
      );


    everyoneData = [];


    snapshot.forEach(
      item => {

        everyoneData.push({

    const subjects =

          everyoneData

                  item.subject === subject
              ).length}

            </div>

          </div>

      ).join("");

    console.error(error);

  }

};

/* ==================================================
   HTML安全化
================================================== */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==================================================
   JS文字列安全化
================================================== */

function escapeJs(value){

  return String(value)

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    );

}
