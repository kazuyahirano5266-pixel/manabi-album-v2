<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
  background:#f4f7fb;
  color:#333;
}

header{
  background:linear-gradient(135deg,#4f8cff,#6c63ff);
  color:white;
  text-align:center;
  padding:22px 15px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:7px 0 0;
  font-size:14px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:25px;
}

.menu-button{
  border:none;
  border-radius:18px;
  padding:30px 15px;
  font-size:18px;
  font-weight:bold;
  background:white;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  cursor:pointer;
}

.menu-button:hover{
  transform:translateY(-2px);
}

.lesson-box{
  background:white;
  border-radius:18px;
  padding:25px;
  margin-top:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.current-lesson{
  border-left:7px solid #4f8cff;
}

.lesson-label{
  color:#777;
  font-size:14px;
}

.lesson-subject{
  font-size:28px;
  font-weight:bold;
  margin:8px 0;
}

.lesson-unit{
  font-size:19px;
  color:#555;
}

input,
textarea,
select{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:17px;
  font-family:inherit;
}

textarea{
  min-height:150px;
  resize:vertical;
}

label{
  display:block;
  margin-top:18px;
  font-weight:bold;
}

.button{
  border:none;
  border-radius:12px;
  padding:14px 22px;
  margin-top:18px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#4f8cff;
  color:white;
}

.secondary{
  background:#e9eef8;
  color:#333;
}

.green{
  background:#43b883;
  color:white;
}

.back{
  margin-bottom:10px;
}

.status{
  padding:13px;
  border-radius:12px;
  background:#eef4ff;
  margin-top:15px;
  font-weight:bold;
}

.warning{
  background:#fff4df;
  color:#8a5a00;
}

.advice-box{
  background:#f0f7ff;
  border-left:6px solid #4f8cff;
  padding:18px;
  border-radius:12px;
  margin-top:18px;
}

.level-box{
  background:#fff7df;
  border-left:6px solid #f5b942;
  padding:18px;
  border-radius:12px;
  margin-top:18px;
}

.reflection-card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.card-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  font-weight:bold;
}

.subject-tag{
  background:#eaf1ff;
  color:#3769c8;
  padding:5px 10px;
  border-radius:20px;
  font-size:13px;
}

.date{
  color:#888;
  font-size:13px;
}

.study-text{
  white-space:pre-wrap;
  line-height:1.8;
  margin-top:15px;
}

.deep-text{
  background:#f7f7f7;
  padding:14px;
  border-radius:10px;
  white-space:pre-wrap;
  line-height:1.7;
  margin-top:10px;
}

.subject-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:20px;
}

.subject-button{
  background:white;
  border:2px solid #e3e8f2;
  border-radius:14px;
  padding:18px 10px;
  font-weight:bold;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px;
}

.like-button{
  border:none;
  background:#fff0f3;
  border-radius:20px;
  padding:7px 13px;
  cursor:pointer;
}

.ai-title{
  font-weight:bold;
  margin-bottom:8px;
}

.name-title{
  font-size:22px;
  font-weight:bold;
}

@media(max-width:700px){

  .menu-grid{
    grid-template-columns:1fr;
  }

  .subject-grid{
    grid-template-columns:repeat(2,1fr);
  }

  header h1{
    font-size:24px;
  }

  .container{
    padding:12px;
  }

}

</style>
</head>

<body>

<header>
  <h1>📚 学びアルバム Ver.2</h1>
  <p>今日の学びを残そう！</p>
</header>

<div class="container">

<!-- =========================
     ホーム
========================= -->

<section id="homePage" class="page active">

  <div class="lesson-box current-lesson">

    <div class="lesson-label">
      📡 現在の授業
    </div>

    <div id="homeLessonStatus">
      現在の授業を確認しています……
    </div>

    <div id="homeLessonInfo"></div>

  </div>

  <div class="menu-grid">

    <button class="menu-button"
            onclick="openReflection()">
      ✏️<br>
      今日の振り返りを書く
    </button>

    <button class="menu-button"
            onclick="openHistory()">
      📖<br>
      自分の振り返りを見る
    </button>

    <button class="menu-button"
            onclick="openEveryoneHistory()">
      👫<br>
      みんなの振り返りを見る
    </button>

  </div>

</section>


<!-- =========================
     振り返り入力
========================= -->

<section id="reflectionPage" class="page">

  <button class="button secondary back"
          onclick="showPage('homePage')">
    ← 戻る
  </button>

  <div class="lesson-box">

    <h2>✏️ 今日の振り返り</h2>

    <div id="reflectionLesson"></div>

    <label>
      名前
      <input
        id="studentName"
        type="text"
        placeholder="自分の名前を入力してください">
    </label>

    <label>
      今日の学び
      <textarea
        id="studyText"
        placeholder="今日の授業で分かったこと、できるようになったこと、考えたことを書こう。"
        oninput="showAdvice()"></textarea>
    </label>

    <div id="adviceBox" class="advice-box" style="display:none;"></div>

    <div id="firstSaveArea">

      <button
        class="button primary"
        onclick="saveReflection()">
        💾 振り返りを保存する
      </button>

    </div>

    <div id="deepReflectionArea"
         style="display:none;">

      <div class="level-box">

        <h3>🌱 振り返りの深まり</h3>

        <div id="levelText"></div>

      </div>

      <label>
        もう一歩深く考えてみよう
        <textarea
          id="deepReflection"
          placeholder="AIからの問いをヒントに、もう一度考えてみよう。"></textarea>
      </label>

      <button
        class="button green"
        onclick="saveDeepReflection()">
        🌱 深まり振り返りを保存する
      </button>

    </div>

  </div>

</section>


<!-- =========================
     自分の履歴
========================= -->

<section id="historyPage" class="page">

  <button class="button secondary back"
          onclick="showPage('homePage')">
    ← 戻る
  </button>

  <div class="lesson-box">

    <h2>📖 自分の振り返り</h2>

    <label>
      名前
      <input
        id="historyName"
        type="text"
        placeholder="名前を入力してください">
    </label>

    <button
      class="button primary"
      onclick="loadMyHistory()">
      振り返りを見る
    </button>

  </div>

  <div id="myHistory"></div>

</section>


<!-- =========================
     みんなの振り返り
========================= -->

<section id="everyonePage" class="page">

  <button class="button secondary back"
          onclick="showPage('homePage')">
    ← 戻る
  </button>

  <div class="lesson-box">

    <h2>👫 みんなの振り返り</h2>

    <p>
      教科を選ぶと、その教科の振り返りを見ることができます。
    </p>

    <div id="everyoneSubjects"
         class="subject-grid"></div>

  </div>

  <div id="everyoneList"></div>

</section>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  orderBy,
  doc,
  onSnapshot,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   Firebase設定
   ↓ ここを先生のFirebase設定にしてください
================================================== */

const firebaseConfig = {

  apiKey: "ここにAPI_KEY",

  authDomain: "ここにAUTH_DOMAIN",

  projectId: "ここにPROJECT_ID",

  storageBucket: "ここにSTORAGE_BUCKET",

  messagingSenderId: "ここにMESSAGING_SENDER_ID",

  appId: "ここにAPP_ID"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* ==================================================
   現在の授業
================================================== */

let currentLesson = null;

let currentLessonId = null;

let currentSavedDocId = null;


/* ==================================================
   ページ切り替え
================================================== */

window.showPage = function(pageId){

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document
    .getElementById(pageId)
    .classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* ==================================================
   現在の授業を自動判別
================================================== */

const todayLessonRef =
  doc(db,"currentLesson","today");


onSnapshot(
  todayLessonRef,
  (snapshot)=>{

    if(!snapshot.exists()){

      currentLesson = null;
      currentLessonId = null;

      document.getElementById(
        "homeLessonStatus"
      ).innerHTML =
        "⏸️ 現在、授業は設定されていません。";

      document.getElementById(
        "homeLessonInfo"
      ).innerHTML = "";

      document.getElementById(
        "reflectionLesson"
      ).innerHTML =
        `<div class="status warning">
          現在の授業がありません。
        </div>`;

      return;
    }


    const data = snapshot.data();


    if(data.active !== true){

      currentLesson = null;
      currentLessonId = null;

      document.getElementById(
        "homeLessonStatus"
      ).innerHTML =
        "⏸️ 授業は終了しています。";

      document.getElementById(
        "homeLessonInfo"
      ).innerHTML = "";

      return;
    }


    currentLesson = data;

    currentLessonId = data.lessonId;


    document.getElementById(
      "homeLessonStatus"
    ).innerHTML =
      "🟢 現在の授業が見つかりました！";


    document.getElementById(
      "homeLessonInfo"
    ).innerHTML = `

      <div class="lesson-subject">
        ${escapeHtml(data.subject || "")}
      </div>

      <div class="lesson-unit">
        📘 ${escapeHtml(data.unit || "")}
      </div>

    `;


    document.getElementById(
      "reflectionLesson"
    ).innerHTML = `

      <div class="status">
        📚 ${escapeHtml(data.subject || "")}
        ／
        ${escapeHtml(data.unit || "")}
      </div>

    `;

  },
  (error)=>{

    console.error(error);

    document.getElementById(
      "homeLessonStatus"
    ).innerHTML =
      "⚠️ Firebaseとの接続を確認してください。";

  }
);


/* ==================================================
   振り返りページ
================================================== */

window.openReflection = function(){

  showPage("reflectionPage");

  if(!currentLesson){

    document.getElementById(
      "reflectionLesson"
    ).innerHTML = `

      <div class="status warning">
        ⚠️ 現在、先生が授業を開始していません。<br>
        先生が「授業開始」を押すと、ここに教科と単元が自動表示されます。
      </div>

    `;

    return;
  }


  document.getElementById(
    "reflectionLesson"
  ).innerHTML = `

    <div class="status">
      📚 ${escapeHtml(currentLesson.subject)}
      ／
      ${escapeHtml(currentLesson.unit)}
    </div>

  `;

};


/* ==================================================
   AIからの問い
================================================== */

window.showAdvice = function(){

  const text =
    document.getElementById("studyText").value.trim();

  const box =
    document.getElementById("adviceBox");


  if(!text){

    box.style.display = "none";
    return;

  }


  if(!currentLesson){

    box.style.display = "none";
    return;

  }


  const subject =
    currentLesson.subject || "";


  let question = "";


  if(subject === "国語"){

    if(
      text.includes("分かった") ||
      text.includes("できた")
    ){

      question =
        "🤖 どうして分かったのかな？具体的にどんなところが分かったのか考えてみよう。";

    }else{

      question =
        "🤖 今日の学びで、特に心に残った言葉や考えは何かな？";

    }

  }


  else if(subject === "算数"){

    if(
      text.includes("方法") ||
      text.includes("やり方")
    ){

      question =
        "🤖 その方法が使えるのは、どんなときかな？";

    }else{

      question =
        "🤖 どうしてその答えになるのか、説明するとしたらどう説明する？";

    }

  }


  else if(subject === "理科"){

    question =
      "🤖 実験や観察をして、何が変わったかな？その理由は何だと思う？";

  }


  else if(subject === "社会"){

    question =
      "🤖 今日分かったことは、私たちの生活とどのようにつながっているかな？";

  }


  else if(subject === "生活"){

    question =
      "🤖 今日見つけたことや気付いたことから、もっと知りたいことは何かな？";

  }


  else if(subject === "総合"){

    question =
      "🤖 今日の学びを、これからの活動にどう生かせそうかな？";

  }


  else if(subject === "道徳"){

    question =
      "🤖 今日考えたことを、自分の生活に置き換えるとどうかな？";

  }


  else if(subject === "体育"){

    question =
      "🤖 うまくできた理由、またはできなかった理由は何だと思う？次はどうしたい？";

  }


  else{

    question =
      "🤖 今日の学びについて、「なぜ？」「どうして？」をもう一度考えてみよう。";

  }


  box.innerHTML = `

    <div class="ai-title">
      🤖 AIからの問い
    </div>

    <div>
      ${question}
    </div>

  `;

  box.style.display = "block";

};


/* ==================================================
   振り返り保存
================================================== */

window.saveReflection = async function(){

  const name =
    document.getElementById("studentName")
      .value.trim();

  const study =
    document.getElementById("studyText")
      .value.trim();


  if(!currentLesson){

    alert("現在の授業がありません。");
    return;

  }


  if(!name){

    alert("名前を入力してください。");
    return;

  }


  if(!study){

    alert("今日の学びを書いてください。");
    return;

  }


  const subject =
    currentLesson.subject || "";

  const unit =
    currentLesson.unit || "";


  const aiQuestion =
    document
      .getElementById("adviceBox")
      .innerText
      .replace("🤖 AIからの問い","")
      .trim();


  let level = 1;


  if(study.length >= 80){
    level = 2;
  }

  if(
    study.length >= 120 &&
    (
      study.includes("理由") ||
      study.includes("なぜ") ||
      study.includes("工夫") ||
      study.includes("比べ") ||
      study.includes("つなが")
    )
  ){

    level = 3;

  }


  try{

    const docRef =
      await addDoc(
        collection(db,"manabi"),
        {

          name:name,

          subject:subject,

          unit:unit,

          study:study,

          aiQuestion:aiQuestion,

          deepReflection:"",

          deepLevel:level,

          likes:0,

          lessonId:currentLesson.lessonId,

          lessonCreatedAt:
            currentLesson.createdAt || null,

          date:new Date()
            .toLocaleString("ja-JP"),

          createdAt:serverTimestamp()

        }
      );


    currentSavedDocId = docRef.id;


    document.getElementById(
      "firstSaveArea"
    ).style.display = "none";


    document.getElementById(
      "deepReflectionArea"
    ).style.display = "block";


    document.getElementById(
      "levelText"
    ).innerHTML =
      getLevelMessage(level);


    alert("保存しました！");

  }catch(error){

    console.error(error);

    alert(
      "保存できませんでした。\n" +
      "Firebaseの設定を確認してください。"
    );

  }

};


/* ==================================================
   深まりレベル表示
================================================== */

function getLevelMessage(level){

  if(level === 3){

    return `
      <strong>🌟 レベル3</strong><br>
      自分の考えを理由や具体例とつなげて、
      深く振り返ることができています！すばらしい！
    `;

  }

  if(level === 2){

    return `
      <strong>🌱 レベル2</strong><br>
      今日の学びについて、
      自分の言葉で振り返ることができています。
      もう一歩深く考えてみよう！
    `;

  }

  return `
    <strong>🌱 レベル1</strong><br>
    今日の学びを振り返ることができました。
    「なぜ？」「どうして？」を考えると、
    さらに学びが深まりそうです！
  `;

}


/* ==================================================
   深まり振り返り保存
================================================== */

window.saveDeepReflection = async function(){

  const text =
    document
      .getElementById("deepReflection")
      .value.trim();


  if(!text){

    alert("深まり振り返りを書いてください。");
    return;

  }


  if(!currentSavedDocId){

    alert("保存する振り返りが見つかりません。");
    return;

  }


  try{

    await updateDoc(
      doc(
        db,
        "manabi",
        currentSavedDocId
      ),
      {

        deepReflection:text,

        deepLevel:
          calculateDeepLevel(text),

        deepSavedAt:
          serverTimestamp()

      }
    );


    alert(
      "🌱 深まり振り返りを保存しました！"
    );

  }catch(error){

    console.error(error);

    alert("保存できませんでした。");

  }

};


function calculateDeepLevel(text){

  if(text.length >= 120){

    if(
      text.includes("理由") ||
      text.includes("なぜ") ||
      text.includes("工夫") ||
      text.includes("比べ") ||
      text.includes("つなが") ||
      text.includes("これから")
    ){

      return 3;

    }

  }


  if(text.length >= 50){

    return 2;

  }


  return 1;

}


/* ==================================================
   自分の振り返り
================================================== */

window.openHistory = function(){

  showPage("historyPage");

  document.getElementById(
    "myHistory"
  ).innerHTML = "";

};


window.loadMyHistory = async function(){

  const name =
    document
      .getElementById("historyName")
      .value.trim();


  if(!name){

    alert("名前を入力してください。");
    return;

  }


  const area =
    document.getElementById("myHistory");


  area.innerHTML =
    "読み込んでいます……";


  try{

    const q =
      query(
        collection(db,"manabi"),
        where("name","==",name)
      );


    const snapshot =
      await getDocs(q);


    let data = [];

    snapshot.forEach(docSnap=>{

      data.push({
        id:docSnap.id,
        ...docSnap.data()
      });

    });


    data.sort(
      (a,b)=>
        String(b.date || "")
          .localeCompare(
            String(a.date || "")
          )
    );


    if(data.length === 0){

      area.innerHTML =
        `<div class="empty">
          まだ振り返りがありません。
        </div>`;

      return;

    }


    area.innerHTML =
      data.map(item=>reflectionCard(item))
        .join("");


  }catch(error){

    console.error(error);

    area.innerHTML =
      `<div class="empty">
        読み込みに失敗しました。
      </div>`;

  }

};


/* ==================================================
   みんなの振り返り
================================================== */

let everyoneData = [];


window.openEveryoneHistory = async function(){

  showPage("everyonePage");

  const subjectArea =
    document.getElementById(
      "everyoneSubjects"
    );


  subjectArea.innerHTML =
    "読み込んでいます……";


  try{

    const snapshot =
      await getDocs(
        collection(db,"manabi")
      );


    everyoneData = [];

    snapshot.forEach(docSnap=>{

      everyoneData.push({
        id:docSnap.id,
        ...docSnap.data()
      });

    });


    const subjects = [
      "国語",
      "算数",
      "生活",
      "理科",
      "社会",
      "総合",
      "道徳",
      "体育"
    ];


    subjectArea.innerHTML =
      subjects.map(subject=>`

        <button
          class="subject-button"
          onclick="showEveryoneSubject('${subject}')">

          ${subject}

        </button>

      `).join("");


  }catch(error){

    console.error(error);

    subjectArea.innerHTML =
      "読み込みに失敗しました。";

  }

};


window.showEveryoneSubject =
function(subject){

  const area =
    document.getElementById(
      "everyoneList"
    );


  const filtered =
    everyoneData
      .filter(item=>
        item.subject === subject
      )
      .sort(
        (a,b)=>
          String(b.date || "")
            .localeCompare(
              String(a.date || "")
            )
      );


  if(filtered.length === 0){

    area.innerHTML =
      `<div class="empty">
        ${subject}の振り返りはまだありません。
      </div>`;

    return;

  }


  area.innerHTML = `

    <div class="lesson-box">

      <h2>📚 ${subject}の振り返り</h2>

    </div>

    ${filtered
      .map(item=>reflectionCard(item,true))
      .join("")}

  `;

};


/* ==================================================
   カード
================================================== */

function reflectionCard(item, showName=false){

  const level =
    item.deepLevel || 1;


  return `

    <div class="reflection-card">

      <div class="card-header">

        <div>

          ${
            showName
              ? `<div class="name-title">
                   ${escapeHtml(item.name || "")}
                 </div>`
              : ""
          }

          <span class="subject-tag">
            ${escapeHtml(item.subject || "")}
          </span>

          <span>
            ${escapeHtml(item.unit || "")}
          </span>

        </div>

        <div class="date">
          ${escapeHtml(item.date || "")}
        </div>

      </div>


      <div class="study-text">
        ${escapeHtml(item.study || "")}
      </div>


      ${
        item.aiQuestion
          ? `
            <div class="advice-box">

              <div class="ai-title">
                🤖 AIからの問い
              </div>

              ${escapeHtml(item.aiQuestion)}

            </div>
          `
          : ""
      }


      ${
        item.deepReflection
          ? `
            <div class="deep-text">

              <strong>
                🌱 深まり振り返り
                （レベル${level}）
              </strong>

              <br><br>

              ${escapeHtml(item.deepReflection)}

            </div>
          `
          : ""
      }

    </div>

  `;

}


/* ==================================================
   HTML安全化
================================================== */

function escapeHtml(value){

  if(value === null ||
     value === undefined){

    return "";

  }


  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}
