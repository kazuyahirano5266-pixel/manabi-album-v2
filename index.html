<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2</title>


<style>

body{

font-family:sans-serif;
background:#f0f8ff;
text-align:center;
padding:20px;

}


.box{

background:white;
padding:20px;
border-radius:20px;
max-width:600px;
margin:auto;

}


button{

padding:15px 30px;
border:none;
border-radius:20px;
background:#2b7a78;
color:white;
font-size:18px;
margin:10px;

}


input,textarea,select{

width:90%;
padding:10px;
font-size:18px;
margin:8px;

}


.card{

background:white;
padding:15px;
margin:15px auto;
border-radius:20px;
box-shadow:0 3px 8px #ccc;

}


.advice-box{

background:#eaf6ff;
padding:15px;
border-radius:20px;

}


.comment-box{

background:#fff4d6;
padding:15px;
border-radius:20px;

}


.hidden{

display:none;

}


</style>

</head>


<body>



<!-- スタートメニュー -->

<div class="box" id="home">


<h1>
📚 学びアルバム Ver.2
</h1>


<p>
自分の学びを残そう！
</p>



<button onclick="openReflection()">

✏️ 今日の振り返りを書く

</button>



<br>



<button onclick="openHistory()">

📖 自分の振り返りを見る

</button>



<br>



<button onclick="openEveryoneHistory()">

👫 みんなの振り返りを見る

</button>



</div>





<!-- 振り返り入力ページ -->


<div class="box hidden" id="reflectionPage">


<h1>
✏️ 今日の振り返り
</h1>



<p>名前</p>

<input id="name">



<p>教科</p>

<select id="subject">

<option>国語</option>
<option>算数</option>
<option>生活</option>
<option>理科</option>
<option>社会</option>
<option>総合</option>
<option>道徳</option>
<option>体育</option>

</select>



<p>単元名</p>

<input id="unit" placeholder="例：ごんぎつね">



<p>今日の学び</p>

<textarea id="study"></textarea>



<div class="advice-box">

<h3>
🤖 AIからの問い
</h3>


<p id="studyAdvice">

振り返りを書くと、
学びを深める質問が出ます。

</p>


</div>



<p>
✏️ もう一度考えてみよう
</p>


<textarea id="deepReflection"
placeholder="AIの問いをもとに考えを深めよう">
</textarea>



<button onclick="save()">

🌟 学びを保存する

</button>


<div id="deepButton" style="display:none;">


<p>
保存した後、もう一度考えてみよう😊
</p>


<button onclick="saveDeepReflection()">

✏️ 考えを深めて保存する

</button>


</div>



<p id="msg"></p>



<button onclick="backHome()">

🏠 戻る

</button>


</div>





<!-- 自分の振り返りページ -->


<div class="box hidden" id="historyPage">


<h1>
📖 自分の学びアルバム
</h1>


<div id="historyList">

</div>



<button onclick="backHome()">

🏠 戻る

</button>


</div>





<!-- みんなの振り返りページ -->


<div class="box hidden" id="everyonePage">


<h1>
👫 みんなの振り返り
</h1>


<div id="everyoneList">

</div>



<button onclick="backHome()">

🏠 戻る

</button>


</div>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
query,
where,
getDocs,
updateDoc,
doc

}

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain: "manabi-album-v2.firebaseapp.com",

projectId: "manabi-album-v2",

storageBucket: "manabi-album-v2.firebasestorage.app",

messagingSenderId: "226258471812",

appId: "1:226258471812:web:15230ba15e7e0bd7d86bd1"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);





// ページ移動

window.openReflection=function(){

document.getElementById("home").style.display="none";

document.getElementById("reflectionPage").style.display="block";

}



window.backHome=function(){

document.getElementById("home").style.display="block";

document.getElementById("reflectionPage").style.display="none";

document.getElementById("historyPage").style.display="none";

document.getElementById("everyonePage").style.display="none";

}





// 保存

window.save = async function(){


const saveData = await addDoc(collection(db,"manabi"),{


name:
document.getElementById("name").value,


subject:
document.getElementById("subject").value,


unit:
document.getElementById("unit").value,


study:
document.getElementById("study").value,


deepReflection:
document.getElementById("deepReflection").value,
likes:0,

date:new Date()

});

console.log("保存ID", saveData.id);

id: saveData.id

document.getElementById("msg").innerHTML=
"🌟 保存しました！";
document.getElementById("deepButton").style.display="block";

};





// 自分の振り返りを見る


window.openHistory = async function(){


const name =
document.getElementById("name").value;



if(!name){

alert("名前を入力してください");

return;

}



document.getElementById("home").style.display="none";

document.getElementById("historyPage").style.display="block";



const q=query(

collection(db,"manabi"),

where("name","==",name)

);



const result =
await getDocs(q);



let dataList=[];


result.forEach(doc=>{

let data=doc.data();

dataList.push(data);

});



let subjects=[];



dataList.forEach(data=>{

if(!subjects.includes(data.subject)){

subjects.push(data.subject);

}

});



let html="";



html += `
<h2>📁 教科を選んでください</h2>
`;



subjects.forEach(subject=>{


html += `


<div class="card">


<h2>
📚 ${subject}
</h2>


<button onclick="openMySubject('${subject}')">

見る

</button>


</div>


`;



});



document.getElementById("historyList").innerHTML=html;



window.myData=dataList;



};






window.openMySubject=function(subject){


let html=`


<button onclick="openHistory()">

← 教科一覧へ

</button>


<h2>
📚 ${subject}
</h2>


<h3>
📖 単元を選んでください
</h3>


`;



let units=[];



myData.forEach(data=>{


if(data.subject===subject){


if(!units.includes(data.unit)){


units.push(data.unit);


}


}


});



units.forEach(unit=>{


html += `


<div class="card">


<h2>
📖 ${unit || "単元名なし"}
</h2>


<button onclick="openMyUnit('${subject}','${unit}')">

見る

</button>


</div>


`;



});



document.getElementById("historyList").innerHTML=html;



};






window.openMyUnit=function(subject,unit){



let html=`


<button onclick="openMySubject('${subject}')">

← 単元一覧へ

</button>



<h2>
📖 ${unit}
</h2>


`;



myData.forEach(data=>{


if(
data.subject===subject &&
data.unit===unit
){



html += `


<div class="card">


<p>
📝 今日の学び
</p>


<p>
${data.study}
</p>



<div class="advice-box">


🤖 AIからの問い

<br>

${data.aiQuestion || ""}


</div>



<p>
✏️ 深めた考え
</p>


<p>
${data.deepReflection || "まだありません"}

</p>


</div>


`;



}



});



document.getElementById("historyList").innerHTML=html;


};








// みんなの振り返りを見る

window.openEveryoneHistory = async function(){


document.getElementById("home").style.display="none";

document.getElementById("everyonePage").style.display="block";



const result =
await getDocs(collection(db,"manabi"));



let dataList=[];



result.forEach(doc=>{

let data=doc.data();

dataList.push(data);


});



window.everyoneData=dataList;



let subjects=[];



dataList.forEach(data=>{


if(!subjects.includes(data.subject)){


subjects.push(data.subject);


}


});



let html=`


<h2>
📁 教科を選んでください
</h2>


`;



subjects.forEach(subject=>{


html += `


<div class="card">


<h2>
📚 ${subject}
</h2>



<button onclick="openEveryoneSubject('${subject}')">

見る

</button>


</div>


`;



});



document.getElementById("everyoneList").innerHTML=html;


};







window.openEveryoneSubject=function(subject){



let html=`


<button onclick="openEveryoneHistory()">

← 教科一覧へ

</button>


<h2>
📚 ${subject}
</h2>


<h3>
📖 単元を選んでください
</h3>


`;



let units=[];



everyoneData.forEach(data=>{


if(data.subject===subject){


if(!units.includes(data.unit)){


units.push(data.unit);


}


}


});



units.forEach(unit=>{


html += `


<div class="card">


<h2>
📖 ${unit || "単元名なし"}
</h2>



<button onclick="openEveryoneUnit('${subject}','${unit}')">

見る

</button>



</div>


`;



});



document.getElementById("everyoneList").innerHTML=html;


};








window.openEveryoneUnit=function(subject,unit){


let html=`


<button onclick="openEveryoneSubject('${subject}')">

← 単元一覧へ

</button>



<h2>
📖 ${unit}
</h2>


`;



everyoneData.forEach(data=>{


if(
data.subject===subject &&
data.unit===unit
){



html += `


<div class="card">


<h3>
👤 友達の振り返り
</h3>



<p>
📝 今日の学び
</p>


<p>
${data.study}
</p>




<div class="advice-box">


🤖 AIからの問い

<br>

${data.aiQuestion || ""}


</div>



<p>
✏️ 深めた考え
</p>


<p>
${data.deepReflection || ""}

</p>
<button onclick="addLike('${data.id}')">

⭐ この考えが参考になった

</button>


<p>
⭐ 参考にした人数：
${data.likes || 0}人

</p>


</div>



`;



}



});



document.getElementById("everyoneList").innerHTML=html;


};

window.addLike = async function(id){


const ref = doc(db,"manabi",id);


const target = everyoneData.find(
data=>data.id===id
);



if(target){


await updateDoc(

ref,

{

likes:(target.likes || 0)+1

}

);


alert("⭐ 参考にしました！");


openEveryoneHistory();


}



};
</script>
