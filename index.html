<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>学びアルバム Ver.2</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    "Noto Sans JP",
    sans-serif;
  background: #f4f7fb;
  color: #333;
}

header {
  background: #3d7cc9;
  color: white;
  text-align: center;
  padding: 18px;
  font-size: 23px;
  font-weight: bold;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow:
    0 3px 12px rgba(0,0,0,.08);
}

.hidden {
  display: none;
}

button {
  border: none;
  border-radius: 10px;
  padding: 13px 20px;
  margin: 5px;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
  background: #3d7cc9;
  color: white;
}

.green {
  background: #4c9b65;
}

.orange {
  background: #d98b35;
}

.purple {
  background: #7656a8;
}

.gray {
  background: #777;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0 15px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
}

textarea {
  min-height: 180px;
  line-height: 1.8;
}

.lesson-box {
  background: #eef6ff;
  border-left: 6px solid #3d7cc9;
  padding: 18px;
  border-radius: 10px;
  margin: 15px 0;
}

.ai-box {
  background: #fff8dd;
  border-left: 6px solid #e1aa32;
  padding: 18px;
  border-radius: 10px;
  margin: 15px 0;
}

.deep-box {
  background: #eef9f0;
  border-left: 6px solid #4c9b65;
  padding: 18px;
  border-radius: 10px;
  margin: 15px 0;
}

.reflection-card {
  background: #f8fbfd;
  border-left: 5px solid #55a96d;
  padding: 15px;
  border-radius: 10px;
  margin: 12px 0;
}

.subject-grid {
  display: grid;
  grid-template-columns:
    repeat(3,1fr);
  gap: 12px;
}

.subject-card {
  padding: 18px;
  border-radius: 12px;
  background: #f1f7ff;
  border: 2px solid #d5e6f7;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
}

@media(max-width:600px) {

  .subject-grid {
    grid-template-columns:
      repeat(2,1fr);
  }

}

</style>

</head>

<body>

<header>
📚 学びアルバム
</header>

<div class="container">


<!-- ==================================================
     START
================================================== -->

<div
  id="startPage"
  class="card"
>

<h2>
👋 今日の学び
</h2>

<div
  id="lessonArea"
>
読み込み中...
</div>

<button
  class="green"
  onclick="openReflection()"
>
✏️ 今日の振り返りを書く
</button>

<button
  onclick="openHistory()"
>
📖 自分の振り返りを見る
</button>

<button
  class="purple"
  onclick="openEveryoneHistory()"
>
👫 みんなの振り返りを見る
</button>

</div>


<!-- ==================================================
     REFLECTION
================================================== -->

<div
  id="reflectionPage"
  class="card hidden"
>

<h2>
✏️ 今日の振り返り
</h2>

<div
  id="currentLessonInfo"
  class="lesson-box"
></div>


<label>
出席番号
</label>

<input
  id="studentNumber"
  type="number"
  min="1"
  max="50"
  placeholder="例：12"
>


<label>
教科
</label>

<input
  id="subject"
  readonly
>


<label>
単元名
</label>

<input
  id="unit"
  readonly
>


<label>
今日の学び
</label>

<textarea
  id="study"
  placeholder="今日の授業で分かったこと、できるようになったこと、考えたことを書こう。"
  oninput="showAdvice()"
></textarea>


<div
  id="adviceBox"
  class="ai-box hidden"
>

<h3>
🤖 AIからの問い
</h3>

<div
  id="aiQuestion"
></div>

</div>


<button
  class="green"
  onclick="saveReflection()"
>
💾 振り返りを保存
</button>

<button
  class="gray"
  onclick="goHome()"
>
戻る
</button>

</div>


<!-- ==================================================
     DEEP
================================================== -->

<div
  id="deepPage"
  class="card hidden"
>

<h2>
🌱 もう一歩深く考えてみよう
</h2>

<div class="deep-box">

<p>
さっき書いた振り返りについて、
もう一歩考えてみましょう。
</p>

<div
  id="deepQuestion"
></div>

</div>

<textarea
  id="deepReflection"
  placeholder="AIからの問いをもとに、もう一歩深く考えてみよう。"
></textarea>

<button
  class="green"
  onclick="saveDeepReflection()"
>
🌱 深まりを保存
</button>

</div>


<!-- ==================================================
     HISTORY
================================================== -->

<div
  id="historyPage"
  class="card hidden"
>

<h2>
📖 自分の振り返り
</h2>

<input
  id="historyNumber"
  type="number"
  placeholder="出席番号を入力"
>

<button
  onclick="loadMyHistory()"
>
見る
</button>

<div
  id="historyList"
></div>

<button
  class="gray"
  onclick="goHome()"
>
戻る
</button>

</div>


<!-- ==================================================
     EVERYONE
================================================== -->

<div
  id="everyonePage"
  class="card hidden"
>

<h2>
👫 みんなの振り返り
</h2>

<div
  id="everyoneSubjects"
  class="subject-grid"
></div>

<div
  id="everyoneList"
></div>

<button
  class="gray"
  onclick="goHome()"
>
戻る
</button>

</div>


</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  orderBy,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   Firebase
================================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

  authDomain:
  "manabi-album-v2.firebaseapp.com",

  projectId:
  "manabi-album-v2",

  storageBucket:
  "manabi-album-v2.firebasestorage.app",

  messagingSenderId:
  "226258471812",

  appId:
  "1:226258471812:web:15230ba15e7e0bd7d86bd1"

};

const app =
  initializeApp(
    firebaseConfig
  );

const db =
  getFirestore(app);


/* ==================================================
   設定
================================================== */

const SCHOOL_YEAR = 2026;


/* ==================================================
   状態
================================================== */

let currentLesson =
  null;

let savedReflectionId =
  null;

let everyoneData =
  [];


/* ==================================================
   画面
================================================== */

function showPage(id) {

  [
    "startPage",
    "reflectionPage",
    "deepPage",
    "historyPage",
    "everyonePage"
  ]
  .forEach(
    p =>
      document
        .getElementById(p)
        .classList.add("hidden")
  );


  document
    .getElementById(id)
    .classList.remove("hidden");

}


window.goHome =
function() {

  showPage(
    "startPage"
  );

};


/* ==================================================
   現在の授業を取得
================================================== */

async function loadCurrentLesson() {

  try {

    const ref =
      doc(
        db,
        "currentLesson",
        "today"
      );


    const snap =
      await getDoc(ref);


    const area =
      document.getElementById(
        "lessonArea"
      );


    if (
      !snap.exists() ||
      !snap.data().active
    ) {

      currentLesson =
        null;


      area.innerHTML = `

        <div class="lesson-box">

          🔴
          <strong>
            先生がまだ授業を開始していません。
          </strong>

          <br><br>

          先生が授業を開始すると、
          ここに今日の教科と単元が表示されます。

        </div>

      `;

      return;

    }


    currentLesson =
      snap.data();


    area.innerHTML = `

      <div class="lesson-box">

        🟢
        <strong>
          今日の授業が始まっています！
        </strong>

        <br><br>

        📖 教科：
        <strong>
          ${escapeHtml(
            currentLesson.subject
          )}
        </strong>

        <br>

        📚 単元：
        <strong>
          ${escapeHtml(
            currentLesson.unit
          )}
        </strong>

      </div>

    `;

  }
  catch(error) {

    console.error(error);

    document.getElementById(
      "lessonArea"
    ).innerHTML = `

      <div class="lesson-box">

        ❌ 授業情報を読み込めませんでした。

      </div>

    `;

  }

}


/* ==================================================
   振り返り画面
================================================== */

window.openReflection =
async function() {

  await loadCurrentLesson();


  if (!currentLesson) {

    alert(
      "先生がまだ授業を開始していません。"
    );

    return;

  }


  showPage(
    "reflectionPage"
  );


  document.getElementById(
    "subject"
  ).value =
    currentLesson.subject || "";


  document.getElementById(
    "unit"
  ).value =
    currentLesson.unit || "";


  document.getElementById(
    "currentLessonInfo"
  ).innerHTML = `

    🟢 今日の授業

    <br><br>

    教科：
    <strong>
      ${escapeHtml(
        currentLesson.subject
      )}
    </strong>

    <br>

    単元：
    <strong>
      ${escapeHtml(
        currentLesson.unit
      )}
    </strong>

  `;

};


/* ==================================================
   AIの問い
================================================== */

window.showAdvice =
function() {

  const subject =
    document.getElementById(
      "subject"
    ).value;


  const study =
    document.getElementById(
      "study"
    ).value
    .trim();


  const box =
    document.getElementById(
      "adviceBox"
    );


  const question =
    document.getElementById(
      "aiQuestion"
    );


  if (!study) {

    box.classList.add(
      "hidden"
    );

    return;

  }


  let q =
    "今日の学びで、いちばん心に残ったことは何ですか？";


  if (
    subject === "国語"
  ) {

    if (
      study.includes("分かった") ||
      study.includes("できた")
    ) {

      q =
        "どうして分かったのですか？また、次に生かせそうなことは何ですか？";

    }
    else {

      q =
        "友達の考えや自分の考えと比べて、どんなことに気付きましたか？";

    }

  }


  else if (
    subject === "算数"
  ) {

    q =
      "その方法が使えるのは、どんなときだと思いますか？";

  }


  else if (
    subject === "理科"
  ) {

    q =
      "実験や観察の結果から、どんなことが分かったと言えますか？";

  }


  else if (
    subject === "社会"
  ) {

    q =
      "調べたことから、なぜそうなっているのか考えてみましょう。";

  }


  else if (
    subject === "総合"
  ) {

    q =
      "活動を通して、自分の考えはどのように変わりましたか？";

  }


  else if (
    subject === "道徳"
  ) {

    q =
      "今日考えたことを、これからの生活でどのように生かせそうですか？";

  }


  else if (
    subject === "体育"
  ) {

    q =
      "うまくいくために、どんな工夫をしましたか？";

  }


  question.textContent =
    q;


  box.classList.remove(
    "hidden"
  );

};


/* ==================================================
   保存
================================================== */

window.saveReflection =
async function() {

  if (!currentLesson) {

    alert(
      "授業情報がありません。"
    );

    return;

  }


  const studentNumber =
    document.getElementById(
      "studentNumber"
    ).value.trim();


  const study =
    document.getElementById(
      "study"
    ).value.trim();


  if (!studentNumber) {

    alert(
      "出席番号を入力してください。"
    );

    return;

  }


  if (!study) {

    alert(
      "振り返りを書いてください。"
    );

    return;

  }


  const aiQuestion =
    document.getElementById(
      "aiQuestion"
    ).textContent;


  try {

    const ref =
      await addDoc(
        collection(
          db,
          "manabi"
        ),
        {

          schoolYear:
            SCHOOL_YEAR,

          studentNumber:
            Number(
              studentNumber
            ),

          subject:
            currentLesson.subject,

          unit:
            currentLesson.unit,

          lessonId:
            currentLesson.lessonId,

          study:
            study,

          aiQuestion:
            aiQuestion,

          deepReflection:
            "",

          deepLevel:
            "",

          date:
            new Date().toISOString(),

          createdAt:
            serverTimestamp()

        }
      );


    savedReflectionId =
      ref.id;


    document.getElementById(
      "deepQuestion"
    ).textContent =
      aiQuestion ||
      "この学びから、もっと考えてみたいことは何ですか？";


    document.getElementById(
      "deepReflection"
    ).value =
      "";


    showPage(
      "deepPage"
    );


    alert(
      "振り返りを保存しました！"
    );

  }
  catch(error) {

    console.error(error);

    alert(
      "保存できませんでした。\n" +
      error.message
    );

  }

};


/* ==================================================
   深まり保存
================================================== */

window.saveDeepReflection =
async function() {

  if (!savedReflectionId) {

    alert(
      "保存する振り返りがありません。"
    );

    return;

  }


  const deep =
    document.getElementById(
      "deepReflection"
    ).value.trim();


  if (!deep) {

    alert(
      "もう一歩深く考えたことを書いてください。"
    );

    return;

  }


  const level =
    judgeDepth(
      deep
    );


  try {

    await updateDoc(

      doc(
        db,
        "manabi",
        savedReflectionId
      ),

      {

        deepReflection:
          deep,

        deepLevel:
          level,

        deepUpdatedAt:
          serverTimestamp()

      }

    );


    alert(
      `深まりレベル${level}で保存しました！`
    );


    document.getElementById(
      "study"
    ).value = "";


    document.getElementById(
      "deepReflection"
    ).value = "";


    showPage(
      "startPage"
    );


    loadCurrentLesson();

  }
  catch(error) {

    console.error(error);

    alert(
      "保存できませんでした。\n" +
      error.message
    );

  }

};


/* ==================================================
   深まり判定
================================================== */

function judgeDepth(
  text
) {

  const t =
    text.trim();


  if (
    t.length < 25
  ) {

    return "1";

  }


  const deepWords = [

    "なぜ",
    "理由",
    "だから",
    "比べて",
    "違い",
    "共通",
    "工夫",
    "生かす",
    "次は",
    "これから",
    "つながる",
    "考えが変わった",
    "気付いた",
    "分かったこと"

  ];


  const count =
    deepWords.filter(
      word =>
        t.includes(word)
    ).length;


  if (
    t.length >= 60 &&
    count >= 2
  ) {

    return "3";

  }


  if (
    t.length >= 35 ||
    count >= 1
  ) {

    return "2";

  }


  return "1";

}


/* ==================================================
   自分の履歴
================================================== */

window.openHistory =
function() {

  showPage(
    "historyPage"
  );

};


window.loadMyHistory =
async function() {

  const number =
    document.getElementById(
      "historyNumber"
    ).value.trim();


  if (!number) {

    alert(
      "出席番号を入力してください。"
    );

    return;

  }


  const area =
    document.getElementById(
      "historyList"
    );


  area.innerHTML =
    "読み込み中...";


  try {

    const q =
      query(

        collection(
          db,
          "manabi"
        ),

        where(
          "schoolYear",
          "==",
          SCHOOL_YEAR
        ),

        where(
          "studentNumber",
          "==",
          Number(number)
        )

      );


    const snap =
      await getDocs(q);


    const data =
      snap.docs
        .map(
          d => ({
            id:
              d.id,
            ...d.data()
          })
        )
        .sort(
          (a,b) =>
            new Date(b.date) -
            new Date(a.date)
        );


    if (!data.length) {

      area.innerHTML =
        "まだ振り返りがありません。";

      return;

    }


    area.innerHTML =
      data.map(
        item => `

        <div class="reflection-card">

          <small>
            ${formatDate(item.date)}
          </small>

          <h3>
            ${escapeHtml(
              item.subject
            )}
            ・
            ${escapeHtml(
              item.unit
            )}
          </h3>

          <p>
            ${escapeHtml(
              item.study
            )}
          </p>

          ${
            item.deepReflection
            ?
            `
              <div class="deep-box">

                🌱
                ${escapeHtml(
                  item.deepReflection
                )}

                <br>

                深まりレベル：
                ${escapeHtml(
                  item.deepLevel
                )}

              </div>
            `
            :
            ""
          }

        </div>

      `
      ).join("");

  }
  catch(error) {

    console.error(error);

    area.innerHTML =
      "読み込みエラー";

  }

};


/* ==================================================
   みんなの振り返り
================================================== */

window.openEveryoneHistory =
async function() {

  showPage(
    "everyonePage"
  );


  const area =
    document.getElementById(
      "everyoneSubjects"
    );


  area.innerHTML =
    "読み込み中...";


  try {

    const snap =
      await getDocs(
        query(
          collection(
            db,
            "manabi"
          ),

          where(
            "schoolYear",
            "==",
            SCHOOL_YEAR
          )
        )
      );


    everyoneData =
      snap.docs.map(
        d => ({
          id:
            d.id,
          ...d.data()
        })
      );


    area.innerHTML = "";


    [
      "国語",
      "算数",
      "生活",
      "理科",
      "社会",
      "総合",
      "道徳",
      "体育"
    ]
    .forEach(
      subject => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "subject-card";


        card.textContent =
          subject;


        card.onclick =
          () =>
            showEveryoneSubject(
              subject
            );


        area.appendChild(
          card
        );

      }
    );

  }
  catch(error) {

    console.error(error);

    area.innerHTML =
      "読み込みエラー";

  }

};


function showEveryoneSubject(
  subject
) {

  const area =
    document.getElementById(
      "everyoneList"
    );


  const data =
    everyoneData
      .filter(
        x =>
          x.subject ===
          subject
      )
      .sort(
        (a,b) =>
          new Date(b.date) -
          new Date(a.date)
      );


  if (!data.length) {

    area.innerHTML =
      "この教科の振り返りはありません。";

    return;

  }


  area.innerHTML =
    data.map(
      item => `

      <div class="reflection-card">

        <small>
          ${formatDate(item.date)}
        </small>

        <strong>
          ${escapeHtml(
            item.studentNumber
          )}番
        </strong>

        <p>
          ${escapeHtml(
            item.study
          )}
        </p>

      </div>

    `
    ).join("");

}


/* ==================================================
   日付
================================================== */

function formatDate(
  value
) {

  if (!value)
    return "";

  const d =
    new Date(value);


  if (
    isNaN(
      d.getTime()
    )
  )
    return String(value);


  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;

}


/* ==================================================
   HTML
================================================== */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  )
    return "";


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ==================================================
   起動
================================================== */

loadCurrentLesson();

</script>

</body>

</html>
