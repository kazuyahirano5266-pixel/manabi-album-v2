<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学びアルバム Ver.2</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;
  background:#f4f7fb;
  color:#333;
}
button,input,textarea,select{font:inherit}
button{
  cursor:pointer;
  border:0;
  border-radius:12px;
  padding:12px 18px;
  font-weight:bold;
}
.container{
  width:min(1200px,94%);
  margin:0 auto;
  padding:20px 0 50px;
}
header{
  background:white;
  border-bottom:1px solid #ddd;
  padding:16px 20px;
  position:sticky;
  top:0;
  z-index:100;
}
.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
h1{margin:0;font-size:24px}
h2{margin-top:0}
h3{margin-bottom:8px}
.page{display:none}
.page.active{display:block}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-top:30px;
}
.menu-btn{
  min-height:130px;
  background:white;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  font-size:18px;
}
.menu-btn span{
  display:block;
  font-size:38px;
  margin-bottom:8px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

label{
  display:block;
  font-weight:bold;
  margin:14px 0 6px;
}
input,select,textarea{
  width:100%;
  border:2px solid #dce3eb;
  border-radius:12px;
  padding:12px;
  background:white;
}
textarea{
  min-height:150px;
  resize:vertical;
}
.primary{background:#4f7cff;color:white}
.secondary{background:#e8edf5;color:#333}
.success{background:#54b77a;color:white}
.danger{background:#e96b6b;color:white}

.ai-box{
  background:#eef7ff;
  border-left:6px solid #4f9de8;
  border-radius:12px;
  padding:15px;
  margin-top:14px;
}
.level-box{
  border-radius:12px;
  padding:12px 15px;
  margin-top:12px;
  background:#f7f3ff;
}

.reflection-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;
}
.reflection-card{
  background:white;
  border-radius:16px;
  padding:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}
.reflection-text{
  white-space:pre-wrap;
  line-height:1.8;
}
.anonymous{
  font-size:13px;
  color:#888;
  margin-bottom:8px;
}

.like-btn{
  background:#fff2c9;
  margin-top:12px;
}
.like-btn.selected{
  background:#ffd84d;
}
.count-badge{
  display:inline-block;
  background:#edf1f6;
  padding:5px 10px;
  border-radius:20px;
  font-size:13px;
}

.tool-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
}
.tool-btn{
  background:white;
  border:3px solid #e3e8ef;
  min-height:110px;
}
.tool-btn.selected{
  border-color:#4f7cff;
  background:#eef3ff;
}
.tool-icon{
  font-size:34px;
  display:block;
}

.board{
  position:relative;
  width:100%;
  min-height:650px;
  background:#fafafa;
  border:3px dashed #ccd5df;
  border-radius:20px;
  overflow:hidden;
  margin-top:18px;
  touch-action:none;
}
.board-title{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  padding:14px;
  pointer-events:none;
}

.thinking-card{
  position:absolute;
  width:190px;
  min-width:110px;
  min-height:90px;
  background:#fffde8;
  border:2px solid #e2d88c;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
  overflow:hidden;
  touch-action:none;
}
.card-handle{
  background:#f4e98d;
  padding:7px 35px 7px 9px;
  font-size:13px;
  font-weight:bold;
  cursor:grab;
  user-select:none;
  touch-action:none;
}
.card-text{
  width:100%;
  min-height:55px;
  border:0;
  border-radius:0;
  background:transparent;
  resize:none;
  padding:9px;
}
.card-delete{
  position:absolute;
  top:4px;
  right:4px;
  width:25px;
  height:25px;
  padding:0;
  border-radius:50%;
  background:#e96b6b;
  color:white;
}
.card-resize-handle{
  position:absolute;
  right:2px;
  bottom:2px;
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#d8c95e;
  border-radius:6px 0 10px 0;
  cursor:nwse-resize;
  user-select:none;
  touch-action:none;
  font-size:14px;
  font-weight:bold;
}

.tool-controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}

.final-area{
  margin-top:20px;
  background:#f3fff6;
  border:2px solid #a8ddb8;
  border-radius:16px;
  padding:18px;
}

.complete{
  text-align:center;
  padding:40px 20px;
}
.complete-icon{font-size:70px}
.learning-comment{
  margin:25px auto;
  max-width:750px;
  background:#fff9dc;
  border:3px solid #f1d76a;
  border-radius:18px;
  padding:20px;
  text-align:left;
  line-height:1.9;
}
.learning-comment-title{
  font-weight:bold;
  font-size:18px;
  margin-bottom:8px;
}

.hidden{display:none!important}

.history-group{
  margin-bottom:25px;
}
.history-item{
  border-left:5px solid #8ba9ff;
  padding:12px 15px;
  margin:8px 0;
  background:white;
  border-radius:8px;
}
.small{
  font-size:13px;
  color:#777;
}
.back{
  margin-bottom:15px;
}

.status{
  padding:10px 14px;
  border-radius:10px;
  margin:10px 0;
  background:#eef3f8;
}
.status.ok{background:#eaf9ef;color:#237342}
.status.error{background:#fff0f0;color:#a33}

.y-line{
  position:absolute;
  width:5px;
  height:180px;
  background:#b9a8d5;
  left:50%;
  top:270px;
  transform-origin:bottom center;
  z-index:1;
}
.y-line.left{transform:rotate(-55deg)}
.y-line.right{transform:rotate(55deg)}
.y-center{
  position:absolute;
  left:50%;
  top:440px;
  transform:translateX(-50%);
  width:190px;
  text-align:center;
  padding:15px;
  border:3px solid #b9a8d5;
  background:#faf5ff;
  border-radius:15px;
  z-index:2;
}
.y-label{
  position:absolute;
  top:90px;
  padding:15px 25px;
  border-radius:15px;
  background:#fff;
  border:3px solid #b9a8d5;
  font-weight:bold;
  z-index:3;
}
.y-label.left{left:12%}
.y-label.right{right:12%}
.y-label.top{
  left:50%;
  transform:translateX(-50%);
  top:35px;
}

.before-after{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:15px;
  align-items:center;
}
.before-after .arrow{
  font-size:40px;
}

.venn{
  position:relative;
  min-height:500px;
}
.circle{
  position:absolute;
  width:300px;
  height:300px;
  border:4px solid #7899e8;
  border-radius:50%;
  top:100px;
}
.circle.left{left:18%}
.circle.right{right:18%}
.circle-label{
  position:absolute;
  top:60px;
  font-weight:bold;
}
.circle-label.left{left:27%}
.circle-label.right{right:27%}
.circle-center{
  position:absolute;
  left:50%;
  top:225px;
  transform:translate(-50%,-50%);
  font-weight:bold;
}

.webbing{
  position:relative;
  min-height:550px;
}
.web-center{
  position:absolute;
  left:50%;
  top:220px;
  transform:translate(-50%,-50%);
  width:180px;
  padding:20px;
  background:#eaf3ff;
  border:3px solid #7fa7df;
  border-radius:50%;
  text-align:center;
  font-weight:bold;
}
.web-line{
  position:absolute;
  height:4px;
  width:180px;
  background:#7fa7df;
  left:50%;
  top:220px;
  transform-origin:left center;
}
.web-node{
  position:absolute;
  width:150px;
  padding:12px;
  background:white;
  border:3px solid #9ab7df;
  border-radius:12px;
  text-align:center;
}
.web-node.n1{left:8%;top:70px}
.web-node.n2{right:8%;top:70px}
.web-node.n3{left:4%;top:360px}
.web-node.n4{right:4%;top:360px}

.jellyfish{
  position:relative;
  min-height:550px;
}
.jelly-body{
  position:absolute;
  left:50%;
  top:80px;
  transform:translateX(-50%);
  width:220px;
  padding:25px;
  background:#fff3d9;
  border:4px solid #e5b865;
  border-radius:50% 50% 35% 35%;
  text-align:center;
  font-weight:bold;
}
.jelly-leg{
  position:absolute;
  width:4px;
  height:180px;
  background:#e5b865;
  top:240px;
  transform-origin:top;
}
.jelly-leg.l1{left:25%;transform:rotate(25deg)}
.jelly-leg.l2{left:38%;transform:rotate(12deg)}
.jelly-leg.l3{left:50%;transform:rotate(0)}
.jelly-leg.l4{left:62%;transform:rotate(-12deg)}
.jelly-leg.l5{left:75%;transform:rotate(-25deg)}
.jelly-label{
  position:absolute;
  width:150px;
  padding:10px;
  background:white;
  border:2px solid #e5b865;
  border-radius:10px;
  text-align:center;
}
.jelly-label.l1{left:5%;top:420px}
.jelly-label.l2{left:25%;top:440px}
.jelly-label.l3{left:43%;top:450px}
.jelly-label.l4{right:25%;top:440px}
.jelly-label.l5{right:5%;top:420px}

@media(max-width:700px){
  .container{width:96%}
  .header-inner{align-items:flex-start}
  h1{font-size:19px}
  .before-after{grid-template-columns:1fr}
  .before-after .arrow{text-align:center}
  .circle{
    width:210px;
    height:210px;
  }
  .circle.left{left:3%}
  .circle.right{right:3%}
  .circle-center{top:205px}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>📚 学びアルバム Ver.2</h1>
    <button class="secondary" onclick="goHome()">🏠 ホーム</button>
  </div>
</header>

<main class="container">

<!-- =========================
     HOME
========================= -->
<section id="homePage" class="page active">
  <div class="card">
    <h2>🌱 学びアルバム</h2>
    <p>今日の学びを振り返って、自分の考えを深めよう。</p>
  </div>

  <div class="menu-grid">
    <button class="menu-btn" onclick="openReflection()">
      <span>✏️</span>
      振り返りを書く
    </button>

    <button class="menu-btn" onclick="openHistory()">
      <span>📚</span>
      自分の振り返り
    </button>

    <button class="menu-btn" onclick="openEveryone()">
      <span>👫</span>
      みんなの振り返り
    </button>
  </div>
</section>

<!-- =========================
     REFLECTION
========================= -->
<section id="reflectionPage" class="page">
  <button class="back secondary" onclick="goHome()">← ホームへ</button>

  <div class="card">
    <h2>✏️ 振り返りを書こう</h2>

    <div id="lessonStatus" class="status">
      授業情報を確認しています……
    </div>

    <label for="studentName">名前</label>
    <input id="studentName" placeholder="自分の名前を入力">

    <label for="attendanceNo">出席番号</label>
    <input id="attendanceNo" type="number" min="1" placeholder="出席番号">

    <label for="subject">教科</label>
    <select id="subject" onchange="showAdvice()">
      <option value="">教科を選ぶ</option>
      <option>国語</option>
      <option>算数</option>
      <option>生活</option>
      <option>理科</option>
      <option>社会</option>
      <option>総合</option>
      <option>道徳</option>
      <option>体育</option>
    </select>

    <label for="unit">単元名</label>
    <input id="unit" placeholder="単元名を入力">

    <label for="study">今日の振り返り</label>
    <textarea id="study"
      placeholder="今日の学習で、分かったこと・気付いたこと・考えたことを書こう。"
      oninput="showAdvice()"></textarea>

    <div id="aiAdvice" class="ai-box">
      🤖 ここにAIからの問いが表示されます。
    </div>

    <div id="levelBox" class="level-box hidden"></div>

    <div class="tool-controls">
      <button class="primary" onclick="saveReflection()">
        💾 振り返りを保存
      </button>
      <button class="secondary" onclick="openEveryone()">
        👀 みんなの考えを見る
      </button>
    </div>
  </div>
</section>

<!-- =========================
     EVERYONE
========================= -->
<section id="everyonePage" class="page">
  <button class="back secondary" onclick="goHome()">← ホームへ</button>

  <div class="card">
    <h2>👫 みんなの振り返り</h2>
    <p>
      名前は表示されません。<br>
      「この考えを参考にしたい」と思ったものを選んでみよう。
    </p>

    <div id="everyoneInfo" class="status"></div>

    <div class="tool-controls">
      <button class="primary" onclick="loadEveryonePage()">🔄 更新</button>
      <button class="success" onclick="goThinkingTools()">
        🧠 選んだ考えを思考ツールで整理
      </button>
    </div>
  </div>

  <div id="everyoneList" class="reflection-grid"></div>
</section>

<!-- =========================
     THINKING TOOL SELECT
========================= -->
<section id="thinkingSelectPage" class="page">
  <button class="back secondary" onclick="openEveryone()">← みんなの振り返りへ</button>

  <div class="card">
    <h2>🧠 思考ツールを選ぼう</h2>
    <p>友達の考えを参考にして、自分の考えを整理してみよう。</p>

    <div id="selectedCount" class="status"></div>

    <div class="tool-grid">

      <button class="tool-btn" onclick="selectThinkingTool('venn',this)">
        <span class="tool-icon">🔵</span>
        比べる<br>
        ベン図
      </button>

      <button class="tool-btn" onclick="selectThinkingTool('web',this)">
        <span class="tool-icon">🟢</span>
        整理する<br>
        ウェビング
      </button>

      <button class="tool-btn" onclick="selectThinkingTool('jelly',this)">
        <span class="tool-icon">🟡</span>
        理由を考える<br>
        クラゲチャート
      </button>

      <button class="tool-btn" onclick="selectThinkingTool('y',this)">
        <span class="tool-icon">🟣</span>
        考えを広げる<br>
        Yチャート
      </button>

      <button class="tool-btn" onclick="selectThinkingTool('beforeAfter',this)">
        <span class="tool-icon">🔴</span>
        自分の変化を見る<br>
        Before → After
      </button>

    </div>

    <div class="tool-controls">
      <button class="primary" onclick="startThinking()">🧠 この思考ツールで考える</button>
    </div>
  </div>
</section>

<!-- =========================
     THINKING BOARD
========================= -->
<section id="thinkingPage" class="page">
  <button class="back secondary" onclick="openEveryone()">← みんなの振り返りへ</button>

  <div class="card">
    <h2 id="thinkingTitle">🧠 思考ツール</h2>

    <div id="thinkingInstruction" class="ai-box"></div>

    <div class="tool-controls">
      <button class="success" onclick="addThinkingCard()">＋ カードを追加</button>
      <button class="secondary" onclick="clearThinkingCards()">🗑 カードを全部消す</button>
      <button class="primary" onclick="saveThinking()">💾 思考ツールを保存</button>
    </div>

    <div id="thinkingBoard" class="board"></div>

    <div class="final-area">
      <h3>📝 思考ツールを使って考えたこと</h3>
      <textarea id="finalThought"
        placeholder="友達の考えを参考にしたり、思考ツールで整理したりして、今の自分の考えを書こう。"></textarea>

      <div class="tool-controls">
        <button class="primary" onclick="thinkingToReflection()">
          ✨ 振り返りに反映する
        </button>
      </div>
    </div>
  </div>
</section>

<!-- =========================
     HISTORY
========================= -->
<section id="historyPage" class="page">
  <button class="back secondary" onclick="goHome()">← ホームへ</button>

  <div class="card">
    <h2>📚 自分の振り返り</h2>

    <label for="historyName">名前</label>
    <input id="historyName" placeholder="自分の名前を入力">

    <button class="primary" onclick="loadHistory()">📖 振り返りを見る</button>
  </div>

  <div id="historyList"></div>
</section>

<!-- =========================
     COMPLETE
========================= -->
<section id="submissionCompleteArea" class="page">
  <div class="card complete">

    <div class="complete-icon">🎉</div>

    <h2>振り返りが完成しました！</h2>

    <p>
      今日の学びをしっかり振り返ることができました。
    </p>

    <div id="learningComment" class="learning-comment hidden">
      <div class="learning-comment-title">
        💬 今日の学びについて
      </div>
      <div id="learningCommentText"></div>
    </div>

    <div class="tool-controls" style="justify-content:center">
      <button class="primary" onclick="goHome()">🏠 ホームへ</button>
      <button class="secondary" onclick="openHistory()">📚 自分の振り返りを見る</button>
    </div>

  </div>
</section>

</main>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  orderBy,
  limit,
  doc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig={
  apiKey:"AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",
  authDomain:"manabi-album-v2.firebaseapp.com",
  projectId:"manabi-album-v2",
  storageBucket:"manabi-album-v2.firebasestorage.app",
  messagingSenderId:"226258471812",
  appId:"1:226258471812:web:15230ba15e7e0bd7d86bd1"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* =====================================================
   GLOBAL
===================================================== */

let currentReflectionId=null;
let currentLesson=null;
let selectedReflectionIds=[];
let selectedThinkingTool=null;
let everyoneData=[];
let everyoneCache=null;

const LESSON_CACHE_MS=15000;

/* =====================================================
   PAGE
===================================================== */

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>{
    p.classList.remove("active");
  });

  const target=document.getElementById(id);

  if(target){
    target.classList.add("active");
    window.scrollTo(0,0);
  }
}

window.goHome=function(){
  showPage("homePage");
};

window.openReflection=async function(){

  let returningFromThinking=false;

  try{
    const tool=sessionStorage.getItem("thinkingReflectionTool");
    const originalId=sessionStorage.getItem("thinkingOriginalReflectionId");

    returningFromThinking=Boolean(tool && originalId);
  }catch(e){}

  if(!returningFromThinking){
    currentReflectionId=null;
  }

  showPage("reflectionPage");

  await loadCurrentLesson();

  showAdvice();
};

/* =====================================================
   LESSON
===================================================== */

async function getCurrentLesson(){

  const now=Date.now();

  if(
    window.lessonCache &&
    now-window.lessonCache.time<LESSON_CACHE_MS
  ){
    return window.lessonCache.data;
  }

  try{

    const ref=doc(db,"currentLesson","today");
    const snap=await getDocs(
      query(
        collection(db,"currentLesson"),
        limit(1)
      )
    );

    let data=null;

    /*
      currentLesson/today が直接読めない構成にも対応。
      実際のアプリでは today ドキュメントを使用する。
    */

    try{
      const direct=await import(
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
      );
    }catch(e){}

    window.lessonCache={
      time:now,
      data:data
    };

    return data;

  }catch(e){

    console.log("授業情報取得エラー",e);
    return null;
  }
}

/*
  Firestore の currentLesson/today を直接取得するための
  getDoc を動的に利用する。
*/
import {
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function loadCurrentLesson(){

  const status=document.getElementById("lessonStatus");

  try{

    const snap=await getDoc(
      doc(db,"currentLesson","today")
    );

    if(!snap.exists()){

      currentLesson=null;

      status.textContent=
        "📘 授業情報は設定されていません。教科・単元を入力してください。";

      return null;
    }

    const data=snap.data();

    if(data.active!==true){

      currentLesson=null;

      status.textContent=
        "⏸ 授業は現在開始されていません。";

      return null;
    }

    currentLesson={
      ...data,
      lessonId:data.lessonId || "today"
    };

    status.className="status ok";

    status.textContent=
      `🟢 授業中：${data.subject||""} ${data.unit||""}`;

    /*
      授業中なら教科・単元を自動入力
    */
    if(data.subject){
      document.getElementById("subject").value=data.subject;
    }

    if(data.unit){
      document.getElementById("unit").value=data.unit;
    }

    return currentLesson;

  }catch(e){

    console.error(e);

    status.className="status error";
    status.textContent=
      "授業情報を取得できませんでした。教科・単元を入力してください。";

    return null;
  }
}

function getQuestionByLevel(subject,level){

  const questions={

    "国語":{
      1:"どんなことが分かったの？そのとき、どう思った？",
      2:"今日の学習で、前と考えが変わったところはある？",
      3:"友達の考えと比べると、自分の考えのよさや新しい気付きは何？"
    },

    "算数":{
      1:"どんな計算や考え方が分かった？",
      2:"どうしてその方法で答えを出せるの？",
      3:"別の方法で考えると、どんな共通点や違いが見える？"
    },

    "生活":{
      1:"今日、どんなことに気付いた？",
      2:"なぜそう思ったの？",
      3:"友達の考えから、新しく気付いたことはある？"
    },

    "理科":{
      1:"何が分かった？",
      2:"なぜそうなると思う？",
      3:"実験の結果や友達の考えから、考えをどう深めた？"
    },

    "社会":{
      1:"何について分かった？",
      2:"なぜそうなっているの？",
      3:"違う立場から見ると、どんなことが見えてくる？"
    },

    "総合":{
      1:"今日分かったことや気付いたことは？",
      2:"なぜそれが大切だと思った？",
      3:"友達の考えを参考にすると、自分の考えはどう深まる？"
    },

    "道徳":{
      1:"どんなことを考えた？",
      2:"なぜそう思った？",
      3:"友達の考えを聞いて、自分の考えを見つめ直すとどうなる？"
    },

    "体育":{
      1:"できるようになったことは？",
      2:"どうしたらもっと上手くできそう？",
      3:"友達の動きや考えから、自分に取り入れたいことは？"
    }
  };

  return(
    questions[subject] &&
    questions[subject][level]
  ) ||
  "今日の学習で、一番大切だと思ったことは何？";
}

function normalizeForComparison(text){
  return String(text||"")
    .replace(/\s+/g,"")
    .replace(/[。、，．,.！？!?「」『』（）()]/g,"");
}

function judgeReflectionLevel(text){

  const t=String(text||"").trim();

  if(!t)return 1;

  const normalized=normalizeForComparison(t);

  const deepWords=[
    "比べ",
    "違い",
    "共通",
    "理由",
    "なぜ",
    "だから",
    "つなが",
    "広げ",
    "深め",
    "気付い",
    "友達",
    "考えが変",
    "見直",
    "納得",
    "根拠"
  ];

  let score=0;

  deepWords.forEach(word=>{
    if(normalized.includes(word)){
      score++;
    }
  });

  if(t.length>=120 || score>=3)return 3;
  if(t.length>=45 || score>=1)return 2;

  return 1;
}

function getLevelHTML(level){

  if(level===3){
    return `
      🌟 <strong>レベル3</strong><br>
      自分の考えを理由や友達の考えとつなげながら、
      深く振り返ることができています！
    `;
  }

  if(level===2){
    return `
      👍 <strong>レベル2</strong><br>
      自分の考えをしっかり振り返ることができています。
      もう一歩、「なぜ？」を考えてみよう！
    `;
  }

  return `
    🌱 <strong>レベル1</strong><br>
    まずは今日分かったことや気付いたことを書けています。
    「どうして？」を一つ加えてみよう！
  `;
}

window.saveReflection=async function(){

  const name=document.getElementById("studentName").value.trim();
  const attendanceNo=document.getElementById("attendanceNo").value.trim();
  const subject=document.getElementById("subject").value.trim();
  const unit=document.getElementById("unit").value.trim();
  const study=document.getElementById("study").value.trim();

  if(!name){
    alert("名前を入力してください。");
    return;
  }

  if(!subject){
    alert("教科を選んでください。");
    return;
  }

  if(!unit){
    alert("単元名を入力してください。");
    return;
  }

  if(!study){
    alert("振り返りを書いてください。");
    return;
  }

  const level=judgeReflectionLevel(study);
  const aiQuestion=getQuestionByLevel(subject,level);

  const lessonId=
    currentLesson?.lessonId ||
    currentLesson?.id ||
    null;

  /*
    思考ツールから戻ってきた「最終振り返り」なら、
    最初の振り返りのFirestore文書を更新する。
  */

  let originalReflectionId=null;

  try{
    originalReflectionId=
      sessionStorage.getItem("thinkingOriginalReflectionId");
  }catch(e){}

  const isFinalThinkingReflection=
    Boolean(
      originalReflectionId &&
      sessionStorage.getItem("thinkingReflectionTool")
    );

  try{

    if(isFinalThinkingReflection){

      let initialStudy="";

      try{
        initialStudy=
          sessionStorage.getItem("thinkingInitialStudy") || "";
      }catch(e){}

      const tool=
        sessionStorage.getItem("thinkingReflectionTool") || "";

      let sourceIds=[];

      try{
        sourceIds=JSON.parse(
          sessionStorage.getItem("thinkingSourceIds") || "[]"
        );
      }catch(e){}

      const learningComment=
        generateLearningComment(
          initialStudy,
          study,
          tool
        );

      await updateDoc(
        doc(db,"manabi",originalReflectionId),
        {
          finalReflection:study,
          finalReflectionDate:new Date().toISOString(),
          thinkingTool:tool,
          thinkingSourceIds:sourceIds,
          learningComment:learningComment,
          reflectionStage:"completed",
          updatedAt:serverTimestamp(),

          /*
            最新情報も保存
          */
          name,
          attendanceNo,
          subject,
          unit,
          deepReflection:level,
          aiQuestion,
          lessonId
        }
      );

      currentReflectionId=originalReflectionId;

      try{
        sessionStorage.removeItem("thinkingOriginalReflectionId");
        sessionStorage.removeItem("thinkingInitialStudy");
        sessionStorage.removeItem("thinkingReflectionTool");
        sessionStorage.removeItem("thinkingSourceIds");
        sessionStorage.removeItem("thinkingReflectionDraft");
      }catch(e){}

      showLearningComment(learningComment);

      showPage("submissionCompleteArea");

      return;
    }

    /*
      通常の最初の振り返り保存
    */

    const docRef=await addDoc(
      collection(db,"manabi"),
      {
        name,
        attendanceNo,
        subject,
        unit,
        study,

        aiQuestion,
        deepReflection:level,

        lessonId,

        likes:0,

        date:new Date().toISOString(),
        createdAt:serverTimestamp(),

        reflectionStage:"initial"
      }
    );

    currentReflectionId=docRef.id;

    /*
      後で思考ツールから戻ってきたとき、
      同じ振り返りを更新できるようにする。
    */

    try{
      sessionStorage.setItem(
        "thinkingOriginalReflectionId",
        docRef.id
      );

      sessionStorage.setItem(
        "thinkingInitialStudy",
        study
      );
    }catch(e){}

    /*
      最初の保存後は、友達の考えを見る流れへ。
    */

    alert("振り返りを保存しました！");

    await openEveryone();

  }catch(e){

    console.error(e);

    alert(
      "保存できませんでした。\n"+
      e.message
    );
  }
};

/* =====================================================
   LEARNING COMMENT
===================================================== */

function extractFinalThought(text){

  return String(text||"")
    .replace(/【思考ツールで整理したこと】/g,"")
    .replace(/【友達の考えから参考にしたこと】/g,"")
    .replace(/【自分の考え】/g,"")
    .replace(/【整理して見つけたこと】/g,"")
    .replace(/【今日の授業での自分の考え】/g,"")
    .trim();
}

function generateLearningComment(initial,final,tool){

  const a=normalizeForComparison(initial);
  const b=normalizeForComparison(final);

  const same=
    a===b ||
    (
      a.length>0 &&
      b.length>0 &&
      (
        b.includes(a) ||
        a.includes(b)
      )
    );

  let first="";

  if(same){

    first=
      "最初の考えを大切にしながら、友達の考えや思考ツールを使って、自分の考えを確かめることができました。考えが大きく変わらなくても、自分の考えを見つめ直せたことが今日の大切な学びです。";

  }else if(tool==="venn"){

    first=
      "友達の考えと比べたことで、同じところや違うところに気付き、自分の考えを見つめ直すことができました。";

  }else if(tool==="web"){

    first=
      "いくつかの考えを整理してつなげたことで、自分の考えを広げたり、関係に気付いたりすることができました。";

  }else if(tool==="jelly"){

    first=
      "理由を一つずつ考えたことで、「どうしてそう思うのか」を深く考えることができました。";

  }else if(tool==="y"){

    first=
      "いろいろな視点から考えたことで、最初には気付かなかったことにも目を向けることができました。";

  }else if(tool==="beforeAfter"){

    first=
      "最初の考えと今の考えを比べたことで、自分の考えの変化を自分自身で確かめることができました。";

  }else{

    first=
      "友達の考えや思考ツールを使って、自分の考えをもう一度見つめ直すことができました。";
  }

  if(
    !same &&
    final.length>initial.length+12
  ){

    first+=
      " 最初の考えに新しい気付きが加わり、考えが一歩深まりましたね。";

  }else if(!same){

    first+=
      " 最初の考えをもとに、新しい気付きや考えを加えることができましたね。";
  }

  return first;
}

function showLearningComment(comment){

  const box=document.getElementById("learningComment");
  const text=document.getElementById("learningCommentText");

  text.textContent=comment;
  box.classList.remove("hidden");
}

window.openEveryone=async function(){

async function getLessonForEveryone(){

  try{

    const snap=await getDoc(
      doc(db,"currentLesson","today")
    );

    if(!snap.exists())return null;

    const data=snap.data();

    if(data.active!==true)return null;

    return{
      ...data,
      lessonId:data.lessonId || "today"
    };

  }catch(e){

    console.error(e);
    return null;
  }
}

window.loadEveryonePage=async function(){

  const info=document.getElementById("everyoneInfo");
  const list=document.getElementById("everyoneList");

  info.textContent="振り返りを読み込んでいます……";
  list.innerHTML="";

  try{

    const lesson=await getLessonForEveryone();

    currentLesson=lesson;

    let snaps;

    if(lesson && lesson.lessonId){

      const q=query(
        collection(db,"manabi"),
        where("lessonId","==",lesson.lessonId),
        limit(100)
      );

      snaps=await getDocs(q);

    }else if(lesson && lesson.subject && lesson.unit){

      const q=query(
        collection(db,"manabi"),
        where("subject","==",lesson.subject),
        where("unit","==",lesson.unit),
        limit(100)
      );

      snaps=await getDocs(q);

    }else{

      const q=query(
        collection(db,"manabi"),
        orderBy("createdAt","desc"),
        limit(100)
      );

      snaps=await getDocs(q);
    }

    everyoneData=[];

    snaps.forEach(snap=>{

      const d=snap.data();

      if(
        lesson &&
        lesson.subject &&
        d.subject!==lesson.subject
      )return;

      if(
        lesson &&
        lesson.unit &&
        d.unit!==lesson.unit
      )return;

      everyoneData.push({
        id:snap.id,
        ...d
      });
    });

    /*
      最新順
    */

    everyoneData.sort((a,b)=>{

      const da=
        a.createdAt?.seconds ||
        new Date(a.date||0).getTime()/1000;

      const dbb=
        b.createdAt?.seconds ||
        new Date(b.date||0).getTime()/1000;

      return dbb-da;
    });

    info.className="status ok";

    if(lesson){

      info.textContent=
        `🟢 ${lesson.subject||""} ${lesson.unit||""} の授業中の振り返り`;

    }else{

      info.textContent=
        "📚 みんなの振り返り";
    }

    renderEveryone();

  }catch(e){

    console.error(e);

    info.className="status error";

    info.textContent=
      "読み込みに失敗しました。";

  }
};

function renderEveryone(){

  const list=document.getElementById("everyoneList");

  list.innerHTML="";

  if(!everyoneData.length){

    list.innerHTML=`
      <div class="card">
        <p>まだ表示できる振り返りがありません。</p>
      </div>
    `;

    return;
  }

  everyoneData.forEach(item=>{

    const selected=
      selectedReflectionIds.includes(item.id);

    const text=
      item.finalReflection ||
      item.deepReflectionText ||
      item.study ||
      "";

    const div=document.createElement("div");

    div.className="reflection-card";

    div.innerHTML=`

      <div class="anonymous">
        👤 友達の振り返り
      </div>

      <div class="small">
        ${escapeHTML(item.subject||"")}
        ${item.unit ? "・"+escapeHTML(item.unit):""}
      </div>

      <div class="reflection-text">
        ${escapeHTML(text)}
      </div>

      <button
        class="like-btn ${selected?"selected":""}"
        data-id="${item.id}">
        ${selected?"👍 参考にすることにした":"👍 この考えを参考にしたい"}
      </button>
    `;

    div.querySelector(".like-btn")
      .addEventListener("click",()=>{

        toggleReflectionSelection(item.id);
      });

    list.appendChild(div);
  });

  updateSelectedCount();
}

function toggleReflectionSelection(id){

  const index=
    selectedReflectionIds.indexOf(id);

  if(index>=0){

    selectedReflectionIds.splice(index,1);

  }else{

    selectedReflectionIds.push(id);
  }

  renderEveryone();
}

function updateSelectedCount(){

  const count=
    document.getElementById("selectedCount");

  if(count){

    count.textContent=
      `👍 参考にした考え：${selectedReflectionIds.length}個`;
  }
}

function addCardToBoard(board,label){

      Math.random()*
      Math.max(50,board.clientWidth-250)
    );

    Math.floor(
      Math.random()*350
    );

  card.style.top=top+"px";

  card.innerHTML=`

    <div class="card-handle">
      ${escapeHTML(label)}
    </div>

    <button
      class="card-delete"
      title="削除">
      ×
    </button>

    <textarea
      class="card-text"
      placeholder="ここに考えを書こう"></textarea>

    <div
      class="card-resize-handle"
      aria-label="カードの大きさを変える">
      ↘
    </div>
  `;

  card.querySelector(".card-delete")
    .addEventListener("click",e=>{

      e.stopPropagation();
      card.remove();

    });

  board.appendChild(card);

  makeDraggable(card);
  makeResizable(card);
}

/* =====================================================
   DRAG
===================================================== */

function makeDraggable(element){

  const handle=
    element.querySelector(".card-handle");

  if(!handle)return;

  let dragging=false;
  let sx=0;
  let sy=0;
  let sl=0;
  let st=0;

  handle.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      dragging=true;

      sx=e.clientX;
      sy=e.clientY;

      sl=parseFloat(element.style.left)||0;
      st=parseFloat(element.style.top)||0;

      try{
        handle.setPointerCapture(e.pointerId);
      }catch(err){}

    }
  );

  handle.addEventListener(
    "pointermove",
    e=>{

      if(!dragging)return;

      e.preventDefault();

      const board=element.parentElement;

      const dx=e.clientX-sx;
      const dy=e.clientY-sy;

      let left=sl+dx;
      let top=st+dy;

      left=Math.max(
        0,
        Math.min(
          left,
          board.clientWidth-element.offsetWidth
        )
      );

      top=Math.max(
        35,
        Math.min(
          top,
          board.clientHeight-element.offsetHeight
        )
      );

      element.style.left=left+"px";
      element.style.top=top+"px";

    }
  );

  const stop=e=>{

    dragging=false;

    try{
      handle.releasePointerCapture(e.pointerId);
    }catch(err){}

  };

  handle.addEventListener("pointerup",stop);
  handle.addEventListener("pointercancel",stop);
}

/* =====================================================
   RESIZE
===================================================== */

function makeResizable(element){

  const handle=
    element.querySelector(".card-resize-handle");

  if(!handle)return;

  let resizing=false;
  let sx=0;
  let sy=0;
  let sw=0;
  let sh=0;

  handle.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();
      e.stopPropagation();

      resizing=true;

      sx=e.clientX;
      sy=e.clientY;

      sw=element.offsetWidth;
      sh=element.offsetHeight;

      try{
        handle.setPointerCapture(e.pointerId);
      }catch(err){}

    }
  );

  handle.addEventListener(
    "pointermove",
    e=>{

      if(!resizing)return;

      e.preventDefault();

      const board=element.parentElement;

      let width=
        sw+(e.clientX-sx);

      let height=
        sh+(e.clientY-sy);

      width=Math.max(110,width);
      height=Math.max(90,height);

      const left=parseFloat(element.style.left)||0;
      const top=parseFloat(element.style.top)||0;

      width=Math.min(
        width,
        board.clientWidth-left
      );

      height=Math.min(
        height,
        board.clientHeight-top
      );

      element.style.width=width+"px";
      element.style.height=height+"px";

    }
  );

  const stop=e=>{

    resizing=false;

    try{
      handle.releasePointerCapture(e.pointerId);
    }catch(err){}

  };

  handle.addEventListener("pointerup",stop);
  handle.addEventListener("pointercancel",stop);
}

/* =====================================================
   COLLECT THINKING DATA
===================================================== */

function collectThinkingData(){

  const board=
    document.getElementById("thinkingBoard");

  const cards=[];

  board
    .querySelectorAll(".thinking-card")
    .forEach(card=>{

      cards.push({

        label:
          card.querySelector(".card-handle")
            ?.textContent
            ?.trim() || "",

        text:
          card.querySelector(".card-text")
            ?.value || "",

        x:
          parseFloat(card.style.left)||0,

        y:
          parseFloat(card.style.top)||0,

        width:
          card.offsetWidth,

        height:
          card.offsetHeight
      });
    });

  return cards;
}

/* =====================================================
   SAVE THINKING
===================================================== */

window.saveThinking=async function(){

  if(!selectedThinkingTool){

    alert("思考ツールを選んでください。");
    return;
  }

  try{

    const cards=collectThinkingData();

    const finalThought=
      document.getElementById("finalThought")
        ?.value.trim() || "";

    const lessonId=
      currentLesson?.lessonId ||
      currentLesson?.id ||
      null;

    await addDoc(
      collection(db,"thinking"),
      {
        lessonId,
        subject:
          currentLesson?.subject ||
          document.getElementById("subject")?.value ||
          "",

        unit:
          currentLesson?.unit ||
          document.getElementById("unit")?.value ||
          "",

        selectedReflectionIds:[
          ...selectedReflectionIds
        ],

        tool:selectedThinkingTool,
        cards,
        finalThought,

        date:new Date().toISOString(),
        createdAt:serverTimestamp()
      }
    );

    alert("思考ツールを保存しました！");

  }catch(e){

    console.error(e);

    alert(
      "思考ツールを保存できませんでした。\n"+
      e.message
    );
  }
};

/* =====================================================
   THINKING → REFLECTION
===================================================== */

window.thinkingToReflection=function(){

  const cards=collectThinkingData();

  const finalThought=
    document.getElementById("finalThought")
      ?.value.trim() || "";

  const sourceTexts=
    selectedReflectionIds
      .map(id=>
        everyoneData.find(item=>item.id===id)
      )
      .filter(Boolean)
      .map(item=>
        item.finalReflection ||
        item.study ||
        ""
      );

  let sourceText="";

  if(sourceTexts.length){

    sourceText=
      sourceTexts
        .map(
          (text,i)=>
            `友達の考え${i+1}：${text}`
        )
        .join("\n");
  }

  const cardTexts=
    cards
      .filter(c=>c.text)
      .map(c=>
        `${c.label}：${c.text}`
      )
      .join("\n");

  const currentStudy=
    document.getElementById("study")
      ?.value.trim() || "";

  const draft=`

【思考ツールで整理したこと】
${cardTexts || "思考ツールを使って整理しました。"}

【友達の考えから参考にしたこと】
${sourceText || "友達の考えを参考にしました。"}

【自分の考え】
${currentStudy}

【整理して見つけたこと】
${finalThought}

【今日の授業での自分の考え】
${finalThought || currentStudy}
  `.trim();

  /*
    元の振り返りIDを維持
  */

  try{

    if(currentReflectionId){

      sessionStorage.setItem(
        "thinkingOriginalReflectionId",
        currentReflectionId
      );
    }

    sessionStorage.setItem(
      "thinkingInitialStudy",
      sessionStorage.getItem("thinkingInitialStudy") ||
      currentStudy
    );

    sessionStorage.setItem(
      "thinkingReflectionTool",
      selectedThinkingTool
    );

    sessionStorage.setItem(
      "thinkingSourceIds",
      JSON.stringify(selectedReflectionIds)
    );

    sessionStorage.setItem(
      "thinkingReflectionDraft",
      draft
    );

  }catch(e){}

  /*
    振り返り画面へ戻る
  */

  showPage("reflectionPage");

  document.getElementById("study").value=
    finalThought || currentStudy;

  if(currentLesson){

    if(currentLesson.subject){
      document.getElementById("subject").value=
        currentLesson.subject;
    }

    if(currentLesson.unit){
      document.getElementById("unit").value=
        currentLesson.unit;
    }
  }

  showAdvice();

  /*
    下書きは消さずに維持。
    saveReflection()で最終保存したときに削除する。
  */

  alert(
    "思考ツールで整理したことをもとに、最後の振り返りを書きました。\n\n"+
    "必要なら文章を直してから保存してください。"
  );
};

window.loadHistory=async function(){

  const name=
    document.getElementById("historyName")
      .value.trim();

  if(!name){

    alert("名前を入力してください。");
    return;
  }

  const list=
    document.getElementById("historyList");

  list.innerHTML=
    `<div class="card">読み込んでいます……</div>`;

  try{

    const q=query(
      collection(db,"manabi"),
      where("name","==",name),
      limit(300)
    );

    const snaps=await getDocs(q);

    const items=[];

    snaps.forEach(snap=>{

      items.push({
        id:snap.id,
        ...snap.data()
      });

    });

    items.sort((a,b)=>
      new Date(
        b.finalReflectionDate ||
        b.date ||
        0
      )-
      new Date(
        a.finalReflectionDate ||
        a.date ||
        0
      )
    );

    if(!items.length){

      list.innerHTML=`
        <div class="card">
          <p>振り返りが見つかりませんでした。</p>
        </div>
      `;

      return;
    }

    /*
      教科→単元でまとめる
    */

    const groups={};

    items.forEach(item=>{

      const key=
        `${item.subject||"その他"}__${item.unit||"単元なし"}`;

      if(!groups[key]){
        groups[key]=[];
      }

      groups[key].push(item);
    });

    list.innerHTML="";

    Object.entries(groups)
      .forEach(([key,group])=>{

        const first=group[0];

        const section=
          document.createElement("div");

        section.className=
          "history-group";

        section.innerHTML=`
          <div class="card">
            <h3>
              ${escapeHTML(first.subject||"")}
              ・
              ${escapeHTML(first.unit||"")}
            </h3>
            <span class="count-badge">
              ${group.length}件
            </span>
          </div>
        `;

        group.forEach(item=>{

          const text=
            item.finalReflection ||
            item.study ||
            "";

          const div=
            document.createElement("div");

          div.className="history-item";

          div.innerHTML=`

            <div class="small">
              ${formatDate(
                item.finalReflectionDate ||
                item.date
              )}
            </div>

            <div class="reflection-text">
              ${escapeHTML(text)}
            </div>

            ${
              item.learningComment
              ?
              `
              <div class="learning-comment"
                   style="margin:15px 0 0">
                <div class="learning-comment-title">
                  💬 今日の学びについて
                </div>
                ${escapeHTML(item.learningComment)}
              </div>
              `
              :""
            }

          `;

          section.appendChild(div);
        });

        list.appendChild(section);
      });

  }catch(e){

    console.error(e);

    list.innerHTML=`
      <div class="card">
        <div class="status error">
          読み込みに失敗しました。<br>
          ${escapeHTML(e.message)}
        </div>
      </div>
    `;
  }
};

/* =====================================================
   UTIL
===================================================== */

function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(value){

  if(!value)return "";

  let date;

  if(
    typeof value==="object" &&
    value.seconds
  ){

    date=new Date(
      value.seconds*1000
    );

  }else{

    date=new Date(value);
  }

  if(Number.isNaN(date.getTime()))return "";

  return date.toLocaleString(
    "ja-JP",
    {
      year:"numeric",
      month:"numeric",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}
