<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
  background:#f3f6fa;
  color:#333;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  border:none;
  border-radius:12px;
  padding:13px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.88;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

header{
  background:
    linear-gradient(
      135deg,
      #4f8cff,
      #6c63ff
    );
  color:white;
  padding:22px;
}

header h1{
  margin:0;
  font-size:27px;
}

header p{
  margin:7px 0 0;
  font-size:14px;
}

.box{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:
    0 4px 15px rgba(0,0,0,.06);
}

h2{
  margin-top:0;
}

.primary{
  background:#4f8cff;
  color:white;
}

.green{
  background:#43b883;
  color:white;
}

.orange{
  background:#f2a93b;
  color:white;
}

.gray{
  background:#e9edf4;
  color:#333;
}

.full-button{
  width:100%;
  margin-top:12px;
}

input,
select,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #d8dee8;
  border-radius:12px;
  font-size:16px;
  background:white;
}

textarea{
  min-height:150px;
  resize:vertical;
  line-height:1.8;
}

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

.lesson-box{
  border-left:7px solid #43b883;
  background:#f5fff9;
  border-radius:14px;
  padding:18px;
}

.lesson-box.waiting{
  border-left-color:#f2a93b;
  background:#fffaf0;
}

.lesson-status{
  font-weight:bold;
  color:#43a56f;
}

.lesson-status.waiting{
  color:#d58b13;
}

.lesson-subject{
  font-size:28px;
  font-weight:bold;
  margin:8px 0;
}

.lesson-unit{
  font-size:18px;
  color:#555;
}

.lesson-id{
  margin-top:10px;
  padding:10px;
  background:#eef3f9;
  border-radius:9px;
  font-size:12px;
  color:#666;
  word-break:break-all;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.menu-button{
  background:white;
  border:2px solid #e1e7f0;
  border-radius:17px;
  padding:22px;
  text-align:center;
  cursor:pointer;
}

.menu-button:hover{
  border-color:#4f8cff;
  background:#f8fbff;
}

.menu-icon{
  font-size:32px;
}

.menu-title{
  font-size:17px;
  font-weight:bold;
  margin-top:8px;
}

.menu-description{
  color:#777;
  font-size:13px;
  margin-top:5px;
}

.ai-box{
  margin-top:16px;
  background:#eef7ff;
  border-left:6px solid #4f8cff;
  border-radius:11px;
  padding:16px;
  line-height:1.8;
}

.deep-box{
  background:#fff9e8;
  border-left:6px solid #f2b94b;
  border-radius:11px;
  padding:16px;
  line-height:1.8;
}

.level-box{
  background:#f5f7fa;
  border-radius:12px;
  padding:16px;
  margin-top:16px;
}

.level-title{
  font-weight:bold;
  margin-bottom:10px;
}

.level-result{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#eef7ff;
  font-weight:bold;
}

.reflection-card{
  border:1px solid #e1e6ed;
  border-radius:15px;
  padding:18px;
  margin-bottom:14px;
}

.reflection-card h3{
  margin-top:0;
}

.date{
  color:#888;
  font-size:13px;
}

.study-text{
  margin-top:12px;
  line-height:1.8;
  white-space:pre-wrap;
}

.advice-box{
  margin-top:12px;
  background:#eef7ff;
  border-radius:10px;
  padding:13px;
  line-height:1.7;
}

.empty{
  text-align:center;
  color:#888;
  padding:35px 15px;
}

.notice{
  padding:15px;
  border-radius:12px;
  background:#fff8e8;
  color:#8a6500;
  line-height:1.7;
}

.success{
  padding:15px;
  border-radius:12px;
  background:#eefaf3;
  color:#27734b;
  line-height:1.7;
}

@media(max-width:700px){

  .menu-grid{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:23px;
  }

  .lesson-subject{
    font-size:24px;
  }

}

</style>

</head>


<body>


<header>

  <h1>📚 学びアルバム Ver.2</h1>

  <p>
    今日の学びを残そう！
  </p>

</header>


<div class="container">


<!-- =========================================
     HOME
========================================= -->

<section
  id="homePage"
  class="page active">

  <div class="box">

    <h2>📚 今日の授業</h2>

    <div id="lessonArea">

      読み込んでいます……

    </div>

  </div>


  <div class="menu-grid">

    <div
      class="menu-button"
      onclick="openReflection()">

      <div class="menu-icon">
        ✏️
      </div>

      <div class="menu-title">
        今日の振り返りを書く
      </div>

      <div class="menu-description">
        今日の学びを記録しよう
      </div>

    </div>


    <div
      class="menu-button"
      onclick="openHistory()">

      <div class="menu-icon">
        📖
      </div>

      <div class="menu-title">
        自分の振り返りを見る
      </div>

      <div class="menu-description">
        今までの学びを見る
      </div>

    </div>


    <div
      class="menu-button"
      onclick="openEveryoneHistory()">

      <div class="menu-icon">
        👫
      </div>

      <div class="menu-title">
        みんなの振り返りを見る
      </div>

      <div class="menu-description">
        友達の学びから考えよう
      </div>

    </div>

  </div>

</section>


<!-- =========================================
     REFLECTION
========================================= -->

<section
  id="reflectionPage"
  class="page">

  <div class="box">

    <button
      class="gray"
      onclick="showPage('homePage')">

      ← 戻る

    </button>

  </div>


  <div class="box">

    <h2>
      ✏️ 今日の振り返り
    </h2>


    <div
      id="reflectionLesson"
      class="lesson-box">
    </div>


    <div class="form-group">

      <label>
        👤 名前
      </label>

      <input
        id="studentName"
        type="text"
        placeholder="自分の名前を入力">

    </div>


    <div class="form-group">

      <label>
        📘 教科
      </label>

      <select id="subject">

        <option value="">
          教科を選択
        </option>

        <option>国語</option>
        <option>算数</option>
        <option>生活</option>
        <option>理科</option>
        <option>社会</option>
        <option>総合</option>
        <option>道徳</option>
        <option>体育</option>

      </select>

    </div>


    <div class="form-group">

      <label>
        📚 単元名
      </label>

      <input
        id="unit"
        type="text"
        placeholder="単元名">

    </div>


    <div class="form-group">

      <label>
        ✏️ 今日の学び
      </label>

      <textarea
        id="study"
        placeholder="今日、どんなことを学びましたか？"
        oninput="showAdvice()"></textarea>

    </div>


    <div
      id="adviceArea"
      class="ai-box"
      style="display:none;">

    </div>


    <div id="firstSaveArea">

      <button
        class="primary full-button"
        onclick="saveReflection()">

        💾 振り返りを保存する

      </button>

    </div>


    <div
      id="deepReflectionArea"
      style="display:none;">

      <div class="deep-box">

        <h3>
          🌱 もう一歩深く考えてみよう
        </h3>

        <p>
          AIからの問いをヒントに、
          もう少し詳しく振り返ってみよう。
        </p>

        <div id="savedQuestion"></div>

      </div>


      <div class="form-group">

        <label>
          🌱 深まり振り返り
        </label>

        <textarea
          id="deepReflection"
          placeholder="なぜそう思ったの？"
          oninput="judgeDepth()"></textarea>

      </div>


      <div
        id="levelResult"
        class="level-result">

        振り返りを書いてみよう。

      </div>


      <button
        class="green full-button"
        onclick="saveDeepReflection()">

        🌱 深まり振り返りを保存する

      </button>

    </div>


    <div
      id="saveMessage"
      style="margin-top:15px;">
    </div>

  </div>

</section>


<!-- =========================================
     MY HISTORY
========================================= -->

<section
  id="historyPage"
  class="page">

  <div class="box">

    <button
      class="gray"
      onclick="showPage('homePage')">

      ← 戻る

    </button>

  </div>


  <div class="box">

    <h2>
      📖 自分の振り返り
    </h2>


    <input
      id="historyName"
      placeholder="自分の名前を入力">


    <button
      class="primary full-button"
      onclick="loadMyHistory()">

      📖 振り返りを見る

    </button>


    <div
      id="historyList"
      style="margin-top:20px;">

    </div>

  </div>

</section>


<!-- =========================================
     EVERYONE
========================================= -->

<section
  id="everyonePage"
  class="page">

  <div class="box">

    <button
      class="gray"
      onclick="showPage('homePage')">

      ← 戻る

    </button>

  </div>


  <div class="box">

    <h2>
      👫 みんなの振り返り
    </h2>

    <div
      id="everyoneList">

      読み込んでいます……

    </div>

  </div>

</section>


</div>


<script type="module">


/* =========================================
   Firebase
========================================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  onSnapshot,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   Firebase設定
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

  authDomain:
    "manabi-album-v2.firebaseapp.com",

  projectId:
    "manabi-album-v2",

  storageBucket:
    "manabi-album-v2.firebasestorage.app",

  messagingSenderId:
    "226258471812",

  appId:
    "1:226258471812:web:15230ba15e7e0bd7d86bd1"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =========================================
   現在の授業
========================================= */

let currentLesson = null;

let savedReflectionId = null;

let everyoneData = [];


/* =========================================
   ページ
========================================= */

window.showPage =
function(pageId){

  document
    .querySelectorAll(".page")
    .forEach(
      page =>
        page.classList.remove(
          "active"
        )
    );


  document
    .getElementById(pageId)
    .classList.add("active");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* =========================================
   授業ID自動取得
========================================= */

const lessonRef =
  doc(
    db,
    "currentLesson",
    "today"
  );


onSnapshot(
  lessonRef,

  snapshot => {

    if(snapshot.exists()){

      currentLesson =
        snapshot.data();

    }else{

      currentLesson = null;

    }


    displayCurrentLesson();

  },

  error => {

    console.error(error);

    document.getElementById(
      "lessonArea"
    ).innerHTML = `

      <div class="notice">

        授業情報を取得できませんでした。<br>
        FirebaseのFirestoreルールを確認してください。

      </div>

    `;

  }

);


/* =========================================
   授業表示
========================================= */

function displayCurrentLesson(){

  const area =
    document.getElementById(
      "lessonArea"
    );


  if(
    !currentLesson ||
    currentLesson.active !== true
  ){

    area.innerHTML = `

      <div class="lesson-box waiting">

        <div class="lesson-status waiting">

          ⏸️ 現在、授業は始まっていません。

        </div>

        <p>
          先生が授業を開始すると、
          ここに授業内容が表示されます。
        </p>

      </div>

    `;

    return;

  }


  area.innerHTML = `

    <div class="lesson-box">

      <div class="lesson-status">

        🟢 現在の授業

      </div>


      <div class="lesson-subject">

        ${escapeHtml(
          currentLesson.subject || ""
        )}

      </div>


      <div class="lesson-unit">

        📘
        ${escapeHtml(
          currentLesson.unit || ""
        )}

      </div>


      <div class="lesson-id">

        🔑 授業IDは自動取得されています。<br>

        この授業IDは、
        児童が保存するときに自動的に記録されます。

      </div>

    </div>

  `;

}


/* =========================================
   振り返りを書く
========================================= */

window.openReflection =
function(){

  showPage(
    "reflectionPage"
  );


  if(
    !currentLesson ||
    currentLesson.active !== true
  ){

    document.getElementById(
      "reflectionLesson"
    ).innerHTML = `

      <div class="notice">

        ⏸️ まだ授業が開始されていません。<br>
        先生が授業を開始してから
        振り返りを書いてください。

      </div>

    `;

    return;

  }


  document.getElementById(
    "reflectionLesson"
  ).innerHTML = `

    <div class="lesson-status">
      🟢 ${escapeHtml(
        currentLesson.subject || ""
      )}
    </div>

    <div class="lesson-unit">
      📘 ${escapeHtml(
        currentLesson.unit || ""
      )}
    </div>

    <div class="lesson-id">
      🔑 授業IDは自動取得済み
    </div>

  `;


  document.getElementById(
    "subject"
  ).value =
    currentLesson.subject || "";


  document.getElementById(
    "unit"
  ).value =
    currentLesson.unit || "";

};


/* =========================================
   AIからの問い
========================================= */

window.showAdvice =
function(){

  const subject =
    document
      .getElementById(
        "subject"
      )
      .value;


  const text =
    document
      .getElementById(
        "study"
      )
      .value
      .trim();


  const area =
    document.getElementById(
      "adviceArea"
    );


  if(!text){

    area.style.display =
      "none";

    return;

  }


  let question =
    "今日の学びで、一番心に残ったことは何ですか？";


  if(subject === "国語"){

    if(
      text.includes("分かった") ||
      text.includes("できた")
    ){

      question =
        "どうして分かったの？どんな工夫をしたの？";

    }else{

      question =
        "文章や友達の考えから、新しく気付いたことは何ですか？";

    }

  }


  if(subject === "算数"){

    question =
      "その答えになる理由を、図や言葉を使って説明するとどうなりますか？";

  }


  if(subject === "理科"){

    question =
      "実験や観察の結果から、どんなことが分かったと言えますか？";

  }


  if(subject === "社会"){

    question =
      "今日分かったことは、私たちの生活とどのようにつながっていますか？";

  }


  if(subject === "生活"){

    question =
      "見つけたことや気付いたことから、さらに調べてみたいことは何ですか？";

  }


  if(subject === "総合"){

    question =
      "今日の学びを、地域や自分たちの生活にどう生かせそうですか？";

  }


  if(subject === "道徳"){

    question =
      "今日考えたことを、自分の生活に置き換えるとどうなりますか？";

  }


  if(subject === "体育"){

    question =
      "うまくいくために、どんな工夫や声かけをしましたか？";

  }


  area.style.display =
    "block";


  area.innerHTML = `

    <strong>
      🤖 AIからの問い
    </strong>

    <br><br>

    ${escapeHtml(question)}

  `;


};


/* =========================================
   振り返り保存
========================================= */

window.saveReflection =
async function(){

  if(
    !currentLesson ||
    currentLesson.active !== true
  ){

    alert(
      "現在、授業が開始されていません。"
    );

    return;

  }


  const name =
    document
      .getElementById(
        "studentName"
      )
      .value
      .trim();


  const subject =
    document
      .getElementById(
        "subject"
      )
      .value;


  const unit =
    document
      .getElementById(
        "unit"
      )
      .value
      .trim();


  const study =
    document
      .getElementById(
        "study"
      )
      .value
      .trim();


  if(!name){

    alert(
      "名前を入力してください。"
    );

    return;

  }


  if(!subject){

    alert(
      "教科を選択してください。"
    );

    return;

  }


  if(!unit){

    alert(
      "単元名を入力してください。"
    );

    return;

  }


  if(!study){

    alert(
      "今日の学びを書いてください。"
    );

    return;

  }


  let aiQuestion =
    "";


  const advice =
    document.getElementById(
      "adviceArea"
    );


  if(advice.style.display !== "none"){

    aiQuestion =
      advice.innerText
        .replace(
          "🤖 AIからの問い",
          ""
        )
        .trim();

  }


  try{

    const result =
      await addDoc(

        collection(
          db,
          "manabi"
        ),

        {

          name:name,

          subject:subject,

          unit:unit,

          study:study,

          aiQuestion:aiQuestion,

          deepReflection:"",

          deepLevel:1,

          likes:0,

          lessonId:
            currentLesson.lessonId,

          date:
            new Date().toLocaleString(
              "ja-JP"
            ),

          createdAt:
            serverTimestamp()

        }

      );


    savedReflectionId =
      result.id;


    document.getElementById(
      "firstSaveArea"
    ).style.display =
      "none";


    document.getElementById(
      "deepReflectionArea"
    ).style.display =
      "block";


    document.getElementById(
      "savedQuestion"
    ).innerHTML = `

      <strong>
        🤖 ${escapeHtml(
          aiQuestion ||
          "今日の学びを、もう一度詳しく考えてみよう。"
        )}
      </strong>

    `;


    document.getElementById(
      "saveMessage"
    ).innerHTML = `

      <div class="success">

        ✅ 振り返りを保存しました！<br>
        次に「深まり振り返り」を書いてみよう。

      </div>

    `;

  }catch(error){

    console.error(error);

    alert(
      "保存できませんでした。Firebaseの設定を確認してください。"
    );

  }

};


/* =========================================
   深まり判定
========================================= */

window.judgeDepth =
function(){

  const text =
    document
      .getElementById(
        "deepReflection"
      )
      .value
      .trim();


  const result =
    document.getElementById(
      "levelResult"
    );


  if(!text){

    result.innerHTML =
      "振り返りを書いてみよう。";

    return 1;

  }


  let level = 1;


  if(
    text.length >= 25
  ){

    level = 2;

  }


  if(
    text.length >= 45 &&
    (
      text.includes("なぜ") ||
      text.includes("理由") ||
      text.includes("だから") ||
      text.includes("工夫") ||
      text.includes("つなが") ||
      text.includes("生か")
    )
  ){

    level = 3;

  }


  if(level === 1){

    result.innerHTML =
      "🌱 レベル1：まずは、自分が分かったことを書けています。";

  }


  if(level === 2){

    result.innerHTML =
      "🌱 レベル2：学びについて、詳しく振り返ることができています！";

  }


  if(level >= 3){

    result.innerHTML =
      "🌟 レベル3：理由や自分の考えまで深く振り返ることができています！すばらしい！";

  }


  return level;

};


/* =========================================
   深まり振り返り保存
========================================= */

window.saveDeepReflection =
async function(){

  if(!savedReflectionId){

    alert(
      "先に最初の振り返りを保存してください。"
    );

    return;

  }


  const text =
    document
      .getElementById(
        "deepReflection"
      )
      .value
      .trim();


  if(!text){

    alert(
      "深まり振り返りを書いてください。"
    );

    return;

  }


  const level =
    judgeDepth();


  try{

    await updateDoc(

      doc(
        db,
        "manabi",
        savedReflectionId
      ),

      {

        deepReflection:text,

        deepLevel:level,

        deepUpdatedAt:
          serverTimestamp()

      }

    );


    document.getElementById(
      "saveMessage"
    ).innerHTML = `

      <div class="success">

        ✅ 深まり振り返りも保存しました！<br>

        ${
          level >= 3
          ? "🌟 とても深く考えられています！"
          : "🌱 よく振り返ることができました！"
        }

      </div>

    `;

  }catch(error){

    console.error(error);

    alert(
      "深まり振り返りを保存できませんでした。"
    );

  }

};

window.openHistory =

window.loadMyHistory =
async function(){

  const name =
    document
      .getElementById(
        "historyName"
      )
      .value
      .trim();


  const area =
    document.getElementById(
      "historyList"
    );


  if(!name){

    alert(
      "名前を入力してください。"
    );

    return;

  }


  area.innerHTML =
    "読み込んでいます……";


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "manabi"
        )
      );


    const data = [];


    snapshot.forEach(
      item => {

        const d =
          item.data();


        if(d.name === name){

          data.push(d);

        }

      }
    );


    data.sort(
      (a,b) =>
        String(
          b.date || ""
        ).localeCompare(
          String(
            a.date || ""
          )
        )
    );


    if(data.length === 0){

      area.innerHTML = `

        <div class="empty">

          まだ振り返りはありません。

        </div>

      `;

      return;

    }


    area.innerHTML =
      data.map(
        item => `

          <div class="reflection-card">

            <h3>

              📘
              ${escapeHtml(
                item.subject || ""
              )}

            </h3>


            <div>

              ${escapeHtml(
                item.unit || ""
              )}

            </div>


            <div class="date">

              ${escapeHtml(
                item.date || ""
              )}

            </div>


            <div class="study-text">

              ${escapeHtml(
                item.study || ""
              )}

            </div>


            ${
              item.deepReflection
              ? `

                <div class="deep-box">

                  <strong>
                    🌱 深まり振り返り
                  </strong>

                  <br><br>

                  ${escapeHtml(
                    item.deepReflection
                  )}

                </div>

              `
              : ""
            }

          </div>

        `
      ).join("");

  }catch(error){

    console.error(error);

    area.innerHTML =
      "読み込みに失敗しました。";

  }

};

/* =========================================
   HTML安全化
========================================= */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
