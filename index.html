<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>学びアルバム Ver.2</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:"Noto Sans JP","Yu Gothic",sans-serif;
  background:#f4f8fb;
  color:#333;
}

header{
  background:#4c8dcc;
  color:white;
  text-align:center;
  padding:18px 10px;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.page{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.hidden{display:none;}

h2{margin-top:0;}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccd5dd;
  border-radius:10px;
  font-size:16px;
  font-family:inherit;
}

textarea{
  min-height:150px;
  line-height:1.8;
  resize:vertical;
}

button{
  border:none;
  border-radius:10px;
  padding:13px 18px;
  margin:6px 3px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:#4c8dcc;
  color:white;
}

button:hover{opacity:.9;}

.green{background:#4d9c68;}
.orange{background:#d68c36;}
.purple{background:#7656a8;}
.gray{background:#777;}
.red{background:#c75b5b;}

.menu-button{
  width:100%;
  padding:20px;
  font-size:18px;
  margin:8px 0;
}

.box{
  background:#eef7ff;
  border-left:6px solid #4c8dcc;
  padding:16px;
  border-radius:10px;
  margin:15px 0;
}

.advice-box{
  background:#fff8dd;
  border-left:6px solid #e0aa32;
  padding:16px;
  border-radius:10px;
  margin:15px 0;
}

.level-box{
  background:#eef9f0;
  border-left:6px solid #4d9c68;
  padding:16px;
  border-radius:10px;
  margin:15px 0;
}

.everyone-card{
  background:#fafcff;
  border:2px solid #dbe7f0;
  border-radius:14px;
  padding:18px;
  margin:15px 0;
}

.everyone-card.selected{
  border:3px solid #4d9c68;
  background:#f0faf2;
}

.reference-button{
  background:#4d9c68;
  width:100%;
  margin-top:10px;
}

.reference-button.selected{
  background:#d68c36;
}

.anonymous-label{
  display:inline-block;
  background:#e9f2ff;
  color:#3d72a8;
  padding:5px 10px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.lesson-status{
  background:#eef9f0;
  border-left:6px solid #4d9c68;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.success{
  color:#278247;
  font-weight:bold;
}

.center{text-align:center;}

.submission-complete{
  background:#eef9f0;
  border:3px solid #4d9c68;
  border-radius:20px;
  padding:30px 20px;
  margin-top:20px;
  text-align:center;
}

.submission-icon{
  font-size:58px;
  line-height:1;
  margin-bottom:15px;
}

.submission-complete h3{
  margin:8px 0 12px;
  color:#278247;
  font-size:25px;
}

.submission-complete p{
  font-size:17px;
  line-height:1.8;
}

.submission-note{
  font-weight:bold;
  color:#555;
}

.learning-comment{
  background:white;
  border:2px solid #d9eadf;
  border-radius:14px;
  padding:15px;
  margin:18px auto 0;
  max-width:720px;
  text-align:left;
  line-height:1.8;
}

.learning-comment-title{
  font-weight:bold;
  color:#278247;
  margin-bottom:6px;
}

.submission-actions{margin-top:22px;}

.submission-actions button{
  width:100%;
  max-width:600px;
  margin:7px auto;
  display:block;
  padding:17px;
  font-size:17px;
}

.tool-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin:15px 0;
}

.tool-card{
  border:2px solid #d5e0ea;
  border-radius:14px;
  padding:14px 8px;
  background:#f9fbfd;
  cursor:pointer;
  text-align:center;
  min-height:125px;
}

.tool-card:hover{background:#eef7ff;}

.tool-card.selected{
  border:3px solid #4c8dcc;
  background:#eef7ff;
}

.tool-icon{
  font-size:30px;
  margin-bottom:5px;
}

.thinking-hint{
  background:#fff8dd;
  border:3px solid #e0aa32;
  border-radius:15px;
  padding:16px;
  margin:15px 0;
}

.thinking-hint h3{margin-top:0;}

.hint-question{
  background:white;
  border-radius:10px;
  padding:12px;
  margin:8px 0;
  font-weight:bold;
}

.final-thinking{
  background:#f3efff;
  border-left:6px solid #7656a8;
  border-radius:12px;
  padding:18px;
  margin-top:20px;
}

.final-thinking textarea{min-height:140px;}

.thinking-board{
  position:relative;
  width:100%;
  height:720px;
  background:#f8fbfd;
  border:3px solid #d7e2ea;
  border-radius:18px;
  overflow:hidden;
  margin-top:20px;
  touch-action:none;
}

.board-title{
  position:absolute;
  top:12px;
  left:18px;
  font-size:20px;
  font-weight:bold;
  z-index:10;
}

.board-help{
  position:absolute;
  top:48px;
  left:18px;
  right:18px;
  background:white;
  border-radius:10px;
  padding:8px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  z-index:10;
  font-size:14px;
}

.thought-card{
  position:absolute;
  min-width:150px;
  min-height:90px;
  width:220px;
  height:130px;
  background:white;
  border:3px solid #4c8dcc;
  border-radius:14px;
  padding:34px 12px 12px;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
  overflow:hidden;
  touch-action:none;
  resize:both;
  z-index:20;
}

.thought-card.friend{border-color:#4d9c68;}

.thought-card.mine{
  border-color:#d68c36;
  background:#fffaf1;
}

.thought-card.new-card{
  border-color:#7656a8;
  background:#faf7ff;
}

.card-handle{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:29px;
  padding:5px 8px;
  font-size:12px;
  font-weight:bold;
  color:#555;
  background:rgba(255,255,255,.9);
  cursor:grab;
  user-select:none;
  touch-action:none;
}

.thought-card.mine .card-handle{background:#fff2d9;}
.thought-card.new-card .card-handle{background:#eee6ff;}

.card-handle:active{cursor:grabbing;}

.card-resize-handle{
  position:absolute;
  right:2px;
  bottom:2px;
  width:24px;
  height:24px;
  border-radius:6px;
  background:#e8eef5;
  color:#555;
  font-size:16px;
  line-height:24px;
  text-align:center;
  font-weight:bold;
  z-index:60;
  cursor:nwse-resize;
  user-select:none;
  touch-action:none;
}

.card-delete{
  position:absolute;
  top:2px;
  right:3px;
  width:25px;
  height:25px;
  padding:0;
  margin:0;
  border-radius:50%;
  background:#c75b5b;
  color:white;
  font-size:13px;
  z-index:50;
}

.card-text{
  width:100%;
  height:100%;
  min-height:60px;
  border:none;
  outline:none;
  resize:none;
  padding:0;
  background:transparent;
  font-size:15px;
  line-height:1.6;
}

.compare-board{
  background:
  linear-gradient(
    90deg,
    #eef7ff 0%,
    #eef7ff 47%,
    white 47%,
    white 53%,
    #fff3f3 53%,
    #fff3f3 100%
  );
}

.web-board{background:#f9fbfd;}

/* rest of original CSS preserved */
</style>
</head>

<script>
// Safer implementation for saveFinalReflection. Replaces previous definition if present.
window.saveFinalReflection = async function(){
  const button = document.getElementById("finalSaveButton");
  if(button && button.disabled) return;

  const finalEl = document.getElementById("finalReflection");
  if(!finalEl){
    alert("最後の振り返りの入力欄が見つかりません。ページを再読み込みしてください。");
    return;
  }

  const finalText = finalEl.value.trim();
  if(!finalText){
    alert("最後の振り返りを書いてください。");
    finalEl.focus();
    return;
  }

  // Safely read sessionStorage keys used by the app
  let originalId = null;
  try{ originalId = sessionStorage.getItem(KEY_ORIGINAL_ID); }catch(e){ originalId = null; }
  const initialText = (function(){ try{ return sessionStorage.getItem(KEY_INITIAL_STUDY) || ""; }catch(e){ return ""; }})();
  let tool = "";
  try{ tool = sessionStorage.getItem(KEY_TOOL) || (typeof getToolName === 'function' ? getToolName(currentThinkingTool) : ""); }catch(e){ tool = ""; }

  let sourceIds = [];
  try{
    const s = sessionStorage.getItem(KEY_SOURCE_IDS);
    sourceIds = s ? JSON.parse(s) : [];
  }catch(e){ sourceIds = []; }

  if(button){ button.disabled = true; button.textContent = "保存しています……"; }

  try{
    const learningComment = (typeof generateLearningComment === 'function') ? generateLearningComment(initialText, finalText, tool) : "";
    const finalLevel = (typeof calculateReflectionLevel === 'function') ? calculateReflectionLevel(finalText) : null;

    if(originalId){
      try{
        const ref = doc(db, "manabi", originalId);
        await updateDoc(ref, {
          finalReflection: finalText,
          finalReflectionDate: new Date().toLocaleDateString("ja-JP"),
          thinkingTool: tool,
          thinkingSourceIds: sourceIds,
          learningComment: learningComment,
          finalReflectionLevel: finalLevel,
          reflectionStage: "completed",
          updatedAt: serverTimestamp()
        });
      }catch(updateErr){
        console.error('updateDoc failed, falling back to addDoc', updateErr);
        const created = await addDoc(collection(db, 'manabi'), {
          studentNumber: Number(document.getElementById('studentNumber')?.value) || null,
          subject: document.getElementById('subject')?.value || (currentLesson?.subject || null),
          unit: document.getElementById('unit')?.value || (currentLesson?.unit || null),
          study: initialText || "",
          finalReflection: finalText,
          finalReflectionDate: new Date().toLocaleDateString('ja-JP'),
          thinkingTool: tool,
          thinkingSourceIds: sourceIds,
          learningComment: learningComment,
          finalReflectionLevel: finalLevel,
          reflectionStage: 'completed',
          likes: 0,
          lessonId: currentLesson?.lessonId || null,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        originalId = created.id;
      }
    }else{
      const created = await addDoc(collection(db, 'manabi'), {
        studentNumber: Number(document.getElementById('studentNumber')?.value) || null,
        subject: document.getElementById('subject')?.value || (currentLesson?.subject || null),
        unit: document.getElementById('unit')?.value || (currentLesson?.unit || null),
        study: initialText || "",
        finalReflection: finalText,
        finalReflectionDate: new Date().toLocaleDateString('ja-JP'),
        thinkingTool: tool,
        thinkingSourceIds: sourceIds,
        learningComment: learningComment,
        finalReflectionLevel: finalLevel,
        reflectionStage: 'completed',
        likes: 0,
        lessonId: currentLesson?.lessonId || null,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      originalId = created.id;
    }

    try{ everyoneCache.clear(); }catch(e){}

    // Clean up session storage keys
    try{
      sessionStorage.removeItem(KEY_FLOW);
      sessionStorage.removeItem(KEY_DRAFT);
      sessionStorage.removeItem(KEY_TOOL);
      sessionStorage.removeItem(KEY_SOURCE_IDS);
      sessionStorage.removeItem(KEY_ORIGINAL_ID);
      sessionStorage.removeItem(KEY_INITIAL_STUDY);
    }catch(e){}

    // Update UI to show completion
    try{
      document.getElementById('finalSaveArea')?.classList.add('hidden');
      document.getElementById('finalReflectionNotice')?.classList.add('hidden');
      document.getElementById('thinkingDraftNotice')?.classList.add('hidden');
      document.getElementById('firstSaveArea')?.classList.add('hidden');
      document.getElementById('submissionCompleteArea')?.classList.remove('hidden');
    }catch(e){}

    try{ showLearningComment(learningComment); }catch(e){}
    try{ toast('最後の振り返りを保存しました！'); }catch(e){ console.log('saved'); }

  }catch(err){
    console.error('saveFinalReflection error', err);
    alert('保存に失敗しました。通信状態を確認するか、ページを再読み込みして再度お試しください。');
  }finally{
    if(button){ button.disabled = false; button.textContent = '保存する'; }
  }
};
</script>

</div>
