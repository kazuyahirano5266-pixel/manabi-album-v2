<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>学びアルバム Ver.2</title>

<style>

body{
font-family:sans-serif;
background:#f0f8ff;
text-align:center;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:20px;
max-width:600px;
margin:auto;
}

button{
padding:15px 30px;
border:none;
border-radius:20px;
background:#2b7a78;
color:white;
font-size:18px;
margin:10px;
}

input,textarea,select{
width:90%;
padding:10px;
font-size:18px;
margin:8px;
box-sizing:border-box;
}

textarea{
min-height:100px;
}

.card{
background:white;
padding:15px;
margin:15px auto;
border-radius:20px;
box-shadow:0 3px 8px #ccc;
}

.advice-box{
background:#eaf6ff;
padding:15px;
border-radius:20px;
margin:15px 0;
}

.comment-box{
background:#fff4d6;
padding:15px;
border-radius:20px;
margin:15px 0;
}

.hidden{
display:none;
}

.menu-button{
width:90%;
max-width:450px;
}

.small-button{
font-size:16px;
padding:10px 20px;
}

.success{
color:#2b7a78;
font-weight:bold;
}

</style>

</head>


<body>


<!-- ================================================= -->
<!-- スタートメニュー -->
<!-- ================================================= -->

<div class="box" id="home">

<h1>
📚 学びアルバム Ver.2
</h1>

<p>
自分の学びを残そう！
</p>


<button
class="menu-button"
onclick="openReflection()">

✏️ 今日の振り返りを書く

</button>

<br>


<button
class="menu-button"
onclick="openHistory()">

📖 自分の振り返りを見る

</button>

<br>


<button
class="menu-button"
onclick="openEveryoneHistory()">

👫 みんなの振り返りを見る

</button>

</div>



<!-- ================================================= -->
<!-- 今日の振り返り -->
<!-- ================================================= -->

<div
class="box hidden"
id="reflectionPage">

<h1>
✏️ 今日の振り返り
</h1>


<p>名前</p>

<input
id="name"
placeholder="名前を入力しよう">


<p>教科</p>

<select id="subject">

<option>国語</option>
<option>算数</option>
<option>生活</option>
<option>理科</option>
<option>社会</option>
<option>総合</option>
<option>道徳</option>
<option>体育</option>

</select>


<p>単元名</p>

<input
id="unit"
placeholder="例：ごんぎつね">


<p>今日の学び</p>

<textarea
id="study"
placeholder="今日の学びを書こう">
</textarea>


<!-- ================================================= -->
<!-- AIからの問い -->
<!-- ================================================= -->

<div class="advice-box">

<h3>
🤖 AIからの問い
</h3>

<p id="studyAdvice">

振り返りを書くと、
学びを深める質問が出ます。

</p>

</div>


<!-- ================================================= -->
<!-- 最初の保存ボタン -->
<!-- ================================================= -->

<div id="firstSaveArea">

<button onclick="save()">

🌟 学びを保存する

</button>

</div>


<p
id="msg"
class="success">
</p>


<!-- ================================================= -->
<!-- 保存後に表示する部分 -->
<!-- ================================================= -->

<div
id="deepReflectionArea"
style="display:none;">

<hr>

<h2>
🌱 学びをもう一歩深めよう
</h2>

<p>
🤖 AIからの問いをもとに、
もう一度自分の考えを深めてみよう😊
</p>


<textarea
id="deepReflection"
placeholder="考えが変わったことや、新しく気付いたことを書こう">
</textarea>


<button onclick="saveDeepReflection()">

✏️ 考えを深めて保存する

</button>


<p
id="deepMsg"
class="success">
</p>

</div>


<br>


<button
class="small-button"
onclick="backHome()">

🏠 スタートメニューへ

</button>

</div>



<!-- ================================================= -->
<!-- 自分の振り返り -->
<!-- ================================================= -->

<div
class="box hidden"
id="historyPage">

<h1>
📖 自分の学びアルバム
</h1>


<div id="historyList">

</div>


<br>


<button onclick="backHome()">

🏠 スタートメニューへ

</button>

</div>



<!-- ================================================= -->
<!-- みんなの振り返り -->
<!-- ================================================= -->

<div
class="box hidden"
id="everyonePage">

<h1>
👫 みんなの振り返り
</h1>


<div id="everyoneList">

</div>


<br>


<button onclick="backHome()">

🏠 スタートメニューへ

</button>

</div>



<script type="module">


/* ================================================= */
/* Firebase */
/* ================================================= */

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
query,
where,
getDocs,
updateDoc,
doc

}

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyA7fBz695BTUL8lxxJ06csf6AfU_DQp3iw",

authDomain:
"manabi-album-v2.firebaseapp.com",

projectId:
"manabi-album-v2",

storageBucket:
"manabi-album-v2.firebasestorage.app",

messagingSenderId:
"226258471812",

appId:
"1:226258471812:web:15230ba15e7e0bd7d86bd1"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* ================================================= */
/* データ */
/* ================================================= */

let currentRecordId = null;

let currentMySubject = "";

let currentEveryoneSubject = "";

window.myData = [];

window.everyoneData = [];

window.mySubjects = [];

window.myUnits = [];

window.everyoneSubjects = [];

window.everyoneUnits = [];


/* ================================================= */
/* ページ移動 */
/* ================================================= */

window.openReflection=function(){

document.getElementById("home").style.display="none";

document.getElementById("reflectionPage").style.display="block";

document.getElementById("historyPage").style.display="none";

document.getElementById("everyonePage").style.display="none";

};


window.backHome=function(){

document.getElementById("home").style.display="block";

document.getElementById("reflectionPage").style.display="none";

document.getElementById("historyPage").style.display="none";

document.getElementById("everyonePage").style.display="none";

};


/* ================================================= */
/* AIからの問いを作る */
/* ================================================= */

function createAdvice(){

const subject =
document.getElementById("subject").value;

const study =
document.getElementById("study").value;

let advice="";


if(subject==="国語"){

if(study.includes("友達")){

advice=
"友達のどんな考えを聞いて、自分の考えはどのように変わりましたか？";

}

else if(
study.includes("理由") ||
study.includes("考え")
){

advice=
"その考えを支える理由や、もとになった言葉は何ですか？";

}

else{

advice=
"文章や友達の考えから、新しく気付いたことは何ですか？";

}

}


else if(subject==="算数"){

advice=
"その考え方は、別の問題でも使えそうですか？工夫したところを説明してみよう。";

}


else if(subject==="理科"){

advice=
"予想と結果を比べて、なぜその結果になったのか考えてみよう。";

}


else if(subject==="社会"){

advice=
"調べて分かったことは、私たちの生活とどんな関係がありますか？";

}


else if(subject==="生活"){

advice=
"見つけたことや気付いたことから、どんな発見や驚きがありましたか？";

}


else if(subject==="総合"){

if(
study.includes("地域") ||
study.includes("武蔵村山")
){

advice=
"その学びを誰に伝えたいですか？伝えるためにどんな工夫ができますか？";

}

else{

advice=
"調べたことから、新しく生まれた疑問や課題は何ですか？";

}

}


else if(subject==="道徳"){

advice=
"その考えを大切にした理由は何ですか？自分の生活でどう生かせそうですか？";

}


else if(subject==="体育"){

advice=
"できるようになるために工夫したことや、友達から学んだことは何ですか？";

}


else{

advice=
"今日の学びから、新しく気付いたことを書いてみよう。";

}


document.getElementById(
"studyAdvice"
).innerHTML=
"🤖 "+advice;


return advice;

}


/* ================================================= */
/* 学びを保存 */
/* ================================================= */

window.save=async function(){

const name=
document.getElementById("name")
.value.trim();


const subject=
document.getElementById("subject")
.value;


const unit=
document.getElementById("unit")
.value.trim();


const study=
document.getElementById("study")
.value.trim();


if(!name){

alert(
"名前を入力してください。"
);

return;

}


if(!study){

alert(
"今日の学びを書いてください。"
);

return;

}


/* AIの問い */

const aiQuestion=
createAdvice();


try{


const saveData=

await addDoc(

collection(db,"manabi"),

{

name:name,

subject:subject,

unit:unit,

study:study,

deepReflection:"",

aiQuestion:aiQuestion,

likes:0,

date:new Date()

}

);


currentRecordId=
saveData.id;


/* 保存完了 */

document.getElementById(
"msg"
).innerHTML=
"🌟 学びを保存しました！";


/* ================================================= */
/* ここが重要 */
/* ================================================= */

/*
学びを保存した後は
「学びを保存する」ボタンを消す
*/

document.getElementById(
"firstSaveArea"
).style.display="none";


/*
考えを深める部分だけ表示
*/

document.getElementById(
"deepReflectionArea"
).style.display="block";


}catch(error){

console.error(error);

alert(
"保存できませんでした。\nもう一度試してください。"
);

}

};


/* ================================================= */
/* 考えを深めて保存 */
/* ================================================= */

window.saveDeepReflection=async function(){

if(!currentRecordId){

alert(
"先に「学びを保存する」を押してください。"
);

return;

}


const deepReflection=
document.getElementById(
"deepReflection"
)
.value.trim();


if(!deepReflection){

alert(
"考えを深めた内容を書いてください。"
);

return;

}


try{


await updateDoc(

doc(
db,
"manabi",
currentRecordId
),

{

deepReflection:
deepReflection

}

);


document.getElementById(
"deepMsg"
).innerHTML=
"🌟 考えを深めて保存しました！";


}catch(error){

console.error(error);

alert(
"保存できませんでした。"
);

}

};


/* ================================================= */
/* 自分の振り返りを見る */
/* ================================================= */

window.openHistory=async function(){

const name=
document.getElementById("name")
.value.trim();


if(!name){

alert(
"まず名前を入力してください。"
);

return;

}


document.getElementById("home").style.display="none";

document.getElementById("reflectionPage").style.display="none";

document.getElementById("historyPage").style.display="block";

document.getElementById("everyonePage").style.display="none";


const q=query(

collection(db,"manabi"),

where("name","==",name)

);


const result=
await getDocs(q);


let dataList=[];


result.forEach(d=>{

const data=d.data();

data.id=d.id;

dataList.push(data);

});


window.myData=
dataList;


if(dataList.length===0){

document.getElementById(
"historyList"
).innerHTML=
"<p>まだ振り返りがありません。</p>";

return;

}


let subjects=[];


dataList.forEach(data=>{

if(
data.subject &&
!subjects.includes(data.subject)
){

subjects.push(data.subject);

}

});


window.mySubjects=
subjects;


let html=
"<h2>📁 教科を選んでください</h2>";


subjects.forEach(
(subject,index)=>{

html+=`

<div class="card">

<h2>
📚 ${escapeHtml(subject)}
</h2>

<button
onclick="openMySubjectByIndex(${index})">

見る

</button>

</div>

`;

});


document.getElementById(
"historyList"
).innerHTML=
html;

};


/* ================================================= */
/* 自分 → 教科 */
/* ================================================= */

window.openMySubjectByIndex=function(index){

const subject=
window.mySubjects[index];

currentMySubject=
subject;

openMySubject(subject);

};


window.openMySubject=function(subject){

currentMySubject=
subject;


let html=`

<button onclick="openHistory()">

← 教科一覧へ

</button>


<h2>
📚 ${escapeHtml(subject)}
</h2>


<h3>
📖 単元を選んでください
</h3>

`;


let units=[];


window.myData.forEach(data=>{

if(data.subject===subject){

const unitName=
data.unit ||
"単元名なし";


if(!units.includes(unitName)){

units.push(unitName);

}

}

});


window.myUnits=
units;


units.forEach(
(unit,index)=>{

html+=`

<div class="card">

<h2>
📖 ${escapeHtml(unit)}
</h2>


<button
onclick="openMyUnitByIndex(${index})">

見る

</button>

</div>

`;

});


document.getElementById(
"historyList"
).innerHTML=
html;

};


/* ================================================= */
/* 自分 → 単元 */
/* ================================================= */

window.openMyUnitByIndex=function(index){

const unit=
window.myUnits[index];

openMyUnit(
currentMySubject,
unit
);

};


window.openMyUnit=function(subject,unit){

let html=`

<button
onclick="openMySubject(currentMySubject)">

← 単元一覧へ

</button>


<h2>
📖 ${escapeHtml(unit)}
</h2>

`;


let count=0;


window.myData.forEach(data=>{

const dataUnit=
data.unit ||
"単元名なし";


if(
data.subject===subject &&
dataUnit===unit
){

count++;


html+=`

<div class="card">

<p>
<b>📝 今日の学び</b>
</p>

<p>
${escapeHtml(data.study || "")}
</p>


<div class="advice-box">

🤖 AIからの問い

<br>

${escapeHtml(
data.aiQuestion || ""
)}

</div>


<p>
<b>✏️ 深めた考え</b>
</p>

<p>
${escapeHtml(
data.deepReflection ||
"まだありません"
)}
</p>

</div>

`;

}

});


if(count===0){

html+=
"<p>この単元の振り返りはありません。</p>";

}


document.getElementById(
"historyList"
).innerHTML=
html;

};


/* ================================================= */
/* みんなの振り返り */
/* ================================================= */

window.openEveryoneHistory=
async function(){

document.getElementById("home").style.display="none";

document.getElementById("reflectionPage").style.display="none";

document.getElementById("historyPage").style.display="none";

document.getElementById("everyonePage").style.display="block";


try{


const result=
await getDocs(
collection(db,"manabi")
);


let dataList=[];


result.forEach(d=>{

const data=d.data();

data.id=d.id;

dataList.push(data);

});


window.everyoneData=
dataList;


let subjects=[];


dataList.forEach(data=>{

if(
data.subject &&
!subjects.includes(data.subject)
){

subjects.push(data.subject);

}

});


window.everyoneSubjects=
subjects;


let html=
"<h2>📁 教科を選んでください</h2>";


subjects.forEach(
(subject,index)=>{

html+=`

<div class="card">

<h2>
📚 ${escapeHtml(subject)}
</h2>


<button
onclick="openEveryoneSubjectByIndex(${index})">

見る

</button>

</div>

`;

});


if(subjects.length===0){

html+=
"<p>まだ振り返りがありません。</p>";

}


document.getElementById(
"everyoneList"
).innerHTML=
html;


}catch(error){

console.error(error);

document.getElementById(
"everyoneList"
).innerHTML=
"<p>読み込みに失敗しました。</p>";

}

};


/* ================================================= */
/* みんな → 教科 */
/* ================================================= */

window.openEveryoneSubjectByIndex=
function(index){

const subject=
window.everyoneSubjects[index];

currentEveryoneSubject=
subject;

openEveryoneSubject(subject);

};


window.openEveryoneSubject=
function(subject){

currentEveryoneSubject=
subject;


let html=`

<button
onclick="openEveryoneHistory()">

← 教科一覧へ

</button>


<h2>
📚 ${escapeHtml(subject)}
</h2>


<h3>
📖 単元を選んでください
</h3>

`;


let units=[];


window.everyoneData.forEach(data=>{

if(data.subject===subject){

const unitName=
data.unit ||
"単元名なし";


if(!units.includes(unitName)){

units.push(unitName);

}

}

});


window.everyoneUnits=
units;


units.forEach(
(unit,index)=>{

html+=`

<div class="card">

<h2>
📖 ${escapeHtml(unit)}
</h2>


<button
onclick="openEveryoneUnitByIndex(${index})">

見る

</button>

</div>

`;

});


if(units.length===0){

html+=
"<p>まだこの教科の振り返りはありません。</p>";

}


document.getElementById(
"everyoneList"
).innerHTML=
html;

};


/* ================================================= */
/* みんな → 単元 */
/* ================================================= */

window.openEveryoneUnitByIndex=
function(index){

const unit=
window.everyoneUnits[index];

openEveryoneUnit(
currentEveryoneSubject,
unit
);

};


window.openEveryoneUnit=
function(subject,unit){

let html=`

<button
onclick="openEveryoneSubject(currentEveryoneSubject)">

← 単元一覧へ

</button>


<h2>
📖 ${escapeHtml(unit)}
</h2>

`;


let count=0;


window.everyoneData.forEach(data=>{

const dataUnit=
data.unit ||
"単元名なし";


if(
data.subject===subject &&
dataUnit===unit
){

count++;


html+=`

<div class="card">

<h3>
👤 友達の振り返り
</h3>


<p>
<b>📝 今日の学び</b>
</p>


<p>
${escapeHtml(
data.study || ""
)}
</p>


<div class="advice-box">

🤖 AIからの問い

<br>

${escapeHtml(
data.aiQuestion || ""
)}

</div>


<p>
<b>✏️ 深めた考え</b>
</p>


<p>
${escapeHtml(
data.deepReflection ||
"まだありません"
)}
</p>


<button
onclick="addLike('${data.id}')">

⭐ この考えが参考になった

</button>


<p>

⭐ 参考にした人数：
${data.likes || 0}人

</p>

</div>

`;

}

});


if(count===0){

html+=
"<p>この単元の振り返りはありません。</p>";

}


document.getElementById(
"everyoneList"
).innerHTML=
html;

};


/* ================================================= */
/* ⭐ 参考になった */
/* ================================================= */

window.addLike=
async function(id){

const target=
window.everyoneData.find(
data=>data.id===id
);


if(!target){

alert(
"データが見つかりません。"
);

return;

}


try{


const newLikes=
(target.likes || 0)+1;


await updateDoc(

doc(
db,
"manabi",
id
),

{

likes:newLikes

}

);


target.likes=
newLikes;


alert(
"⭐ 参考にしました！"
);


openEveryoneUnit(
currentEveryoneSubject,
target.unit ||
"単元名なし"
);


}catch(error){

console.error(error);

alert(
"保存できませんでした。"
);

}

};


/* ================================================= */
/* HTML文字対策 */
/* ================================================= */

function escapeHtml(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


console.log(
"📚 学びアルバム Ver.2 完成版 起動"
);

</script>

</body>

</html>
